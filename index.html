                          : '「왜 지금인가」 장은 있으나 언제 바뀌었는지가 없습니다 — 시점을 적으십시오.' };
    },
    'IR-VIZ-02': function(d){
      var bad = (d.slides || []).filter(function(s){ return s && arr(s.bullets).length > 3; });
      return { ok: !bad.length,
               note: bad.length ? bad.length + '장이 요점 4개 이상입니다 — 한 장이 답하는 질문이 여럿입니다.'
                                : '모든 장이 요점 3개 이하입니다.' };
    },
    'IR-VIZ-03': function(d){
      //  ★코드가 IR 원문과 대조한다 — LLM에게 다시 묻지 않는다.
      var bad = 0;
      (d.slides || []).forEach(function(s){
        if(!s) return;
        [s.headline, s.sub].concat(arr(s.bullets)).forEach(function(t){
          bad += badNumbers(t || '').length;
        });
      });
      return { ok: !bad,
               note: bad ? '원문에서 확인되지 않는 수치 ' + bad + '건이 슬라이드에 있습니다.'
                         : '슬라이드의 수치가 모두 IR 원문에서 확인됩니다.' };
    },
    'IR-VIZ-04': function(d){
      var over = 0;
      (d.slides || []).forEach(function(s){
        if(!s) return;
        if(String(s.headline || '').length > 40) over++;
        arr(s.bullets).forEach(function(b){ if(String(b).length > 45) over++; });
      });
      return { ok: !over,
               note: over ? '길이 기준을 넘는 문구 ' + over + '건 — 한 장의 초점이 흐려집니다.'
                          : '제목·요점 길이가 기준 안에 있습니다.' };
    }
  };

  function deckText(d){
    var out = [];
    (d.slides || []).forEach(function(s){
      if(!s) return;
      out.push(s.headline || '', s.sub || '');
      arr(s.bullets).forEach(function(b){ out.push(b); });
    });
    if(d.rnd){ out.push(d.rnd.headline || ''); arr(d.rnd.bullets).forEach(function(b){ out.push(b); }); }
    return out.join(' ');
  }

  //  번들에서 덱 영역 문항만 꺼낸다. 번들이 없으면 빈 배열 — 카드가 조용히 비고 덱은 그대로 산다.
  function deckItems(){
    if(!brain.items.length) return [];
    return brain.items.filter(function(it){
      return DECK_DOMAINS.indexOf(String(it.domain_code || '')) >= 0;
    });
  }

  // ★ IR 원문에 없는 숫자를 찾아낸다.
  //   의미 있는 수치만 본다 — "3단계"의 3 같은 한 자리 맨숫자는 걸지 않는다.
  //   단위(억·만·%·원·명…)가 붙었거나 두 자리 이상이면 검사 대상이다.
  function irHay(){
    return Object.keys(state.formData)
      .map(function(k){ return state.formData[k] || ''; })
      .join(' ')
      .replace(/[,\s]/g, '');
  }

  function badNumbers(text){
    var hay = irHay();
    var out = [];
    var toks = String(text || '').match(/\d[\d,.]*\s*(억|만|천|퍼센트|%|원|명|개사|개월|개|건|배|년|주|일|시간|배수|x|X)?/g) || [];
    toks.forEach(function(t){
      var norm = t.replace(/[,\s]/g, '');
      var m = norm.match(/\d[\d.]*/);
      if(!m) return;
      var d = m[0];
      var hasUnit = /[^\d.]/.test(norm);
      if(d.replace(/\D/g, '').length < 2 && !hasUnit) return;   // 한 자리 맨숫자는 통과
      if(hay.indexOf(d) < 0 && out.indexOf(t.trim()) < 0) out.push(t.trim());
    });
    return out;
  }

  // ★ 근거 인용 검증 — LLM을 믿지 않는다. 코드가 원문 대조한다.
  //   "원문을 인용하라"는 프롬프트만으로는 가끔 지어낸다(라이브 검증에서 실제 발생).
  //   인용문이 IR 어디에도 없으면 근거로 인정하지 않고 화면에 경고를 띄운다.
  function verifyEvidence(ev){
    if(!ev) return null;
    var norm = function(s){ return String(s).replace(/[\s"'“”‘’·,.]/g, ''); };
    var hay = norm(Object.keys(state.formData).map(function(k){ return state.formData[k] || ''; }).join(' '));
    var needle = norm(ev);
    if(!needle) return null;
    if(hay.indexOf(needle) >= 0) return true;                    // 통째로 일치
    var head = needle.slice(0, Math.min(16, needle.length));     // 앞부분만이라도 일치하는가
    return hay.indexOf(head) >= 0;
  }

  var FIELD_LABEL = {};
  IR_STEPS.concat(TIPS_STEPS).forEach(function(s){
    s.inputs.forEach(function(i){ FIELD_LABEL[i.key] = i.label; });
  });

  // ══ 화면 ══════════════════════════════════════════════════════

  // 목차에 쓸 짧은 이름 — IR_STEPS의 title은 "2. 문제 정의 (Problem)" 형태다
  function shortTitle(s){
    return String(s.title || '').replace(/^\s*\d+\.\s*/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  }
  function stepNo(i){ return ('0' + (i + 1)).slice(-2); }
  function stepFilled(s){
    return s.inputs.every(function(i){ return (state.formData[i.key] || '').trim(); });
  }
  function stepChars(s){
    return s.inputs.reduce(function(a, i){ return a + (state.formData[i.key] || '').length; }, 0);
  }

  // ── 메타 스트립 ──
  function renderMeta(){
    var all = steps(), n = 0, tot = 0, ch = 0;
    all.forEach(function(s){
      s.inputs.forEach(function(i){
        tot++;
        var v = (state.formData[i.key] || '').trim();
        if(v) n++;
        ch += v.length;
      });
    });
    // 🔴 대리 편집 중임을 어느 화면에서든 계속 보인다.
    //    이 표시가 없으면 관리자가 자기 원고를 쓰는 줄 알고 남의 기업 자리에 저장한다.
    //    메타 스트립은 잉크(어두운) 배경이므로 색을 명시한다 — 안 그러면 밝은 박스에 밝은 글씨가 된다.
    var edit = (admin && admin.editing)
      ? '<div class="m" style="background:var(--pb-warn-bg);border-color:var(--pb-warn-line);' +
        'color:var(--pb-warn-deep)">대리 편집 중' +
        '<b style="color:var(--pb-warn-deep)">' + esc(admin.editing.company) + '</b>' +
        '<button class="pb-hbtn" id="mtClose" style="margin-left:10px;color:var(--pb-warn-deep);' +
        'border-color:var(--pb-warn-line)">닫기</button></div>'
      : '';
    $('pbMeta').innerHTML = edit +
      '<div class="m">작성 필드<b>' + n + ' / ' + tot + '</b></div>' +
      '<div class="m">분량<b>' + ch.toLocaleString() + '자</b></div>' +
      '<div class="m">투자논리 진단<b>' + (state.lastAudit ? '완료' : '—') + '</b></div>' +
      //  ★AI 사용 횟수 — 기업에게만 뜬다(관리자는 총량 제한이 없다).
      //   다 쓰면 붉게. 남은 횟수를 모르고 쓰다 갑자기 막히는 일이 없어야 한다.
      (llm.quota
        ? '<div class="m"' + (quotaLeft() === 0
            ? ' style="background:var(--pb-warn-bg);border-color:var(--pb-warn-line);color:var(--pb-warn-deep)"' : '') +
          '>AI 사용<b' + (quotaLeft() === 0 ? ' style="color:var(--pb-warn-deep)"' : '') + '>' +
          llm.quota.used + ' / ' + llm.quota.limit + '회</b></div>'
        : '') +
      '<div class="sp"></div>' +
      '<div class="note">자동저장 켜짐 · 단계 이동마다</div>';
    if($('mtClose')) $('mtClose').onclick = adminCloseIR;
  }

  // ── 좌: 목차 ──
  function renderLeft(){
    var tot = 0, n = 0;
    steps().forEach(function(st){ st.inputs.forEach(function(i){ tot++; if((state.formData[i.key] || '').trim()) n++; }); });
    var pct = tot ? Math.round(n / tot * 100) : 0;
    var h = '<div class="pb-ringwrap">' +
              '<div class="pb-ring" style="background:conic-gradient(var(--pb-accent) 0 ' + pct + '%,var(--pb-on-ink-line) ' + pct + '% 100%)"><i>' + pct + '%</i></div>' +
              '<div class="pb-ringtxt"><b>' + n + ' / ' + tot + ' 칸</b><span>' +
                (tot - n > 0 ? (tot - n) + '칸 남았습니다' : '전부 채우셨습니다') + '</span></div>' +
            '</div>';
    h += '<h4>IR 6 STEPS</h4>';
    IR_STEPS.forEach(function(s, i){ h += navRow(s, i); });
    if(llm.tipsMode){
      h += '<div class="pb-hr"></div><h4>R&D 대응<em>선택</em></h4>';
      TIPS_STEPS.forEach(function(s, i){ h += navRow(s, IR_STEPS.length + i); });
    }
    h += '<div class="sp"></div>' +
         '<button class="pb-cta" id="btnResult">결과 보기</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="btnDeckGo">IR 피칭 자료 만들기</button>';

    $('pbLeft').innerHTML = h;
    $('btnResult').onclick  = goResult;
    // ★작성 화면에서 곧장 덱으로 뛰지 않는다(2026-08-22) — ①②는 결과 화면에 있다.
    //   막기만 하면 "버튼이 안 먹는다"가 된다. 막고, 가야 할 자리로 데려간다.
    $('btnDeckGo').onclick  = function(){
      var g = deckGate();
      if(!g.ok){
        deckBlocked(g);
        goResult();
        setTimeout(function(){ var el = $(g.fig ? 'secAudit' : 'secFig'); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); }, 60);
        return;
      }
      goDeck();
    };
    Array.prototype.forEach.call($('pbLeft').querySelectorAll('.pb-nav'), function(b){
      b.onclick = function(){ state.stepIndex = +b.dataset.i; render(); };
    });
  }
  function navRow(s, i){
    var on = i === state.stepIndex, done = stepFilled(s);
    var cls = 'pb-nav' + (on ? ' is-on' : (done ? '' : ' is-todo'));
    var right = (done && !on) ? '<span class="ok">✓</span>' : '';
    return '<button class="' + cls + '" data-i="' + i + '">' + esc(shortTitle(s)) + right + '</button>';
  }

  // ── 중앙 ──
  function renderCenter(){
    $('pbCenter').style.padding = '';        // 덱 화면이 0으로 바꿔놓은 것을 되돌린다
    var all = steps(), h = '';
    // ★기업 화면에는 [저장분 불러오기]가 없다(2026-08-22) — 그 버튼을 가리키던 안내도 함께 뺀다.
    //   안내만 남기면 있지도 않은 버튼을 찾게 된다.
    if(state.serverDraft && isAdmin()){
      h += '<div class="pb-stalebar" style="margin-bottom:14px"><b>서버에 제출 자료(신청서·사업계획서·아이템 분석)로 만든 새 초안이 있습니다.</b>' +
           '<p>지금 화면의 내용과 다릅니다. 상단 <b>[저장분 불러오기]</b>를 누르면 이 화면이 그 초안으로 바뀝니다(현재 내용은 대체됩니다). ' +
           '지금 내용을 계속 쓰시려면 [저장]을 누르십시오 — 그러면 서버 쪽이 지금 내용으로 바뀝니다.</p></div>';
    }
    all.forEach(function(s, i){
      if(i === state.stepIndex){ h += openStep(s, i, all.length); return; }
      var prev = '';
      for(var k = 0; k < s.inputs.length && !prev; k++) prev = (state.formData[s.inputs[k].key] || '').trim();
      h += '<button class="pb-row' + (prev ? '' : ' is-empty') + '" data-i="' + i + '">' +
             '<span class="t">' + stepNo(i) + ' ' + esc(shortTitle(s)) + '</span>' +
             '<span class="p">' + (prev ? esc(prev) : '비어 있습니다 — 초안 자동생성은 제공하지 않습니다') + '</span>' +
             '<span class="n"><span>' + stepChars(s) + '자</span>' +
               (stepFilled(s) ? '<span class="ok">✓</span>' : '') + '</span>' +
           '</button>';
    });
    $('pbCenter').innerHTML = h;

    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-row'), function(b){
      b.onclick = function(){ state.stepIndex = +b.dataset.i; render(); };
    });
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-cardtab'), function(b){
      b.onclick = function(){ state.tab = +b.dataset.ct; render(); };
    });
    if(state.tab !== 0) bindCoach(steps()[state.stepIndex]);
    if(state.tab === 0) bindAw(steps()[state.stepIndex]);
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('textarea'), function(ta){
      ta.oninput = function(){
        state.formData[ta.dataset.k] = ta.value;
        ta.parentNode.querySelector('.pb-cnt').textContent = ta.value.length + '자';
        saveLocal();
        renderMeta();
      };
    });
    if($('btnPrev')) $('btnPrev').onclick = function(){ move(-1); };
    if($('btnNext')) $('btnNext').onclick = function(){ move(1); };
  }
  // ══ AI 작성모드 (2026-08-20 2단 · grilling Q5 확정) ═══════════════
  //  묻고 답한 재료만 문장으로 정리한다. 없는 수치는 [__] — 빈칸 자동 생성 금지 원칙(§2-3)은 여기서도 산다.
  //  ★답변 1회 = LLM 1회. 응답 하나에 [다음 질문 + 지금까지 재료로 정리한 원고]를 같이 받아 왕복을 아낀다.
  //  ★첫 질문은 로컬 템플릿(LLM 0회). [이대로 원고에 넣기]·모드 전환도 0회.
  //  ★문답 이력은 계정(who())별 localStorage — 계정을 갈면 다른 키라 새어 나가지 않는다.
  var AW_BASE = 'pitchbuilder.aw.v1';
  var aw = { on:false, data:{} };
  function awKey(){ return AW_BASE + '::' + who(); }
  function readAw(){ aw.data = {}; try{ aw.data = JSON.parse(localStorage.getItem(awKey()) || '{}') || {}; }catch(e){} }
  function writeAw(){ try{ localStorage.setItem(awKey(), JSON.stringify(aw.data)); }catch(e){} }
  function awOf(s){ if(!aw.data[s.id]) aw.data[s.id] = { msgs:[], draft:{} }; return aw.data[s.id]; }

  // 오늘 이 계정이 부른 LLM 횟수 — 안내용(강제는 서버 DAILY_LIMIT가 한다)
  var LLMCNT_BASE = 'pitchbuilder.llmcnt.v1';
  function llmCntKey(){ return LLMCNT_BASE + '::' + ((llm.id || '').trim() || 'anon') + '::' + localYMD(); }
  function llmToday(){ try{ return +(localStorage.getItem(llmCntKey()) || 0) || 0; }catch(e){ return 0; } }
  function llmBump(){ try{ localStorage.setItem(llmCntKey(), String(llmToday() + 1)); }catch(e){} }

  // ── AI 사용 횟수 ── 기업은 **누적 총 N회**까지 쓴다(2026-08-22 민부장 지시).
  //  🔴 세는 주체는 서버다. 브라우저가 세면 다른 PC에서 쓴 것이 빠지고 localStorage 를
  //     지우면 0으로 보인다. 화면은 서버가 준 값을 **받아 적기만** 한다.
  function quotaTake(d){
    if(d && d.quota && typeof d.quota.limit === 'number' && d.quota.limit > 0){
      llm.quota = { used: +d.quota.used || 0, limit: +d.quota.limit };
      try{ renderMeta(); }catch(e){}
    }
  }
  function quotaLeft(){ return llm.quota ? Math.max(0, llm.quota.limit - llm.quota.used) : null; }
  //  자리마다 다르게 적으면 기업이 서로 다른 숫자로 읽는다 — 문장은 하나로 둔다.
  function quotaText(){
    return llm.quota ? ('AI 사용 ' + llm.quota.used + ' / ' + llm.quota.limit + '회') : '';
  }

  function awOpening(s){
    return '「' + shortTitle(s) + '」 칸을 문답으로 채워 봅시다. 먼저 — ' + s.inputs[0].label + '부터 말씀해 주십시오.\n' +
           '수치를 말씀하실 때는 산정 근거(출처·방식)도 함께 주시면 원고에 그대로 싣습니다. ' +
           '모르는 항목은 "모릅니다"라고 하셔도 됩니다 — 비운 채로 넘어갑니다.';
  }

  //  기업이 말하지 않은 숫자를 잡는다 — 대조 원문 = 문답에서 기업이 말한 것 + 이미 쓴 원고.
  //  (badNumbers는 IR 원문 기준이라 여기 못 쓴다 — 문답 원고의 근거는 문답이다.)
  function awHay(s, entry){
    var t = entry.msgs.filter(function(m){ return m.role === 'me'; }).map(function(m){ return m.text; }).join(' ');
    s.inputs.forEach(function(f){ t += ' ' + (state.formData[f.key] || ''); });
    return t.replace(/[,\s]/g, '');
  }
  function awBadNums(text, hay){
    var out = [];
    var toks = String(text || '').match(/\d[\d,.]*/g) || [];
    toks.forEach(function(t){
      var d = t.replace(/[,\s]/g, '');
      if(d.replace(/\D/g, '').length < 2) return;                 // 한 자리 맨숫자는 통과
      if(hay.indexOf(d) < 0 && out.indexOf(t) < 0) out.push(t);
    });
    return out;
  }

  function awPrompt(s, entry){
    var keys = s.inputs.map(function(f){ return f.key; });
    var cur = s.inputs.map(function(f){
      return '- ' + f.key + ' (' + f.label + '): ' + ((state.formData[f.key] || '').trim() || '(비어 있음)');
    }).join('\n');
    var qa = entry.msgs.map(function(m){ return (m.role === 'ai' ? 'AI: ' : '기업: ') + m.text; }).join('\n');
    return [
      '너는 IR 문답 편집자다. 창업기업과 문답으로 "' + shortTitle(s) + '" 단계의 작성칸을 채우는 중이다.',
      '기업이 말한 재료만으로 원고를 정리하고, 다음에 물을 것을 하나만 정하라.',
      '',
      '# 이 단계의 작성칸 (key와 뜻)',
      cur,
      '',
      '# 지금까지의 문답 (마지막 줄이 방금 받은 답이다)',
      qa || '(아직 없음)',
      '',
      '# 규칙 (어기면 실패다)',
      '- 기업이 말하지 않은 수치·고객명·기관·비율·연도를 절대 만들지 마라. 근거가 필요한 자리는 [__]로 비워라.',
      '- 근거 없는 비율·수치가 나오면 출처를 한 번만 되물어라. "모릅니다"라고 하면 [__]로 두고 다음 항목으로 넘어가라.',
      '- 질문은 한 번에 하나. 이미 답한 것을 다시 묻지 마라.',
      '- draft는 위 작성칸 key에 대해서만 쓴다. 아직 재료가 없는 칸은 빈 문자열 "".',
      '- draft 문장은 투자자가 읽는 IR 문장으로 다듬는다 — 단 내용은 기업이 말한 범위를 넘지 마라.',
      '- 모든 칸에 재료가 모였으면 done=true, ask는 빈 문자열.',
      '',
      '# 출력 JSON 스키마',
      '{',
      '  "note": "방금 답에 대한 한 줄 반응(받았습니다/짚을 점). 없으면 빈 문자열",',
      '  "ask": "다음 질문 하나. 더 물을 것이 없으면 빈 문자열",',
      '  "draft": { "' + keys.join('" | "') + '": "정리된 원고(재료 없으면 빈 문자열)" },',
      '  "done": true 또는 false',
      '}'
    ].join('\n');
  }

  //  코드가 LLM을 검증한다 — 이 단계의 key만 남기고, 말하지 않은 숫자를 센다.
  function awNormalize(s, d, entry){
    d = (d && typeof d === 'object') ? d : {};
    var keys = s.inputs.map(function(f){ return f.key; });
    var draft = {}, hay = awHay(s, entry), warn = {};
    var src = (d.draft && typeof d.draft === 'object') ? d.draft : {};
    keys.forEach(function(k){
      var v = String(src[k] || '').trim();
      draft[k] = v;
      if(v){ var bad = awBadNums(v, hay); if(bad.length) warn[k] = bad; }
    });
    return { note: String(d.note || '').trim(), ask: String(d.ask || '').trim(),
             draft: draft, warn: warn, done: d.done === true };
  }

  function awPanel(s){
    var e = awOf(s);
    if(!e.msgs.length){ e.msgs.push({ role:'ai', text: awOpening(s) }); writeAw(); }   // 첫 질문 = 로컬(LLM 0회)

    var h = '<div class="pb-aw"><div class="pb-awchat"><h6>문답</h6><div class="pb-awmsgs" id="awMsgs">';
    e.msgs.forEach(function(m){
      h += '<div class="pb-awmsg ' + (m.role === 'me' ? 'me' : 'ai') + '">' + esc(m.text) + '</div>';
    });
    h += '</div>' +
         '<div class="pb-awin"><textarea id="awIn" placeholder="답을 적으십시오"></textarea>' +
         '<button class="pb-awsend" id="awSend">보내기</button></div>' +
         '<p class="pb-awhint">질문에 말로 답하면 오른쪽 원고가 채워집니다. 말하지 않은 수치는 만들지 않습니다. ' +
         '모르는 항목은 "모릅니다"라고 답하셔도 됩니다 — [__]로 비운 채 남깁니다.</p></div>';

    h += '<div class="pb-awdraft"><h6>정리된 원고</h6>' +
         '<p class="lead">그대로 두거나 [이대로 원고에 넣기] 뒤 직접 고치십시오. <b>[__]</b>는 말씀하지 않은 근거 자리입니다 — 심사에서 질문으로 돌아옵니다.</p>';
    var any = false;
    s.inputs.forEach(function(f){
      var v = (e.draft[f.key] || '').trim();
      if(v) any = true;
      var body = v
        ? '<p>' + esc(v).replace(/\[__\]/g, '<span class="gap">[__]</span>') + '</p>'
        : '<p class="empty">아직 재료가 없습니다</p>';
      var warn = (e.warn && e.warn[f.key] && e.warn[f.key].length)
        ? '<p class="warnnum">⚠ 말씀하지 않은 숫자 ' + e.warn[f.key].length + '개(' +
          esc(e.warn[f.key].slice(0, 3).join(' · ')) + ') — 문답에 없는 값입니다. 확인하십시오.</p>'
        : '';
      h += '<div class="pb-awf"><label>' + esc(f.label) + '</label>' + body + warn + '</div>';
    });
    h += '<div class="pb-awact">' +
           '<button class="pb-cta" style="width:auto;padding:11px 18px" id="awApply"' + (any ? '' : ' disabled') + '>이대로 원고에 넣기</button>' +
           '<button class="pb-cta sub" style="width:auto;padding:11px 18px" id="awRegen"' + (e.msgs.length > 1 ? '' : ' disabled') + '>다시 정리</button>' +
         '</div>' + DISCLAIMER + '</div></div>';
    return h;
  }

  var awBusy = false;
  function awCall(s, e, btn){
    awBusy = true;
    if(btn){ btn.disabled = true; btn.textContent = '정리 중…'; }
    callLLM(SYSTEM, awPrompt(s, e))
      .then(function(d){
        var r = awNormalize(s, d, e);
        e.draft = r.draft; e.warn = r.warn;
        var say = (r.note ? r.note + '\n' : '') +
                  (r.ask || (r.done ? '더 물을 것이 없습니다. 오른쪽 원고를 확인하시고 [이대로 원고에 넣기]를 누르십시오.'
                                    : '이어서 말씀해 주십시오.'));
        e.msgs.push({ role:'ai', text: say });
        writeAw();
      })
      .catch(function(err){
        e.msgs.push({ role:'ai', text: '답을 정리하지 못했습니다 — ' + (err.message || '오류') + '\n다시 보내 주십시오.' });
        writeAw();
      })
      .then(function(){ awBusy = false; render(); });
  }
  function bindAw(s){
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-awbtn'), function(b){
      b.onclick = function(){ aw.on = b.dataset.aw === '1'; render(); };
    });
    var box = $('awMsgs');
    if(box) box.scrollTop = box.scrollHeight;
    if($('awSend')){
      var send = function(){
        if(awBusy) return;
        var ta = $('awIn'), v = (ta.value || '').trim();
        if(!v) return;
        var e = awOf(s);
        e.msgs.push({ role:'me', text: v });
        writeAw();
        render();                                            // 내 답을 먼저 보인다
        awCall(s, e, $('awSend'));
      };
      $('awSend').onclick = send;
      $('awIn').onkeydown = function(ev){ if(ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)){ ev.preventDefault(); send(); } };
    }
    if($('awRegen')) $('awRegen').onclick = function(){
      if(awBusy) return;
      awCall(s, awOf(s), $('awRegen'));                       // 같은 문답으로 원고만 다시 조립(LLM 1회)
    };
    if($('awApply')) $('awApply').onclick = function(){
      var e = awOf(s), n = 0, clash = 0;
      s.inputs.forEach(function(f){
        var v = (e.draft[f.key] || '').trim();
        if(!v) return;
        n++;
        var cur = (state.formData[f.key] || '').trim();
        if(cur && normTxt(cur) !== normTxt(v)) clash++;
      });
      if(!n) return;
      // ★원고 소유권은 기업이다 — 이미 쓴 칸을 덮을 때는 반드시 먼저 묻는다.
      if(clash && !confirm('이미 쓰신 칸 ' + clash + '개가 문답 원고로 바뀝니다.\n' +
                           '지금 쓰신 내용은 되돌릴 수 없습니다.\n\n계속할까요?')) return;
      s.inputs.forEach(function(f){
        var v = (e.draft[f.key] || '').trim();
        if(v) state.formData[f.key] = v;
      });
      saveLocal();
      aw.on = false;                                          // 넣었으면 직접 작성으로 돌아가 다듬는다
      render();
    };
  }

  function openStep(s, i, total){
    var h = '<div class="pb-open">' +
      '<div class="step-no">STEP ' + stepNo(i) + ' / ' + total + '</div>' +
      '<h2>' + esc(s.title.replace(/^\s*\d+\.\s*/, '')) + '</h2>' +
      '<p class="sub">' + esc(s.subtitle) + '</p>';

    // ── 카드 탭 [작성 | 가이드 | AI 진단] — 탭을 넘겨도 원고는 그대로 남는다(2026-08-20 재디자인) ──
    var gN = 0;
    try{ gN = brainItemsFor(s.id).length; }catch(e){}
    var TABS = ['작성', '가이드' + (gN ? '<span class="n">' + gN + '문항</span>' : ''), 'AI 진단'];
    h += '<div class="pb-cardtabs">';
    TABS.forEach(function(t, k){
      h += '<button class="pb-cardtab' + (k === state.tab ? ' is-on' : '') + '" data-ct="' + k + '">' + t + '</button>';
    });
    h += '</div>';

    if(state.tab !== 0){
      h += coachPanel(s) + '</div>';
      return h;
    }

    // ── 작성 방식 [직접 작성 | AI 작성모드] — 기본은 직접 작성(2026-08-20 2단) ──
    h += '<div class="pb-awbar">' +
           '<button class="pb-awbtn' + (!aw.on ? ' is-on' : '') + '" data-aw="0">직접 작성</button>' +
           '<button class="pb-awbtn' + (aw.on ? ' is-on' : '') + '" data-aw="1">AI 작성모드</button>' +
           '<span class="pb-awcnt">' + (llm.quota ? esc(quotaText())
                                                   : ('오늘 AI 호출 ' + llmToday() + '회 사용')) + '</span>' +
         '</div>';
    if(aw.on){
      h += awPanel(s) + '</div>';
      return h;
    }

    s.inputs.forEach(function(f){
      var v = state.formData[f.key] || '';
      h += '<div class="pb-field">' +
             '<label>' + esc(f.label) + '<span class="key">' + esc(f.key) + '</span></label>' +
             '<textarea data-k="' + esc(f.key) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>' +
             '<div class="pb-cnt">' + v.length + '자</div>' +
           '</div>';
    });
    // 마지막 단계에서는 버튼이 무엇을 하는지 라벨로 밝힌다
    var isLast = (i === total - 1);
    h += '<div class="pb-steps-btn">' +
           '<button class="pb-cta sub" id="btnPrev" style="width:auto;padding:11px 20px">← 이전</button>' +
           '<button class="pb-cta" id="btnNext" style="width:auto;padding:11px 20px">' +
             (isLast ? '결과 보기 →' : '다음 →') + '</button>' +
         '</div>' +
         '<p class="pb-cardhint">위 탭에서 가이드·AI 진단을 보실 수 있습니다 — 탭을 넘겨도 원고는 그대로 남습니다.</p>' +
         '</div>';
    return h;
  }
  function move(d){
    var n = steps().length;
    // ★마지막 단계에서 [다음]은 '결과 보기'다.
    //   전에는 인덱스를 잘라내기만 해 **눌러도 아무 일이 없었다** — 고장으로 보인다.
    //   마지막이 어디인지는 모드가 정한다: R&D 꺼짐 = 6 팀·Ask / 켜짐 = 8 성능지표.
    if(d > 0 && state.stepIndex >= n - 1){
      syncToServer();
      goResult();
      return;
    }
    state.stepIndex = Math.max(0, Math.min(n - 1, state.stepIndex + d));
    // ★단계를 넘길 때마다 서버에 올린다.
    //   수동 버튼뿐이던 시절, 캐시 삭제나 PC 변경이 곧 전량 소실이었다.
    syncToServer();
    render();
    window.scrollTo(0, 0);
  }

  // ── 우: 코치 열 ── (2026-07-30 재편 · grilling 13문답)
  //   순서 = **쓰기 전 → 쓴 뒤**. 가이드가 맨 앞인 이유다 —
  //   가이드는 '무엇을 써야 하는가'이고 나머지는 '쓴 것에 대한 평'이다.
  //   ~~"멘토가 맨 앞" 원칙은 폐기했다(민부장 지시 2026-07-30).~~
  //
  //   가이드 = D5 IR 학습자료 지식체계 문항(①) + B6 전문 관점(②·다음 단계) + B1 신청서 재료(③)
  //   ~~멘토·상장사 대조군·분량 배분~~ = 2026-08-19~20 민부장 지시로 전부 삭제(배점·LAGMP 연동 폐기).

  //  🔴 어느 탭이든 "여기 내용은 의견일 뿐"임을 밝힌다(민부장 지시).
  //     시스템은 판정자가 아니라 쟁점 제기자다 — 산학협력단 운영지원 AI와 같은 사상.
  var DISCLAIMER =
    '<p class="pb-disclaim">여기 내용은 <b>의견일 뿐이며 참고 자료로 활용</b>하십시오. ' +
    '판정이 아닙니다 — 최종 판단과 책임은 작성자에게 있습니다.</p>';

  //  카드 안 코치 패널 — 다크 인셋. ~~우측 코치 열(#pbRight)~~ 2026-08-20 재디자인으로 폐지(작성 화면).
  //  state.tab: 0=작성 · 1=가이드 · 2=AI 진단
  function coachPanel(s){
    var h = '<div class="pb-coach"><div class="pb-panel">';

    if(state.tab === 1){
      // ── 가이드 ── ①문항 ②전문 관점 ③신청서 재료
      h += guideBlock(s);
      h += b1RefBlock(s);
    } else if(state.tab === 2){
      var dg = state.diags[s.id];
      var dStale = !!dg && dg.hash !== stepHash(s);
      h += '<h5>AI 진단</h5>' +
           '<p>이 단계를 진단하면 심사역 관점의 지적과 개선 문장을 제안합니다. ' +
           '근거가 필요한 자리는 <b>[__]</b>로 비워 둡니다 — 없는 수치를 만들어 넣지 않기 위해서입니다.</p>' +
           '<p class="pb-note" style="margin:6px 0 10px">AI 진단은 기업별 10회로 제한됩니다.</p>';
      if(dStale){
        h += '<div class="pb-stalebar"><b>이 진단은 고치기 전 문장에 대한 것입니다.</b>' +
             '<p>' + (dg.at ? esc(String(dg.at).slice(0,16).replace('T',' ')) + ' 진단 이후 ' : '') +
             '이 단계를 고치셨습니다. 지금 원고에 대한 판단이 필요하면 다시 진단하십시오.</p></div>';
      }
      h += '<button class="pb-inkbtn" id="btnAI">' + (dg ? '다시 진단' : '이 단계 진단받기') + '</button>' +
           '<div id="pbDiag" class="pb-diag' + (dStale ? ' pb-stale' : '') + '"></div>';
    }
    h += DISCLAIMER + '</div></div>';
    return h;
  }
  function bindCoach(s){
    if($('btnAI')){
      $('btnAI').onclick = runDiag;
      if(state.diags[s.id]) renderDiagInto(state.diags[s.id].data);
    }
    if($('btnB1Ref')) $('btnB1Ref').onclick = reloadB1Ref;
    bindGuideToggles();
  }

  // ══ 가이드 ① — D5 지식체계 문항 ═══════════════════════════════
  //  🔴 **채점하지 않는다.** LLM을 부르지 않으므로 일일 상한과 무관하고,
  //     누르지 않아도 항상 떠 있다 — 이것이 '자동 코칭'의 실질이다.
  //     내 원고를 판단하는 일은 AI 진단 탭이 맡는다. 두 탭이 같은 말을 하면 안 된다.
  //  🔴 `red_flags`는 프롬프트 전용이라 여기 뿌리지 않는다(엔진 규칙).
  //  🔴 문항이 배정되지 않은 단계(1 cover · 6 team_ask · R&D)는 기존 coachTips를 쓴다.
  function guideBlock(s){
    var items = brainItemsFor(s.id);

    if(!items.length){
      var h0 = '<h5>작성 가이드</h5><ul>';
      (s.coachTips || []).forEach(function(t){ h0 += '<li>' + esc(t) + '</li>'; });
      h0 += '</ul>';
      if(brain.version){
        h0 += '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-3)">' +
              '이 단계는 아직 문헌 기반 문항이 배정되지 않았습니다.</p>';
      }
      return h0;
    }

    var h = '<h5>이 단계가 묻는 것</h5>' +
            '<p class="pb-note" style="color:var(--pb-on-ink-3)">' +
            'IR 학습자료 <b>40건</b>에서 뽑은 문항입니다. 채점하지 않습니다 — ' +
            '무엇을 갖춰야 하는지만 보여드립니다.</p>';

    items.forEach(function(it, i){
      var soft = String(it.confidence || '') === '낮음';
      var good = (it.anchors && (it.anchors['3'] || it.anchors[3])) || '';
      h += '<div class="pb-qitem">' +
             '<div class="q"><span class="n">' + (i + 1) + '</span>' + esc(it.question || '') +
               (soft ? '<span class="soft">의견</span>' : '') + '</div>';
      if(it.why) h += '<div class="why">' + esc(it.why) + '</div>';
      if(it.evidence && it.evidence.length){
        h += '<div class="ev"><b>요구 증거</b> ' +
             it.evidence.map(function(e){ return esc(e); }).join(' · ') + '</div>';
      }
      if(good) h += '<div class="good"><b>이 정도면 충분합니다</b><br>' + esc(good) + '</div>';
      if(it.industry) h += '<div class="ind">' + esc(it.industry) + '</div>';

      var rx = it.rx && brain.rx ? brain.rx[it.rx] : null;
      if(rx){
        h += '<button class="pb-qmore" data-rx="' + esc(it.id) + '">처방 보기</button>' +
             '<div class="pb-rx hidden" id="rx-' + esc(it.id) + '">' + rxHtml(rx) + '</div>';
      }
      if(it.sources && it.sources.length){
        h += '<div class="src">출처 ' + it.sources.map(function(x){ return esc(x); }).join(' · ') + '</div>';
      }
      h += '</div>';
    });
    return h;
  }

  //  처방 본문. 번들 계약이 문자열/객체 둘 다 올 수 있어 방어적으로 그린다.
  function rxHtml(rx){
    if(typeof rx === 'string') return '<p>' + esc(rx) + '</p>';
    var h = '';
    ['처방', 'action', 'body', '개선처방', 'text'].forEach(function(k){
      if(!h && rx[k]) h = '<p>' + esc(String(rx[k])) + '</p>';
    });
    if(!h){
      // 알 수 없는 형태여도 사람이 읽을 수 있게는 보여준다
      Object.keys(rx).forEach(function(k){
        var v = rx[k];
        if(typeof v === 'string' && v.trim())
          h += '<p><b>' + esc(k) + '</b> · ' + esc(v) + '</p>';
      });
    }
    return h || '<p>처방 본문이 비어 있습니다.</p>';
  }

  function bindGuideToggles(){
    Array.prototype.forEach.call(document.querySelectorAll('.pb-coach .pb-qmore'), function(b){
      b.onclick = function(){
        var box = $('rx-' + b.dataset.rx);
        if(!box) return;
        var open = !box.classList.contains('hidden');
        box.classList.toggle('hidden', open);
        b.textContent = open ? '처방 보기' : '처방 닫기';
      };
    });
  }

  // ══ 신청서 참고자료 (P2) ═══════════════════════════════════════
  //  이노테크 접수(B1)에 이미 쓰신 것 중 **IR 본문으로 옮기지 않는 것**을 여기서만 보여준다.
  //  🔴 숫자로 문장을 조립하지 않는다. "연 480만원 × 3,200곳 = 153억"을 시스템이 만들면
  //     그것은 기업이 쓴 문장이 아니라 시스템의 해석이고, 투자자가 근거를 물으면 팀이 답하지 못한다.
  //     그래서 값만 나란히 놓고, 문장은 사람이 쓴다.
  //  🔴 ③ 아이템분석은 여기에 싣지 않는다(미결 1 판단). 심사 배점·비판적 진단이 섞여 있어
  //     피심사자 본인에게 보이면 변별력이 깨진다 — LAGMP가 applicantdetail에서 막는 것과 같은 이유다.
  var B1_REF_STEPS = {
    cover:    { extra:['사업아이템명'] },
    solution: { extra:['LC3.고유가치제안(필수)'] },
    market:   { numbers:['1년차 목표 판매량', '단가', '3년차 목표매출'] },
    business: { numbers:['단가', '단위원가', '재구매율', 'CAC', 'LTV/CAC', '단위경제성'],
                extra:['LC7.비용구조', 'LC8.핵심지표'] }
  };
  function hasB1Ref(){
    var r = state.b1ref;
    if(!r) return false;
    var n = r.numbers && Object.keys(r.numbers).some(function(k){
      return r.numbers[k] !== null && r.numbers[k] !== '' && r.numbers[k] !== undefined;
    });
    return !!((r.files && r.files.length) || n || (r.extra && Object.keys(r.extra).length));
  }
  function numTxt(v){
    if(v === null || v === undefined || v === '') return '';
    return (typeof v === 'number') ? v.toLocaleString() : String(v);
  }
  function b1RefBlock(s){
    var r = state.b1ref;
    if(!r){
      // ★여기가 '원고를 지키면서 자료만 받는' 유일한 입구다. 버튼이 반드시 있어야 한다.
      return '<h5>신청서에 이렇게 쓰셨습니다</h5>' +
             '<p>이노테크 접수 자료 중 <b>IR 본문으로 옮기지 않는 것</b>(재무 트윈 숫자 · 고유가치제안 · ' +
             '비용구조 · 핵심지표 · 제출 파일)을 여기서 보실 수 있습니다.</p>' +
             '<p class="pb-note" style="margin-top:10px;color:var(--pb-on-ink-3)">' +
             '아래 버튼은 <b>작성하신 원고를 건드리지 않습니다.</b> ' +
             '원고까지 신청서 내용으로 되돌리시려면 상단 [신청서 내용 가져오기]를 쓰십시오.</p>' +
             '<button class="pb-inkbtn" id="btnB1Ref" style="margin-top:14px">제출한 파일 확인</button>';
    }

    var h = '<h5>신청서에 이렇게 쓰셨습니다</h5>' +
            '<p class="pb-note" style="color:var(--pb-on-ink-3)">' +
            '이노테크 접수 자료입니다' +
            (state.b1At ? ' · ' + esc(String(state.b1At).slice(0,16).replace('T',' ')) + ' 기준' : '') +
            '. <b>IR 본문에 자동으로 들어가지 않습니다</b> — 보고 판단하신 뒤 직접 쓰십시오.</p>';

    var map = B1_REF_STEPS[s.id] || {};
    var body = '';

    // 숫자 — 나란히 놓기만 한다. 곱하지도 더하지도 않는다.
    (map.numbers || []).forEach(function(k){
      var v = numTxt(r.numbers && r.numbers[k]);
      if(v) body += '<div class="row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>';
    });
    if(body){
      body = '<div class="pb-mine" style="margin-top:12px"><h5>재무 트윈에 적으신 숫자</h5>' + body +
             '<p class="vd">🔴 <b>이 값들로 문장을 만들어 드리지 않습니다.</b> 단위와 근거를 아는 사람은 여러분입니다. ' +
             '지금도 같은 값인지 확인하고, 시장·수익 문장은 직접 쓰십시오.</p></div>';
    }

    // 린캔버스 서술 — 본문 8칸에 안 들어가는 것들
    var ex = '';
    (map.extra || []).forEach(function(k){
      var v = (r.extra && r.extra[k]) || '';
      if(v) ex += '<div class="pb-mentor" style="margin-top:10px"><h5>' + esc(k) + '</h5><p>' + esc(v) + '</p></div>';
    });

    var out = body + ex;
    if(!out) out = '<p style="margin-top:12px">이 단계에 해당하는 신청서 참고자료는 없습니다.</p>';
    h += out;

    // 제출 파일 — 노션 첨부 URL은 시간이 지나면 만료된다.
    // ★[신청서 불러오기]로 다시 받게 하면 원고가 통째로 대체된다(그게 그 버튼의 정의다).
    //   자료만 다시 받는 경로를 따로 둔다 — 파일 하나 보려다 원고를 잃는 일이 없어야 한다.
    if(r.files && r.files.length){
      h += '<div class="pb-corpus" style="margin-top:14px"><h5>제출하신 파일</h5>';
      r.files.forEach(function(f){
        h += '<p style="margin:4px 0"><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' +
             esc(f.name || f.label) + '</a> <span style="color:var(--pb-on-ink-3)">· ' + esc(f.label) + '</span></p>';
      });
      h += '<p class="pb-note" style="color:var(--pb-on-ink-3)">링크는 시간이 지나면 만료됩니다. ' +
           '열리지 않으면 아래 [제출한 파일 확인]을 누르십시오 — <b>원고는 건드리지 않습니다.</b></p></div>';
    }
    h += '<button class="pb-inkbtn" id="btnB1Ref" style="margin-top:14px">제출한 파일 확인</button>';
    return h;
  }

  // 원고를 그대로 두고 참고자료(ref)만 갱신한다 — [신청서 불러오기]와 다른 버튼인 이유.
  function reloadB1Ref(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않습니다.'); return; }
    if(busy) return;
    var btn = $('btnB1Ref');
    busy = true; if(btn){ btn.disabled = true; btn.textContent = '받는 중…'; }
    // 관리자가 대리 편집 중이면 그 기업 cid를 서버에 알려야 한다(팀은 서버가 알아서 정한다)
    apiGet('b1ref', (admin && admin.editing) ? { cid: admin.editing.cid } : {})
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.error) || '받지 못했습니다.');
        if(!d.found){ alert('접수 시스템에서 귀사의 신청 자료를 찾지 못했습니다.'); return; }
        state.b1ref = d.ref || null;
        state.b1At = new Date().toISOString();
        writeLocal();
        render();                                  // 참고자료 블록을 다시 그린다
      })
      .catch(function(err){ alert('받지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if($('btnB1Ref')){ $('btnB1Ref').disabled = false; $('btnB1Ref').textContent = '제출한 파일 확인'; }
      });
  }

  // ── AI 진단 ──
  function runDiag(){
    if(busy) return;
    var s = steps()[state.stepIndex];
    var empty = s.inputs.every(function(i){ return !(state.formData[i.key] || '').trim(); });
    if(empty){
      renderDiagInto({ verdict:'이 단계가 비어 있습니다. 먼저 채우신 뒤 진단을 요청하십시오.' });
      return;
    }
    var btn = $('btnAI');
    busy = true; btn.disabled = true; btn.textContent = '진단 중…';
    callLLM(SYSTEM, stepPrompt())
      .then(function(d){
        // ★무엇을 보고 받은 진단인지를 함께 남긴다 — 이 해시가 낡음 판정의 근거다.
        state.diags[s.id] = { data:d, hash:stepHash(s), at:new Date().toISOString() };
        writeLocal();
        render();                                  // 버튼 라벨·낡음 배너까지 다시 그린다
      })
      .catch(function(err){
        renderDiagInto({ verdict:'진단하지 못했습니다 — ' + (err.message || '오류') });
      })
      .then(function(){
        busy = false;
        // ★라벨을 고정 문구로 되돌리면 안 된다 — 이미 진단을 받은 뒤에는 [다시 진단]이어야 한다.
        if($('btnAI')){
          $('btnAI').disabled = false;
          $('btnAI').textContent = state.diags[s.id] ? '다시 진단' : '이 단계 진단받기';
        }
      });
  }
  function renderDiagInto(d){
    var box = $('pbDiag');
    if(!box) return;
    var h = '';
    if(d.verdict) h += '<p style="font-size:14px;color:var(--pb-paper)">' + esc(d.verdict) + '</p>';

    arr(d.issues).forEach(function(it){
      var sev = (it.severity === 'high') ? ' sev-high' : '';
      h += '<div class="pb-issue' + sev + '">' +
             '<div class="f">' + esc(FIELD_LABEL[it.field] || it.field || '') + '</div>' +
             '<div class="q">' + esc(it.problem || '') + '</div>' +
             (it.why ? '<div class="w">' + esc(it.why) + '</div>' : '') +
           '</div>';
    });

    var rw = arr(d.rewrites).filter(function(r){ return r && r.text && FIELD_LABEL[r.field]; });
    rw.forEach(function(r, i){
      h += '<div class="pb-rw">' +
             '<div class="f" style="font:500 11px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-on-ink-3)">' +
               esc(FIELD_LABEL[r.field]) + '</div>' +
             '<p style="margin-top:6px">' + esc(r.text) + '</p>' +
             '<button data-rw="' + i + '">입력란에 적용</button>' +
           '</div>';
    });

    var qs = arr(d.questions);
    if(qs.length){
      h += '<div class="pb-issue"><div class="f">실사에서 나올 질문</div>';
      qs.forEach(function(q){
        h += '<div class="q" style="margin-top:6px">· ' + esc(typeof q === 'string' ? q : (q && q.q) || '') + '</div>';
      });
      h += '</div>';
    }
    box.innerHTML = h;

    Array.prototype.forEach.call(box.querySelectorAll('[data-rw]'), function(b){
      b.onclick = function(){
        var r = rw[+b.dataset.rw];
        if(!r) return;
        state.formData[r.field] = r.text;
        saveLocal();
        render();                                  // 입력란·목차·메타가 함께 갱신된다
        b.textContent = '적용됨';
        b.disabled = true;
      };
    });
  }

  // ── 저장 (계정별 격리) ──
  //  ★키를 계정별로 가르지 않으면, 같은 PC에서 A기업이 쓰고 나간 뒤
  //    B기업이 들어왔을 때 A의 IR이 그대로 떠 있는다.
  var saveTimer = null;
  // ★칩을 띄우지 않고 조용히 쓰는 경로. 화면을 그리다가 기준선을 잡을 때 쓴다 —
  //   코멘트를 열어보기만 했는데 '저장중…'이 뜨면 사용자는 자기가 뭘 고쳤나 의심한다.
  function writeLocal(){
    try{
      localStorage.setItem(skey(), JSON.stringify({
        stepIndex: state.stepIndex, formData: state.formData, completed: state.completed,
        // ★판단과 그 근거 해시도 같이 남긴다. 이것이 없으면 새로고침 한 번에
        //   "고치기 전 진단"이라는 사실이 사라지고, 낡은 진단이 최신인 양 다시 뜬다.
        diags: state.diags,
        auditHash: state.auditHash,
        // ★①도식은 덱의 재료다(2026-08-22 순서 개편). 남기지 않으면 새로고침 한 번에
        //   관문 ①이 도로 닫히고, 기업은 같은 도식을 다시 뽑느라 일일 호출을 또 쓴다.
        lastDiagrams: state.lastDiagrams || null,
        figHash: state.figHash || '',
        deckHash: state.deckHash || '',
        // ★신청서 참고자료도 남긴다. 없으면 새로고침 한 번에 참고 열이 통째로 비고,
        //   기업은 "아까는 있었는데"라며 불러오기를 다시 눌러 원고를 통째로 잃는다.
        b1ref: state.b1ref || null, b1At: state.b1At || ''
      }));
      return true;
    }catch(e){ return false; }
  }
  function saveLocal(){
    chip('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ chip(writeLocal() ? 'ok' : 'fail'); }, 400);
  }
  function loadLocal(){
    // ★먼저 비운다 — 로그아웃해도 스크립트가 메모리에 남아 앞 기업 내용이 새어 나온다
    state.formData = {}; state.stepIndex = 0; state.completed = false;
    state.lastAudit = null; state.lastDeck = null;
    // ★진단·기준선도 반드시 비운다. 칸만 갈라두면 A기업이 받은 진단이 B기업 화면에 남는다.
    state.diags = {}; state.auditHash = '';
    // ★도식도 그 기업의 것이다 — 계정을 갈면 반드시 비운다(관문 ①도 함께 닫힌다).
    state.lastDiagrams = null; state.figHash = ''; state.deckHash = '';
    // ★신청서 참고자료는 그 기업의 신청 내용이다 — 계정을 갈면 반드시 비운다.
    //   칸(localStorage 키)만 갈라두면 A기업의 신청서가 B기업 코치 열에 그대로 남는다.
    state.b1ref = null; state.b1At = '';
    // ★지식 번들은 기업 자료가 아니라 공용 지식이다 — 비우지 않고 그대로 쓴다.
    readBrain();
    readAw(); aw.on = false;                     // 문답 이력은 계정(who) 키로 갈린다 — 켜짐 상태는 넘기지 않는다
    try{
      var raw = localStorage.getItem(skey());
      if(!raw) return;
      var s = JSON.parse(raw);
      if(s && typeof s === 'object'){
        state.formData  = s.formData || {};
        state.stepIndex = Math.min(+s.stepIndex || 0, steps().length - 1);
        state.completed = !!s.completed;
        state.diags      = (s.diags && typeof s.diags === 'object') ? s.diags : {};
        state.auditHash  = s.auditHash || '';
        state.lastDiagrams = (s.lastDiagrams && typeof s.lastDiagrams === 'object') ? s.lastDiagrams : null;
        state.figHash    = s.figHash || '';
        state.deckHash   = s.deckHash || '';
        state.b1ref      = (s.b1ref && typeof s.b1ref === 'object') ? s.b1ref : null;
        state.b1At       = s.b1At || '';
      }
    }catch(e){}
  }

  // ── 저장 상태칩 ── 실패는 자동으로 사라지지 않는다
  function chip(mode){
    var c = $('hdChip'), t = $('hdChipTxt');
    c.classList.toggle('is-fail', mode === 'fail');
    if(mode === 'saving'){ t.textContent = '저장중…'; }
    else if(mode === 'fail'){
      t.innerHTML = '저장 실패 — 브라우저를 닫지 마세요<button class="retry" id="hdRetry">다시 저장</button>';
      var r = $('hdRetry'); if(r) r.onclick = saveLocal;
    } else {
      var d = new Date();
      t.textContent = '저장됨 ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    }
  }

  function notYet(what){
    alert(what + '은(는) 다음 이식 단계에서 붙습니다.');
  }

  // ══ 화면 전환 ═════════════════════════════════════════════════
  //  화면이 늘면 전환 함수가 전부를 알아야 한다 — 하나를 빠뜨리면 그 화면이 열린 채 남는다.
  // 헤더 버튼의 '지금 쓸 수 있는가'를 화면 상태에 맞춘다.
  //  ★관리자는 기업을 연 상태에서만 신청서 내용을 가져올 수 있다 — 누구 신청서인지 정해져야 하고,
  //    직접 입력으로 만든 기업(접수번호 없음)은 애초에 가져올 신청서가 없다.
  function syncHeader(){
    if(!$('hdB1')) return;
    var canB1 = !isAdmin() || !!(admin && admin.editing && admin.editing.cid);
    $('hdB1').style.display = canB1 ? '' : 'none';
    // ★[저장분 불러오기]는 기업 화면에서 뺀다(2026-08-22 민부장 지시).
    //   기업이 쓰는 자리에서 이 버튼이 하는 일은 **지금 쓰던 원고를 서버 저장분으로 갈아치우는 것**뿐이고,
    //   자동저장·자동동기가 이미 도는 화면에서 그럴 일이 없다. 남겨 두면 잘못 눌러 원고를 잃는 버튼이다.
    //   🔴관리자에게는 남긴다 — 대리 편집으로 남의 기업을 열 때는 서버 저장분을 불러오는 것이 정상 동선이다.
    if($('hdLoad')) $('hdLoad').style.display = isAdmin() ? '' : 'none';
  }

  function render(){
    syncHeader();
    // ★우측 열은 작성 화면에서 쓰지 않는다(2026-08-20 재디자인) — 코치는 카드 안 탭으로 들어갔다.
    var noR = (state.view === 'write' || !state.view);
    $('pbRight').classList.toggle('hidden', noR);
    $('pbShell').classList.toggle('no-right', noR);
    if(state.view === 'result'){ renderResultView(); return; }
    if(state.view === 'deck'){   renderDeckView();   return; }
    if(state.view === 'admin'){  renderAdminView();  return; }
    $('pbCenter').style.padding = '';
    renderLeft(); renderCenter(); renderMeta();
  }
  function goResult(){ state.view = 'result'; state.stepIndex = 0; render(); window.scrollTo(0,0); }
  function goWrite(){  state.view = 'write';  render(); window.scrollTo(0,0); }
  function goDeck(){
    // ★관문 ①②를 지나야 덱을 만든다(2026-08-22). 이미 만든 덱을 다시 여는 것은 막지 않는다 —
    //   만들어 둔 것을 못 보게 할 이유가 없다.
    var g = deckGate();
    if(!state.lastDeck){
      if(!g.ok){ deckBlocked(g); return; }
      makeDeck(); return;
    }
    // 🔴 덱이 있으면 재생성하지 않는 것이 원래 규칙이다. 다만 **그 사이 원고가 바뀌었으면**
    //   화면에는 옛 덱이 그대로 떠서 "고쳤는데 자료가 안 바뀐다"로 읽힌다(민부장 지적).
    //   묻고, 답을 따른다. 조용히 덮어쓰지도, 조용히 옛것을 보여주지도 않는다.
    if(irStale(state.deckHash)){
      if(confirm('이 피칭 자료는 원고를 고치기 전에 만든 것입니다.\n\n' +
                 '지금 원고로 다시 만들까요?\n' +
                 '(취소하면 만들어 둔 자료를 그대로 엽니다. 손으로 고친 문구는 다시 만들면 사라집니다.)')){
        if(!g.ok){ deckBlocked(g); return; }
        makeDeck(); return;
      }
    }
    state.view = 'deck'; render(); window.scrollTo(0,0);
  }

  // ══ 피칭 덱 ═══════════════════════════════════════════════════
  //  ★슬라이드 문구와 도식 구조를 LLM 호출 '한 번'에 받는다 — 일일 상한을 아껴야 한다.
  //  ★LLM이 요약하며 지어낸 수치가 슬라이드에 박히면 팀이 투자자 앞에서 그대로 읽는다.
  //    그래서 문구의 숫자를 코드가 IR 원문과 대조한다(badNumbers). 지우진 않는다 — 판단은 사람이 한다.
  var deckEdited = false;

  function makeDeck(){
    if(busy) return;
    // ★[자료 전체 다시 만들기]로도 여기 들어온다 — 관문은 입구가 아니라 이 함수가 지킨다.
    var g = deckGate();
    if(!g.ok){ deckBlocked(g); return; }
    var filledN = Object.keys(state.formData).filter(function(k){
      return String(state.formData[k] || '').trim();
    }).length;
    if(filledN < 4){
      alert('덱을 만들려면 내용이 더 필요합니다. 최소 4개 항목 이상 채워 주십시오. (현재 ' + filledN + '개)');
      return;
    }
    busy = true;
    var btn = $('btnDeckMake') || $('btnDeckGo') || $('rlDeck');
    if(btn){ btn.disabled = true; btn.textContent = '만드는 중…'; }

    callLLM(SYSTEM, deckPrompt())
      .then(function(d){
        // ★도식은 ①의 판정이 정본이다(2026-08-22). 덱이 낸 것은 ①이 비운 자리만 채운다.
        //   이 우선순위를 뒤집으면 기업이 ①에서 보고 받아들인 그림과 덱의 그림이 달라진다.
        var dg = {};
        Object.keys((d && d.diagrams) || {}).forEach(function(k){ dg[k] = d.diagrams[k]; });
        DG_ORDER.forEach(function(k){
          if(drawOne(k, state.lastDiagrams)) dg[k] = state.lastDiagrams[k];
        });
        state.lastDeck = { slides: arr(d && d.slides), rnd:(d && d.rnd) || null, diagrams: dg };
        state.deckHash = irHash();          // 어느 원고로 만든 덱인지 기억한다
        deckEdited = false;
        state.view = 'deck';
        render();
        window.scrollTo(0, 0);
      })
      .catch(function(err){ alert('덱을 만들지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if(btn){ btn.disabled = false; btn.textContent = 'IR 피칭 자료 만들기'; }
      });
  }

  function renderDeckView(){
    renderMeta();
    renderDeckLeft();
    renderDeckCenter();
    renderDeckRight();
  }

  // ── 슬라이드 목록 — LLM이 낸 5장을 화면 장수로 편다 ──
  //  ★도식이 둘인 장(Solution·Market)은 둘째 도식을 **자기 장**으로 뗀다.
  //    848px 폭에 도식 하나가 온전히 들어가야 글자가 읽힌다(둘을 나란히 놓으면 8px대로 준다).
  //  ★둘째 도식이 비어 있어도 장은 만든다(화면에서 [도식 뽑기]를 누를 자리) — 단 PDF에는 안 싣는다(is-empty).
  function deckList(){
    var deck = state.lastDeck || {};
    var wantRnd = !!deck.rnd && state.deckRnd !== false;
    var out = [];
    DECK_SLIDES.forEach(function(def){
      var data = (deck.slides || []).filter(function(s){ return s && s.id === def.id; })[0]
              || { headline:'', bullets:[] };
      // ★선택 슬라이드는 내용이 없으면 넣지 않는다 — 빈 장이 덱·PDF에 끼면 안 된다.
      if(def.opt && !String(data.headline || '').trim()) return;
      out.push({ def:def, data:data, fig:(def.figs || [])[0] || null, figOnly:false });
      (def.figs || []).slice(1).forEach(function(k){
        out.push({ def:{ id:def.id + '_' + k, label:def.label, figs:[k] }, data:data, fig:k, figOnly:true });
      });
    });
    if(wantRnd) out.push({ def:{ id:'rnd', label:'R&D 부록', figs:[] }, data:deck.rnd, fig:null, figOnly:false, appx:true });
    return out;
  }

  function renderDeckLeft(){
    var list = deckList();
    var deck = state.lastDeck || {};
    var wantRnd = !!deck.rnd && state.deckRnd !== false;
    var h = '<h4>IR 피칭 자료<em>' + list.length + '장</em></h4>';
    list.forEach(function(it, i){
      var lab = it.figOnly ? (DG_SLOTS[it.fig] || {}).label || it.fig : it.def.label;
      h += '<button class="pb-nav" data-s="' + i + '">' + ('0' + (i + 1)).slice(-2) + ' · ' + esc(lab) + '</button>';
    });

    if(deck.rnd){
      h += '<div class="pb-hr"></div>' +
           '<label style="display:flex;gap:9px;align-items:center;font-size:14px;color:var(--pb-text-body)">' +
           '<input type="checkbox" id="ckRnd"' + (wantRnd ? ' checked' : '') + '> R&amp;D 부록 붙이기</label>';
    }
    h += '<div class="pb-hr"></div>' +
         '<p class="fine">칸을 눌러 바로 고치실 수 있습니다. 고친 내용이 그대로 PDF로 나갑니다. ' +
         '도식은 「프로그램용 도식 라이브러리」 규격(960×540)입니다.</p>' +
         '<div class="sp"></div>' +
         '<button class="pb-cta" id="dkPdf">PDF 다운로드</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkPpt">PPT 다운로드</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkPrint">인쇄로 저장(대체 경로)</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkKeep">이 자료 보관</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkRegen">자료 전체 다시 만들기</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkBack">← 결과로 돌아가기</button>' +
         //  ★점검 카드는 결과 화면에 있다 — 만들고 여기 머물면 못 본다. 한 줄로 알린다.
         '<p class="fine" style="margin-top:8px">결과 화면에 <b>덱 점검</b>이 있습니다 — ' +
         '만든 덱을 코드가 원문·형식과 대조한 결과입니다.</p>';
    $('pbLeft').innerHTML = h;

    Array.prototype.forEach.call($('pbLeft').querySelectorAll('[data-s]'), function(b){
      b.onclick = function(){
        var el = document.querySelectorAll('#pbCenter .pb-slidebox')[+b.dataset.s];
        if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      };
    });
    if($('ckRnd')) $('ckRnd').onchange = function(){ state.deckRnd = this.checked; render(); };
    $('dkPdf').onclick   = function(){ exportDeckPdf(this); };
    $('dkPpt').onclick   = function(){ exportDeckPpt(this); };
    $('dkPrint').onclick = function(){
      document.body.classList.add('deck-print');
      window.print();
      setTimeout(function(){ document.body.classList.remove('deck-print'); }, 300);
    };
    $('dkRegen').onclick = function(){
      // ★전체를 다시 만들면 고쳐 둔 문구가 사라진다. 도식 하나만 어색하면 그 도식만 다시 뽑는 편이 낫다.
      if(deckEdited && !confirm('고치신 슬라이드 문구가 모두 새 내용으로 바뀝니다.\n\n' +
        '도식 하나만 다시 뽑으려면 그 도식 위의 [도식만 다시]를 쓰십시오.\n\n자료 전체를 다시 만들까요?')) return;
      makeDeck();
    };
    $('dkKeep').onclick = function(){ saveOutput('피칭 덱', this); };
    $('dkBack').onclick = goResult;
  }

  function renderDeckCenter(){
    var list = deckList();
    var total = list.length;

    var box = document.createElement('div');
    box.className = 'pb-deck';
    state.flagged = [];

    list.forEach(function(it, i){
      box.appendChild(slideEl(it, i + 1, total));
    });

    $('pbCenter').innerHTML = '';
    $('pbCenter').style.padding = '0';
    $('pbCenter').appendChild(box);
    fitSlides();
    renderDeckRight();                     // 숫자 대조는 슬라이드를 다 그린 뒤에 센다
  }

  // 슬라이드는 항상 960×540으로 놓고, 칸 폭에 맞춰 축소해 보인다(레이아웃 불변 → PDF와 화면이 같다).
  function fitSlides(){
    Array.prototype.forEach.call(document.querySelectorAll('#pbCenter .pb-slidebox'), function(bx){
      var k = Math.min(1, bx.clientWidth / 960);
      bx.style.setProperty('--k', k);
      bx.style.height = Math.round(540 * k) + 'px';
    });
  }
  window.addEventListener('resize', function(){ if(state.view === 'deck') fitSlides(); });

  function localYMD(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }
  function deckFooter(){
    var fd = state.formData || {};
    return ((fd.companyName || '').trim() || '[회사명]') + ' · IR PitchBuilder · ' + localYMD();
  }

  function slideEl(it, no, total){
    var def = it.def, data = it.data || {};
    var wrapEl = document.createElement('div');
    wrapEl.className = 'pb-slidebox';
    var card = document.createElement('div');
    card.className = 'pb-slide' + (def.id === 'cover' ? ' is-cover' : '') + (it.appx ? ' is-appx' : '') + (it.figOnly ? ' is-figonly' : '');
    wrapEl.appendChild(card);
    card.innerHTML = '<div class="sno">' + no + ' / ' + total + '</div>';

    // 킥커: 장 번호 + 라벨 (좌) · 회사명 (우)
    var kick = document.createElement('div');
    kick.className = 'sk';
    var kLabel = it.figOnly ? ((DG_SLOTS[it.fig] || {}).label || def.label) : def.label;
    kick.innerHTML = '<b>' + ('0' + no).slice(-2) + ' · ' + esc(kLabel).toUpperCase() + '</b>' +
                     '<span>' + esc((state.formData.companyName || '').trim() || '') + '</span>';
    card.appendChild(kick);

    if(it.figOnly){
      // 도식 전용 장 — 제목은 자리 이름, 본문은 도식 하나
      var t = document.createElement('div');
      t.className = 's-head'; t.style.cursor = 'default';
      t.textContent = kLabel.replace(/^[^—]+—\s*/, '');
      card.appendChild(t);
    } else {
      flagNums(def.label, data.headline);
      card.appendChild(field('s-head', data.headline, function(v){ data.headline = v; }));
    }

    var body = document.createElement('div');
    body.className = 's-body';
    card.appendChild(body);

    if(def.id === 'cover'){
      card.insertBefore(field('s-sub', data.sub, function(v){ data.sub = v; }), body);
    } else if(!it.figOnly){
      var ul = document.createElement('ul');
      ul.className = 's-bullets';
      arr(data.bullets).forEach(function(b, i){
        flagNums(def.label, b);
        var li = document.createElement('li');
        var dot = document.createElement('span'); dot.className = 's-dot';
        li.appendChild(dot);
        li.appendChild(field('s-bullet', b, function(v){ data.bullets[i] = v; }));
        ul.appendChild(li);
      });
      body.appendChild(ul);
    }

    if(it.fig){
      var k = it.fig;
      var spec = (state.lastDeck || {}).diagrams;
      var svgStr = drawOne(k, spec);
      var dd = (spec || {})[k] || {};
      var kind = DG_TYPE[String(dd.type || '')];

      var fig = document.createElement('div');
      fig.className = 's-fig' + (it.figOnly ? ' is-solo' : '');
      fig.innerHTML = svgStr ||
        '<p class="s-fig-none">이 자리(' + esc((DG_SLOTS[k] || {}).label || k) +
        ')에 넣을 구조가 IR에서 나오지 않았습니다.</p>';
      if(!svgStr && it.figOnly) card.classList.add('is-empty');   // 도식 전용 장만 — 글이 있는 장은 도식이 비어도 PDF에 싣는다

      if(svgStr && kind){
        var kb = document.createElement('span');
        kb.className = 's-fig-kind';
        kb.textContent = kind.name + (dd.why ? ' · ' + dd.why : '');
        fig.appendChild(kb);
      }
      var rb = document.createElement('button');
      rb.className = 's-fig-regen';
      rb.type = 'button';
      rb.textContent = svgStr ? '도식만 다시' : '도식 뽑기';
      rb.onclick = function(){ regenDiagram(k, rb); };
      fig.appendChild(rb);
      body.appendChild(fig);
    }

    // 하단 캡션 라인 — 라이브러리 규격(Source/Note 자리)
    var note = document.createElement('div');
    note.className = 's-note';
    note.innerHTML = '<span>' + esc(deckFooter()) + '</span><em>' + no + ' / ' + total + '</em>';
    card.appendChild(note);
    return wrapEl;
  }

  // ══ PDF 내보내기 ═══════════════════════════════════════════
  //  ★진짜 파일 다운로드다(민부장 지시 2026-08-19). html2canvas + jsPDF 를 **누를 때만** 불러온다 —
  //    평소 화면은 여전히 외부 스크립트 0이고, 망이 막혀 있으면 인쇄 경로(dkPrint)로 물러난다.
  //  ★html2pdf.js 는 쓰지 않는다(플레이북 PDF 패턴: html2canvas+jsPDF 직접 제어).
  //  ★textarea 는 캔버스에 값이 안 찍히는 경우가 있어, 찍기 전에 같은 글자를 가진 div 로 바꾼 사본을 찍는다.
  var PDF_LIBS = [
    'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'
  ];
  function loadScriptOnce(src){
    return new Promise(function(res, rej){
      if(document.querySelector('script[data-src="' + src + '"]')){ res(); return; }
      var el = document.createElement('script');
      el.src = src; el.async = true; el.setAttribute('data-src', src);
      el.onload = function(){ res(); };
      el.onerror = function(){ el.remove(); rej(new Error('load ' + src)); };
      document.head.appendChild(el);
    });
  }
  function pdfLibs(){
    return loadScriptOnce(PDF_LIBS[0]).then(function(){ return loadScriptOnce(PDF_LIBS[1]); }).then(function(){
      if(!window.html2canvas || !window.jspdf) throw new Error('pdf libs');
    });
  }
  // textarea → div (값 그대로, 줄바꿈 유지)
  function flattenFields(root){
    Array.prototype.forEach.call(root.querySelectorAll('textarea'), function(ta){
      var dv = document.createElement('div');
      dv.className = ta.className;
      dv.style.whiteSpace = 'pre-wrap';
      dv.style.height = 'auto';
      dv.textContent = ta.value;
      ta.parentNode.replaceChild(dv, ta);
    });
    Array.prototype.forEach.call(root.querySelectorAll('.s-fig-regen,.s-fig-kind,.s-fig-none,.sno'), function(x){ x.remove(); });
  }
  function pdfFileName(kind){
    var nm = ((state.formData || {}).companyName || '').trim() || 'IR';
    return nm.replace(/[\\/:*?"<>|]+/g, '_') + '_' + kind + '_' + localYMD().replace(/-/g, '') + '.pdf';
  }

  // 덱 → 960×540 장당 한 쪽. 빈 도식 장(is-empty)은 싣지 않는다.
  function exportDeckPdf(btn){
    var slides = Array.prototype.filter.call(document.querySelectorAll('#pbCenter .pb-slide'), function(s){
      return !s.classList.contains('is-empty');
    });
    if(!slides.length){ alert('내보낼 슬라이드가 없습니다.'); return; }
    var label = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'PDF 준비 중…'; }
    document.body.classList.add('pb-pdfing');

    // 사본을 960px 고정 폭으로 화면 밖에 세운다(축소 transform 없이 원본 크기로 찍기 위해)
    var stage = document.createElement('div');
    stage.style.cssText = 'position:fixed;left:-20000px;top:0;width:960px;background:#fff;z-index:-1';
    document.body.appendChild(stage);

    pdfLibs().then(function(){
      var pdf = new window.jspdf.jsPDF({ orientation:'landscape', unit:'px', format:[960, 540], hotfixes:['px_scaling'] });
      var chain = Promise.resolve();
      slides.forEach(function(src, i){
        chain = chain.then(function(){
          var cl = src.cloneNode(true);
          cl.style.transform = 'none'; cl.style.position = 'relative'; cl.style.left = '0'; cl.style.top = '0';
          flattenFields(cl);
          stage.innerHTML = ''; stage.appendChild(cl);
          return window.html2canvas(cl, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, width:960, height:540 })
            .then(function(cv){
              if(i > 0) pdf.addPage([960, 540], 'landscape');
              pdf.addImage(cv.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, 960, 540);
            });
        });
      });
      return chain.then(function(){ pdf.save(pdfFileName('IR피칭자료')); });
    }).catch(function(err){
      // 망이 막히면 인쇄 경로로 — 안내만 하고 멈추지 않는다
      console.warn('PDF', err);
      if(confirm('PDF 생성 라이브러리를 불러오지 못했습니다(네트워크 차단 가능).\n\n브라우저 인쇄로 저장할까요? 인쇄 대화상자에서 「PDF로 저장」을 고르십시오.')){
        document.body.classList.add('deck-print');
        window.print();
        setTimeout(function(){ document.body.classList.remove('deck-print'); }, 300);
      }
    }).then(function(){
      stage.remove();
      document.body.classList.remove('pb-pdfing');
      if(btn){ btn.disabled = false; btn.textContent = label; }
    });
  }

  // 덱 → PPTX (2026-08-20 민부장 지시 · grilling Q8=(a) 이미지 기반).
  //  ★슬라이드는 고해상 PNG 한 장으로 넣는다 — 글꼴(Noto Sans KR·Archivo)이 없는 PC에서도 디자인이 안 깨진다.
  //  ★대신 제목·본문 텍스트를 발표자 노트에 함께 넣는다 — 고칠 재료는 글자로 준다.
  //  ★pptxgenjs 도 PDF 라이브러리처럼 **누를 때만** 불러온다(평소 script CDN 0 유지).
  //  🔴 2026-08-22 실측 — **cdnjs 에는 pptxgenjs 가 없다.** 종전 주소
  //    `cdnjs.../PptxGenJS/3.12.0/pptxgen.bundle.min.js` 는 대소문자를 어떻게 쓰든 404 였고,
  //    그래서 [PPT 다운로드]는 만든 날부터 한 번도 파일을 내놓지 못했다(항상 catch 로 떨어졌다).
  //    같은 파일에서 html2canvas·jsPDF 가 cdnjs 로 잘 돌고 있어 호스트를 의심하지 않은 것이 원인이다.
  //  ★두 곳을 둔다 — 사내망이 한쪽을 막아도 다른 쪽으로 간다. 순서대로 시도한다.
  var PPT_LIBS = [
    'https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js',
    'https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js'
  ];
  //  앞의 것이 실패하면 다음 것으로. 전부 실패해야 실패다.
  function loadAnyScript(list, i){
    i = i || 0;
    if(i >= list.length) return Promise.reject(new Error('load failed: ' + list.join(' , ')));
    return loadScriptOnce(list[i]).catch(function(){ return loadAnyScript(list, i + 1); });
  }
  function exportDeckPpt(btn){
    var slides = Array.prototype.filter.call(document.querySelectorAll('#pbCenter .pb-slide'), function(x){
      return !x.classList.contains('is-empty');
    });
    if(!slides.length){ alert('내보낼 슬라이드가 없습니다.'); return; }
    var label = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'PPT 준비 중…'; }
    document.body.classList.add('pb-pdfing');

    var stage = document.createElement('div');
    stage.style.cssText = 'position:fixed;left:-20000px;top:0;width:960px;background:#fff;z-index:-1';
    document.body.appendChild(stage);

    loadScriptOnce(PDF_LIBS[0])                       // html2canvas
      .then(function(){ return loadAnyScript(PPT_LIBS); })
      .then(function(){
        if(!window.html2canvas || !window.PptxGenJS) throw new Error('ppt libs');
        var pptx = new window.PptxGenJS();
        pptx.defineLayout({ name:'PB169', width:10, height:5.625 });   // 960×540 비율 그대로
        pptx.layout = 'PB169';
        var chain = Promise.resolve();
        slides.forEach(function(src){
          chain = chain.then(function(){
            var cl = src.cloneNode(true);
            cl.style.transform = 'none'; cl.style.position = 'relative'; cl.style.left = '0'; cl.style.top = '0';
            flattenFields(cl);
            stage.innerHTML = ''; stage.appendChild(cl);
            return window.html2canvas(cl, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, width:960, height:540 })
              .then(function(cv){
                var sl = pptx.addSlide();
                sl.addImage({ data: cv.toDataURL('image/png'), x:0, y:0, w:10, h:5.625 });
                // 발표자 노트 = 그 장의 텍스트(수정 재료)
                var note = [];
                Array.prototype.forEach.call(src.querySelectorAll('.s-head,.s-sub,.s-bullets li,[data-dk]'), function(t){
                  var v = (t.value != null ? t.value : t.textContent) || '';
                  v = v.replace(/\s+/g, ' ').trim();
                  if(v && note.indexOf(v) < 0) note.push(v);
                });
                if(!note.length) note.push((src.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 800));
                sl.addNotes(note.join('\n'));
              });
          });
        });
        return chain.then(function(){
          return pptx.writeFile({ fileName: pdfFileName('IR피칭자료').replace(/\.pdf$/, '.pptx') });
        });
      })
      .catch(function(err){
        console.warn('PPT', err);
        alert('PPT 생성 라이브러리를 불러오지 못했습니다(네트워크 차단 가능).\n\nPDF 다운로드 또는 인쇄 저장을 이용하십시오.');
      })
      .then(function(){
        stage.remove();
        document.body.classList.remove('pb-pdfing');
        if(btn){ btn.disabled = false; btn.textContent = label; }
      });
  }

  // 결과 화면의 IR 본문·도식 → A4 세로 여러 쪽.
  //  ★한 장짜리 긴 캔버스를 쪽 높이로 자르면 글줄 한가운데가 잘린다(2026-08-19 실측) —
  //    그래서 블록(머리글·단계별 절·도식 카드) 단위로 따로 찍어 쪽에 채워 넣는다. 블록 하나가 한 쪽보다 길면 그때만 자른다.
  //  opts.returnData = true 면 **파일로 저장하지 않고** data URI 를 돌려준다.
  //   ★제출할 때 이 PDF 를 서버로 보내 성장관리 플랫폼에 붙이기 위해서다(2026-08-22 민부장 지시).
  //     GAS 가 만드는 텍스트 PDF 에는 **도식이 들어가지 않는다** — 도식은 브라우저가 그린다.
  //   ★그 모드에서는 알림창·인쇄 폴백을 띄우지 않는다. 제출 흐름을 막으면 안 된다.
  function exportFlowPdf(els, kind, btn, opts){
    opts = opts || {};
    els = (Array.isArray(els) ? els : [els]).filter(Boolean);
    if(!els.length){
      if(!opts.returnData) alert('내보낼 내용이 없습니다.');
      return Promise.resolve(null);
    }
    var label = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'PDF 준비 중…'; }
    var stage = document.createElement('div');
    stage.style.cssText = 'position:fixed;left:-20000px;top:0;width:794px;background:#fff;z-index:-1';
    document.body.appendChild(stage);
    var out = null;                                    // returnData 모드에서 돌려줄 data URI

    // 블록으로 쪼갠다
    var blocks = [];
    els.forEach(function(el){
      var c = el.cloneNode(true);
      Array.prototype.forEach.call(c.querySelectorAll('.pb-noprint,.s-fig-regen,button'), function(x){ x.remove(); });
      if(c.classList.contains('pb-ir')){
        var head = document.createElement('div'); head.className = 'pb-ir';
        head.style.cssText = 'width:794px;margin:0;border:none;border-radius:0;padding:38px 42px 6px';
        Array.prototype.slice.call(c.children).forEach(function(ch){
          if(ch.classList.contains('pb-sec')){
            var w = document.createElement('div'); w.className = 'pb-ir';
            w.style.cssText = 'width:794px;margin:0;border:none;border-radius:0;padding:0 42px';
            w.appendChild(ch); blocks.push(w);
          } else { head.appendChild(ch); }
        });
        blocks.unshift(head);
      } else {
        // 도식 카드 묶음 — 카드 하나씩
        var cards = c.querySelectorAll('.pb-fig');
        if(cards.length){
          Array.prototype.forEach.call(cards, function(cd){
            var w = document.createElement('div'); w.style.cssText = 'width:794px;padding:0 42px;background:#fff';
            w.appendChild(cd); blocks.push(w);
          });
        } else {
          c.style.width = '794px'; c.style.margin = '0'; c.style.borderRadius = '0'; c.style.border = 'none';
          blocks.push(c);
        }
      }
    });
    blocks.forEach(function(b){ stage.appendChild(b); });

    var PAGE_W = 794, PAGE_H = 1123, TOP = 0, BOTTOM = 40;
    return pdfLibs().then(function(){
      var pdf = new window.jspdf.jsPDF({ orientation:'portrait', unit:'px', format:[PAGE_W, PAGE_H], hotfixes:['px_scaling'] });
      var y = TOP, first = true;
      var chain = Promise.resolve();
      blocks.forEach(function(b){
        chain = chain.then(function(){
          return window.html2canvas(b, { scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false, width:PAGE_W });
        }).then(function(cv){
          var h = cv.height / 2;
          if(h <= 0) return;
          if(h <= PAGE_H - BOTTOM){
            if(y + h > PAGE_H - BOTTOM && !first){ pdf.addPage([PAGE_W, PAGE_H], 'portrait'); y = TOP; }
            pdf.addImage(cv.toDataURL('image/jpeg', 0.94), 'JPEG', 0, y, PAGE_W, h);
            y += h; first = false;
          } else {
            // 한 쪽보다 긴 블록만 쪽 높이로 자른다
            var pageHpx = (PAGE_H - BOTTOM) * 2, off = 0;
            while(off < cv.height){
              if(!first){ pdf.addPage([PAGE_W, PAGE_H], 'portrait'); }
              var sh = Math.min(pageHpx, cv.height - off);
              var slice = document.createElement('canvas'); slice.width = cv.width; slice.height = sh;
              slice.getContext('2d').drawImage(cv, 0, off, cv.width, sh, 0, 0, cv.width, sh);
              pdf.addImage(slice.toDataURL('image/jpeg', 0.94), 'JPEG', 0, TOP, PAGE_W, sh / 2);
              off += sh; first = false; y = TOP + sh / 2;
            }
          }
        });
      });
      return chain.then(function(){
        if(opts.returnData){ out = pdf.output('datauristring'); return; }
        pdf.save(pdfFileName(kind));
      });
    }).catch(function(err){
      console.warn('PDF', err);
      if(opts.returnData) return;                      // 제출 흐름은 막지 않는다 — 조용히 없는 채로 간다
      if(confirm('PDF 생성 라이브러리를 불러오지 못했습니다(네트워크 차단 가능).\n\n브라우저 인쇄로 저장할까요?')) window.print();
    }).then(function(){
      stage.remove();
      if(btn){ btn.disabled = false; btn.textContent = label; }
      return out;
    });
  }

  function field(cls, val, onEdit){
    var ta = document.createElement('textarea');
    ta.className = cls;
    ta.rows = 1;
    ta.value = String(val || '');
    ta.oninput = function(){
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight + 2) + 'px';
      deckEdited = true;
      onEdit(ta.value);
      renderDeckRight();
    };
    setTimeout(function(){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }, 0);
    return ta;
  }

  // ★IR 원문에 없는 숫자를 모은다. 지우지 않고 우측에 남긴다.
  function flagNums(where, text){
    var bad = badNumbers(text);
    if(bad.length) state.flagged.push({ where:where, nums:bad });
  }

  function renderDeckRight(){
    // 지금 화면의 모든 슬라이드 문구를 다시 훑는다(편집분 반영)
    var flags = [];
    var deck = state.lastDeck || {};
    (deck.slides || []).forEach(function(s){
      var def = DECK_SLIDES.filter(function(x){ return x.id === s.id; })[0];
      var label = def ? def.label : (s.id || '');
      [s.headline, s.sub].concat(arr(s.bullets)).forEach(function(t){
        var bad = badNumbers(t);
        if(bad.length) flags.push({ where:label, nums:bad });
      });
    });

    var h = '<div class="pb-panel"><h5>숫자 대조</h5>';
    if(!flags.length){
      h += '<p>슬라이드의 수치가 모두 IR 원문에서 확인됩니다.</p>' +
           '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-4)">' +
           '단위가 붙었거나 두 자리 이상인 숫자만 검사합니다.</p>';
    } else {
      h += '<p style="color:var(--pb-warn-txt-on-ink)">IR 원문에서 찾지 못한 수치가 ' +
           flags.reduce(function(a,f){ return a + f.nums.length; }, 0) + '건 있습니다. ' +
           '<b>지우지 않았습니다</b> — 맞는 값이면 IR에 근거를 채우시고, 아니면 문구를 고치십시오.</p>';
      flags.forEach(function(f){
        h += '<div class="pb-num"><span class="w">' + f.nums.map(esc).join(', ') + '</span>' +
             '<span class="s">' + esc(f.where) + '</span></div>';
      });
    }
    h += '<p class="pb-note" style="margin-top:16px;color:var(--pb-on-ink-4)">' +
         '이 대조표와 도식 형태 표시는 화면에만 있습니다. PDF에는 슬라이드만 나갑니다.</p></div>';
    $('pbRight').innerHTML = h;
  }

  // ══ 관리자 ════════════════════════════════════════════════════
  //  ★쓰기 권한은 서버가 판정한다. 화면에서 감추는 것은 편의일 뿐 방어가 아니다.
  //    (서버가 관리자가 아닌 요청의 저장을 거부하고, 심사자 응답을 도려낸다.)
  //  ~~검토 화면(원고→코멘트칸)·단계별 코멘트 표~~ — 2026-08-19 멘토 탭 삭제로 진입로가 사라져 2026-08-20 코드도 걷어냈다.
  //    관리자 코멘트(노션③)는 서버 action comments/savecomments에 남아 있으나 화면은 부르지 않는다.
  //  editing = 관리자가 '대신 편집 중인 기업' {company, cid}. null이면 자기 것을 쓴다.
  var admin = { rows:[], loading:false, editing:null,
                applicants:[], apLoading:false, q:'' };

  // ★기업명 검색은 법인격 표기를 떼고 맞춘다.
  //   "(주)엑스업"·"주식회사 엑스업"·"엑스업"은 사람에게 같은 회사인데
  //   문자열로는 전부 다르다 — 그대로 비교하면 검색이 헛돈다.
  function normName(s){
    return String(s == null ? '' : s)
      .replace(/\(\s*주\s*\)|\(\s*유\s*\)|㈜|㈜|주식회사|유한회사|유한책임회사|합자회사|합명회사|\(재\)|재단법인|사단법인/g, '')
      .replace(/\s+/g, '')
      .toLowerCase();
  }

  //  ★대시보드로 간다는 것은 '기업 목록 화면'으로 간다는 뜻이다.
  function goAdmin(){
    state.view = 'admin';
    render();
    loadAdmin();
    window.scrollTo(0, 0);
  }

  function loadAdmin(){
    if(!serverOn()){ admin.rows = []; admin.applicants = []; renderAdminCenter(); return; }
    admin.loading = true; admin.apLoading = true; renderAdminCenter();
    apiGet('list', {}).then(function(d){
      admin.rows = (d && d.ok) ? (d.companies || []) : [];
    }).catch(function(){ admin.rows = []; })
      .then(function(){ admin.loading = false; renderAdminCenter(); });

    // ★신청기업 명부는 B1(이노테크 접수)에서 직접 온다.
    //   ①만 보면 '아직 IR을 쓰지 않은 기업'이 목록에 아예 없다 — 불러올 방법이 없어진다.
    apiGet('b1list', {}).then(function(d){
      admin.applicants = (d && d.ok) ? (d.applicants || []) : [];
    }).catch(function(){ admin.applicants = []; })
      .then(function(){ admin.apLoading = false; renderAdminCenter(); });
  }

  function renderAdminView(){
    renderMeta();
    renderAdminLeft();
    renderAdminCenter();
    renderAdminRight();
  }

  function renderAdminLeft(){
    var h = '<h4>관리자</h4>' +
            '<button class="pb-nav is-on">신청기업</button>' +
            '<div class="pb-hr"></div>' +
            '<h4>전체 설정</h4>' +
            '<p class="fine">여기서 정한 값이 <b>전 계정의 다음 접속</b>에 그대로 적용됩니다. ' +
            '팀에게는 설정 화면이 없습니다.</p>' +
            '<label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-size:14px">' +
              '<input type="checkbox" id="cfgTips"' + (llm.tipsMode ? ' checked' : '') + '> R&D 대응 단계(8단계)</label>' +
            '<button class="pb-cta sub" style="margin-top:12px" id="cfgApply">전체 적용</button>' +
            '<div class="sp"></div>' +
            '<button class="pb-cta sub" id="adWrite">내 IR 작성 화면</button>';
    $('pbLeft').innerHTML = h;
    $('cfgApply').onclick = function(){
      if(!serverOn()){ alert('서버에 연결돼 있지 않습니다.'); return; }
      callProxy({ action:'setconfig', id:llm.id, code:llm.code,
                  config:{ tipsMode: $('cfgTips').checked } })
        .then(function(){ llm.tipsMode = $('cfgTips').checked; alert('전 계정에 적용했습니다.'); })
        .catch(function(err){ alert('적용하지 못했습니다 — ' + (err.message || '오류')); });
    };
    $('adWrite').onclick = goWrite;
  }

  // 검색어에 걸리는 신청기업. 법인격 표기를 뗀 이름과 접수번호 둘 다로 찾는다.
  function apFiltered(){
    var raw = String(admin.q || '').trim();
    var q = normName(raw), qc = raw.toLowerCase();
    return admin.applicants.filter(function(x){
      if(!/^ITC2026-\d{3}$/.test(String(x.cid || ''))) return false;   // 시험 행(TEST-0001·REF01)은 리스트에서 뺀다(2026-08-19)
      if(!raw) return true;
      return (q && normName(x.company).indexOf(q) >= 0) ||
             (qc && String(x.cid || '').toLowerCase().indexOf(qc) >= 0);
    });
  }
  function apRowsHtml(){
    if(admin.apLoading) return '<p class="pb-note">명부를 불러오는 중…</p>';
    if(!admin.applicants.length)
      return '<p class="pb-note">' + (serverOn()
        ? '신청 명부를 불러오지 못했습니다. 서버에 <b>NOTION_DB_APPLICANT</b>가 설정돼 있는지 확인하십시오.'
        : '서버에 연결돼 있지 않습니다.') + '</p>';

    var list = apFiltered();
    if(!list.length) return '<p class="pb-note">"' + esc(admin.q) + '"에 맞는 기업이 없습니다.</p>';

    // ①에 원고가 있는 기업인지 함께 보인다 — 열기 전에 새로 쓰는지 이어 쓰는지 알 수 있다
    var written = {};
    admin.rows.forEach(function(r){ if(r.company) written[normName(r.company)] = r; });

    var h = '';
    list.slice(0, 200).forEach(function(x){
      var w = written[normName(x.company)];
      h += '<button class="pb-aprow" data-nm="' + esc(x.company) + '" data-cid="' + esc(x.cid || '') + '">' +
             '<b>' + esc(x.company || '(이름 없음)') + '</b>' +
             '<span>' + esc(x.cid || '') + '</span>' +
             '<em>' + (w ? '작성 ' + (w.filled != null ? Math.round((+w.filled || 0) * 16) + '/16' : '있음') + (w.status === '제출' ? ' · 제출' : '') : '미작성') + '</em>' +
           '</button>';
    });
    if(list.length > 200) h += '<p class="pb-note">' + (list.length - 200) + '곳 더 있습니다 — 검색어를 좁히십시오.</p>';
    return h;
  }
  function bindApRows(){
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-aprow'), function(b){
      b.onclick = function(){ adminOpenByName(b.dataset.nm, b.dataset.cid); };
    });
  }

  function renderAdminCenter(){
    $('pbCenter').style.padding = '';
    var rows = admin.rows;
    var sub = rows.filter(function(r){ return r.status === '제출'; }).length;
    var wrote = rows.filter(function(r){ return (r.filled || 0) > 0; }).length;

    var h = '<div class="pb-kpi">' +
              '<div class="k"><b>' + admin.applicants.length + '</b><span>신청기업</span></div>' +
              '<div class="k"><b>' + wrote + '</b><span>작성 착수</span></div>' +
              '<div class="k"><b>' + sub + '</b><span>제출 완료</span></div>' +
            '</div>';

    // ── 신청기업 불러오기 ── B1(이노테크 접수) 명부에서 고른다
    h += '<div class="pb-card" style="margin-top:16px">' +
           '<h3>참여기업 리스트</h3>' +
           '<p class="pb-note" style="margin-bottom:12px">이노테크 접수 명부입니다. ' +
           '이름을 치거나 목록에서 고르시면 <b>그 기업의 IR 원고가 열립니다</b>(관리자 권한으로 직접 고치는 대리 편집). ' +
           '(주)·주식회사는 빼고 검색해도 찾습니다. 오른쪽에 작성 진행(작성 n/16 · 제출)이 함께 보입니다.<br>' +
           '<span style="color:var(--pb-ink-3)">※ 여기는 <b>누구를</b> 작업할지 고르는 곳입니다. ' +
           '기업을 연 뒤 상단 [신청서 내용 가져오기]를 누르면 <b>그 기업이 낸 린캔버스로 작성칸이 채워집니다.</b></span></p>' +
           '<input id="apQ" class="pb-apq" placeholder="기업명 또는 접수번호 — 예: 엑스업 · ITC2026-002" ' +
             'value="' + esc(admin.q) + '" autocomplete="off">' +
           '<div id="apList" class="pb-aplist">' + apRowsHtml() + '</div>' +
         '</div>';

    // ~~작성 현황 표~~ 2026-08-19 민부장 지시로 삭제 — 참여기업 리스트와 중복. 진행 상태는 리스트 행에 병기한다.
    $('pbCenter').innerHTML = h;
    bindApRows();
    if($('apQ')){
      // ★리스트만 다시 그린다. 전체를 다시 그리면 타자 도중 포커스를 빼앗긴다.
      $('apQ').oninput = function(){
        admin.q = this.value;
        var box = $('apList');
        if(box){ box.innerHTML = apRowsHtml(); bindApRows(); }
      };
    }
  }

  // ══ 관리자 대리 편집 ═══════════════════════════════════════════
  //  서버는 처음부터 관리자에게 마스터 권한을 주고 있었다 —
  //  `loadCompany_`는 관리자면 아무 기업이나 열어주고, `saveSnapshot_`은 관리자가 보낸
  //  기업명 그대로 저장한다(강제는 팀 계정에만 건다). 화면에 진입로가 없었을 뿐이다.
  //
  //  🔴 위험한 기능이다. 관리자가 '지금 누구 원고를 보고 있는지' 놓치면 남의 IR을 덮어쓴다.
  //     그래서 ①저장 칸을 기업별로 가르고 ②화면 위에 계속 띄우고 ③닫는 버튼을 항상 둔다.
  //  name = ① IR 마스터에 붙일 기업명(정본). cid = 접수번호(B1 조회에 쓴다).
  function adminOpenByName(name, cid){
    name = String(name || '').trim();
    if(!name) return;
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 원고를 불러올 수 없습니다.'); return; }
    if(busy) return;
    busy = true;
    apiGet('load', { company: name })
      .then(function(d){
        // ★editing을 먼저 세운다 — who()가 바뀌어야 그 기업 전용 칸을 읽고 쓴다.
        admin.editing = { company: name, cid: cid || '' };
        loadLocal();                                   // 그 기업 칸에 남은 작업이 있으면 이어서
        // ★저장된 원고가 없는 것(NOTFOUND)은 오류가 아니다 — 아직 안 쓴 기업이다. 빈 화면에서 시작한다.
        if(d && d.ok && d.snapshot) applySnapshot(d.snapshot);
        state.formData.companyName = name;             // 저장 시 이 이름으로 그 행에 붙는다
        state.view = 'write';
        state.stepIndex = 0;
        render();
        window.scrollTo(0, 0);
      })
      .catch(function(err){
        admin.editing = null;
        alert('열지 못했습니다 — ' + (err.message || '오류'));
      })
      .then(function(){ busy = false; });
  }

  //  ★B1 명부에 없는 기업을 관리자가 직접 만든다.
  //    명부에서 고르는 것과 다른 일이다 — 저쪽은 '있는 기업 중 고르기', 이쪽은 '없는 기업 만들기'.
  //    cid가 없으므로 [신청서 내용 가져오기]는 쓸 수 없다(가져올 신청서가 없다).
  function adminNewCompany(){
    var nm = prompt(
      '이노테크 접수 명부에 없는 기업을 직접 등록합니다.\n' +
      '(명부에 있는 기업은 대시보드에서 골라 여십시오.)\n\n' +
      '기업명을 입력하십시오 — 이 이름으로 IR 마스터에 저장됩니다.');
    if(nm === null) return;
    nm = String(nm).trim();
    if(!nm) return;

    var dup = admin.applicants.filter(function(x){ return normName(x.company) === normName(nm); })[0];
    if(dup && !confirm(
        '접수 명부에 "' + dup.company + '"(' + (dup.cid || '접수번호 없음') + ')가 이미 있습니다.\n\n' +
        '그래도 이 이름으로 새로 만드시겠습니까?\n' +
        '[취소]를 누르시고 대시보드에서 고르시면 신청서 내용까지 함께 쓸 수 있습니다.')) return;

    adminOpenByName(nm, dup ? (dup.cid || '') : '');
  }

  function adminCloseIR(){
    admin.editing = null;
    loadLocal();                                       // 관리자 자기 칸으로 되돌린다
    goAdmin();
  }

  // 관리자 우측 열 — 안내만 둔다.
  //  ~~멘토 코멘트(단계별·총평) 저장~~ 2026-08-19 멘토 탭 삭제 → 2026-08-20 입력 UI 제거.
  //  같은 값을 두 곳(중앙 검토화면·우측)에 두던 구조도 함께 사라졌다.
  function renderAdminRight(){
    var h = '<div class="pb-panel">' +
            '<h5>참여기업 작업</h5>' +
            '<p>가운데 <b>참여기업 리스트</b>에서 기업을 고르시면 그 기업의 IR 원고가 열립니다(대리 편집). ' +
            '열린 동안 화면 위에 「대리 편집 중 · 기업명」이 계속 보이고, [닫기]나 로고로 돌아옵니다.</p>' +
            '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-4)">' +
            '행의 「작성 n/17 · 제출」은 그 기업이 서버에 남긴 진행 상태입니다. ' +
            '기업을 연 뒤 상단 [신청서 내용 가져오기]를 누르면 이노테크 신청서(린캔버스)로 작성칸이 채워집니다.</p>' +
            '</div>';
    $('pbRight').innerHTML = h;
  }

  // ══ 투자논리 진단(7축) · 제출 ═══════════════════════════════════
  //  옛 「IR 전체 감수」(score·inconsistencies·questions 5)의 자리. state.lastAudit·auditHash·#btnAudit·#auditBox 이름은
  //  그대로 둔다 — 서버 ②「총평」(snap.audit.verdict)·낡음 판정·보관 경고가 이 이름에 걸려 있다.
  function runAudit(){
    if(busy) return;
    var btn = $('btnAudit');
    busy = true; btn.disabled = true; btn.textContent = '진단 중…';
    callLLM(SYSTEM, axisPrompt())
      .then(function(d){
        state.lastAudit = axisNormalize(d);        // 코드가 검증한 것만 남는다
        state.lastAudit.kind = 'axis';
        state.auditHash = irHash();               // 무엇을 보고 한 진단인지 기억한다
        writeLocal();
        renderAuditBox(); renderMeta(); syncToServer();
        if(state.view === 'result') renderResultRight();   // 우측 투자자 점검표도 같이 갱신(2026-08-20)
        syncGateUI();                                      // ②가 열렸으니 ③ 카드도 함께 갱신(2026-08-22)
      })
      .catch(function(err){
        $('auditBox').innerHTML = '<div class="pb-warnbox" style="margin-top:14px">진단하지 못했습니다 — ' +
                                  esc(err.message || '오류') + '</div>';
      })
      .then(function(){
        busy = false;
        if($('btnAudit')){
          $('btnAudit').disabled = false;
          $('btnAudit').textContent = state.lastAudit ? '투자논리 다시 진단' : '투자논리 진단';
        }
      });
  }
  function axPill(st){ return '<span class="pb-axpill is-' + st.toLowerCase() + '">' + esc(AX_STATUS[st] || st) + '</span>'; }
  function renderAuditBox(){
    var a = state.lastAudit, box = $('auditBox');
    if(!box || !a) return;
    var stale = irStale(state.auditHash);
    var h = '';
    if(stale){
      h += '<div class="pb-warnbox" style="margin-top:14px">' +
           '<b>이 진단은 고치기 전 IR에 대한 것입니다.</b> 진단을 받은 뒤 원고를 고치셨습니다 — ' +
           '끊겼던 연결이 이어졌을 수도, 새로 끊겼을 수도 있습니다. 지금 원고로 다시 진단하십시오.</div>';
    }
    h += '<div class="pb-card pb-ax' + (stale ? ' pb-faded' : '') + '" style="margin-top:14px">';
    if(a.kind !== 'axis'){
      // 옛 감수 결과(로컬에 남은 것) — 형식이 달라 새로 받으라고만 한다
      h += '<p class="pb-note">이전 형식(전체 감수)의 결과입니다. 7축 진단으로 바뀌었으니 [투자논리 진단]을 다시 눌러 주십시오.</p>';
      if(a.verdict) h += '<p style="margin-top:8px;font-size:15px;color:var(--pb-text-body)">' + esc(a.verdict) + '</p>';
      h += '</div>'; box.innerHTML = h; return;
    }
    if(a.verdict) h += '<p style="font-size:15px;color:var(--pb-text-body)">' + esc(a.verdict) + '</p>';
    h += '<p class="pb-note" style="margin-top:8px">점수는 없습니다. 아래는 <b>기업 기재사항·미확인 주장</b>을 축별로 다시 배열한 것이며, ' +
         '원문에 적혀 있다는 것과 사실로 확인됐다는 것은 다릅니다. 자료를 더 내기 전까지 모든 주장은 기재·미확인입니다.' +
         (a.unverified ? ' <span style="color:var(--pb-warn-deep)">원문에서 찾지 못한 인용 ' + a.unverified + '건은 근거로 치지 않았습니다.</span>' : '') + '</p>';

    // ── 6축 주장 원장 ──
    a.axes.forEach(function(ax){
      h += '<div class="pb-axsec"><h4>' + esc(ax.name) + '</h4>';
      if(!ax.claims.length) h += '<p class="pb-note">이 축에 해당하는 기재가 없습니다.</p>';
      ax.claims.forEach(function(c){
        h += '<div class="pb-axclaim' + (c.status === 'CONFLICT' ? ' is-conflict' : '') + '">' +
               axPill(c.status) + '<span class="t">' + esc(c.text) + '</span>' +
               (c.quote ? '<span class="q' + (c.unverified ? ' is-bad' : '') + '" title="' + esc(FIELD_LABEL[c.field] || c.field) + '">「' + esc(c.quote) + '」' +
                          (c.unverified ? ' <b>원문 불일치</b>' : '') + '</span>' : '') +
               (c.note ? '<span class="n">' + esc(c.note) + '</span>' : '') +
             '</div>';
      });
      if(ax.missing.length){
        h += '<div class="pb-axmissing"><b>없는 것</b><ul>';

    // ── 연결고리 18 ──

    a.edges.forEach(function(e){
      h += '<tr class="is-' + e.status.toLowerCase() + '"><td class="id">' + e.id + '</td><td class="nm">' + esc(e.name) + '</td>' +
           '<td class="st">' + esc(AX_EDGE_STATUS[e.status]) + '</td><td class="why">' + esc(e.why) + '</td></tr>';
    });
    h += '</tbody></table></div>';

    // ── 투자논리가 성립하는 범위 / 않는 범위 ──
    if(a.thesis.holds.length || a.thesis.fails.length){
      h += '<div class="pb-axsec"><h4>Investment Thesis — 지금 자료로</h4>';
      if(a.thesis.holds.length){

      }
      if(a.thesis.fails.length){
