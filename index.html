<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<title>PitchBuilder — 2026 이노테크 창업 IR 작성 도구</title>
<style>
/* ══════════════════════════════════════════════════════════════
   PitchBuilder v2 — 원페이지
   디자인 근거: 작성 마법사 화면 와이어프레임\handoff\
     · README_디자인_핸드오프.md (레이아웃·상태·카피 톤)
     · tokens.css (색·글자체·형태)  ★값 하드코딩 금지, 변수를 쓴다
   기능 근거: 설계정본_v1.md

   디자인 판단 3개가 코드 구조와 맞물린다.
   1. 작성 화면에 점수를 두지 않는다 — 채점기가 아니라 작성 도구다.
   2. 작성 영역은 종이, 판단 영역은 잉크 — 내 원고와 남의 의견을 재질로 가른다.
   3. 경고는 지우지 않고 문장 위에 남긴다 — 자동 삭제 없음.
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 색 — 3색 + 상태색만. 그라디언트 없음. */
  --pb-ink:        #101720;
  --pb-navy:       #1B3A5B;
  --pb-accent:     #7FA0C4;
  --pb-accent-ink: #3D6392;
  --pb-accent-soft:#B6CBE2;
  --pb-paper:      #F7F5F1;
  --pb-paper-deep: #EDEAE3;
  --pb-surface:    #FFFFFF;
  --pb-line:       #DCD6CB;
  --pb-line-soft:  #E7E2D9;
  --pb-line-input: #C9C2B6;
  --pb-text:       #101720;
  --pb-text-body:  #3C3934;
  --pb-text-mute:  #6B6660;
  --pb-text-faint: #8C857B;
  --pb-text-ghost: #A9A29A;
  --pb-ok:         #2F5F55;
  --pb-ok-on-ink:  #8FBFA8;
  --pb-warn:       #9E2B25;
  --pb-warn-deep:  #8B2822;
  --pb-warn-bg:    #FBF1F0;
  --pb-warn-line:  #E8C8C4;
  --pb-warn-on-ink:#E06C60;
  --pb-warn-txt-on-ink:#F2C4BE;

  --pb-on-ink-1: rgba(247,245,241,.86);
  --pb-on-ink-2: rgba(247,245,241,.72);
  --pb-on-ink-3: rgba(247,245,241,.50);
  --pb-on-ink-4: rgba(247,245,241,.42);
  --pb-on-ink-line:  rgba(247,245,241,.12);
  --pb-on-ink-line2: rgba(247,245,241,.24);

  /* 글자체 = 지주회사 홈페이지(www.cbnuholdings.com)와 동일 계열 — Pretendard (2026-08-18 민부장 지시·색은 유지) */
  --pb-font-serif: 'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Malgun Gothic',sans-serif;
  --pb-font-sans:  'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI','Malgun Gothic',sans-serif;
  --pb-font-mono:  ui-monospace,SFMono-Regular,Menlo,Consolas,'D2Coding',monospace;

  --pb-radius: 2px;
  --pb-radius-card: 3px;
  --pb-col-left: 250px;
  --pb-col-right: 320px;
  --pb-col-right-collapsed: 48px;
  --pb-shadow-card: 0 2px 8px rgba(16,23,32,.08);
  --pb-shadow-slide: 0 2px 6px rgba(16,23,32,.10);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--pb-paper);
  color:var(--pb-text-body);
  font:400 15px/1.65 var(--pb-font-sans);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none !important}
.mono{font-family:var(--pb-font-mono);font-weight:500;letter-spacing:.12em}
.serif{font-family:var(--pb-font-serif)}

/* ── 헤더 (잉크) ───────────────────────────── */
.pb-head{
  display:flex;align-items:center;gap:18px;
  padding:14px 26px;background:var(--pb-ink);
  position:sticky;top:0;z-index:50;
}
.pb-brand{display:flex;align-items:baseline;gap:9px;cursor:pointer;user-select:none}
.pb-brand:hover b{color:var(--pb-accent)}
.pb-brand b{font:600 19px/1 var(--pb-font-serif);color:var(--pb-paper)}
.pb-brand span{font:500 10px/1 var(--pb-font-mono);letter-spacing:.14em;color:var(--pb-accent)}
.pb-who{
  padding-left:18px;border-left:1px solid rgba(247,245,241,.18);
  font-size:13px;color:var(--pb-on-ink-2);
}
.pb-head .sp{flex:1}
.pb-toggle{
  display:flex;align-items:center;gap:9px;padding:6px 13px;
  border:1px solid rgba(127,160,196,.55);border-radius:var(--pb-radius);
  font-size:12px;font-weight:500;color:var(--pb-accent-soft);
}
.pb-toggle .sw{
  display:inline-block;width:30px;height:16px;background:rgba(247,245,241,.24);
  border-radius:999px;position:relative;transition:background .15s;
}
.pb-toggle .sw::after{
  content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;
  background:var(--pb-paper);border-radius:50%;transition:transform .15s,background .15s;
}
/* ★TIPS 모드는 켜졌을 때 붉게 — 지금이 '9단계·자격검토·TIPS 채점'이 도는 상태임을
   한눈에 알아야 한다. 꺼진 모습은 기존 그대로 둔다(평상 상태를 요란하게 만들지 않는다). */
/* 신청기업 명부 — 검색 + 목록에서 고르기 */
.pb-apq{
  width:100%;padding:10px 13px;border:1px solid var(--pb-line);border-radius:var(--pb-radius);
  font:400 14px var(--pb-font-sans);background:var(--pb-paper);color:var(--pb-ink);
}
.pb-apq:focus{outline:none;border-color:var(--pb-accent-ink)}
.pb-aplist{margin-top:10px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.pb-aprow{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border:1px solid var(--pb-line);border-radius:var(--pb-radius);
  background:var(--pb-paper);cursor:pointer;font:400 13px var(--pb-font-sans);color:var(--pb-ink);
}
.pb-aprow:hover{border-color:var(--pb-accent-ink);background:var(--pb-paper-2,#FAF8F5)}
.pb-aprow b{font-weight:600;flex:1}
.pb-aprow span{font:500 11px var(--pb-font-mono);color:var(--pb-ink-3)}
.pb-aprow em{font-style:normal;font-size:11px;color:var(--pb-ink-3);min-width:64px;text-align:right}

/* 🔴 어느 탭이든 "의견일 뿐"임을 밝힌다 — 시스템은 판정자가 아니라 쟁점 제기자다 */
.pb-disclaim{
  margin-top:18px;padding-top:12px;border-top:1px solid rgba(247,245,241,.14);
  font-size:11.5px;line-height:1.65;color:var(--pb-warn-txt-on-ink);
}

/* 가이드 ① — D5 문항 */
.pb-qitem{
  margin-top:14px;padding:12px 13px;border:1px solid rgba(247,245,241,.13);
  border-radius:var(--pb-radius);background:rgba(247,245,241,.03);
}
.pb-qitem .q{font-size:13px;line-height:1.65;color:var(--pb-paper);font-weight:500}
.pb-qitem .q .n{
  display:inline-block;min-width:17px;height:17px;margin-right:7px;border-radius:50%;
  background:var(--pb-accent);color:var(--pb-ink);text-align:center;
  font:600 10px/17px var(--pb-font-mono);
}
.pb-qitem .q .soft{
  display:inline-block;margin-left:7px;padding:1px 6px;border-radius:3px;
  background:var(--pb-warn-bg);color:var(--pb-warn-deep);
  font:500 10px var(--pb-font-mono);vertical-align:middle;
}
.pb-qitem .why{margin-top:7px;font-size:12px;line-height:1.7;color:var(--pb-on-ink-2)}
.pb-qitem .ev{margin-top:8px;font-size:11.5px;line-height:1.6;color:var(--pb-accent-soft)}
.pb-qitem .good{
  margin-top:8px;padding:8px 10px;border-left:2px solid var(--pb-accent);
  font-size:11.5px;line-height:1.65;color:var(--pb-on-ink-2);
}
.pb-qitem .ind{margin-top:7px;font-size:11px;line-height:1.6;color:var(--pb-on-ink-3);font-style:italic}
.pb-qitem .src{margin-top:8px;font:400 10px var(--pb-font-mono);color:var(--pb-on-ink-4)}
.pb-qmore{
  margin-top:9px;padding:5px 11px;border:1px solid rgba(247,245,241,.28);
  border-radius:var(--pb-radius);background:transparent;color:var(--pb-accent-soft);
  font-size:11.5px;cursor:pointer;
}
.pb-qmore:hover{border-color:var(--pb-accent);color:var(--pb-paper)}
.pb-rx{
  margin-top:9px;padding:10px 12px;border-radius:var(--pb-radius);
  background:rgba(247,245,241,.06);font-size:12px;line-height:1.75;color:var(--pb-on-ink-2);
}
.pb-rx p + p{margin-top:7px}

/* 관리자 검토 화면의 문항(밝은 배경이라 코치 열과 색이 다르다) */
.pb-adqbtn{
  margin-top:12px;padding:6px 12px;border:1px solid var(--pb-line);
  border-radius:var(--pb-radius);background:transparent;color:var(--pb-ink-3);
  font-size:12px;cursor:pointer;
}
.pb-adqbtn:hover{border-color:var(--pb-accent-ink);color:var(--pb-ink)}
.pb-adq{
  margin-top:10px;padding:11px 13px;border-left:2px solid var(--pb-line);
  font-size:12.5px;line-height:1.75;color:var(--pb-text-body);
}
.pb-adq p + p{margin-top:9px}
.pb-adq .ev{font-size:11.5px;color:var(--pb-ink-3)}

/* 관리자 검토 화면 — 기업이 쓴 원고를 읽으며 그 아래에 코멘트를 쓴다 */
.pb-rvf{margin-top:12px;padding-left:12px;border-left:2px solid var(--pb-line)}
.pb-rvf span{
  display:block;font:500 10px var(--pb-font-mono);letter-spacing:.1em;
  color:var(--pb-ink-3);margin-bottom:4px;
}
.pb-rvf p{font-size:14px;line-height:1.7;white-space:pre-wrap}
.pb-rvf p.empty{color:var(--pb-ink-3);font-style:italic}

.pb-toggle.on{border-color:#D9756A;color:#F2C4BE}
.pb-toggle.on .sw{background:#D9756A}
.pb-toggle.on .sw::after{transform:translateX(14px);background:var(--pb-paper)}

/* 저장 상태칩 — 실패는 자동으로 사라지지 않는다 */
.pb-chip{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--pb-ok-on-ink)}
.pb-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pb-chip.is-fail{
  background:var(--pb-warn);color:#fff;padding:6px 12px;border-radius:var(--pb-radius);
}
.pb-chip.is-fail .dot{background:#fff}
.pb-chip .retry{margin-left:6px;text-decoration:underline;font-size:11px}

.pb-hbtn{
  padding:7px 14px;border:1px solid rgba(247,245,241,.28);
  border-radius:var(--pb-radius);font-size:12px;font-weight:500;color:var(--pb-paper);
}
.pb-hbtn:hover{background:rgba(247,245,241,.08)}
.pb-hbtn.ghost{border-color:transparent;color:var(--pb-on-ink-3);font-weight:400}
.pb-hbtn.ghost:hover{color:var(--pb-paper)}

/* ── 메타 스트립 (네이비) ───────────────────── */
.pb-meta{
  display:flex;align-items:center;padding:0 26px;
  background:var(--pb-navy);border-bottom:1px solid var(--pb-on-ink-line);
}
.pb-meta .m{
  display:flex;align-items:baseline;gap:7px;padding:9px 16px;
  border-left:1px solid rgba(247,245,241,.14);
  font-size:11px;color:var(--pb-on-ink-3);
}
.pb-meta .m:first-child{padding-left:0;border-left:none}
.pb-meta .m b{font:500 12px var(--pb-font-mono);color:var(--pb-paper)}
.pb-meta .m.warn b{color:var(--pb-warn-txt-on-ink)}
.pb-meta .sp{flex:1}
.pb-meta .note{padding:9px 0;font-size:11px;color:var(--pb-on-ink-4)}

/* ── 3열 셸 ─────────────────────────────────── */
.pb-shell{
  display:grid;
  grid-template-columns:var(--pb-col-left) 1fr var(--pb-col-right);
  min-height:calc(100vh - 96px);
  background:var(--pb-paper);
}
.pb-shell.is-collapsed{grid-template-columns:var(--pb-col-left) 1fr var(--pb-col-right-collapsed)}
.pb-shell.no-left{grid-template-columns:1fr var(--pb-col-right)}
.pb-center{min-width:0}   /* 표의 min-content가 우측 열을 밀어내는 사고를 막는다 */

/* 좌: 목차 */
.pb-left{
  border-right:1px solid var(--pb-line);padding:24px 20px;
  display:flex;flex-direction:column;gap:3px;
}
.pb-left h4{
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
  font:500 10px/1 var(--pb-font-mono);letter-spacing:.15em;color:var(--pb-text-faint);
}
.pb-left h4 em{font:400 11px var(--pb-font-sans);font-style:normal;color:var(--pb-text-ghost)}
.pb-nav{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 11px;border-radius:var(--pb-radius);
  font-size:14px;color:var(--pb-text-body);text-align:left;width:100%;
}
.pb-nav:hover{background:var(--pb-line-soft)}
.pb-nav.is-on{background:var(--pb-ink);color:var(--pb-paper);font-weight:500}
.pb-nav.is-on .pt{font:500 11px var(--pb-font-mono);color:var(--pb-accent)}
.pb-nav.is-todo{color:var(--pb-text-ghost)}
.pb-nav .ok{color:var(--pb-ok)}
.pb-nav.is-risk{border-left:2px solid var(--pb-warn);background:var(--pb-warn-bg);color:var(--pb-warn-deep)}
.pb-nav.is-risk .pt{font-size:11px;color:var(--pb-warn-deep)}
.pb-hr{height:1px;background:var(--pb-line);margin:16px 0}
.pb-left .fine{font-size:12px;line-height:1.6;color:var(--pb-text-faint)}
.pb-left .sp{flex:1}
.pb-cta{
  padding:12px;background:var(--pb-navy);border-radius:var(--pb-radius);
  font-size:13px;font-weight:500;color:var(--pb-paper);text-align:center;width:100%;
}
.pb-cta:hover{background:var(--pb-ink)}
.pb-cta.sub{background:transparent;color:var(--pb-text-mute);border:1px solid var(--pb-line)}
.pb-cta.sub:hover{background:var(--pb-line-soft);color:var(--pb-text-body)}

/* 중앙: 종이 */
.pb-center{padding:18px 24px;display:flex;flex-direction:column;gap:6px}

/* 접힌 단계 행 — 단계명 · 미리보기 · 글자수 3열 */
.pb-row{
  display:grid;grid-template-columns:150px 1fr 128px;align-items:center;gap:14px;
  padding:9px 14px;background:var(--pb-surface);
  border:1px solid var(--pb-line-soft);border-radius:var(--pb-radius);
  text-align:left;width:100%;
}
.pb-row:hover{border-color:var(--pb-line-input)}
.pb-row .t{font-size:13px;font-weight:500;color:var(--pb-text-body)}
.pb-row .p{
  font-size:12px;color:var(--pb-text-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pb-row .n{
  display:flex;justify-content:flex-end;gap:9px;
  font:400 11px var(--pb-font-mono);color:var(--pb-text-ghost);
}
.pb-row .n .ok{color:var(--pb-ok)}
.pb-row.is-empty .p{color:var(--pb-text-ghost);font-style:italic}

/* 펼친 단계 — 질문 + 입력 */
.pb-open{
  background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card);padding:26px 28px;box-shadow:var(--pb-shadow-card);
}
.pb-open .step-no{
  font:500 10px var(--pb-font-mono);letter-spacing:.15em;color:var(--pb-text-faint);
}
.pb-open h2{
  margin-top:8px;font:600 30px/1.25 var(--pb-font-serif);color:var(--pb-text);
}
.pb-open .sub{margin-top:8px;font-size:14px;color:var(--pb-text-mute)}
.pb-field{margin-top:24px}
.pb-field label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:16px;font-weight:600;color:var(--pb-text);margin-bottom:8px;
}
.pb-field label .key{font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-text-ghost)}
.pb-field textarea{
  width:100%;min-height:104px;resize:vertical;
  padding:14px 15px;background:var(--pb-paper);
  border:1px solid var(--pb-line-input);border-radius:var(--pb-radius);
  font-size:15px;line-height:1.7;color:var(--pb-text-body);
}
.pb-field textarea:focus{outline:none;border-color:var(--pb-accent-ink);background:var(--pb-surface)}
.pb-field textarea::placeholder{color:var(--pb-text-ghost)}
.pb-cnt{margin-top:6px;text-align:right;font:400 11px var(--pb-font-mono);color:var(--pb-text-ghost)}
.pb-steps-btn{display:flex;justify-content:space-between;gap:10px;margin-top:26px}

/* 우: 잉크 판단 열 */
.pb-right{background:var(--pb-ink);color:var(--pb-on-ink-1);display:flex;flex-direction:column}
.pb-right.is-collapsed{align-items:center;padding:18px 0}
.pb-rail{
  writing-mode:vertical-rl;font:500 10px var(--pb-font-mono);letter-spacing:.2em;
  color:var(--pb-on-ink-3);padding-top:8px;
}
.pb-tabs{display:flex;border-bottom:1px solid var(--pb-on-ink-line)}
.pb-tab{
  flex:1;padding:12px 6px;font-size:11px;color:var(--pb-on-ink-3);
  border-bottom:2px solid transparent;position:relative;
}
.pb-tab.is-on{color:var(--pb-paper);border-bottom-color:var(--pb-accent)}
.pb-tab .badge{
  position:absolute;top:7px;right:7px;width:5px;height:5px;
  border-radius:50%;background:var(--pb-accent);
}
.pb-panel{padding:18px 20px;overflow-y:auto;flex:1}
.pb-panel h5{
  font:500 10px var(--pb-font-mono);letter-spacing:.15em;
  color:var(--pb-on-ink-3);margin-bottom:10px;
}
.pb-panel p{font-size:13px;line-height:1.7;color:var(--pb-on-ink-2)}
.pb-panel ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.pb-panel li{display:flex;gap:9px;font-size:13px;line-height:1.7;color:var(--pb-on-ink-2)}
.pb-panel li::before{
  content:'';flex-shrink:0;width:5px;height:5px;margin-top:8px;
  border-radius:50%;background:var(--pb-accent);
}
.pb-corpus{
  margin-top:18px;padding:13px 14px;
  border:1px solid var(--pb-on-ink-line2);border-radius:var(--pb-radius);
}
.pb-corpus h5{color:var(--pb-accent-soft)}
.pb-corpus p{font-size:12.5px;color:var(--pb-on-ink-2)}
.pb-corpus b{color:var(--pb-paper)}
.pb-mentor{
  margin:-18px -20px 18px;padding:16px 20px;
  background:var(--pb-navy);border-bottom:1px solid var(--pb-on-ink-line);
}
.pb-mentor h5{color:var(--pb-accent-soft)}
.pb-mentor p{font-size:13px;color:var(--pb-on-ink-1)}
.pb-mentor .by{margin-top:8px;font-size:11px;color:var(--pb-on-ink-3)}

.pb-inkbtn{
  width:100%;padding:11px;background:var(--pb-accent);color:var(--pb-ink);
  border-radius:var(--pb-radius);font-size:13px;font-weight:600;margin-top:16px;
}
.pb-inkbtn:hover{background:var(--pb-accent-soft)}
.pb-inkbtn:disabled{background:var(--pb-on-ink-line2);color:var(--pb-on-ink-3);cursor:default}
.pb-inkbtn.ghost{background:transparent;border:1px solid var(--pb-on-ink-line2);color:var(--pb-on-ink-2)}

/* 진단 결과 */
.pb-diag{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.pb-issue{
  padding:12px 13px;border-left:2px solid var(--pb-accent);
  background:rgba(247,245,241,.05);border-radius:0 var(--pb-radius) var(--pb-radius) 0;
}
.pb-issue.sev-high{border-left-color:var(--pb-warn-on-ink)}
.pb-issue .f{font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-on-ink-3)}
.pb-issue .q{margin-top:6px;font-size:13px;color:var(--pb-paper)}
.pb-issue .w{margin-top:5px;font-size:12px;color:var(--pb-on-ink-3)}
.pb-rw{
  margin-top:10px;padding:12px 13px;background:rgba(127,160,196,.12);
  border:1px solid rgba(127,160,196,.3);border-radius:var(--pb-radius);
}
.pb-rw p{font-size:13px;color:var(--pb-paper)}
.pb-rw button{
  margin-top:9px;padding:6px 11px;border:1px solid var(--pb-accent);
  border-radius:var(--pb-radius);font-size:11px;font-weight:600;color:var(--pb-accent-soft);
}

/* 낡음 표시 ─ 판단은 그때의 원고에 대한 것이다.
   원고가 바뀐 뒤에도 옛 판단을 최신인 양 두면 시스템이 거짓말을 하는 것이다.
   지우지는 않는다 — 흐리고 이유를 적는다. 무엇을 보고 받은 판단인지가 정보이기 때문이다. */
.pb-stalebar{
  margin-top:14px;padding:11px 12px;border-radius:var(--pb-radius);
  background:rgba(224,108,96,.12);
  border:1px solid var(--pb-warn-on-ink);
}
.pb-stalebar b{color:var(--pb-paper);font-size:12.5px}
.pb-stalebar p{margin-top:4px;font-size:12px;line-height:1.65;color:var(--pb-on-ink-2)}
.pb-stale{opacity:.42;filter:grayscale(.6)}
.pb-faded{opacity:.5}          /* 종이(원고) 쪽 — 흐리게만 한다. 지우지 않는다 */

/* 내 배분 ─ 상장사 출현율과 단위가 다르므로 같은 줄에 놓지 않는다 */
.pb-mine{
  margin-top:18px;padding:13px 14px;
  border:1px solid var(--pb-on-ink-line2);border-radius:var(--pb-radius);
}
.pb-mine h5{color:var(--pb-accent-soft)}
.pb-mine .row{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:12.5px}
.pb-mine .row span:first-child{color:var(--pb-on-ink-3)}
.pb-mine .row span:last-child{color:var(--pb-paper);font-weight:600}
.pb-mine .bar{margin-top:9px;height:5px;border-radius:3px;background:var(--pb-on-ink-line2);overflow:hidden}
.pb-mine .bar i{display:block;height:100%;background:var(--pb-accent)}
.pb-mine .bar.want i{background:var(--pb-on-ink-3)}
.pb-mine .vd{margin-top:9px;font-size:12px;line-height:1.65;color:var(--pb-on-ink-2)}
.pb-mine .unit{margin-top:9px;font-size:11.5px;line-height:1.6;color:var(--pb-on-ink-3)}

/* ── 로그인 ─────────────────────────────────── */
.pb-login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.pb-login .l{
  background:var(--pb-ink);color:var(--pb-paper);
  padding:64px 56px;display:flex;flex-direction:column;justify-content:center;
}
.pb-login .l h1{font:600 40px/1.25 var(--pb-font-serif)}
.pb-login .l p{margin-top:20px;font-size:15px;line-height:1.8;color:var(--pb-on-ink-2);max-width:38ch}
.pb-login .l .fine{margin-top:32px;font-size:12px;color:var(--pb-on-ink-3);line-height:1.7}
.pb-login .r{
  padding:64px 56px;display:flex;flex-direction:column;justify-content:center;
  background:var(--pb-paper);
}
.pb-login .r h3{font:600 22px var(--pb-font-serif);color:var(--pb-text)}
.pb-in{margin-top:22px}
.pb-in label{display:block;font-size:13px;font-weight:600;margin-bottom:7px;color:var(--pb-text)}
.pb-in input{
  width:100%;padding:12px 14px;background:var(--pb-surface);
  border:1px solid var(--pb-line-input);border-radius:var(--pb-radius);font-size:15px;
}
.pb-in input:focus{outline:none;border-color:var(--pb-accent-ink)}
.pb-in .hint{margin-top:6px;font-size:12px;color:var(--pb-text-faint)}
.pb-solid{
  width:100%;margin-top:26px;padding:13px;background:var(--pb-ink);color:var(--pb-paper);
  border-radius:var(--pb-radius);font-size:15px;font-weight:600;
}
.pb-solid:hover{background:var(--pb-navy)}
.pb-err{
  margin-top:16px;padding:12px 14px;background:var(--pb-warn-bg);
  border:1px solid var(--pb-warn-line);border-radius:var(--pb-radius);
  font-size:13px;color:var(--pb-warn-deep);
}

/* ── 공통 조각 ──────────────────────────────── */
.pb-card{
  background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card);padding:22px 24px;
}
.pb-card + .pb-card{margin-top:14px}
.pb-card h3{font:600 20px var(--pb-font-serif);color:var(--pb-text);margin-bottom:12px}
.pb-tbl{width:100%;border-collapse:collapse;font-size:13px}
.pb-tbl th{
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--pb-line);
  font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-text-faint);
}
.pb-tbl td{padding:11px 10px;border-bottom:1px solid var(--pb-line-soft);vertical-align:top}
.pb-tbl tr:last-child td{border-bottom:none}
.pb-warnbox{
  padding:13px 15px;background:var(--pb-warn-bg);border:1px solid var(--pb-warn-line);
  border-radius:var(--pb-radius);font-size:13px;color:var(--pb-warn-deep);line-height:1.7;
}
.pb-note{font-size:12px;color:var(--pb-text-faint);line-height:1.7}

/* 근거 없는 수치 — 지우지 않고 문장 위에 남긴다 */
.pb-badnum{
  border-bottom:2px solid var(--pb-warn);cursor:help;
  background:rgba(158,43,37,.06);
}

/* ── 결과 화면 ─────────────────────────────── */
.pb-ir{background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card);padding:38px 42px}
.pb-ir h1{font:600 34px/1.3 var(--pb-font-serif);color:var(--pb-text)}
.pb-ir .lead{margin-top:10px;font-size:17px;color:var(--pb-text-mute);line-height:1.7}
.pb-sec{margin-top:32px;padding-top:26px;border-top:1px solid var(--pb-line-soft)}
.pb-sec:first-of-type{border-top:none}
.pb-sec h3{font:500 10px var(--pb-font-mono);letter-spacing:.15em;color:var(--pb-text-faint)}
.pb-sec .fl{margin-top:14px}
.pb-sec .fl b{display:block;font-size:13px;font-weight:600;color:var(--pb-text);margin-bottom:5px}
.pb-sec .fl p{font-size:15px;line-height:1.75;color:var(--pb-text-body);white-space:pre-wrap}
.pb-sec .fl p.void{color:var(--pb-text-ghost);font-style:italic}

/* 도식 카드 */
.pb-fig{margin-top:20px;padding:20px;border:1px solid var(--pb-line-soft);
  border-radius:var(--pb-radius);background:var(--pb-surface);break-inside:avoid}
.pb-fig h4{display:flex;align-items:baseline;gap:9px;font:600 14px var(--pb-font-serif);
  color:var(--pb-text);margin-bottom:14px}
.pb-fig h4 em{font:400 11px var(--pb-font-sans);font-style:normal;color:var(--pb-text-faint)}
.pb-fig svg{width:100%;height:auto;display:block;overflow:visible}

/* TIPS 점수표 (우측 잉크 열) */
.pb-score{display:flex;align-items:baseline;gap:10px;padding:14px 0 16px;
  border-bottom:1px solid var(--pb-on-ink-line)}
.pb-score b{font:600 34px/1 var(--pb-font-mono);color:var(--pb-paper)}
.pb-score span{font-size:12px;color:var(--pb-on-ink-3)}
.pb-srow{display:grid;grid-template-columns:1fr 34px 26px;gap:8px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--pb-on-ink-line);font-size:12.5px}
.pb-srow .nm{color:var(--pb-on-ink-2)}
.pb-srow .pt{font:500 11px var(--pb-font-mono);color:var(--pb-on-ink-3);text-align:right}
.pb-srow .gd{font:600 12px var(--pb-font-mono);text-align:center;color:var(--pb-accent-soft)}
.pb-srow.na .nm,.pb-srow.na .pt{color:var(--pb-on-ink-4)}
.pb-srow.na .gd{color:var(--pb-on-ink-4)}
.pb-sdet{padding:10px 0 14px;font-size:12px;line-height:1.7;color:var(--pb-on-ink-3)}
.pb-sdet q{color:var(--pb-on-ink-2)}
.pb-sdet .bad{color:var(--pb-warn-txt-on-ink);font-weight:600}
.pb-sdet .fix{color:var(--pb-accent-soft);margin-top:5px;display:block}

/* 자격 게이트 */
.pb-gate{display:flex;flex-direction:column;gap:2px}
.pb-gate .g{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--pb-line-soft)}
.pb-gate .g b{font-size:14px;font-weight:600;color:var(--pb-text)}
.pb-gate select{width:100%;padding:9px 11px;background:var(--pb-surface);
  border:1px solid var(--pb-line-input);border-radius:var(--pb-radius);font-size:14px}
.pb-gate .g.is-fail{background:var(--pb-warn-bg)}
.pb-gate .why{grid-column:1/-1;font-size:12.5px;color:var(--pb-warn-deep);line-height:1.6}

/* ── 피칭 덱 ───────────────────────────────── */
.pb-deck{background:var(--pb-paper-deep);padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.pb-slide{
  position:relative;aspect-ratio:16/9;background:var(--pb-surface);
  border:1px solid var(--pb-line);border-radius:var(--pb-radius-card);
  box-shadow:var(--pb-shadow-slide);padding:44px 52px;
  display:flex;flex-direction:column;
}
.pb-slide .sno{
  position:absolute;top:16px;right:20px;
  font:500 10px var(--pb-font-mono);letter-spacing:.14em;color:var(--pb-text-ghost);
}
.pb-slide.is-cover{justify-content:center;background:var(--pb-ink)}
.pb-slide.is-cover .s-head{color:var(--pb-paper)}
.pb-slide.is-cover .s-sub{color:var(--pb-on-ink-2)}
.pb-slide.is-appx{border-style:dashed}
.s-head{
  width:100%;border:none;background:transparent;resize:none;overflow:hidden;
  font:600 34px/1.3 var(--pb-font-serif);color:var(--pb-text);padding:2px 4px;
  border-radius:var(--pb-radius);
}
.pb-slide.is-cover .s-head{font-size:44px}
.s-sub{
  width:100%;border:none;background:transparent;resize:none;overflow:hidden;
  margin-top:12px;font:400 17px/1.6 var(--pb-font-sans);color:var(--pb-text-mute);padding:2px 4px;
}
.s-bullets{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:9px}
.s-bullets li{display:flex;gap:11px;align-items:flex-start}
.s-dot{flex-shrink:0;width:5px;height:5px;margin-top:11px;border-radius:50%;background:var(--pb-accent-ink)}
.s-bullet{
  flex:1;border:none;background:transparent;resize:none;overflow:hidden;
  font:400 16px/1.65 var(--pb-font-sans);color:var(--pb-text-body);padding:2px 4px;
}
.s-head:hover,.s-sub:hover,.s-bullet:hover{background:var(--pb-paper)}
.s-head:focus,.s-sub:focus,.s-bullet:focus{outline:none;background:var(--pb-paper);
  box-shadow:inset 0 0 0 1px var(--pb-accent-ink)}
.pb-slide.is-cover .s-head:hover,.pb-slide.is-cover .s-head:focus,
.pb-slide.is-cover .s-sub:hover,.pb-slide.is-cover .s-sub:focus{background:rgba(247,245,241,.08)}

.s-fig{margin-top:auto;padding-top:16px;position:relative}
.s-fig svg{width:100%;height:auto;display:block;max-height:210px;overflow:visible}
.s-fig-kind{position:absolute;top:16px;left:0;font-size:11px;color:var(--pb-text-ghost)}
.s-fig-regen{
  position:absolute;top:14px;right:0;padding:4px 10px;font-size:11px;font-weight:600;
  color:var(--pb-text-mute);background:var(--pb-surface);
  border:1px solid var(--pb-line);border-radius:var(--pb-radius);opacity:0;transition:opacity .15s;
}
.s-fig:hover .s-fig-regen{opacity:1}
.s-fig-regen:hover{color:var(--pb-accent-ink);border-color:var(--pb-accent-ink)}
.s-fig-none{
  font-size:12px;color:var(--pb-text-ghost);padding:12px;text-align:center;
  border:1px dashed var(--pb-line);border-radius:var(--pb-radius);
}

/* ── 관리자 ────────────────────────────────── */
.pb-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.pb-kpi .k{padding:16px 18px;background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card)}
.pb-kpi .k b{display:block;font:600 30px/1 var(--pb-font-mono);color:var(--pb-text)}
.pb-kpi .k span{display:block;margin-top:7px;font-size:12px;color:var(--pb-text-mute)}
.pb-atbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--pb-surface)}
.pb-atbl th{text-align:left;padding:11px 12px;background:var(--pb-paper);
  border-bottom:1px solid var(--pb-line);
  font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-text-faint);white-space:nowrap}
.pb-atbl td{padding:12px;border-bottom:1px solid var(--pb-line-soft);vertical-align:middle}
.pb-atbl tr{cursor:pointer}
.pb-atbl tr:hover td{background:var(--pb-paper)}
.pb-atbl tr.is-on td{background:var(--pb-ink);color:var(--pb-paper)}
.pb-atbl tr.is-on td .sub{color:var(--pb-on-ink-3)}
.pb-atbl .sub{display:block;margin-top:3px;font-size:11px;color:var(--pb-text-faint)}
.pb-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.pb-pill.on{background:#E4EFE9;color:var(--pb-ok)}
.pb-pill.off{background:var(--pb-line-soft);color:var(--pb-text-faint)}
.pb-mfield{margin-top:14px}
.pb-mfield label{display:flex;justify-content:space-between;align-items:baseline;
  font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-on-ink-3);margin-bottom:6px}
.pb-mfield textarea{width:100%;min-height:64px;resize:vertical;padding:10px 11px;
  background:rgba(247,245,241,.06);border:1px solid var(--pb-on-ink-line2);
  border-radius:var(--pb-radius);font-size:13px;line-height:1.6;color:var(--pb-paper)}
.pb-mfield textarea:focus{outline:none;border-color:var(--pb-accent)}
.pb-mfield .cur{font-size:11px;color:var(--pb-on-ink-4);font-weight:400;letter-spacing:0}

/* 숫자 대조 (우측 잉크 열) */
.pb-num{padding:11px 0;border-bottom:1px solid var(--pb-on-ink-line);font-size:12.5px}
.pb-num .w{font:600 13px var(--pb-font-mono);color:var(--pb-warn-txt-on-ink)}
.pb-num .o{font:600 13px var(--pb-font-mono);color:var(--pb-ok-on-ink)}
.pb-num .s{display:block;margin-top:4px;color:var(--pb-on-ink-3);font-size:11.5px}

@media print{
  .pb-head, .pb-meta, .pb-left, .pb-right, .pb-noprint{display:none !important}
  .pb-shell{display:block}
  body{background:#fff}
  /* 덱은 가로 A4, 장당 한 쪽 */
  body.deck-print{background:#fff}
  body.deck-print .pb-deck{padding:0;gap:0;background:#fff}
  body.deck-print .pb-slide{
    border:none;box-shadow:none;border-radius:0;aspect-ratio:auto;
    height:100vh;break-after:page;page-break-after:always;
  }
  body.deck-print .pb-slide:last-child{break-after:auto;page-break-after:auto}
  body.deck-print .sno{display:none}
  /* 재생성 버튼·형태 배지·빈 자리 안내는 투자자에게 가는 PDF에 실리면 안 된다 */
  .s-fig-regen, .s-fig-kind, .s-fig-none{display:none !important}
  .s-head:focus,.s-bullet:focus,.s-sub:focus{box-shadow:none;background:transparent}
}
@page{ size:A4 landscape; margin:0; }

/* ══════════════════════════════════════════════════════════════
   글의 단락 정렬 — 이 블록은 맨 뒤에 둔다(앞 규칙을 덮어야 한다)

   🔴 사람이 쓴 글에는 줄바꿈과 "- " 목록이 들어 있다.
      기업들이 실제로 그렇게 쓴다 — "- 결로 피해 가구 / - 신생아 가구 / - 임대인".
      `white-space`를 주지 않으면 그 구조가 통째로 뭉개져 한 덩어리 문장이 된다.
      원문의 단락을 없애면 읽는 사람이 원문을 잘못 읽는다.
   ══════════════════════════════════════════════════════════════ */

/* 코치 열 — 멘토 코멘트 · 성장관리 의견 · 신청서 참고자료 */
.pb-mentor p,
.pb-corpus p,
.pb-panel .pb-mentor p,
.pb-panel .pb-corpus p{ white-space:pre-wrap; }

/* AI 진단 — 지적·근거·개선 문장 */
.pb-issue .q, .pb-issue .w, .pb-rw p, .pb-stalebar p{ white-space:pre-wrap; }

/* 관리자 검토 화면의 원고 */
.pb-rvf p{ white-space:pre-wrap; }

/* 단락 사이를 띄운다 — 붙어 있으면 어디서 문단이 갈리는지 보이지 않는다 */
.pb-panel p + p,
.pb-mentor p + p,
.pb-corpus p + p,
.pb-card p + p{ margin-top:9px; }

/* 읽기 좋은 줄 길이. 한 줄이 너무 길면 다음 줄 첫머리를 놓친다.
   ★코치 열(좁은 칼럼)에는 걸지 않는다 — 이미 폭이 좁아 두 번 제한하면 답답해진다. */
.pb-sec .fl p,
.pb-rvf p{ max-width:74ch; }

/* 목록형 원문("- "로 시작하는 줄)이 많으므로 들여쓰기가 살아 있어야 한다 */
.pb-sec .fl p, .pb-rvf p, .pb-mentor p, .pb-corpus p{
  word-break:keep-all;      /* 한글은 어절 단위로 끊어야 읽힌다 */
  overflow-wrap:break-word; /* 단 URL·긴 영문은 넘치지 않게 */
}

/* 인쇄물에서도 단락이 살아야 한다 — 투자자가 받는 PDF다 */
@media print{
  .pb-sec .fl p{ white-space:pre-wrap; max-width:none; }
}
</style>
</head>
<body>

<!-- ══ 로그인 ══════════════════════════════════ -->
<div id="viewLogin" class="pb-login">
  <div class="l">
    <h1>투자자가 읽는<br>순서대로 씁니다.</h1>
    <p>여섯 단계를 채우면 IR 한 벌이 됩니다. TIPS 준비 모드를 켜면 R&amp;D 세 단계가 더해집니다.</p>
    <p class="fine">
      이 도구는 채점기가 아닙니다. 점수는 어디를 고쳐야 하는지 가리키는 표시일 뿐입니다.<br>
      빈칸 자동 생성은 제공하지 않습니다 — 없는 근거를 만들어 넣지 않기 위해서입니다.
    </p>
  </div>
  <div class="r">
    <h3>접속</h3>
    <div class="pb-in">
      <label for="inId">접수번호</label>
      <input id="inId" type="text" placeholder="ITC2026-000" autocomplete="off" spellcheck="false">
    </div>
    <div class="pb-in">
      <label for="inCode">접속코드</label>
      <input id="inCode" type="password" placeholder="8자" autocomplete="off">
      <p class="hint">성장관리플랫폼에서 쓰시던 코드와 같습니다. 새로 발급되지 않았습니다.</p>
    </div>
    <button class="pb-solid" id="btnLogin">들어가기</button>
    <div id="loginErr" class="pb-err hidden"></div>
  </div>
</div>

<!-- ══ 헤더 (로그인 후) ════════════════════════ -->
<header id="pbHead" class="pb-head hidden">

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };

  // ══ 상태 ══════════════════════════════════════════════════════
  //  아래 이식 로직의 steps()·who()·contextBlock()·stepPrompt()가 이 두 객체를 본다.
  var state = { stepIndex:0, formData:{}, completed:false,
                cid:'', lastTips:null, lastAudit:null, lastGate:null,
                status:'', submittedAt:'', lastDeck:null, lastDiagrams:null,
                tab:0, view:'write',
                // ★판단은 그때의 원고에 대한 것이다 — 무엇을 보고 받은 판단인지를 함께 기억한다.
                diags:{},        // {단계id: {data, hash, at}}  단계별 AI 진단 + 그때의 입력 해시
                mentorBase:{},   // {단계id: {ch, ih}}          코멘트 본문 해시 + 코멘트를 본 시점의 입력 해시
                tipsHash:'', auditHash:'',     // 채점·감수를 받은 시점의 IR 전체 해시

                b2Base:null };   // {ch, ih} B2 의견 본문 해시 + 그 의견을 처음 본 시점의 IR 전체 해시
  var llm = { conn:'byok', key:'', proxy:'', id:'', code:'',
              model:'gemini-flash-latest', reviewer:false, tipsMode:false };
  var busy = false;
  var mentor = { comments:{}, overall:'', who:'', loaded:false };
  // B2 성장관리(LAGMP) 종합의견 — stage1은 멘토 탭, stage2·3은 IR 고도화 탭.
  //  ★확정본만 온다. 초안은 서버가 애초에 내려주지 않는다(전달 게이트).
  var b2 = { synth:[], loaded:false, enabled:false, note:'' };

  // ══ IR 코칭 지식 번들 (D5 → 32_ 엔진 → 이 화면) ═══════════════
  //  ★로그인 시 1회만 받고 localStorage에 둔다. 단계마다 부르지 않는다(엔진 확정 6).
  //  ★버전만 보내 같으면 본문을 받지 않는다 — 번들이 수백 KB까지 커진다.
  //  🔴 `red_flags`는 프롬프트 전용이다. 화면에 뿌리지 않는다(엔진 규칙) — 내부 메타가 섞여 있다.
  var BRAIN_KEY = 'pitchbuilder.brain.v1';
  var brain = { version:'', items:[], rx:{}, loaded:false };

  //  단계 ↔ 진단영역 매핑. **엔진은 소비자를 모른다** — 이 표는 PitchBuilder가 가진다.
  //  🔴 06 CMP(경쟁)를 3단계에 붙인 이유 = '기술적 방어 해자'와 묻는 것이 같다.
  //  🔴 08 TRC(트랙션)는 IR 6단계에 제 자리가 없어 4단계 시장에 얹었다 —
  //     시장을 증명하는 방식이 곧 초기 성과이기 때문이다.
  //  대응 영역이 없는 단계(1 cover · 6 team_ask · R&D 3단계)는 기존 coachTips를 그대로 쓴다.
  var STEP_DOMAIN_MAP = {
    problem:  ['02 PRB'],
    solution: ['03 SOL', '06 CMP'],
    market:   ['08 TRC'],
    business: ['07 BMO', '09 UNT', '10 GTM']
  };

  function brainItemsFor(stepId){
    var codes = STEP_DOMAIN_MAP[stepId];
    if(!codes || !brain.items.length) return [];
    return brain.items.filter(function(it){
      return codes.indexOf(String(it.domain_code || '')) >= 0;
    });
  }

  function readBrain(){
    try{
      var raw = localStorage.getItem(BRAIN_KEY);
      if(!raw) return;
      var o = JSON.parse(raw);
      if(o && o.version && o.items){
        brain.version = o.version; brain.items = o.items || []; brain.rx = o.rx || {};
      }
    }catch(e){}
  }
  function writeBrain(){
    try{
      localStorage.setItem(BRAIN_KEY, JSON.stringify({
        version: brain.version, items: brain.items, rx: brain.rx }));
    }catch(e){}      // 용량 초과여도 화면은 돌아야 한다 — 다음 접속에 다시 받는다
  }

  //  ★지식 번들은 기업별 자료가 아니라 **공용 지식**이다. 계정을 갈아도 비우지 않는다.
  function pullBrain(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('brain', brain.version ? { have: brain.version } : {})
      .then(function(d){
        if(!d || !d.ok) return;
        if(d.same) { brain.loaded = true; return; }        // 버전 동일 — 본문을 받지 않았다
        if(!d.version || !d.bundle){                        // 아직 발행 전
          brain.version = ''; brain.items = []; brain.rx = {};
          brain.loaded = true;
          return;
        }
        brain.version = d.version;
        brain.items = arr(d.bundle.items);
        brain.rx = d.bundle.rx || {};
        brain.loaded = true;
        writeBrain();
        if(state.view === 'write') renderRight();
      })
      .catch(function(){});                                 // 조용히 접는다 — 가이드만 빈다
  }

    /* ══════════════════════════════════════════════════════════════

     ══════════════════════════════════════════════════════════════ */

  // ══════════════════════════════════════════════════════════════
  var TIPS_STEPS = [
    {
      id:'rnd_goal', icon:'flask',

  function hashOf(s){                                   // djb2 — 충돌 확률보다 '싼 값'이 중요하다

  function parseJSON(text){
    if(!text) throw new Error('응답이 비어 있습니다.');
    var t = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    try{ return JSON.parse(t); }catch(e){}
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if(a >= 0 && b > a){
      try{ return JSON.parse(t.slice(a, b+1)); }catch(e2){}
    }
    throw new Error('응답을 해석하지 못했습니다. 다시 시도해 주세요.');
  }

      '답변이 비어 있는 필드는 rewrite를 만들지 말고 questions로 물어라.'
    ].join('\n');
  }

  function auditPrompt(){
    return [
      '다음은 창업팀이 완성한 IR 스토리 전문이다. 단계별이 아니라 IR 전체를 하나의 논리로 보고 감수하라.',
      '특히 단계 사이의 모순을 찾아라. 예: 타겟 고객이 Problem과 Market에서 다르다, 객단가가 수익 모델과 어긋난다, 마일스톤이 GTM으로는 달성 불가능하다.',
      '',
      '# IR 전문',
      contextBlock(null),
      '',
      '# 출력 JSON 스키마',

      '  "questions": [{ "q": "심사위원이 던질 질문", "intent": "이 질문으로 무엇을 검증하려는지" }]',
      '}',

      'strengths 최대 3개, inconsistencies 최대 4개, questions는 5개.',

  function diagramPrompt(){
    return [
      '아래 IR 내용에서 도식으로 그릴 구조를 추출하라. 새로 창작하지 말고 이미 쓰인 내용에서 뽑아내라.',
      '',
      DG_RULE,
      '',
      '# IR 내용',
      contextBlock(null),
      '',
      '# 자리와 후보 — 자리마다 하나만 고른다',
      slotMenu(),
      '',
      '# 출력 JSON',
      '{ "pain":{…}, "solution":{…}, "moat":{…}, "market":{…}, "gtm":{…}, "ask":{…} }',
      '- 각 값에 "type"과 "why"를 반드시 넣는다. 위 후보에 없는 type은 쓰지 마라.',
      '- 해당 관계가 IR에 없으면 그 자리는 null이다.',
      '',
      '# 공통 규칙',
      '- ★IR에 없는 숫자·기관명·연도·회사명을 절대 지어내지 마라. 모르면 "[__]"로 비워라.',
      '- 경쟁사 실명이 IR에 없으면 유형으로 적어라(예: "기존 수작업", "범용 SaaS").',
      '- market은 Bottom-up(고객 수 × 객단가)만 쓴다. "전체 시장의 몇 %" 같은 Top-down은 쓰지 마라.',
      '- timeline의 when은 IR에 적힌 시점만. 없으면 빈 문자열로 두고 연도·분기를 지어내지 마라.',
      '- position 좌표는 0~1이고 우리가 우상단에 가깝게 선다.',
      '- 라벨은 짧게, note는 15자 이내. 없으면 빈 문자열.',
      '- ★서로 다른 자리에 같은 type을 반복하지 마라. 다른 관계인데 같은 그림이면 구분되지 않는다.'
    ].join('\n');
  }

  // ── SVG 유틸 ────────────────────────────
  //  ★키 이름을 줄여 쓰지 말 것 — 전에 C.bl / C.blLt 로 적힌 곳이 있었고(정의에 없는 키다),
  //    SVG에 fill="undefined"가 들어가 타임라인·포지셔닝의 강조색이 통째로 죽어 있었다.
  //    색이 안 나와도 예외가 나지 않아 눈으로 보기 전엔 모른다.
  var C = { blue:'#2563eb', blueLt:'#eff6ff', blueBd:'#bfdbfe',
            em:'#059669', emLt:'#ecfdf5', emBd:'#a7f3d0',
            pu:'#9333ea', puLt:'#faf5ff', puBd:'#e9d5ff',
            rd:'#dc2626', rdLt:'#fef2f2', rdBd:'#fecaca',
            ink:'#0f172a', mute:'#64748b', line:'#cbd5e1' };

  // 한글은 폭이 넓다 — 대략적 폭 계산으로 줄바꿈한다
  function textW(s, fs){
    var w = 0;
    for(var i=0; i<s.length; i++){
      var c = s.charCodeAt(i);
      w += (c > 0x1100 && c < 0xD7FF) || (c >= 0xFF00 && c <= 0xFFEF) ? fs : fs * 0.55;
    }
    return w;
  }

  function wrap(s, fs, maxW){
    s = String(s || '').trim();
    if(!s) return [];
    var words = s.split(/\s+/), lines = [], cur = '';
    words.forEach(function(w){
      var t = cur ? cur + ' ' + w : w;
      if(textW(t, fs) <= maxW || !cur){ cur = t; }
      else { lines.push(cur); cur = w; }
    });
    if(cur) lines.push(cur);
    // 한 단어가 너무 길면 강제로 자른다
    var out = [];
    lines.forEach(function(l){
      while(textW(l, fs) > maxW && l.length > 1){
        var cut = l.length;
        while(cut > 1 && textW(l.slice(0, cut), fs) > maxW) cut--;
        out.push(l.slice(0, cut));
        l = l.slice(cut);
      }
      if(l) out.push(l);
    });
    return out.slice(0, 3);
  }

  function tspans(lines, cx, y, fs, fill, weight){
    return lines.map(function(l, i){
      return '<text x="' + cx + '" y="' + (y + i * (fs + 5)) + '" text-anchor="middle" font-size="' + fs +
             '" font-weight="' + (weight || 400) + '" fill="' + fill + '" font-family="inherit">' + esc(l) + '</text>';
    }).join('');
  }

  function box(x, y, w, h, fill, stroke){
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10" fill="' + fill +
           '" stroke="' + stroke + '" stroke-width="1.5"/>';
  }

  function arrowDefs(id, color){
    return '<defs><marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
           '<path d="M0 0 L10 5 L0 10 z" fill="' + color + '"/></marker></defs>';
  }

  function svgWrap(w, h, inner){
    return '<svg class="dg" viewBox="0 0 ' + w + ' ' + h + '" role="img" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }

  // ① 해결책 흐름도 — 가로 단계 박스 + 화살표
  function drawFlow(d){
    var steps = arr(d && d.steps).filter(function(s){ return s && s.label; }).slice(0, 5);
    if(steps.length < 2) return '';

    var W = 760, n = steps.length, GAP = 38, PAD = 14;
    var bw = (W - GAP * (n - 1)) / n;
    var inner = bw - 20;

    var laid = steps.map(function(s){
      return { l: wrap(s.label, 14, inner), n: wrap(s.note, 11, inner) };
    });
    var maxL = Math.max.apply(null, laid.map(function(o){ return o.l.length; }));
    var maxN = Math.max.apply(null, laid.map(function(o){ return o.n.length; }));
    var bh = PAD + 24 + 10 + maxL * 19 + (maxN ? 6 + maxN * 16 : 0) + PAD;

    var s = arrowDefs('ar-flow', C.line);
    laid.forEach(function(o, i){
      var x = i * (bw + GAP), cx = x + bw / 2;
      s += box(x, 0, bw, bh, C.blueLt, C.blueBd);
      s += '<circle cx="' + cx + '" cy="' + (PAD + 12) + '" r="12" fill="' + C.blue + '"/>';
      s += '<text x="' + cx + '" y="' + (PAD + 16) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="inherit">' + (i + 1) + '</text>';
      s += tspans(o.l, cx, PAD + 24 + 20, 14, C.ink, 600);
      if(o.n.length) s += tspans(o.n, cx, PAD + 24 + 20 + maxL * 19 + 8, 11, C.mute);
      if(i < n - 1){
        var ax = x + bw + 8, ay = bh / 2;
        s += '<line x1="' + ax + '" y1="' + ay + '" x2="' + (ax + GAP - 20) + '" y2="' + ay +
             '" stroke="' + C.line + '" stroke-width="2" marker-end="url(#ar-flow)"/>';
      }
    });
    return svgWrap(W, bh, s);
  }

  // ② Bottom-up 산식 — [고객 수] × [객단가] = [시장]
  function drawMarket(d){
    if(!d || (!d.unitValue && !d.priceValue && !d.totalValue)) return '';

    var W = 760, SYM = 46, bw = (W - SYM * 2) / 3, PAD = 16;
    var cells = [
      { lab: d.unitLabel || '타겟 고객 수', val: d.unitValue || '[__]', accent: false },
      { lab: d.priceLabel || '객단가',      val: d.priceValue || '[__]', accent: false },
      { lab: d.totalLabel || '초기 시장(SOM)', val: d.totalValue || '[__]', accent: true }
    ];
    var laid = cells.map(function(c){
      return { lab: wrap(c.lab, 11, bw - 24), val: wrap(c.val, 17, bw - 24), accent: c.accent };
    });
    var maxLab = Math.max.apply(null, laid.map(function(o){ return o.lab.length; }));
    var maxVal = Math.max.apply(null, laid.map(function(o){ return o.val.length; }));
    var bh = PAD + maxLab * 15 + 10 + maxVal * 23 + PAD;

    var s = '';
    laid.forEach(function(o, i){
      var x = i * (bw + SYM), cx = x + bw / 2;
      s += box(x, 0, bw, bh, o.accent ? C.em : C.emLt, o.accent ? C.em : C.emBd);
      s += tspans(o.lab, cx, PAD + 11, 11, o.accent ? '#d1fae5' : C.mute, 600);
      s += tspans(o.val, cx, PAD + maxLab * 15 + 20, 17, o.accent ? '#fff' : C.ink, 700);
      if(i < 2){
        s += '<text x="' + (x + bw + SYM / 2) + '" y="' + (bh / 2 + 8) + '" text-anchor="middle" font-size="22" font-weight="700" fill="' +
             C.mute + '" font-family="inherit">' + (i === 0 ? '×' : '=') + '</text>';
      }
    });
    return svgWrap(W, bh, s);
  }

  // ③ GTM 퍼널 — 위가 넓고 아래로 좁아지는 계단
  function drawFunnel(d){
    var stages = arr(d && d.stages).filter(function(s){ return s && s.label; }).slice(0, 4);
    if(stages.length < 2) return '';

    var W = 760, n = stages.length, SH = 66, GAP = 8;
    var topW = 660, botW = 300, cx = W / 2;
    var H = n * SH + (n - 1) * GAP;

    var s = '';
    stages.forEach(function(st, i){
      var y = i * (SH + GAP);
      var wT = topW - (topW - botW) * (i / n);
      var wB = topW - (topW - botW) * ((i + 1) / n);
      var pts = [
        (cx - wT / 2) + ',' + y, (cx + wT / 2) + ',' + y,
        (cx + wB / 2) + ',' + (y + SH), (cx - wB / 2) + ',' + (y + SH)
      ].join(' ');
      var op = 0.16 + i * 0.22;
      s += '<polygon points="' + pts + '" fill="' + C.pu + '" fill-opacity="' + op.toFixed(2) + '" stroke="' + C.pu + '" stroke-width="1.5"/>';

      var lab = wrap(st.label, 14, wB - 30);
      var note = wrap(st.note, 11, wB - 30);
      var dark = op > 0.5;
      var ty = y + SH / 2 - (note.length ? 8 : 0) + 5 - (lab.length - 1) * 9;
      s += tspans(lab, cx, ty, 14, dark ? '#fff' : C.ink, 600);
      if(note.length) s += tspans(note, cx, ty + lab.length * 19 + 2, 11, dark ? '#f3e8ff' : C.mute);
    });
    return svgWrap(W, H, s);
  }

  // ④ 마일스톤 타임라인 — 조달 목표·마일스톤(fundingAsk)에서 뽑는다
  //    돈 이야기를 하는 장(Ask)에 그림이 없으면 슬라이드가 맨 글자만 남는다.
  function drawTimeline(d){
    var items = arr(d && d.items).filter(function(x){ return x && x.label; }).slice(0, 5);
    if(items.length < 2) return '';

    var W = 760, n = items.length;
    var PADX = 40, AXIS = 92;
    var span = (W - PADX * 2) / (n - 1);
    var s = arrowDefs('mkTl', C.line);

    // 축
    s += '<line x1="' + PADX + '" y1="' + AXIS + '" x2="' + (W - PADX + 14) + '" y2="' + AXIS +
         '" stroke="' + C.line + '" stroke-width="2" marker-end="url(#mkTl)"/>';

    items.forEach(function(it, i){
      var cx = PADX + span * i;
      var up = i % 2 === 0;                     // 위·아래 번갈아 — 글자가 겹치지 않는다
      var isLast = i === n - 1;
      var col = isLast ? C.pu : C.blue;

      s += '<circle cx="' + cx + '" cy="' + AXIS + '" r="7" fill="#fff" stroke="' + col + '" stroke-width="3"/>';

      var when = String(it.when || '').trim();
      var lab = wrap(it.label, 13, span * 0.92);
      var note = wrap(it.note, 10.5, span * 0.92);

      var y = up ? AXIS - 26 : AXIS + 30;
      s += '<line x1="' + cx + '" y1="' + (up ? AXIS - 8 : AXIS + 8) + '" x2="' + cx + '" y2="' +
           (up ? y + 4 : y - 12) + '" stroke="' + C.line + '" stroke-width="1.5"/>';

      var ty = up ? y - (lab.length - 1) * 17 - (note.length ? note.length * 13 : 0) - (when ? 15 : 0) : y;
      if(when){ s += tspans([when], cx, ty, 11, col, 700); ty += 16; }
      s += tspans(lab, cx, ty, 13, C.ink, 600);
      if(note.length) s += tspans(note, cx, ty + lab.length * 17 + 1, 10.5, C.mute);
    });
    return svgWrap(W, 190, s);
  }

  // ⑤ 경쟁 포지셔닝 2×2 — 해자(moat)에서 뽑는다
  //   ★좌표는 LLM이 0~1로만 낸다. 축·격자·점은 코드가 그린다.
  function drawPositioning(d){
    if(!d || !d.us || !d.xLabel || !d.yLabel) return '';
    var others = arr(d.others).filter(function(o){ return o && o.label; }).slice(0, 4);

    var W = 760, H = 420, PAD = 74;
    var x0 = PAD, x1 = W - PAD, y0 = 30, y1 = H - PAD;
    var px = function(v){ return x0 + (x1 - x0) * Math.max(0, Math.min(1, +v || 0)); };
    var py = function(v){ return y1 - (y1 - y0) * Math.max(0, Math.min(1, +v || 0)); };

    var s = '';
    // 사분면 — 우상단(우리가 서야 할 자리)만 은은하게 칠한다
    s += '<rect x="' + ((x0 + x1) / 2) + '" y="' + y0 + '" width="' + ((x1 - x0) / 2) +
         '" height="' + ((y1 - y0) / 2) + '" fill="' + C.blueLt + '"/>';
    s += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="' + C.line + '" stroke-width="1.5"/>';
    s += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + y1 + '" stroke="' + C.line + '" stroke-width="1.5"/>';
    s += '<line x1="' + ((x0 + x1) / 2) + '" y1="' + y0 + '" x2="' + ((x0 + x1) / 2) + '" y2="' + y1 +
         '" stroke="' + C.line + '" stroke-width="1" stroke-dasharray="4 4"/>';
    s += '<line x1="' + x0 + '" y1="' + ((y0 + y1) / 2) + '" x2="' + x1 + '" y2="' + ((y0 + y1) / 2) +
         '" stroke="' + C.line + '" stroke-width="1" stroke-dasharray="4 4"/>';

    // 축 이름
    s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 40) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + C.mute + '" font-family="inherit">' + esc(d.xLabel) + ' →</text>';
    s += '<text transform="translate(' + (x0 - 28) + ',' + ((y0 + y1) / 2) + ') rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + C.mute + '" font-family="inherit">' + esc(d.yLabel) + ' →</text>';

    // 경쟁사 — 회색 점
    others.forEach(function(o){
      var cx = px(o.x), cy = py(o.y);
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#fff" stroke="' + C.mute + '" stroke-width="2"/>';
      s += tspans(wrap(o.label, 11, 150), cx, cy + 22, 11, C.mute, 500);
    });

    // 우리 — 강조
    var ux = px(d.us.x), uy = py(d.us.y);
    s += '<circle cx="' + ux + '" cy="' + uy + '" r="13" fill="' + C.blue + '" fill-opacity="0.15"/>';
    s += '<circle cx="' + ux + '" cy="' + uy + '" r="7.5" fill="' + C.blue + '"/>';
    s += tspans(wrap(d.us.label || '우리', 12.5, 180), ux, uy - 18, 12.5, C.blue, 800);

    return svgWrap(W, H, s);
  }

  // ⑥ Problem — 누가 무엇을 잃고 있는가 (targetCustomer + problemDescription에서 뽑는다)
  //    덱 5장 중 cover·problem 두 장이 늘 맨 글자만 남던 자리다.
  //    그런데 problem은 TIPS 「개발 필요성」 15점이 걸린 칸이고,
  //    상장사 IR은 6%만 쓰지만 초기기업은 반드시 써야 하는 칸이다(코퍼스 1,344건 실측).
  //
  //  ★막대그래프로 그리지 않는다. "하루 3시간"과 "월 100만원"은 단위가 달라
  //    한 축에 올릴 수 없다. 단위가 다른 값을 같은 축에 세우면 그림이 거짓말을 한다.
  //    그래서 축 없이 카드로 나열한다 — 비교가 아니라 열거이기 때문이다.
  function drawPain(d){
    if(!d) return '';
    var who   = String(d.who || '').trim();
    var items = arr(d.items).filter(function(x){ return x && String(x.value || '').trim(); }).slice(0, 4);
    if(!items.length) return '';        // 손실 수치가 하나도 없으면 그리지 않는다

    var W = 760, GAP = 16, y = 0, s = '';

    // 누가 겪는가 — 페르소나. 없으면 이 칸 자체를 생략한다.
    if(who){
      var wl = wrap(who, 14, W - 56);
      var wh = 26 + wl.length * 20 + 14;
      s += box(0, 0, W, wh, '#fff', C.line);
      s += '<text x="20" y="24" font-size="10" font-weight="700" fill="' + C.mute +
           '" font-family="inherit" letter-spacing="0.06em">WHO · 누가 겪는가</text>';
      wl.forEach(function(l, i){
        s += '<text x="20" y="' + (48 + i * 20) + '" font-size="14" font-weight="600" fill="' + C.ink +
             '" font-family="inherit">' + esc(l) + '</text>';
      });
      y = wh + GAP;
    }

    // 무엇을 잃는가 — 손실 카드
    var n = items.length, bw = (W - GAP * (n - 1)) / n;
    var labs = items.map(function(it){ return wrap(it.label, 11.5, bw - 24); });
    var maxL = Math.max.apply(null, labs.map(function(l){ return l.length; }));
    var bh = 22 + 30 + 8 + maxL * 17 + 18;

    items.forEach(function(it, i){
      var x = i * (bw + GAP), cx = x + bw / 2;
      var val = String(it.value);
      // 값이 길면 글자를 줄인다 — 박스를 넘기느니 작게 쓴다
      var vfs = 27;
      while(vfs > 14 && textW(val, vfs) > bw - 24) vfs -= 1.5;

      s += box(x, y, bw, bh, C.rdLt, C.rdBd);
      s += '<text x="' + cx + '" y="' + (y + 24) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="' +
           C.rd + '" font-family="inherit" letter-spacing="0.06em">LOSS</text>';
      s += tspans([val], cx, y + 58, vfs, C.rd, 800);
      s += tspans(labs[i], cx, y + 82, 11.5, C.ink, 500);
    });

    return svgWrap(W, y + bh, s);
  }

  // ⑦ 양자 비교 — 기존 방식 vs 우리 방식 (moat에서 뽑는다)
  //    "무엇이 다른가"는 IR에서 가장 자주 나오는 관계인데 그릴 도식이 없었다.
  function drawBeforeAfter(d){
    if(!d || !d.left || !d.right) return '';
    var L = d.left, R = d.right;
    var li = arr(L.items).filter(Boolean).slice(0, 4).map(String);
    var ri = arr(R.items).filter(Boolean).slice(0, 4).map(String);
    if(!li.length && !ri.length) return '';

    var W = 760, ARW = 64, bw = (W - ARW) / 2, PAD = 18;
    var lw = li.map(function(t){ return wrap(t, 12.5, bw - PAD * 2); });
    var rw = ri.map(function(t){ return wrap(t, 12.5, bw - PAD * 2); });
    var lines = function(ws){ return ws.reduce(function(a, w){ return a + w.length; }, 0); };
    var rows = Math.max(lines(lw), lines(rw));
    var bh = 44 + rows * 20 + Math.max(li.length, ri.length) * 8 + PAD;

    function side(x, title, ws, col, bg, bd){
      var s = box(x, 0, bw, bh, bg, bd);
      s += tspans(wrap(title, 13, bw - PAD * 2), x + bw / 2, 28, 13, col, 700);
      var y = 56;
      ws.forEach(function(w){
        s += '<circle cx="' + (x + PAD + 4) + '" cy="' + (y - 4) + '" r="2.5" fill="' + col + '"/>';
        w.forEach(function(l, i){
          s += '<text x="' + (x + PAD + 14) + '" y="' + (y + i * 18) + '" font-size="12.5" fill="' +
               C.ink + '" font-family="inherit">' + esc(l) + '</text>';
        });
        y += w.length * 18 + 10;
      });
      return s;
    }

    var s = arrowDefs('mkBA', C.mute);
    s += side(0, L.title || '기존 방식', lw, C.mute, '#fff', C.line);
    s += side(bw + ARW, R.title || '우리 방식', rw, C.blue, C.blueLt, C.blueBd);
    s += '<line x1="' + (bw + 14) + '" y1="' + (bh / 2) + '" x2="' + (bw + ARW - 14) + '" y2="' + (bh / 2) +
         '" stroke="' + C.mute + '" stroke-width="2" marker-end="url(#mkBA)"/>';
    return svgWrap(W, bh, s);
  }

  // ⑧ 병렬 구성요소 — 순서가 없는 것에 화살표를 붙이지 않기 위해서다.
  //    전에는 이런 내용도 flow로 그려져, 없는 순서를 있는 것처럼 주장했다.
  function drawParallel(d){
    var items = arr(d && d.items).filter(function(x){ return x && x.label; }).slice(0, 4);
    if(items.length < 2) return '';

    var W = 760, GAP = 16, PAD = 16;
    var n = items.length, bw = (W - GAP * (n - 1)) / n;
    var labs = items.map(function(it){ return wrap(it.label, 13.5, bw - PAD * 2); });
    var nts  = items.map(function(it){ return wrap(it.note, 11, bw - PAD * 2); });
    var maxL = Math.max.apply(null, labs.map(function(l){ return l.length; }));
    var maxN = Math.max.apply(null, nts.map(function(l){ return l.length; }));
    var bh = PAD + maxL * 19 + (maxN ? 8 + maxN * 16 : 0) + PAD;

    var s = '';
    items.forEach(function(it, i){
      var x = i * (bw + GAP), cx = x + bw / 2;
      s += box(x, 0, bw, bh, C.blueLt, C.blueBd);
      s += tspans(labs[i], cx, PAD + 16, 13.5, C.ink, 700);
      if(nts[i].length) s += tspans(nts[i], cx, PAD + maxL * 19 + 16, 11, C.mute);
    });
    return svgWrap(W, bh, s);
  }

  // ⑨ 순환 — 반복되는 과정. 직선으로 그리면 끝나는 것처럼 보인다.
  function drawCycle(d){
    var st = arr(d && d.stages).filter(function(x){ return x && x.label; }).slice(0, 5);
    if(st.length < 3) return '';

    var W = 760, H = 340, cx = W / 2, cy = H / 2, R = 108, nr = 46;
    var n = st.length;
    var ang = function(i){ return (-90 + (360 / n) * i) * Math.PI / 180; };
    var px = function(i){ return cx + R * Math.cos(ang(i)); };
    var py = function(i){ return cy + R * Math.sin(ang(i)); };

    var s = arrowDefs('mkCy', C.pu);
    // 노드 사이를 호로 잇는다 — 원 위를 도는 것이 눈에 보여야 순환으로 읽힌다
    for(var i = 0; i < n; i++){
      var a0 = ang(i), a1 = ang((i + 1) % n);
      var pad = 0.30;                                  // 노드에 닿지 않도록 양끝을 물린다
      var s0 = a0 + pad, s1 = a1 - pad;
      s += '<path d="M ' + (cx + R * Math.cos(s0)) + ' ' + (cy + R * Math.sin(s0)) +
           ' A ' + R + ' ' + R + ' 0 0 1 ' + (cx + R * Math.cos(s1)) + ' ' + (cy + R * Math.sin(s1)) +
           '" fill="none" stroke="' + C.pu + '" stroke-width="2" marker-end="url(#mkCy)"/>';
    }
    st.forEach(function(it, i){
      var x = px(i), y = py(i);
      s += '<circle cx="' + x + '" cy="' + y + '" r="' + nr + '" fill="' + C.puLt + '" stroke="' + C.puBd + '" stroke-width="1.5"/>';
      var lab = wrap(it.label, 12, nr * 1.75);
      s += tspans(lab, x, y - (lab.length - 1) * 7 + 4, 12, C.ink, 600);
    });
    return svgWrap(W, H, s);
  }

  // ⑩ 허브 — 중심과 참여자. 플랫폼·생태계 서술에 쓰인다.
  function drawHub(d){
    if(!d || !d.center) return '';
    var sp = arr(d.spokes).filter(function(x){ return x && x.label; }).slice(0, 6);
    if(sp.length < 2) return '';

    var W = 760, H = 340, cx = W / 2, cy = H / 2, R = 118, cr = 62;
    var n = sp.length;
    var s = '';
    sp.forEach(function(it, i){
      var a = (-90 + (360 / n) * i) * Math.PI / 180;
      var x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
      // 선은 중심 원 밖에서 시작한다 — 원을 관통하면 안 된다
      s += '<line x1="' + (cx + cr * Math.cos(a)) + '" y1="' + (cy + cr * Math.sin(a)) +
           '" x2="' + (x - 38 * Math.cos(a)) + '" y2="' + (y - 22 * Math.sin(a)) +
           '" stroke="' + C.line + '" stroke-width="1.5"/>';
      var lab = wrap(it.label, 12, 148);
      var bh2 = 12 + lab.length * 17 + 12, bw2 = 156;
      s += box(x - bw2 / 2, y - bh2 / 2, bw2, bh2, '#fff', C.emBd);
      s += tspans(lab, x, y - (lab.length - 1) * 8.5 + 4, 12, C.ink, 600);
    });
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + cr + '" fill="' + C.emLt + '" stroke="' + C.em + '" stroke-width="2"/>';
    var cl = wrap(d.center.label || '', 13, cr * 1.7);
    s += tspans(cl, cx, cy - (cl.length - 1) * 8 + 4, 13, C.em, 800);
    return svgWrap(W, H, s);
  }

  // ⑪ 격차 — 현재와 목표의 차이. "얼마나 모자란가"가 한눈에 보여야 한다.
  function drawGap(d){
    if(!d || !d.from || !d.to) return '';
    var fv = String(d.from.value || '').trim(), tv = String(d.to.value || '').trim();
    if(!fv || !tv) return '';

    var W = 760, H = 210, bw = 232, gapW = W - bw * 2;
    var s = arrowDefs('mkGap', C.em);

    function pill(x, val, lab, col, bg, bd){
      var t = box(x, 40, bw, 108, bg, bd);
      t += tspans([val], x + bw / 2, 96, 30, col, 800);
      t += tspans(wrap(lab, 12, bw - 24), x + bw / 2, 124, 12, C.mute);
      return t;
    }
    s += pill(0, fv, d.from.label || '현재', C.mute, '#fff', C.line);
    s += pill(bw + gapW, tv, d.to.label || '목표', C.em, C.emLt, C.emBd);

    // 사이의 격차
    var gx = bw, gc = bw + gapW / 2;
    s += '<line x1="' + (gx + 14) + '" y1="94" x2="' + (gx + gapW - 14) + '" y2="94" stroke="' + C.em +
         '" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mkGap)"/>';
    if(d.gap && String(d.gap.value || '').trim()){
      s += tspans([String(d.gap.value)], gc, 74, 15, C.em, 800);
      if(d.gap.label) s += tspans(wrap(d.gap.label, 11, gapW - 16), gc, 124, 11, C.mute);
    }
    return svgWrap(W, H, s);
  }

  // ⑫ 계층 — 위에서 아래로 쌓인 구조(기술 스택·서비스 층위).
  function drawLayers(d){
    var ls = arr(d && d.layers).filter(function(x){ return x && x.label; }).slice(0, 4);
    if(ls.length < 2) return '';

    var W = 760, GAP = 10, PAD = 14, y = 0, s = '';
    var tones = [[C.blueLt, C.blueBd], [C.emLt, C.emBd], [C.puLt, C.puBd], ['#fff', C.line]];
    ls.forEach(function(it, i){
      var lab = wrap(it.label, 13.5, W - 240);
      var nt  = wrap(it.note, 11, W - 240);
      var h = PAD + lab.length * 19 + (nt.length ? 6 + nt.length * 16 : 0) + PAD;
      var tone = tones[i % tones.length];
      s += box(0, y, W, h, tone[0], tone[1]);
      lab.forEach(function(l, j){
        s += '<text x="24" y="' + (y + PAD + 15 + j * 19) + '" font-size="13.5" font-weight="700" fill="' +
             C.ink + '" font-family="inherit">' + esc(l) + '</text>';
      });
      nt.forEach(function(l, j){
        s += '<text x="24" y="' + (y + PAD + lab.length * 19 + 15 + j * 16) + '" font-size="11" fill="' +
             C.mute + '" font-family="inherit">' + esc(l) + '</text>';
      });
      y += h + GAP;
    });
    return svgWrap(W, y - GAP, s);
  }

  // ══════════════════════════════════════════════════════════════
  //  도식 선택 — 자리(슬롯)마다 후보를 두고, 내용의 관계에 맞는 것을 고른다.
  //
  //  ★전에는 필드 하나에 도식 하나가 고정이었다. 그래서 순서가 없는 구성요소에도
  //    화살표가 붙고(없는 순서를 주장), 순환 구조도 직선으로 그려졌다(끝나는 것처럼 보임).
  //  ★그렇다고 LLM에게 그림을 맡기지는 않는다. LLM이 고르는 것은 **관계의 종류**뿐이고,
  //    좌표와 레이아웃은 여전히 코드가 정한다. 후보 밖의 type은 코드가 거부한다.
  // ══════════════════════════════════════════════════════════════
  var DG_DRAW = {
    pain: drawPain, gap: drawGap,
    flow: drawFlow, parallel: drawParallel, layers: drawLayers,
    position: drawPositioning, beforeafter: drawBeforeAfter,
    market: drawMarket,
    funnel: drawFunnel, cycle: drawCycle, hub: drawHub,
    timeline: drawTimeline
  };

  //  when = LLM이 이 도식을 고를 조건. spec = 그때 내야 할 JSON 모양.
  var DG_TYPE = {
    pain:        { name:'손실 열거', when:'고객이 잃는 것을 수치로 나열할 때',
                   spec:'"type":"pain", "who":"고통을 겪는 사람(25자 내외)", "items":[{"value":"3시간","label":"무엇을 잃는지(20자 이내)"}]' },
    gap:         { name:'격차', when:'현재 값과 목표 값의 차이가 핵심일 때',
                   spec:'"type":"gap", "from":{"value":"87%","label":"현재"}, "to":{"value":"95%","label":"목표"}, "gap":{"value":"8%p","label":"메워야 할 차이"}' },
    flow:        { name:'순차 흐름', when:'단계가 정해진 순서로 이어질 때',
                   spec:'"type":"flow", "steps":[{"label":"단계명(8자 내외)","note":"부연(15자 이내)"}]' },
    parallel:    { name:'병렬 구성', when:'순서 없이 나란한 구성요소일 때',
                   spec:'"type":"parallel", "items":[{"label":"구성요소","note":"부연(15자 이내)"}]' },
    layers:      { name:'계층 구조', when:'위아래로 쌓인 층위일 때(기술 스택 등)',
                   spec:'"type":"layers", "layers":[{"label":"층 이름","note":"부연"}]' },
    position:    { name:'경쟁 2×2', when:'경쟁 기준 두 축으로 자리가 갈릴 때',
                   spec:'"type":"position", "xLabel":"가로축","yLabel":"세로축","us":{"x":0.8,"y":0.8,"label":"우리"},"others":[{"x":0.3,"y":0.4,"label":"경쟁 유형"}]' },
    beforeafter: { name:'양자 비교', when:'기존 방식과 우리 방식을 맞세울 때',
                   spec:'"type":"beforeafter", "left":{"title":"기존 방식","items":["항목","항목"]}, "right":{"title":"우리 방식","items":["항목","항목"]}' },
    market:      { name:'Bottom-up 산식', when:'고객 수 × 객단가 = 시장으로 산출할 때',
                   spec:'"type":"market", "unitLabel":"고객 단위","unitValue":"고객 수","priceLabel":"객단가 항목","priceValue":"객단가","totalLabel":"시장 이름","totalValue":"금액"' },
    funnel:      { name:'퍼널', when:'넓은 채널에서 좁은 고객으로 줄어들 때',
                   spec:'"type":"funnel", "stages":[{"label":"단계","note":"부연"}]' },
    cycle:       { name:'순환', when:'과정이 되돌아와 반복될 때(리텐션·데이터 선순환)',
                   spec:'"type":"cycle", "stages":[{"label":"단계(12자 이내)"}]' },
    hub:         { name:'허브', when:'우리를 중심으로 여러 참여자가 붙을 때(플랫폼)',
                   spec:'"type":"hub", "center":{"label":"우리"}, "spokes":[{"label":"참여자"}]' },
    timeline:    { name:'마일스톤', when:'시점별 목표가 있을 때',
                   spec:'"type":"timeline", "items":[{"when":"시점","label":"마일스톤","note":"부연"}]' }
  };

  //  슬롯 = 슬라이드의 한 자리. 그 자리에 올 수 있는 후보를 **코드가** 정한다.
  var DG_SLOTS = {
    pain:     { label:'Problem — 고객이 잃는 것', src:'타겟 고객·고객의 문제', opts:['pain','gap'] },
    solution: { label:'Solution — 어떻게 푸는가', src:'해결책 작동 원리',      opts:['flow','parallel','layers'] },
    moat:     { label:'경쟁 — 우리의 자리',       src:'기술적 방어 해자',      opts:['position','beforeafter'] },
    market:   { label:'Market — 시장 산출',       src:'SOM 타겟·시장 규모',    opts:['market'] },
    gtm:      { label:'GTM — 고객 확보',          src:'수익 모델·GTM 전략',    opts:['funnel','cycle','hub'] },
    ask:      { label:'Ask — 조달·마일스톤',      src:'조달 목표·마일스톤',    opts:['timeline'] }
  };

  var DG_ORDER = ['pain', 'solution', 'moat', 'market', 'gtm', 'ask'];

  // 슬롯 하나 → SVG. renderDeck·renderDiagrams·regenDiagram이 모두 이 함수를 본다.
  function drawOne(slot, spec){
    var d = (spec || {})[slot];
    if(!d) return '';
    var S = DG_SLOTS[slot];
    var t = String(d.type || '');
    // ★후보 밖의 type은 거부한다. 엉뚱한 자리에 엉뚱한 그림이 들어가느니 비는 편이 낫다.
    if(!S || S.opts.indexOf(t) < 0) return '';
    return DG_DRAW[t] ? DG_DRAW[t](d) : '';
  }

  // 슬롯의 후보 메뉴 — 프롬프트에 넣는다. 전 도식을 다 나열하면 LLM이 고르지 못한다.
  function slotMenu(only){
    return (only ? [only] : DG_ORDER).map(function(k){
      var S = DG_SLOTS[k];
      var out = ['## ' + k + ' — ' + S.label + '   (재료: ' + S.src + ')'];
      S.opts.forEach(function(t){
        out.push('   · ' + t + ' = ' + DG_TYPE[t].name + ' — ' + DG_TYPE[t].when);
        out.push('     { ' + DG_TYPE[t].spec + ' }');
      });
      return out.join('\n');
    }).join('\n\n');
  }

  var DG_RULE = [
    '# 도식을 고르는 법 — 이것이 가장 중요하다',
    '자리마다 후보가 여럿이다. **내용이 어떤 관계인지 먼저 판정하고** 그에 맞는 것을 골라라.',
    '- 정해진 순서로 이어지면 flow / 순서 없이 나란하면 parallel / 위아래로 쌓이면 layers',
    '- 되돌아와 반복되면 cycle / 갈수록 줄어들면 funnel / 중심에 우리가 있고 참여자가 붙으면 hub',
    '- 두 방식을 맞세우면 beforeafter / 두 기준으로 자리가 갈리면 position',
    '★보기 좋아서가 아니라 **정보 사이에 그 관계가 실제로 있어서** 고른다.',
    '  관계가 없으면 그 자리는 null이다. 억지로 만들지 마라 — 빈 자리가 틀린 그림보다 낫다.',
    '★각 도식에 "why"를 25자 이내로 적어라. 왜 그 형태를 골랐는지다(예: "순서가 있어 흐름도").'
  ]

  // ══════════════════════════════════════════════════════════════
  //  피칭 덱 (5장 + R&D 부록)
  //
  //  ★도식과 같은 원칙: LLM은 '무엇을 말할지'만 내고, '어떻게 보일지'는 코드가 정한다.
  //  ★그리고 하나 더 — LLM이 낸 문구의 **숫자를 코드가 IR 원문과 대조**한다.
  //    슬라이드에 박힌 허구 수치는 팀이 투자자 앞에서 그대로 읽게 된다.
  //    "지어내지 마라"는 프롬프트만으로는 못 막는다(TIPS 채점에서 이미 겪었다).
  //  ★슬라이드와 도식을 LLM 호출 '한 번'에 받는다 — 계정당 일일 상한을 아껴야 한다.
  // ══════════════════════════════════════════════════════════════
  //  figs = 그 장에 놓을 **슬롯** 이름이다(도식 이름이 아니다).
  //  어떤 도식이 그려질지는 슬롯 안에서 내용의 관계에 따라 정해진다.
  var DECK_SLIDES = [
    { id:'cover',    label:'Cover',            figs:[] },
    { id:'problem',  label:'Problem',          figs:['pain'] },
    { id:'solution', label:'Solution',         figs:['solution', 'moat'] },
    { id:'market',   label:'Market & BM',      figs:['market', 'gtm'] },
    { id:'team_ask', label:'Team & Ask',       figs:['ask'] }
  ];

  function deckPrompt(){
    return [
      '아래 IR을 투자자 앞에서 띄우는 **피칭 덱 5장**으로 압축하라.',
      'IR 문서를 그대로 옮기지 마라 — 슬라이드는 짧아야 한다. 이미 쓰인 내용에서만 뽑아라.',
      '',
      '# IR 내용',
      contextBlock(null),
      '',
      '# 출력 JSON',
      '{',
      '  "slides": [',
      '    { "id":"cover",    "headline":"회사명 — 한 줄 정체성", "sub":"보조 문장 1개" },',
      '    { "id":"problem",  "headline":"문제를 한 문장으로", "bullets":["...","..."] },',
      '    { "id":"solution", "headline":"해결책을 한 문장으로", "bullets":["...","..."] },',
      '    { "id":"market",   "headline":"시장·수익모델을 한 문장으로", "bullets":["...","..."] },',
      '    { "id":"team_ask", "headline":"왜 우리인가 + 얼마가 필요한가", "bullets":["...","..."] }',
      '  ],',
      '  "rnd": { "headline":"R&D 개발 목표를 한 문장으로", "bullets":["...","..."] },',
      '  "diagrams": { "pain":{…}, "solution":{…}, "moat":{…}, "market":{…}, "gtm":{…}, "ask":{…} }',
      '}',
      '',
      DG_RULE,
      '',
      '# 도식 자리와 후보',
      slotMenu(),
      '',
      '# 규칙 (어기면 쓸 수 없는 덱이 된다)',
      '- headline은 **한 문장, 40자 이내**. 슬로건이 아니라 주장이어야 한다.',
      '  나쁜 예: "혁신적인 AI 플랫폼" / 좋은 예: "송장 입력에 하루 3시간을 쓴다"',
      '- bullets는 **장당 2~3개, 각 45자 이내**. 문장을 잘라 넣지 말고 요점만.',
      '- 형용사·수식어를 빼라("혁신적", "최고의", "글로벌 선도" 금지).',
      '- ★★숫자는 IR에 적힌 것만 쓴다. IR에 없는 수치·연도·비율·금액을 만들어내면 안 된다.',
      '  근거가 없으면 숫자를 아예 빼고 문장으로 써라. 코드가 원문과 대조해 걸러낸다.',
      '- ★회사명·기관명·경쟁사명도 IR에 있는 것만. 없으면 유형으로 표현하라.',
      '- rnd = R&D 항목(개발 목표·성능지표·글로벌)이 IR에 있을 때만. 없으면 null.',
      '- diagrams = 위 "도식 자리와 후보"를 따른다. 각 자리에 "type"과 "why"를 넣고,',
      '  해당 관계가 IR에 없으면 그 자리는 null. 후보에 없는 type은 쓰지 마라.',
      '  market은 Bottom-up만, timeline의 when은 IR에 적힌 시점만, position 좌표는 0~1.'
    ].join('\n');
  }

  // ★ IR 원문에 없는 숫자를 찾아낸다.
  //   의미 있는 수치만 본다 — "3단계"의 3 같은 한 자리 맨숫자는 걸지 않는다.
  //   단위(억·만·%·원·명…)가 붙었거나 두 자리 이상이면 검사 대상이다.
  function irHay(){
    return Object.keys(state.formData)
      .map(function(k){ return state.formData[k] || ''; })
      .join(' ')
      .replace(/[,\s]/g, '');
  }

  function badNumbers(text){
    var hay = irHay();
    var out = [];
    var toks = String(text || '').match(/\d[\d,.]*\s*(억|만|천|퍼센트|%|원|명|개사|개월|개|건|배|년|주|일|시간|배수|x|X)?/g) || [];
    toks.forEach(function(t){
      var norm = t.replace(/[,\s]/g, '');
      var m = norm.match(/\d[\d.]*/);
      if(!m) return;
      var d = m[0];
      var hasUnit = /[^\d.]/.test(norm);
      if(d.replace(/\D/g, '').length < 2 && !hasUnit) return;   // 한 자리 맨숫자는 통과
      if(hay.indexOf(d) < 0 && out.indexOf(t.trim()) < 0) out.push(t.trim());
    });
    return out;
  }

  // ★ 근거 인용 검증 — LLM을 믿지 않는다. 코드가 원문 대조한다.
  //   "원문을 인용하라"는 프롬프트만으로는 가끔 지어낸다(라이브 검증에서 실제 발생).
  //   인용문이 IR 어디에도 없으면 근거로 인정하지 않고 화면에 경고를 띄운다.
  function verifyEvidence(ev){
    if(!ev) return null;
    var norm = function(s){ return String(s).replace(/[\s"'“”‘’·,.]/g, ''); };
    var hay = norm(Object.keys(state.formData).map(function(k){ return state.formData[k] || ''; }).join(' '));
    var needle = norm(ev);
    if(!needle) return null;
    if(hay.indexOf(needle) >= 0) return true;                    // 통째로 일치
    var head = needle.slice(0, Math.min(16, needle.length));     // 앞부분만이라도 일치하는가
    return hay.indexOf(head) >= 0;
  }

  var FIELD_LABEL = {};
  IR_STEPS.concat(TIPS_STEPS).forEach(function(s){
    s.inputs.forEach(function(i){ FIELD_LABEL[i.key] = i.label; });
  });

  // ══ 화면 ══════════════════════════════════════════════════════

  // 목차에 쓸 짧은 이름 — IR_STEPS의 title은 "2. 문제 정의 (Problem)" 형태다
  function shortTitle(s){
    return String(s.title || '').replace(/^\s*\d+\.\s*/, '').replace(/\s*\([^)]*\)\s*$/, '').trim();
  }
  function stepNo(i){ return ('0' + (i + 1)).slice(-2); }
  function stepPts(s){
    // 그 단계가 걸린 TIPS 배점 — 채점 항목의 fields/tipsFields로 되짚는다
    var keys = s.inputs.map(function(x){ return x.key; });
    var pts = 0;
    TIPS_RUBRIC.items.forEach(function(it){
      var f = (it.fields || []).concat(it.tipsFields || []);
      if(f.some(function(k){ return keys.indexOf(k) >= 0; })) pts = Math.max(pts, it.max);
    });
    return pts;
  }
  function stepFilled(s){
    return s.inputs.every(function(i){ return (state.formData[i.key] || '').trim(); });
  }
  function stepChars(s){
    return s.inputs.reduce(function(a, i){ return a + (state.formData[i.key] || '').length; }, 0);
  }

  // ── 메타 스트립 ──
  function renderMeta(){
    var all = steps(), n = 0, tot = 0, ch = 0;
    all.forEach(function(s){
      s.inputs.forEach(function(i){
        tot++;
        var v = (state.formData[i.key] || '').trim();
        if(v) n++;
        ch += v.length;
      });
    });
    var bad = state.lastTips ? (state.lastTips.unverified || 0) : 0;
    // 🔴 대리 편집 중임을 어느 화면에서든 계속 보인다.
    //    이 표시가 없으면 관리자가 자기 원고를 쓰는 줄 알고 남의 기업 자리에 저장한다.
    //    메타 스트립은 잉크(어두운) 배경이므로 색을 명시한다 — 안 그러면 밝은 박스에 밝은 글씨가 된다.
    var edit = (admin && admin.editing)
      ? '<div class="m" style="background:var(--pb-warn-bg);border-color:var(--pb-warn-line);' +
        'color:var(--pb-warn-deep)">대리 편집 중' +
        '<b style="color:var(--pb-warn-deep)">' + esc(admin.editing.company) + '</b>' +
        '<button class="pb-hbtn" id="mtClose" style="margin-left:10px;color:var(--pb-warn-deep);' +
        'border-color:var(--pb-warn-line)">닫기</button></div>'
      : '';
    $('pbMeta').innerHTML = edit +
      '<div class="m">작성 필드<b>' + n + ' / ' + tot + '</b></div>' +
      '<div class="m">분량<b>' + ch.toLocaleString() + '자</b></div>' +
      '<div class="m">직전 감수<b>' + (state.lastAudit ? '완료' : '—') + '</b></div>' +
      '<div class="m' + (bad ? ' warn' : '') + '">근거 미확인<b>' + bad + '건</b></div>' +
      '<div class="sp"></div>' +
      '<div class="note">자동저장 켜짐 · 단계 이동마다</div>';
    if($('mtClose')) $('mtClose').onclick = adminCloseIR;
  }

  // ── 좌: 목차 ──
  function renderLeft(){
    var got = 0;
    IR_STEPS.forEach(function(s){ if(stepFilled(s)) got += stepPts(s); });

    var h = '<h4>IR 6 STEPS<em>' + got + ' / 60</em></h4>';
    IR_STEPS.forEach(function(s, i){ h += navRow(s, i); });

    if(llm.tipsMode){
      h += '<div class="pb-hr"></div><h4>TIPS 3 STEPS<em style="color:var(--pb-accent-ink)">+30</em></h4>';
      TIPS_STEPS.forEach(function(s, i){ h += navRow(s, IR_STEPS.length + i); });
    }
    h += '<div class="pb-hr"></div>' +
         '<p class="fine">운영사 지원계획 10점은 추천 운영사가 작성합니다. 이 도구에서는 채울 수 없습니다.</p>';
    if(!llm.tipsMode){
      h += '<p class="fine" style="margin-top:12px;color:var(--pb-warn-deep)">' +
           'IR 6단계만으로는 60점 컷에 구조적으로 닿지 않습니다. 채점 범위를 90점으로 넓히려면 TIPS 준비 모드를 켜십시오.</p>';
    }
    h += '<div class="sp"></div>' +
         '<button class="pb-cta" id="btnResult">결과 보기</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="btnDeckGo">피칭 덱 만들기</button>';

    $('pbLeft').innerHTML = h;
    $('btnResult').onclick  = goResult;
    $('btnDeckGo').onclick  = goDeck;
    Array.prototype.forEach.call($('pbLeft').querySelectorAll('.pb-nav'), function(b){
      b.onclick = function(){ state.stepIndex = +b.dataset.i; render(); };
    });
  }
  function navRow(s, i){
    var on = i === state.stepIndex, done = stepFilled(s);
    var risk = s.id === 'rnd_kpi';                       // 탈락이 가장 많은 단계
    var cls = 'pb-nav' + (on ? ' is-on' : (done ? '' : ' is-todo')) + (risk && !on ? ' is-risk' : '');
    var right = on   ? '<span class="pt">' + stepPts(s) + '</span>'
              : risk ? '<span class="pt">탈락 최다</span>'
              : done ? '<span class="ok">✓</span>' : '';
    return '<button class="' + cls + '" data-i="' + i + '">' + esc(shortTitle(s)) + right + '</button>';
  }

  // ── 중앙 ──
  function renderCenter(){
    $('pbCenter').style.padding = '';        // 덱 화면이 0으로 바꿔놓은 것을 되돌린다
    var all = steps(), h = '';
    all.forEach(function(s, i){
      if(i === state.stepIndex){ h += openStep(s, i, all.length); return; }
      var prev = '';
      for(var k = 0; k < s.inputs.length && !prev; k++) prev = (state.formData[s.inputs[k].key] || '').trim();
      h += '<button class="pb-row' + (prev ? '' : ' is-empty') + '" data-i="' + i + '">' +
             '<span class="t">' + stepNo(i) + ' ' + esc(shortTitle(s)) + '</span>' +
             '<span class="p">' + (prev ? esc(prev) : '비어 있습니다 — 초안 자동생성은 제공하지 않습니다') + '</span>' +
             '<span class="n"><span>' + stepChars(s) + '자</span>' +
               (stepFilled(s) ? '<span class="ok">✓</span>' : '') + '</span>' +
           '</button>';
    });
    $('pbCenter').innerHTML = h;

    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-row'), function(b){
      b.onclick = function(){ state.stepIndex = +b.dataset.i; render(); };
    });
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('textarea'), function(ta){
      ta.oninput = function(){
        state.formData[ta.dataset.k] = ta.value;
        ta.parentNode.querySelector('.pb-cnt').textContent = ta.value.length + '자';
        saveLocal();
        renderMeta();
        renderRightSoon();      // 코치 열도 따라와야 한다 — 안 그러면 탭을 옮길 때까지 낡은 판단이 최신인 양 보인다
      };
    });
    if($('btnPrev')) $('btnPrev').onclick = function(){ move(-1); };
    if($('btnNext')) $('btnNext').onclick = function(){ move(1); };
  }
  function openStep(s, i, total){
    var h = '<div class="pb-open">' +
      '<div class="step-no">STEP ' + stepNo(i) + ' / ' + total + '</div>' +
      '<h2>' + esc(s.title.replace(/^\s*\d+\.\s*/, '')) + '</h2>' +
      '<p class="sub">' + esc(s.subtitle) + '</p>';
    s.inputs.forEach(function(f){
      var v = state.formData[f.key] || '';
      h += '<div class="pb-field">' +
             '<label>' + esc(f.label) + '<span class="key">' + esc(f.key) + '</span></label>' +
             '<textarea data-k="' + esc(f.key) + '" placeholder="' + esc(f.placeholder || '') + '">' + esc(v) + '</textarea>' +
             '<div class="pb-cnt">' + v.length + '자</div>' +
           '</div>';
    });
    // 마지막 단계에서는 버튼이 무엇을 하는지 라벨로 밝힌다
    var isLast = (i === total - 1);
    h += '<div class="pb-steps-btn">' +
           '<button class="pb-cta sub" id="btnPrev" style="width:auto;padding:11px 20px">← 이전</button>' +
           '<button class="pb-cta" id="btnNext" style="width:auto;padding:11px 20px">' +
             (isLast ? '결과 보기 →' : '다음 →') + '</button>' +
         '</div></div>';
    return h;
  }
  function move(d){
    var n = steps().length;
    // ★마지막 단계에서 [다음]은 '결과 보기'다.
    //   전에는 인덱스를 잘라내기만 해 **눌러도 아무 일이 없었다** — 고장으로 보인다.
    //   마지막이 어디인지는 모드가 정한다: TIPS 꺼짐 = 6 팀·Ask / 켜짐 = 9 글로벌.
    if(d > 0 && state.stepIndex >= n - 1){
      syncToServer();
      goResult();
      return;
    }
    state.stepIndex = Math.max(0, Math.min(n - 1, state.stepIndex + d));
    // ★단계를 넘길 때마다 서버에 올린다.
    //   수동 버튼뿐이던 시절, 캐시 삭제나 PC 변경이 곧 전량 소실이었다.
    syncToServer();
    render();
    window.scrollTo(0, 0);
  }

  // ── 우: 코치 열 ── (2026-07-30 재편 · grilling 13문답)
  //   순서 = **쓰기 전 → 쓴 뒤**. 가이드가 맨 앞인 이유다 —
  //   가이드는 '무엇을 써야 하는가'이고 나머지는 '쓴 것에 대한 평'이다.
  //   ~~"멘토가 맨 앞" 원칙은 폐기했다(민부장 지시 2026-07-30).~~
  //
  //   가이드 = D5 IR 학습자료 지식체계 문항(①) + B6 전문 관점(②·다음 단계)
  //            + B1 신청서 재료(③) + 내 배분(④)
  //   멘토   = LAGMP 멘토링 종합(stage1) + 관리자 단계 코멘트
  //   IR고도화 = LAGMP stage2·stage3. **의견이 하나도 없으면 탭을 만들지 않는다.**
  //   ~~상장사 대조군~~ = 삭제(민부장 지시). '내 배분'만 가이드로 옮겨 살렸다.
  var TABS_BASE = ['가이드', '멘토', 'AI 진단'];
  function hasB2(){ return !!(b2.enabled && b2.synth && b2.synth.length); }
  function tabs(){ return hasB2() ? TABS_BASE.concat(['IR 고도화']) : TABS_BASE; }

  //  🔴 어느 탭이든 "여기 내용은 의견일 뿐"임을 밝힌다(민부장 지시).
  //     시스템은 판정자가 아니라 쟁점 제기자다 — 산학협력단 운영지원 AI와 같은 사상.
  var DISCLAIMER =
    '<p class="pb-disclaim">여기 내용은 <b>의견일 뿐이며 참고 자료로 활용</b>하십시오. ' +
    '판정이 아닙니다 — 최종 판단과 책임은 작성자에게 있습니다.</p>';

  function renderRight(){
    var s = steps()[state.stepIndex];
    var hasMentor = !!(mentor.comments[s.id] || '').trim();
    var TABS = tabs();
    // 탭이 사라지면(의견 소멸·계정 전환) 사라진 탭에 머물러 빈 화면이 남는다
    if(state.tab >= TABS.length) state.tab = 0;

    var h = '<div class="pb-tabs">';
    TABS.forEach(function(t, i){
      h += '<button class="pb-tab' + (i === state.tab ? ' is-on' : '') + '" data-t="' + i + '">' +
           esc(t) + (i === 1 && hasMentor ? '<span class="badge"></span>' : '') + '</button>';
    });
    h += '</div><div class="pb-panel">';

    if(state.tab === 0){
      // ── 가이드 ── ①문항 ②전문 관점 ③신청서 재료 ④내 배분
      h += guideBlock(s);
      h += b1RefBlock(s);
      h += mineBlock(s);
    } else if(state.tab === 1){
      // ── 멘토 ── 성장관리 멘토링 종합(위) + 이 단계 코멘트(아래)
      h += b2Block(1, '성장관리 멘토링 의견');
      if(hasMentor){
        // ★코멘트를 받은 뒤 고쳤는지는 서버가 알려주지 않는다(코멘트에 시각이 없다).
        //   그래서 코멘트를 처음 본 시점의 원고를 기준선으로 잡아 둔다.
        var mb = mentorBaseline(s, mentor.comments[s.id]);
        var mStale = mb.ih !== stepHash(s);
        h += '<div class="pb-mentor"><h5>이 단계 코멘트</h5><p>' + esc(mentor.comments[s.id]) + '</p>' +
             (mentor.who ? '<p class="by">' + esc(mentor.who) + '</p>' : '') + '</div>';
        if(mStale){
          // ★코멘트를 흐리지 않는다 — 사람 의견은 원고가 바뀌어도 유효할 수 있다.
          //   바뀌었다는 사실만 알린다. 판단은 사람이 한다.
          h += '<div class="pb-stalebar"><b>이 코멘트를 받은 뒤 이 단계를 고치셨습니다.</b>' +
               '<p>지적이 반영됐는지 다시 확인하십시오. 멘토는 아직 고친 원고를 보지 못했습니다.</p></div>';
        }
      } else {
        h += '<h5>이 단계 코멘트</h5><p>이 단계에 남겨진 코멘트가 없습니다.</p>';
      }
    } else if(state.tab === 2){
      var dg = state.diags[s.id];
      var dStale = !!dg && dg.hash !== stepHash(s);
      h += '<h5>AI 진단</h5>' +
           '<p>이 단계를 진단하면 심사역 관점의 지적과 개선 문장을 제안합니다. ' +
           '근거가 필요한 자리는 <b>[__]</b>로 비워 둡니다 — 없는 수치를 만들어 넣지 않기 위해서입니다.</p>';
      if(dStale){
        h += '<div class="pb-stalebar"><b>이 진단은 고치기 전 문장에 대한 것입니다.</b>' +
             '<p>' + (dg.at ? esc(String(dg.at).slice(0,16).replace('T',' ')) + ' 진단 이후 ' : '') +
             '이 단계를 고치셨습니다. 지금 원고에 대한 판단이 필요하면 다시 진단하십시오.</p></div>';
      }
      h += '<button class="pb-inkbtn" id="btnAI">' + (dg ? '다시 진단' : '이 단계 진단받기') + '</button>' +
           '<div id="pbDiag" class="pb-diag' + (dStale ? ' pb-stale' : '') + '"></div>';
    } else {
      // ── IR 고도화 ── LAGMP stage2(고도화) + stage3(평가)
      h += b2Block(2, 'IR 고도화 의견') + b2Block(3, 'IR 평가 의견');
    }
    h += DISCLAIMER + '</div>';
    $('pbRight').innerHTML = h;

    Array.prototype.forEach.call($('pbRight').querySelectorAll('.pb-tab'), function(b){
      b.onclick = function(){ state.tab = +b.dataset.t; renderRight(); };
    });
    if($('btnAI')){
      $('btnAI').onclick = runDiag;
      if(state.diags[s.id]) renderDiagInto(state.diags[s.id].data);
    }
    if($('btnB1Ref')) $('btnB1Ref').onclick = reloadB1Ref;
    bindGuideToggles();
  }

  // ★타자 한 자마다 오른쪽을 다시 그리면 깜박이고 무겁다. 손을 멈추면 따라온다.
  //   코치 열은 #pbRight이고 입력란은 #pbCenter이므로 다시 그려도 포커스를 빼앗지 않는다.
  var rightTimer = null;
  function renderRightSoon(){
    clearTimeout(rightTimer);
    rightTimer = setTimeout(function(){ if(state.view === 'write') renderRight(); }, 600);
  }

  // ══ B2 성장관리 종합의견 (P4) ═════════════════════════════════
  //  멘토 탭 **안** 2단이다. 탭을 늘리지 않는 이유 — 둘 다 사람 의견이고,
  //  탭이 다섯이 되면 "사람 먼저 읽는다"는 순서가 흐려진다.
  //  ★확정본만 온다. 초안은 LAGMP가 전달 게이트로 막는다(우리가 거르는 게 아니다).
  var B2_STAGE = { 1:'멘토링 종합', 2:'IR 고도화 종합', 3:'IR 평가 종합' };

  // 이 의견을 받은 뒤 원고를 고쳤는가.
  //  ★LAGMP는 '확정 시점의 원고'를 모른다 — 그래서 확정일자로 판정하지 않는다.
  //    멘토 코멘트와 같이 **처음 본 시점**을 기준선으로 잡는다.
  //    단계별이 아니라 IR 전체에 대한 의견이므로 stepHash가 아니라 irHash를 쓴다.
  function b2Baseline(){
