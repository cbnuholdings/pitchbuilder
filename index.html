<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<title>PitchBuilder — 2026 이노테크 창업 IR 작성 도구</title>
<style>
/* ══════════════════════════════════════════════════════════════
   PitchBuilder v2 — 원페이지
   디자인 근거: 작성 마법사 화면 와이어프레임\handoff\
     · README_디자인_핸드오프.md (레이아웃·상태·카피 톤)
     · tokens.css (색·글자체·형태)  ★값 하드코딩 금지, 변수를 쓴다
   기능 근거: 설계정본_v1.md

   디자인 판단 3개가 코드 구조와 맞물린다.
   1. 작성 화면에 점수를 두지 않는다 — 채점기가 아니라 작성 도구다.
   2. 작성 영역은 종이, 판단 영역은 잉크 — 내 원고와 남의 의견을 재질로 가른다.
   3. 경고는 지우지 않고 문장 위에 남긴다 — 자동 삭제 없음.
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 재디자인 2026-08-20 — 다크 사이드바 · 코발트 · 크림 (정본 = PitchBuilder 재디자인.dc.html 턴2) */
  --pb-ink:        #0E1116;
  --pb-navy:       #1B4BF0;
  --pb-accent:     #6C8CFF;
  --pb-accent-ink: #1B4BF0;
  --pb-accent-soft:#DFE6FD;
  --pb-paper:      #E9E7E1;
  --pb-paper-deep: #DEDBD3;
  --pb-surface:    #F4F3EF;
  --pb-line:       #D6D2C9;
  --pb-line-soft:  #E2DFD8;
  --pb-line-input: #C3BFB4;
  --pb-text:       #0E1116;
  --pb-text-body:  #23272E;
  --pb-text-mute:  #565B64;
  --pb-text-faint: #7A7F88;
  --pb-text-ghost: #9BA0A8;
  --pb-ok:         #1E6B4F;
  --pb-ok-on-ink:  #7FC9A4;
  --pb-warn:       #B3261E;
  --pb-warn-deep:  #932019;
  --pb-warn-bg:    #FAEEEC;
  --pb-warn-line:  #E9C7C2;
  --pb-warn-on-ink:#FF8A80;
  --pb-warn-txt-on-ink:#F5C1BB;

  --pb-on-ink-1: rgba(244,243,239,.92);
  --pb-on-ink-2: rgba(244,243,239,.78);
  --pb-on-ink-3: rgba(244,243,239,.58);
  --pb-on-ink-4: rgba(244,243,239,.46);
  --pb-on-ink-line:  rgba(244,243,239,.14);
  --pb-on-ink-line2: rgba(244,243,239,.30);

  /* 글꼴 — 디자인 파일 그대로(Q2 확정): 본문 Noto Sans KR · 표제/숫자 Archivo · 라벨 IBM Plex Mono */
  --pb-font-serif: 'Archivo','Noto Sans KR',system-ui,'Malgun Gothic',sans-serif;
  --pb-font-sans:  'Noto Sans KR','Archivo',system-ui,'Malgun Gothic',sans-serif;
  --pb-font-mono:  'IBM Plex Mono',ui-monospace,Consolas,'D2Coding',monospace;

  --pb-radius: 8px;
  --pb-radius-card: 12px;
  --pb-col-left: 264px;
  --pb-col-right: 352px;
  --pb-col-right-collapsed: 48px;
  --pb-shadow-card: 0 6px 24px rgba(14,17,22,.08);
  --pb-shadow-slide: 0 10px 30px rgba(14,17,22,.10);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--pb-paper);
  color:var(--pb-text-body);
  font:400 16px/1.65 var(--pb-font-sans);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
.hidden{display:none !important}
.mono{font-family:var(--pb-font-mono);font-weight:500;letter-spacing:.12em}
.serif{font-family:var(--pb-font-serif)}

/* ── 헤더 (잉크) ───────────────────────────── */
.pb-head{
  display:flex;align-items:center;gap:18px;
  padding:14px 26px;background:var(--pb-ink);
  position:sticky;top:0;z-index:50;
}
.pb-brand{display:flex;align-items:baseline;gap:9px;cursor:pointer;user-select:none}
.pb-brand:hover b{color:var(--pb-accent)}
.pb-brand b{font:600 20px/1 var(--pb-font-serif);color:var(--pb-paper)}
.pb-brand span{font:500 11px/1 var(--pb-font-mono);letter-spacing:.14em;color:var(--pb-accent)}
.pb-who{
  padding-left:18px;border-left:1px solid rgba(243,247,252,.18);
  font-size:14px;color:var(--pb-on-ink-2);
}
.pb-head .sp{flex:1}
.pb-toggle{
  display:flex;align-items:center;gap:9px;padding:6px 13px;
  border:1px solid rgba(127,160,196,.55);border-radius:var(--pb-radius);
  font-size:13px;font-weight:500;color:var(--pb-accent-soft);
}
.pb-toggle .sw{
  display:inline-block;width:30px;height:16px;background:rgba(243,247,252,.24);
  border-radius:999px;position:relative;transition:background .15s;
}
.pb-toggle .sw::after{
  content:'';position:absolute;left:2px;top:2px;width:12px;height:12px;
  background:var(--pb-paper);border-radius:50%;transition:transform .15s,background .15s;
}
/* R&D 대응 토글 — 켜졌을 때 강조. 지금이 8단계 상태임을
   한눈에 알아야 한다. 꺼진 모습은 기존 그대로 둔다(평상 상태를 요란하게 만들지 않는다). */
/* 신청기업 명부 — 검색 + 목록에서 고르기 */
.pb-apq{
  width:100%;padding:10px 13px;border:1px solid var(--pb-line);border-radius:var(--pb-radius);
  font:400 15px var(--pb-font-sans);background:var(--pb-paper);color:var(--pb-ink);
}
.pb-apq:focus{outline:none;border-color:var(--pb-accent-ink)}
.pb-aplist{margin-top:10px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.pb-aprow{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:9px 12px;border:1px solid var(--pb-line);border-radius:var(--pb-radius);
  background:var(--pb-paper);cursor:pointer;font:400 14px var(--pb-font-sans);color:var(--pb-ink);
}
.pb-aprow:hover{border-color:var(--pb-accent-ink);background:var(--pb-paper-2,#FAF8F5)}
.pb-aprow b{font-weight:600;flex:1}
.pb-aprow span{font:500 12px var(--pb-font-mono);color:var(--pb-ink-3)}
.pb-aprow em{font-style:normal;font-size:12px;color:var(--pb-ink-3);min-width:64px;text-align:right}

/* 🔴 어느 탭이든 "의견일 뿐"임을 밝힌다 — 시스템은 판정자가 아니라 쟁점 제기자다 */
.pb-disclaim{
  margin-top:18px;padding-top:12px;border-top:1px solid rgba(243,247,252,.14);
  font-size:12.5px;line-height:1.65;color:var(--pb-warn-txt-on-ink);
}

/* 가이드 ① — D5 문항 */
.pb-qitem{
  margin-top:14px;padding:12px 13px;border:1px solid rgba(243,247,252,.13);
  border-radius:var(--pb-radius);background:rgba(243,247,252,.03);
}
.pb-qitem .q{font-size:14px;line-height:1.65;color:var(--pb-paper);font-weight:500}
.pb-qitem .q .n{
  display:inline-block;min-width:17px;height:17px;margin-right:7px;border-radius:50%;
  background:var(--pb-accent);color:var(--pb-ink);text-align:center;
  font:600 11px/17px var(--pb-font-mono);
}
.pb-qitem .q .soft{
  display:inline-block;margin-left:7px;padding:1px 6px;border-radius:3px;
  background:var(--pb-warn-bg);color:var(--pb-warn-deep);
  font:500 11px var(--pb-font-mono);vertical-align:middle;
}
.pb-qitem .why{margin-top:7px;font-size:13px;line-height:1.7;color:var(--pb-on-ink-2)}
.pb-qitem .ev{margin-top:8px;font-size:12.5px;line-height:1.6;color:var(--pb-accent-soft)}
.pb-qitem .good{
  margin-top:8px;padding:8px 10px;border-left:2px solid var(--pb-accent);
  font-size:12.5px;line-height:1.65;color:var(--pb-on-ink-2);
}
.pb-qitem .ind{margin-top:7px;font-size:12px;line-height:1.6;color:var(--pb-on-ink-3);font-style:italic}
.pb-qitem .src{margin-top:8px;font:400 11px var(--pb-font-mono);color:var(--pb-on-ink-4)}
.pb-qmore{
  margin-top:9px;padding:5px 11px;border:1px solid rgba(243,247,252,.28);
  border-radius:var(--pb-radius);background:transparent;color:var(--pb-accent-soft);
  font-size:12.5px;cursor:pointer;
}
.pb-qmore:hover{border-color:var(--pb-accent);color:var(--pb-paper)}
.pb-rx{
  margin-top:9px;padding:10px 12px;border-radius:var(--pb-radius);
  background:rgba(243,247,252,.06);font-size:13px;line-height:1.75;color:var(--pb-on-ink-2);
}
.pb-rx p + p{margin-top:7px}

.pb-toggle.on{border-color:var(--pb-accent);color:var(--pb-accent)}
.pb-toggle.on .sw{background:var(--pb-accent-ink)}
.pb-toggle.on .sw::after{transform:translateX(14px);background:var(--pb-paper)}

/* 저장 상태칩 — 실패는 자동으로 사라지지 않는다 */
.pb-chip{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--pb-ok-on-ink)}
.pb-chip .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pb-chip.is-fail{
  background:var(--pb-warn);color:#fff;padding:6px 12px;border-radius:var(--pb-radius);
}
.pb-chip.is-fail .dot{background:#fff}
.pb-chip .retry{margin-left:6px;text-decoration:underline;font-size:12px}

.pb-hbtn{
  padding:7px 14px;border:1px solid rgba(243,247,252,.28);
  border-radius:var(--pb-radius);font-size:13px;font-weight:500;color:var(--pb-paper);
}
.pb-hbtn:hover{background:rgba(243,247,252,.08)}
.pb-hbtn.ghost{border-color:transparent;color:var(--pb-on-ink-3);font-weight:400}
.pb-hbtn.ghost:hover{color:var(--pb-paper)}
/* 사용 안내(PDF) — 헤더 왼쪽, 로고 옆. <a>라서 밑줄과 기본 링크색을 지운다. */
a.pb-hbtn{text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
a.pb-hbtn svg{width:14px;height:14px;flex:none;opacity:.85}

/* ── 메타 스트립 (네이비) ───────────────────── */
.pb-meta{
  display:flex;align-items:center;padding:0 26px;
  background:#171B22;border-bottom:1px solid var(--pb-on-ink-line);
}
.pb-meta .m{
  display:flex;align-items:baseline;gap:7px;padding:9px 16px;
  border-left:1px solid rgba(243,247,252,.14);
  font-size:12px;color:var(--pb-on-ink-3);
}
.pb-meta .m:first-child{padding-left:0;border-left:none}
.pb-meta .m b{font:500 13px var(--pb-font-mono);color:var(--pb-paper)}
.pb-meta .m.warn b{color:var(--pb-warn-txt-on-ink)}
.pb-meta .sp{flex:1}
.pb-meta .note{padding:9px 0;font-size:12px;color:var(--pb-on-ink-4)}

/* ── 3열 셸 ─────────────────────────────────── */
.pb-shell{
  display:grid;
  grid-template-columns:var(--pb-col-left) 1fr var(--pb-col-right);
  min-height:calc(100vh - 96px);
  background:var(--pb-paper);
}
.pb-shell.is-collapsed{grid-template-columns:var(--pb-col-left) 1fr var(--pb-col-right-collapsed)}
.pb-shell.no-left{grid-template-columns:1fr var(--pb-col-right)}
.pb-center{min-width:0}   /* 표의 min-content가 우측 열을 밀어내는 사고를 막는다 */

/* 좌: 목차 */
.pb-left{
  border-right:1px solid var(--pb-line);padding:24px 20px;
  display:flex;flex-direction:column;gap:3px;
}
.pb-left h4{
  display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;
  font:500 11px/1 var(--pb-font-mono);letter-spacing:.15em;color:var(--pb-text-faint);
}
.pb-left h4 em{font:400 12px var(--pb-font-sans);font-style:normal;color:var(--pb-text-ghost)}
.pb-nav{
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:9px 11px;border-radius:var(--pb-radius);
  font-size:15px;color:var(--pb-text-body);text-align:left;width:100%;
}
.pb-nav:hover{background:var(--pb-line-soft)}
.pb-nav.is-on{background:var(--pb-ink);color:var(--pb-paper);font-weight:500}
.pb-nav.is-on .pt{font:500 12px var(--pb-font-mono);color:var(--pb-accent)}
.pb-nav.is-todo{color:var(--pb-text-ghost)}
.pb-nav .ok{color:var(--pb-ok)}
.pb-hr{height:1px;background:var(--pb-line);margin:16px 0}
.pb-left .fine{font-size:13px;line-height:1.6;color:var(--pb-text-faint)}
.pb-left .sp{flex:1}
.pb-cta{
  padding:12px;background:var(--pb-navy);border-radius:var(--pb-radius);
  font-size:14px;font-weight:500;color:var(--pb-paper);text-align:center;width:100%;
}
.pb-cta:hover{background:var(--pb-ink)}
.pb-cta.sub{background:transparent;color:var(--pb-text-mute);border:1px solid var(--pb-line)}
.pb-cta.sub:hover{background:var(--pb-line-soft);color:var(--pb-text-body)}
/* ★투자논리 진단 = 붉은 계열 (2026-08-22 민부장 지시).
   덱으로 넘어가기 전에 반드시 지나야 하는 관문이라 색으로 구분한다 —
   파란 CTA 사이에 섞여 있으면 「지나가도 되는 것」으로 읽힌다. */
.pb-cta.warn{background:var(--pb-warn);color:#fff;border:1px solid var(--pb-warn-deep)}
.pb-cta.warn:hover{background:var(--pb-warn-deep)}
.pb-cta.warn:disabled{background:var(--pb-warn-bg);color:var(--pb-warn-deep);border-color:var(--pb-warn-line);cursor:default}
/* 관문을 아직 못 지난 버튼 — 눌리지 않는다는 것이 보여야 한다 */
.pb-cta:disabled{background:var(--pb-line-soft);color:var(--pb-text-mute);cursor:default}
.pb-cta.sub:disabled{background:transparent;color:var(--pb-text-mute);opacity:.55;cursor:default}
/* 결과 화면 3관문 — 카드 머리에 붙는 번호 */
.pb-gateno{
  display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  margin-right:8px;border-radius:50%;background:var(--pb-navy);color:#fff;
  font:600 12px var(--pb-font-mono);vertical-align:2px;
}
.pb-gateno.is-done{background:var(--pb-ok,#1E7A46)}
.pb-gateno.is-warn{background:var(--pb-warn)}

/* 중앙: 종이 */
.pb-center{padding:18px 24px;display:flex;flex-direction:column;gap:6px}

/* 접힌 단계 행 — 단계명 · 미리보기 · 글자수 3열 */
.pb-row{
  display:grid;grid-template-columns:150px 1fr 128px;align-items:center;gap:14px;
  padding:9px 14px;background:var(--pb-surface);
  border:1px solid var(--pb-line-soft);border-radius:var(--pb-radius);
  text-align:left;width:100%;
}
.pb-row:hover{border-color:var(--pb-line-input)}
.pb-row .t{font-size:14px;font-weight:500;color:var(--pb-text-body)}
.pb-row .p{
  font-size:13px;color:var(--pb-text-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pb-row .n{
  display:flex;justify-content:flex-end;gap:9px;
  font:400 12px var(--pb-font-mono);color:var(--pb-text-ghost);
}
.pb-row .n .ok{color:var(--pb-ok)}
.pb-row.is-empty .p{color:var(--pb-text-ghost);font-style:italic}

/* 펼친 단계 — 질문 + 입력 */
.pb-open{
  background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card);padding:26px 28px;box-shadow:var(--pb-shadow-card);
}
.pb-open .step-no{
  font:500 11px var(--pb-font-mono);letter-spacing:.15em;color:var(--pb-text-faint);
}
.pb-open h2{
  margin-top:8px;font:600 30px/1.25 var(--pb-font-serif);color:var(--pb-text);
}
.pb-open .sub{margin-top:8px;font-size:15px;color:var(--pb-text-mute)}
.pb-field{margin-top:24px}
.pb-field label{
  display:flex;justify-content:space-between;align-items:baseline;
  font-size:17px;font-weight:600;color:var(--pb-text);margin-bottom:8px;
}
.pb-field label .key{font:500 11px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-text-ghost)}
.pb-field textarea{
  width:100%;min-height:104px;resize:vertical;
  padding:14px 15px;background:var(--pb-paper);
  border:1px solid var(--pb-line-input);border-radius:var(--pb-radius);
  font-size:16px;line-height:1.7;color:var(--pb-text-body);
}
.pb-field textarea:focus{outline:none;border-color:var(--pb-accent-ink);background:var(--pb-surface)}
.pb-field textarea::placeholder{color:var(--pb-text-ghost)}
.pb-cnt{margin-top:6px;text-align:right;font:400 12px var(--pb-font-mono);color:var(--pb-text-ghost)}
.pb-steps-btn{display:flex;justify-content:space-between;gap:10px;margin-top:26px}

/* 우: 잉크 판단 열 */
.pb-right{background:var(--pb-ink);color:var(--pb-on-ink-1);display:flex;flex-direction:column}
.pb-right.is-collapsed{align-items:center;padding:18px 0}
.pb-rail{
  writing-mode:vertical-rl;font:500 11px var(--pb-font-mono);letter-spacing:.2em;
  color:var(--pb-on-ink-3);padding-top:8px;
}
.pb-tabs{display:flex;border-bottom:1px solid var(--pb-on-ink-line)}
.pb-tab{
  flex:1;padding:12px 6px;font-size:12px;color:var(--pb-on-ink-3);
  border-bottom:2px solid transparent;position:relative;
}
.pb-tab.is-on{color:var(--pb-paper);border-bottom-color:var(--pb-accent)}
.pb-tab .badge{
  position:absolute;top:7px;right:7px;width:5px;height:5px;
  border-radius:50%;background:var(--pb-accent);
}
.pb-panel{padding:18px 20px;overflow-y:auto;flex:1}
.pb-panel h5{
  font:500 11px var(--pb-font-mono);letter-spacing:.15em;
  color:var(--pb-on-ink-3);margin-bottom:10px;
}
.pb-panel p{font-size:14px;line-height:1.7;color:var(--pb-on-ink-2)}
.pb-panel ul{list-style:none;display:flex;flex-direction:column;gap:10px;margin-top:4px}
.pb-panel li{display:flex;gap:9px;font-size:14px;line-height:1.7;color:var(--pb-on-ink-2)}
.pb-panel li::before{
  content:'';flex-shrink:0;width:5px;height:5px;margin-top:8px;
  border-radius:50%;background:var(--pb-accent);
}
.pb-corpus{
  margin-top:18px;padding:13px 14px;
  border:1px solid var(--pb-on-ink-line2);border-radius:var(--pb-radius);
}
.pb-corpus h5{color:var(--pb-accent-soft)}
.pb-corpus p{font-size:13.5px;color:var(--pb-on-ink-2)}
.pb-corpus b{color:var(--pb-paper)}
.pb-mentor{
  margin:-18px -20px 18px;padding:16px 20px;
  background:#171B22;border-bottom:1px solid var(--pb-on-ink-line);
}
.pb-mentor h5{color:var(--pb-accent-soft)}
.pb-mentor p{font-size:14px;color:var(--pb-on-ink-1)}
.pb-mentor .by{margin-top:8px;font-size:12px;color:var(--pb-on-ink-3)}

.pb-inkbtn{
  width:100%;padding:11px;background:var(--pb-accent);color:var(--pb-ink);
  border-radius:var(--pb-radius);font-size:14px;font-weight:600;margin-top:16px;
}
.pb-inkbtn:hover{background:var(--pb-accent-soft)}
.pb-inkbtn:disabled{background:var(--pb-on-ink-line2);color:var(--pb-on-ink-3);cursor:default}
.pb-inkbtn.ghost{background:transparent;border:1px solid var(--pb-on-ink-line2);color:var(--pb-on-ink-2)}

/* 진단 결과 */
.pb-diag{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.pb-issue{
  padding:12px 13px;border-left:2px solid var(--pb-accent);
  background:rgba(243,247,252,.05);border-radius:0 var(--pb-radius) var(--pb-radius) 0;
}
.pb-issue.sev-high{border-left-color:var(--pb-warn-on-ink)}
.pb-issue .f{font:500 11px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-on-ink-3)}
.pb-issue .q{margin-top:6px;font-size:14px;color:var(--pb-paper)}
.pb-issue .w{margin-top:5px;font-size:13px;color:var(--pb-on-ink-3)}
.pb-rw{
  margin-top:10px;padding:12px 13px;background:rgba(127,160,196,.12);
  border:1px solid rgba(127,160,196,.3);border-radius:var(--pb-radius);
}
.pb-rw p{font-size:14px;color:var(--pb-paper)}
.pb-rw button{
  margin-top:9px;padding:6px 11px;border:1px solid var(--pb-accent);
  border-radius:var(--pb-radius);font-size:12px;font-weight:600;color:var(--pb-accent-soft);
}

/* 낡음 표시 ─ 판단은 그때의 원고에 대한 것이다.
   원고가 바뀐 뒤에도 옛 판단을 최신인 양 두면 시스템이 거짓말을 하는 것이다.
   지우지는 않는다 — 흐리고 이유를 적는다. 무엇을 보고 받은 판단인지가 정보이기 때문이다. */
.pb-stalebar{
  margin-top:14px;padding:11px 12px;border-radius:var(--pb-radius);
  background:rgba(224,108,96,.12);
  border:1px solid var(--pb-warn-on-ink);
}
.pb-stalebar b{color:var(--pb-paper);font-size:13.5px}
.pb-stalebar p{margin-top:4px;font-size:13px;line-height:1.65;color:var(--pb-on-ink-2)}
.pb-stale{opacity:.42;filter:grayscale(.6)}
.pb-faded{opacity:.5}          /* 종이(원고) 쪽 — 흐리게만 한다. 지우지 않는다 */


/* ── 로그인 ─────────────────────────────────── */
.pb-login{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.pb-login .l{
  background:var(--pb-ink);color:var(--pb-paper);
  padding:64px 56px;display:flex;flex-direction:column;justify-content:center;
}
.pb-login .l h1{font:600 40px/1.25 var(--pb-font-serif)}
.pb-login .l p{margin-top:20px;font-size:16px;line-height:1.8;color:var(--pb-on-ink-2);max-width:38ch}
.pb-login .l .fine{margin-top:32px;font-size:13px;color:var(--pb-on-ink-3);line-height:1.7}
.pb-login .r{
  padding:64px 56px;display:flex;flex-direction:column;justify-content:center;
  background:var(--pb-paper);
}
.pb-login .r h3{font:600 23px var(--pb-font-serif);color:var(--pb-text)}
.pb-in{margin-top:22px}
.pb-in label{display:block;font-size:14px;font-weight:600;margin-bottom:7px;color:var(--pb-text)}
.pb-in input{
  width:100%;padding:12px 14px;background:var(--pb-surface);
  border:1px solid var(--pb-line-input);border-radius:var(--pb-radius);font-size:16px;
}
.pb-in input:focus{outline:none;border-color:var(--pb-accent-ink)}
.pb-in .hint{margin-top:6px;font-size:13px;color:var(--pb-text-faint)}
.pb-solid{
  width:100%;margin-top:26px;padding:13px;background:var(--pb-ink);color:var(--pb-paper);
  border-radius:var(--pb-radius);font-size:16px;font-weight:600;
}
.pb-solid:hover{background:var(--pb-navy)}
.pb-err{
  margin-top:16px;padding:12px 14px;background:var(--pb-warn-bg);
  border:1px solid var(--pb-warn-line);border-radius:var(--pb-radius);
  font-size:14px;color:var(--pb-warn-deep);
}

/* ── 공통 조각 ──────────────────────────────── */
.pb-card{
  background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card);padding:22px 24px;
}
.pb-card + .pb-card{margin-top:14px}
.pb-card h3{font:600 21px var(--pb-font-serif);color:var(--pb-text);margin-bottom:12px}
.pb-tbl{width:100%;border-collapse:collapse;font-size:14px}
.pb-tbl th{
  text-align:left;padding:9px 10px;border-bottom:1px solid var(--pb-line);
  font:500 11px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-text-faint);
}
.pb-tbl td{padding:11px 10px;border-bottom:1px solid var(--pb-line-soft);vertical-align:top}
.pb-tbl tr:last-child td{border-bottom:none}
.pb-warnbox{
  padding:13px 15px;background:var(--pb-warn-bg);border:1px solid var(--pb-warn-line);
  border-radius:var(--pb-radius);font-size:14px;color:var(--pb-warn-deep);line-height:1.7;
}
.pb-note{font-size:13px;color:var(--pb-text-faint);line-height:1.7}

/* 근거 없는 수치 — 지우지 않고 문장 위에 남긴다 */
.pb-badnum{
  border-bottom:2px solid var(--pb-warn);cursor:help;
  background:rgba(158,43,37,.06);
}

/* ── 투자논리 진단(7축) — 주장 원장·연결고리·질문 (2026-08-20) ── */
.pb-ax .pb-axsec{margin-top:20px;padding-top:16px;border-top:1px solid var(--pb-line-soft)}
.pb-ax .pb-axsec h4{font:600 16px var(--pb-font-sans);color:var(--pb-text);margin-bottom:10px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.pb-ax .pb-axsec .lbl{font:600 13.5px var(--pb-font-sans);color:var(--pb-ok);margin-top:10px}
.pb-ax .pb-axsec .lbl.is-fail{color:var(--pb-warn-deep)}
.pb-ax .pb-axsec ul{margin-top:6px;padding-left:18px}
.pb-ax .pb-axsec li{font-size:14.5px;line-height:1.7;color:var(--pb-text-body)}
.pb-axclaim{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-bottom:1px dashed var(--pb-line-soft)}
.pb-axclaim:last-of-type{border-bottom:none}
.pb-axclaim .t{font-size:14.5px;line-height:1.65;color:var(--pb-text-body)}
.pb-axclaim .q,.pb-axclaim .n{grid-column:2;font-size:12.5px;line-height:1.6;color:var(--pb-text-faint)}
.pb-axclaim .q.is-bad{color:var(--pb-warn-deep)}
.pb-axclaim.is-conflict{background:var(--pb-warn-bg);margin:0 -8px;padding:9px 8px;border-radius:var(--pb-radius)}
.pb-axpill{display:inline-block;align-self:start;margin-top:2px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;
  background:var(--pb-line-soft);color:var(--pb-text-mute)}
.pb-axpill.is-plan{background:var(--pb-accent-soft);color:var(--pb-accent-ink)}
.pb-axpill.is-conflict{background:var(--pb-warn);color:#fff}
.pb-axmissing{margin-top:8px;padding:9px 12px;border-left:3px solid var(--pb-line);font-size:13.5px;color:var(--pb-text-mute)}
.pb-axmissing b{font-size:12px;letter-spacing:.08em;color:var(--pb-text-faint)}
.pb-axmissing ul{margin-top:4px;padding-left:16px}
.pb-axedges td{font-size:13.5px;padding:8px 8px}
.pb-axedges td.id{font:500 12px var(--pb-font-mono);color:var(--pb-text-faint);white-space:nowrap}
.pb-axedges td.nm{white-space:nowrap;color:var(--pb-text-body)}
.pb-axedges td.st{font-weight:600;white-space:nowrap}
.pb-axedges tr.is-connected td.st{color:var(--pb-ok)}
.pb-axedges tr.is-partial td.st{color:var(--pb-accent-ink)}
.pb-axedges tr.is-broken td.st{color:var(--pb-warn-deep)}
.pb-axedges tr.is-unknown td.st{color:var(--pb-text-faint)}
.pb-axedges td.why{color:var(--pb-text-mute);line-height:1.6}
.pb-axq{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--pb-line-soft)}
.pb-axq:last-of-type{border-bottom:none}
.pb-axq .p{flex:none;font:700 12px var(--pb-font-mono);padding:3px 8px;border-radius:var(--pb-radius);background:var(--pb-line-soft);color:var(--pb-text-mute)}
.pb-axq.is-p0 .p{background:var(--pb-warn);color:#fff}
.pb-axq.is-p1 .p{background:var(--pb-accent-soft);color:var(--pb-accent-ink)}
.pb-axq .qq{font-size:14.5px;line-height:1.65;color:var(--pb-text-body)}
.pb-axq .ev{font-size:12.5px;color:var(--pb-text-faint);margin-top:2px}

/* ── 결과 화면 ─────────────────────────────── */
.pb-ir{background:var(--pb-surface);border:1px solid var(--pb-line);border-top:6px solid var(--pb-accent-ink);
  border-radius:var(--pb-radius-card);padding:40px 46px}
.pb-ir h1{font:700 34px/1.25 var(--pb-font-sans);color:var(--pb-text);letter-spacing:-.01em}
.pb-ir .lead{margin-top:10px;font-size:19px;color:var(--pb-text-mute);line-height:1.7}
.pb-sec{margin-top:32px;padding-top:26px;border-top:1px solid var(--pb-line-soft)}
.pb-sec:first-of-type{border-top:none}
.pb-sec h3{display:inline-block;padding:5px 10px;border-radius:2px;background:var(--pb-paper-deep);
  font:600 12px/1 var(--pb-font-mono);letter-spacing:.14em;color:var(--pb-accent-ink)}
.pb-sec .fl{margin-top:14px}
.pb-sec .fl b{display:block;font-size:14px;font-weight:600;color:var(--pb-text);margin-bottom:5px}
.pb-sec .fl p{font-size:16px;line-height:1.75;color:var(--pb-text-body);white-space:pre-wrap}
.pb-sec .fl p.void{color:var(--pb-text-ghost);font-style:italic}

/* 도식 카드 */
.pb-fig{margin-top:20px;padding:20px;border:1px solid var(--pb-line-soft);
  border-radius:var(--pb-radius);background:var(--pb-surface);break-inside:avoid}
.pb-fig h4{display:flex;align-items:baseline;gap:9px;font:600 15px var(--pb-font-serif);
  color:var(--pb-text);margin-bottom:14px}
.pb-fig h4 em{font:400 12px var(--pb-font-sans);font-style:normal;color:var(--pb-text-faint)}
.pb-fig svg{width:100%;height:auto;display:block;overflow:visible}

/* 자격 게이트 */
.pb-gate{display:flex;flex-direction:column;gap:2px}
.pb-gate .g{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:center;
  padding:13px 0;border-bottom:1px solid var(--pb-line-soft)}
.pb-gate .g b{font-size:15px;font-weight:600;color:var(--pb-text)}
.pb-gate select{width:100%;padding:9px 11px;background:var(--pb-surface);
  border:1px solid var(--pb-line-input);border-radius:var(--pb-radius);font-size:15px}
.pb-gate .g.is-fail{background:var(--pb-warn-bg)}
.pb-gate .why{grid-column:1/-1;font-size:13.5px;color:var(--pb-warn-deep);line-height:1.6}

/* ── 피칭 덱 ───────────────────────────────── */
/*  2026-08-19 민부장 지시로 전면 재설계 — 「프로그램용 도식 디자인 제작\exports」 도식 라이브러리 v2 규격을 따른다.
    공통 규격: 960×540 · 좌우 여백 56 · 콘텐츠 폭 848 · 킥커 15 / 제목 32 / 소제목 17 / 본문·도형 15 / 캡션 14(하한)
    컬러(코발트 치환 2026-08-20): 포인트 #1B4BF0 · 딥 #10309E · 틴트 #6C8CFF #A9BCFA #D4DEFC #EDF1FE · 구조색 #1F2637 · 본문 #1F2537 · 캡션 #667087 · 중성 박스 #F7F9FC · 라인 #D8DDE8
    깊이 규칙(v2 입체): 일반 카드 0 4px 10px rgba(31,38,55,.10) · 강조 카드 0 5px 14px rgba(47,111,216,.16) — 그라데이션·베벨 없음
    화면에서는 폭에 맞춰 transform:scale(--k) 로 줄여 보이고(레이아웃은 항상 960×540), PDF는 960×540 그대로 찍는다. */
:root{
  --dk-point:#1B4BF0; --dk-deep:#10309E; --dk-t1:#6C8CFF; --dk-t2:#A9BCFA; --dk-t3:#D4DEFC; --dk-t4:#EDF1FE;
  --dk-struct:#1F2637; --dk-text:#1F2537; --dk-cap:#667087; --dk-box:#F7F9FC; --dk-gray:#9AA4B5; --dk-line:#D8DDE8;
  --dk-sh-card:0 4px 10px rgba(31,38,55,.10),0 1px 3px rgba(31,38,55,.07);
  --dk-sh-accent:0 5px 14px rgba(27,75,240,.16),0 1px 3px rgba(27,75,240,.10);
}
.pb-deck{background:var(--pb-paper-deep);padding:22px 24px;display:flex;flex-direction:column;gap:22px}
.pb-slidebox{position:relative;width:100%;height:540px;--k:1}
.pb-slide{
  position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;transform:scale(var(--k));
  background:#fff;color:var(--dk-text);font-family:'Noto Sans KR','Archivo','Malgun Gothic',sans-serif;
  box-shadow:var(--dk-sh-card);padding:36px 56px 30px;display:flex;flex-direction:column;box-sizing:border-box;
}
.pb-slide .sno{
  position:absolute;top:12px;right:16px;
  font:500 11px var(--pb-font-mono);letter-spacing:.14em;color:var(--dk-gray);
}
.pb-slide .sk{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.pb-slide .sk b{font-size:15px;font-weight:700;color:var(--dk-point);letter-spacing:.08em}
.pb-slide .sk span{font-size:14px;color:var(--dk-cap)}
.s-head{
  width:100%;border:none;background:transparent;resize:none;overflow:hidden;
  font-family:inherit;font-weight:700;font-size:32px;line-height:1.15;color:var(--dk-text);padding:2px 4px;margin:6px -4px 0;border-radius:2px;
}
.s-sub{
  width:100%;border:none;background:transparent;resize:none;overflow:hidden;
  margin:10px -4px 0;font-family:inherit;font-weight:400;font-size:17px;line-height:1.5;color:var(--dk-cap);padding:2px 4px;border-radius:2px;
}
.s-body{flex:1;display:flex;flex-direction:column;gap:14px;margin-top:14px;min-height:0}
.s-bullets{list-style:none;display:flex;flex-direction:column;gap:8px}
.s-bullets li{display:flex;align-items:stretch;background:var(--dk-box);border-left:3px solid var(--dk-line);box-shadow:var(--dk-sh-card)}
.s-bullets li:first-child{background:var(--dk-t4);border-left-color:var(--dk-point);box-shadow:var(--dk-sh-accent)}
.s-dot{display:none}
.s-bullet{
  flex:1;border:none;background:transparent;resize:none;overflow:hidden;
  font-family:inherit;font-weight:400;font-size:16px;line-height:1.55;color:var(--dk-text);padding:9px 14px;
}
.s-head:hover,.s-sub:hover,.s-bullet:hover{background:rgba(47,111,216,.06)}
.s-head:focus,.s-sub:focus,.s-bullet:focus{outline:none;background:rgba(47,111,216,.06);box-shadow:inset 0 0 0 1px var(--dk-point)}
.s-fig{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-top:4px}
.s-fig svg{width:100%;height:100%;max-height:100%;display:block;overflow:visible;font-family:inherit}
.s-fig.is-solo{align-items:center}
.s-fig-kind{position:absolute;top:0;left:0;font-size:12px;color:var(--dk-gray)}
.s-fig-regen{
  position:absolute;top:0;right:0;padding:4px 10px;font-size:12px;font-weight:600;
  color:var(--dk-cap);background:#fff;border:1px solid var(--dk-line);border-radius:2px;opacity:0;transition:opacity .15s;
}
.s-fig:hover .s-fig-regen{opacity:1}
.s-fig-regen:hover{color:var(--dk-point);border-color:var(--dk-point)}
.s-fig-none{
  font-size:14px;color:var(--dk-gray);padding:24px;text-align:center;width:100%;
  border:1px dashed var(--dk-line);border-radius:2px;
}
.s-note{display:flex;justify-content:space-between;gap:16px;margin-top:12px;padding-top:9px;border-top:1px solid var(--dk-line);font-size:14px;color:var(--dk-cap)}
.s-note em{font-style:normal;color:var(--dk-gray)}
/* 표지 — 구조색 바탕 + 포인트 띠 */
.pb-slide.is-cover{background:var(--dk-struct);color:#fff;justify-content:center;padding:56px}
.pb-slide.is-cover::before{content:'';position:absolute;left:0;top:0;width:12px;height:100%;background:var(--dk-point)}
.pb-slide.is-cover .sk b{color:var(--dk-t2)}
.pb-slide.is-cover .sk span{color:var(--dk-t3)}
.pb-slide.is-cover .s-head{color:#fff;font-size:44px;line-height:1.2;margin-top:18px}
.pb-slide.is-cover .s-sub{color:var(--dk-t3);font-size:19px;margin-top:14px}
.pb-slide.is-cover .s-head:hover,.pb-slide.is-cover .s-head:focus,
.pb-slide.is-cover .s-sub:hover,.pb-slide.is-cover .s-sub:focus{background:rgba(255,255,255,.08)}
.pb-slide.is-cover .s-note{border-top-color:rgba(255,255,255,.18);color:var(--dk-t3);margin-top:auto}
.pb-slide.is-cover .s-note em{color:var(--dk-t2)}
/* 부록(R&D)·도식 전용 장 */
.pb-slide.is-appx .sk b{color:var(--dk-cap)}
.pb-slide.is-figonly .s-body{margin-top:8px}
/* PDF 내보내기 진행 표시 */
.pb-pdfing{pointer-events:none;opacity:.6}

/* ── 관리자 ────────────────────────────────── */
.pb-kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.pb-kpi .k{padding:16px 18px;background:var(--pb-surface);border:1px solid var(--pb-line);
  border-radius:var(--pb-radius-card)}
.pb-kpi .k b{display:block;font:600 30px/1 var(--pb-font-mono);color:var(--pb-text)}
.pb-kpi .k span{display:block;margin-top:7px;font-size:13px;color:var(--pb-text-mute)}
.pb-atbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--pb-surface)}
.pb-atbl th{text-align:left;padding:11px 12px;background:var(--pb-paper);
  border-bottom:1px solid var(--pb-line);
  font:500 11px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-text-faint);white-space:nowrap}
.pb-atbl td{padding:12px;border-bottom:1px solid var(--pb-line-soft);vertical-align:middle}
.pb-atbl tr{cursor:pointer}
.pb-atbl tr:hover td{background:var(--pb-paper)}
.pb-atbl tr.is-on td{background:var(--pb-ink);color:var(--pb-paper)}
.pb-atbl tr.is-on td .sub{color:var(--pb-on-ink-3)}
.pb-atbl .sub{display:block;margin-top:3px;font-size:12px;color:var(--pb-text-faint)}
.pb-pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}
.pb-pill.on{background:#E4EFE9;color:var(--pb-ok)}
.pb-pill.off{background:var(--pb-line-soft);color:var(--pb-text-faint)}

/* 숫자 대조 (우측 잉크 열) */
.pb-num{padding:11px 0;border-bottom:1px solid var(--pb-on-ink-line);font-size:13.5px}
.pb-num .w{font:600 14px var(--pb-font-mono);color:var(--pb-warn-txt-on-ink)}
.pb-num .o{font:600 14px var(--pb-font-mono);color:var(--pb-ok-on-ink)}
.pb-num .s{display:block;margin-top:4px;color:var(--pb-on-ink-3);font-size:12.5px}

@media print{
  .pb-head, .pb-meta, .pb-left, .pb-right, .pb-noprint{display:none !important}
  .pb-shell{display:block}
  body{background:#fff}
  /* 덱은 가로 A4, 장당 한 쪽 */
  body.deck-print{background:#fff}
  body.deck-print .pb-deck{padding:0;gap:0;background:#fff}
  body.deck-print .pb-slidebox{height:auto !important;break-after:page;page-break-after:always}
  body.deck-print .pb-slidebox:last-child{break-after:auto;page-break-after:auto}
  body.deck-print .pb-slide{position:relative;transform:none !important;box-shadow:none;width:960px;height:540px;margin:0 auto}
  body.deck-print .pb-slide.is-empty{display:none}
  body.deck-print .sno{display:none}
  /* 재생성 버튼·형태 배지·빈 자리 안내는 투자자에게 가는 PDF에 실리면 안 된다 */
  .s-fig-regen, .s-fig-kind, .s-fig-none{display:none !important}

/* ══════════════════════════════════════════════════════════════
   글의 단락 정렬 — 이 블록은 맨 뒤에 둔다(앞 규칙을 덮어야 한다)

   🔴 사람이 쓴 글에는 줄바꿈과 "- " 목록이 들어 있다.
      기업들이 실제로 그렇게 쓴다 — "- 결로 피해 가구 / - 신생아 가구 / - 임대인".
      `white-space`를 주지 않으면 그 구조가 통째로 뭉개져 한 덩어리 문장이 된다.
      원문의 단락을 없애면 읽는 사람이 원문을 잘못 읽는다.
   ══════════════════════════════════════════════════════════════ */

/* 코치 패널 — 신청서 참고자료(린캔버스 서술 .pb-mentor) */
.pb-mentor p,
.pb-corpus p,
.pb-panel .pb-mentor p,
.pb-panel .pb-corpus p{ white-space:pre-wrap; }

/* AI 진단 — 지적·근거·개선 문장 */
.pb-issue .q, .pb-issue .w, .pb-rw p, .pb-stalebar p{ white-space:pre-wrap; }

/* 단락 사이를 띄운다 — 붙어 있으면 어디서 문단이 갈리는지 보이지 않는다 */
.pb-panel p + p,
.pb-mentor p + p,
.pb-corpus p + p,
.pb-card p + p{ margin-top:9px; }

/* 읽기 좋은 줄 길이. 한 줄이 너무 길면 다음 줄 첫머리를 놓친다.
   ★코치 열(좁은 칼럼)에는 걸지 않는다 — 이미 폭이 좁아 두 번 제한하면 답답해진다. */
.pb-sec .fl p{ max-width:74ch; }

/* 목록형 원문("- "로 시작하는 줄)이 많으므로 들여쓰기가 살아 있어야 한다 */
.pb-sec .fl p, .pb-mentor p, .pb-corpus p{
  word-break:keep-all;      /* 한글은 어절 단위로 끊어야 읽힌다 */
  overflow-wrap:break-word; /* 단 URL·긴 영문은 넘치지 않게 */
}

/* 인쇄물에서도 단락이 살아야 한다 — 투자자가 받는 PDF다 */
@media print{
  .pb-sec .fl p{ white-space:pre-wrap; max-width:none; }
}

</style>
</head>

<main id="pbShell" class="pb-shell hidden">

  <section class="pb-center" id="pbCenter"></section>

<script>
(function(){
  'use strict';

  var $ = function(id){ return document.getElementById(id); };

  // ══ 상태 ══════════════════════════════════════════════════════
  //  아래 이식 로직의 steps()·who()·contextBlock()·stepPrompt()가 이 두 객체를 본다.
  var state = { stepIndex:0, formData:{}, completed:false,
                cid:'', lastAudit:null,
                status:'', submittedAt:'', lastDeck:null, lastDiagrams:null,
                lastLagmp:null,                // ⑤ 성장관리 플랫폼 반영 결과(제출 응답)
                tab:0, view:'write',
                // ★판단은 그때의 원고에 대한 것이다 — 무엇을 보고 받은 판단인지를 함께 기억한다.
                diags:{},        // {단계id: {data, hash, at}}  단계별 AI 진단 + 그때의 입력 해시
                auditHash:'',                  // 투자논리 진단을 받은 시점의 IR 전체 해시
                figHash:'',                    // ①도식을 뽑은 시점의 IR 전체 해시
                deckHash:'',                   // 덱을 만든 시점의 IR 전체 해시
                // B1 신청서 참고자료(P2) — 본문에 넣지 않고 코치 열에서만 보여준다
                b1ref:null, b1At:'' };
  var llm = { conn:'byok', key:'', proxy:'', id:'', code:'',
              model:'gemini-flash-latest', reviewer:false, tipsMode:false,
              quota:null };            // 서버가 준 AI 사용 잔여 {used,limit} — 기업만 받는다
  var busy = false;
  // ~~B2 성장관리(LAGMP) 종합의견~~ — 2026-08-19 민부장 지시로 연동 제거. 접속코드만 LAGMP와 공유한다(로그인).

  // ══ IR 코칭 지식 번들 (D5 → 32_ 엔진 → 이 화면) ═══════════════
  //  ★로그인 시 1회만 받고 localStorage에 둔다. 단계마다 부르지 않는다(엔진 확정 6).
  //  ★버전만 보내 같으면 본문을 받지 않는다 — 번들이 수백 KB까지 커진다.
  //  🔴 `red_flags`는 프롬프트 전용이다. 화면에 뿌리지 않는다(엔진 규칙) — 내부 메타가 섞여 있다.
  var BRAIN_KEY = 'pitchbuilder.brain.v1';
  var brain = { version:'', items:[], rx:{}, loaded:false };

  //  단계 ↔ 진단영역 매핑. **엔진은 소비자를 모른다** — 이 표는 PitchBuilder가 가진다.
  //  🔴 06 CMP(경쟁)를 3단계에 붙인 이유 = '기술적 방어 해자'와 묻는 것이 같다.
  //  🔴 08 TRC(트랙션)는 IR 6단계에 제 자리가 없어 4단계 시장에 얹었다 —
  //     시장을 증명하는 방식이 곧 초기 성과이기 때문이다.
  //  대응 영역이 없는 단계(1 cover · 6 team_ask · R&D 3단계)는 기존 coachTips를 그대로 쓴다.
  var STEP_DOMAIN_MAP = {
    problem:  ['02 PRB'],
    solution: ['03 SOL', '06 CMP'],
    market:   ['08 TRC'],
    business: ['07 BMO', '09 UNT', '10 GTM']
  };

  function brainItemsFor(stepId){
    var codes = STEP_DOMAIN_MAP[stepId];
    if(!codes || !brain.items.length) return [];
    return brain.items.filter(function(it){
      return codes.indexOf(String(it.domain_code || '')) >= 0;
    });
  }

  function readBrain(){
    try{
      var raw = localStorage.getItem(BRAIN_KEY);
      if(!raw) return;
      var o = JSON.parse(raw);
      if(o && o.version && o.items){
        brain.version = o.version; brain.items = o.items || []; brain.rx = o.rx || {};
      }
    }catch(e){}
  }
  function writeBrain(){
    try{
      localStorage.setItem(BRAIN_KEY, JSON.stringify({
        version: brain.version, items: brain.items, rx: brain.rx }));
    }catch(e){}      // 용량 초과여도 화면은 돌아야 한다 — 다음 접속에 다시 받는다
  }

  //  ★지식 번들은 기업별 자료가 아니라 **공용 지식**이다. 계정을 갈아도 비우지 않는다.
  function pullBrain(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('brain', brain.version ? { have: brain.version } : {})
      .then(function(d){
        if(!d || !d.ok) return;
        if(d.same) { brain.loaded = true; return; }        // 버전 동일 — 본문을 받지 않았다
        if(!d.version || !d.bundle){                        // 아직 발행 전
          brain.version = ''; brain.items = []; brain.rx = {};
          brain.loaded = true;
          return;
        }
        brain.version = d.version;
        brain.items = arr(d.bundle.items);
        brain.rx = d.bundle.rx || {};
        brain.loaded = true;
        writeBrain();
        if(state.view === 'write' && state.tab !== 0) render();   // 가이드 탭이 열려 있으면 갱신
      })
      .catch(function(){});                                 // 조용히 접는다 — 가이드만 빈다
  }

    /* ══════════════════════════════════════════════════════════════
     아래는 구 실행본(PitchBuilder_Pro.html)에서 **문자 그대로 옮긴** 로직이다.
     검증 137건을 통과한 코드이므로 손으로 고쳐 쓰지 않는다.
     추출: extract_logic.py
     ══════════════════════════════════════════════════════════════ */
  var IR_STEPS = [
    {
      id:'cover', icon:'file',
      title:'1. 한 줄 소개 (Cover)',
      subtitle:'우리 회사의 정체성을 5초 안에 각인시킵니다.',
      inputs:[
        {key:'companyName', label:'회사명/서비스명', placeholder:'예: 토스(Toss)'},
        {key:'oneLiner', label:'한 줄 소개 (Declarative Sentence)', placeholder:'예: 금융의 모든 것을 쉽고 간편하게 만드는 모바일 금융 앱'}
      ],
      coachTips:[
        '형용사를 빼고 명확한 명사 위주로 작성하세요.',
        "우리가 '무엇을 하는지' 비전문가도 이해할 수 있어야 합니다.",
        '나쁜 예: 4차 산업혁명을 선도하는 글로벌 혁신 플랫폼'
      ]
    },
    {
      id:'problem', icon:'alert',
      title:'2. 문제 정의 (Problem)',

  var TIPS_STEPS = [

  // 현재 모드에 맞는 단계 목록 — 코드 전체가 이 함수 하나만 본다

  var PLACEHOLDER_RESULT = {
    companyName:'[회사명]', oneLiner:'[한 줄 소개]',

  var STORAGE_BASE = 'pitchbuilder.pro.v1';


  var LLM_KEY = 'pitchbuilder.llm.v1';

  //    같은 칸에 담으면 관리자 자신의 원고와 섞이고, 나갔다 들어왔을 때
  //    지금 화면의 글이 누구 것인지 알 수 없게 된다 — 남의 IR을 자기 것으로 덮어쓰는 길이다.
  function who(){
    var base = (llm.id || '').trim() || 'anon';
    return (typeof admin !== 'undefined' && admin && admin.editing)
      ? base + '@' + admin.editing.company
      : base;
  }

  function skey(){ return STORAGE_BASE + '::' + who(); }


  // ══ R&D 대응 여부 — 기업이 처음 들어올 때 한 번 묻는다 ═══════
  //  ★서버 APP_CONFIG의 tipsMode는 **기본값**일 뿐이다. 기업이 한 번 정하면 그 선택이 이긴다.
  //    관리자가 전체 적용한 값이 매 접속마다 기업 선택을 덮으면, 기업은 껐는데 다시 켜져 있다.
  //  ★계정별로 남긴다 — 같은 PC를 두 기업이 쓰면 서로의 선택이 섞이면 안 된다.
  var TIPSASK_BASE = 'pitchbuilder.tipsask.v1';
  function askKey(){ return TIPSASK_BASE + '::' + (llm.id || '').trim(); }
  function tipsChoice(){ try{ return localStorage.getItem(askKey()) || ''; }catch(e){ return ''; } }
  function setTipsChoice(v){ try{ localStorage.setItem(askKey(), v ? 'yes' : 'no'); }catch(e){} }

  // ══ 낡음 판정 ═════════════════════════════════════════════════
  //  이 연동의 심장이다 — *"기업이 자꾸 고치고 그때마다 피드백을 받는 구조"*(민부장님, 2026-07-30).
  //  고쳤는데 피드백이 그대로면 시스템이 거짓말을 하는 것이다.
  //  ★자동 재호출은 하지 않는다. 9단계를 오가는 것만으로 일일 상한(40회)이 녹는다.
  //    낡았다는 사실만 알리고, 다시 부를지는 사람이 정한다.
  //  정본: 설계정본_3자연동_v1.md §6
  function hashOf(s){                                   // djb2 — 충돌 확률보다 '싼 값'이 중요하다
    var h = 5381, t = String(s == null ? '' : s);
    for(var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }
  // ★공백만 달라진 것을 '고쳤다'고 하면 경고가 잔소리가 되어 아무도 안 읽는다.
  function normTxt(v){ return String(v == null ? '' : v).replace(/\s+/g, ' ').trim(); }
  function stepHash(s){
    if(!s || !s.inputs) return '';
    return hashOf(s.inputs.map(function(f){
      return f.key + '=' + normTxt(state.formData[f.key]);
    }).join(''));
  }
  // ★단계 목록이 아니라 고정 필드 목록으로 센다 — R&D 대응을 켜고 끄는 것만으로
  //   전체 해시가 흔들리면 진단이 멀쩡한데도 낡았다고 말하게 된다.
  function irHash(){
    return hashOf(Object.keys(PLACEHOLDER_RESULT).sort().map(function(k){
      return k + '=' + normTxt(state.formData[k]);
    }).join(''));
  }
  // 해시를 모르는 상태(서버에서 원고만 받아온 경우)는 '낡음'이 아니라 '판정 불가'다.
  // 모르는 것을 낡았다고 하면 매번 늑대가 나타난다.
  function irStale(h){ return !!h && h !== irHash(); }

  // ══ 결과 화면 3관문 — ① 도식 → ② 투자논리 진단 → ③ 피칭 자료 (2026-08-22 민부장 지시) ══
  //  🔴 왜 순서를 강제하는가 — 20개사 실측에서 **덱의 도식이 기업마다 비슷하게 나왔다.**
  //    원인은 기업 자료가 아니라 만드는 순서였다. 곧장 덱을 만들면 한 번의 LLM 호출이
  //    슬라이드 문구와 도식 판정을 동시에 하게 되고, 관계 판정이 문구에 밀려 무난한
  //    형태(대개 flow)로 수렴한다. ①은 도식만 보는 전용 호출이고(자리마다 같은 type을
  //    반복하지 말라는 규칙까지 걸려 있다), ②는 무엇이 비었는지 가른 결과다.
  //    **덱은 이 둘을 재료로 받아야 그 기업의 것이 된다.**
  //  ★관문은 '했는가'만 본다. 낡음(원고를 고친 뒤 다시 안 함)은 막지 않고 알리기만 한다 —
  //    되돌릴 수 없는 것이 아니고, 막으면 한 글자 고칠 때마다 전부 다시 하게 된다.
  function deckGate(){
    var g = {};
    g.fig        = !!state.lastDiagrams;
    g.figStale   = g.fig && irStale(state.figHash);
    g.audit      = !!(state.lastAudit && state.lastAudit.kind === 'axis');
    g.auditStale = g.audit && irStale(state.auditHash);
    g.ok         = g.fig && g.audit;
    g.stale      = g.figStale || g.auditStale;
    // 아직 못 지난 관문 이름 — 버튼 옆 한 줄로 그대로 쓴다
    g.need = [];
    if(!g.fig)   g.need.push('① 도식 만들기');
    if(!g.audit) g.need.push('② 투자논리 진단');
    return g;
  }
  // 관문을 못 지난 [IR 피칭 자료 만들기]를 눌렀을 때 — 막기만 하지 않고 어디로 가야 하는지 말한다.
  function deckBlocked(g){
    alert('IR 피칭 자료는 ① 도식과 ② 투자논리 진단을 마친 뒤에 만듭니다.\n\n' +
          '아직 남은 것 — ' + g.need.join(' · ') + '\n\n' +
          '덱은 ①의 도식 판정과 ②의 진단 결과를 재료로 씁니다. 건너뛰고 만들면 ' +
          '어느 기업이나 비슷한 자료가 나옵니다.');
  }

  // ── 진단 결과 렌더링 ────────────────────
  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  function arr(v){ return Array.isArray(v) ? v : []; }

  // 모델이 코드펜스를 씌우거나 앞뒤에 말을 붙여도 살려낸다.
  function parseJSON(text){
    if(!text) throw new Error('응답이 비어 있습니다.');
    var t = String(text).trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
    try{ return JSON.parse(t); }catch(e){}
    var a = t.indexOf('{'), b = t.lastIndexOf('}');
    if(a >= 0 && b > a){
      try{ return JSON.parse(t.slice(a, b+1)); }catch(e2){}
    }
    throw new Error('응답을 해석하지 못했습니다. 다시 시도해 주세요.');
  }

  // ── 프롬프트 ────────────────────────────
  // 헌법: 없는 사실을 지어내지 않는다. 모르면 물어본다.
  var SYSTEM = [
    '너는 한국 초기기업 투자 심사역이다. 초기 투자 심사역의 관점으로 창업팀의 IR 초안을 진단한다.',
    '',
    '# 절대 규칙 (어기면 실패다)',
    '- 사용자가 제공하지 않은 정량 수치·고객사명·연도·특허번호·인원수를 절대 지어내지 마라.',

  // 코드가 LLM을 검증한다 — 상태 enum·축/연결 고정 목록·인용 원문 대조·질문 상한. 통과 못 한 것은 내리거나 버린다.
  function axisNormalize(d){
    d = (d && typeof d === 'object') ? d : {};
    var out = { verdict: String(d.verdict || '').trim(), axes:[], edges:[], thesis:{ holds:[], fails:[] }, questions:[], dropped:0, unverified:0 };
    var byId = {};
    arr(d.axes).forEach(function(a){ if(a && a.id) byId[String(a.id)] = a; });
    AX_AXES.forEach(function(ax){
      var a = byId[ax.id] || {};
      var claims = [];
      arr(a.claims).slice(0, 5).forEach(function(c){
        if(!c || !String(c.text || '').trim()) return;
        var st = String(c.status || '').toUpperCase();
        var note = String(c.note || '').trim();
        if(st === 'FACT' || st === 'INFERENCE'){ st = 'CLAIM'; note = (note ? note + ' · ' : '') + '확인자료 없음 → 기재·미확인으로 내림'; }
        if(!AX_STATUS[st]) st = 'CLAIM';
        var q = String(c.quote || '').trim();
        var ver = q ? verifyEvidence(q) : false;            // 인용이 원문에 없으면 근거로 인정하지 않는다
        if(!q || ver === false){ out.unverified++; }
        claims.push({ text:String(c.text).trim(), status:st, field:String(c.field || ''), quote:q, note:note, unverified: (!q || ver === false) });
      });
      out.axes.push({ id:ax.id, name:ax.name, claims:claims,
                      missing: arr(a.missing).slice(0, 3).map(function(m){ return String(typeof m === 'string' ? m : (m && (m.what || m.required_element)) || '').trim(); }).filter(Boolean) });
    });
    var eById = {};
    arr(d.edges).forEach(function(e){ if(e && e.id) eById[String(e.id).toUpperCase()] = e; });
    AX_EDGES.forEach(function(def){
      var e = eById[def[0]] || {};
      var st = String(e.status || '').toUpperCase();
      if(!AX_EDGE_STATUS[st]) st = 'UNKNOWN';
      out.edges.push({ id:def[0], name:def[1], status:st, why:String(e.why || '').trim() });
    });
    var th = (d.thesis && typeof d.thesis === 'object') ? d.thesis : {};
    out.thesis.holds = arr(th.holds).map(String).filter(Boolean).slice(0, 4);
    out.thesis.fails = arr(th.fails).map(String).filter(Boolean).slice(0, 4);
    var cap = { P0:3, P1:3, P2:1 }, cnt = { P0:0, P1:0, P2:0 };
    arr(d.questions).forEach(function(q){
      if(!q || !String(q.q || '').trim()) return;
      var p = String(q.priority || 'P1').toUpperCase(); if(!cap[p]) p = 'P1';
      if(cnt[p] >= cap[p] || out.questions.length >= 7){ out.dropped++; return; }
      cnt[p]++;
      out.questions.push({ priority:p, axis:String(q.axis || ''), q:String(q.q).trim(), evidence:String(q.evidence || '').trim(),
                           edges: arr(q.edges).map(String).filter(function(x){ return /^E(0[1-9]|1[0-8])$/.test(x); }) });
    });
    out.questions.sort(function(a, b){ return a.priority < b.priority ? -1 : a.priority > b.priority ? 1 : 0; });
    return out;
  }

  //    색이 안 나와도 예외가 나지 않아 눈으로 보기 전엔 모른다.
  //  2026-08-20: 재디자인 코발트 팔레트로 통일 — 포인트 #1B4BF0 · 딥 #10309E · 틴트 #A9BCFA/#EDF1FE · 구조색 #1F2637
  //  네 계열의 뜻은 그대로다: blue=기본 · em=합계·강조(딥) · pu=보조(틴트) · rd=손실·경고(구조색·굵게)
  var C = { blue:'#1B4BF0', blueLt:'#EDF1FE', blueBd:'#A9BCFA',
            em:'#10309E', emLt:'#EDF1FE', emBd:'#A9BCFA',
            pu:'#6C9BE6', puLt:'#F7F9FC', puBd:'#CFE0F8',
            rd:'#1F2637', rdLt:'#F7F9FC', rdBd:'#D8DDE8',
            ink:'#1F2537', mute:'#667087', line:'#D8DDE8' };

  // 한글은 폭이 넓다 — 대략적 폭 계산으로 줄바꿈한다
  function textW(s, fs){
    var w = 0;
    for(var i=0; i<s.length; i++){
      var c = s.charCodeAt(i);
      w += (c > 0x1100 && c < 0xD7FF) || (c >= 0xFF00 && c <= 0xFFEF) ? fs : fs * 0.55;
    }
    return w;
  }

  function wrap(s, fs, maxW){
    s = String(s || '').trim();
    if(!s) return [];
    var words = s.split(/\s+/), lines = [], cur = '';
    words.forEach(function(w){
      var t = cur ? cur + ' ' + w : w;
      if(textW(t, fs) <= maxW || !cur){ cur = t; }
      else { lines.push(cur); cur = w; }
    });
    if(cur) lines.push(cur);
    // 한 단어가 너무 길면 강제로 자른다
    var out = [];
    lines.forEach(function(l){
      while(textW(l, fs) > maxW && l.length > 1){
        var cut = l.length;
        while(cut > 1 && textW(l.slice(0, cut), fs) > maxW) cut--;
        out.push(l.slice(0, cut));
        l = l.slice(cut);
      }
      if(l) out.push(l);
    });
    return out.slice(0, 3);
  }

  function tspans(lines, cx, y, fs, fill, weight){
    return lines.map(function(l, i){
      return '<text x="' + cx + '" y="' + (y + i * (fs + 5)) + '" text-anchor="middle" font-size="' + fs +
             '" font-weight="' + (weight || 400) + '" fill="' + fill + '" font-family="inherit">' + esc(l) + '</text>';
    }).join('');
  }

  function box(x, y, w, h, fill, stroke){
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="10" fill="' + fill +
           '" stroke="' + stroke + '" stroke-width="1.5"/>';
  }

  function arrowDefs(id, color){
    return '<defs><marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">' +
           '<path d="M0 0 L10 5 L0 10 z" fill="' + color + '"/></marker></defs>';
  }

  function svgWrap(w, h, inner){
    return '<svg class="dg" viewBox="0 0 ' + w + ' ' + h + '" role="img" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
  }

  // ① 해결책 흐름도 — 가로 단계 박스 + 화살표
  function drawFlow(d){
    var steps = arr(d && d.steps).filter(function(s){ return s && s.label; }).slice(0, 5);
    if(steps.length < 2) return '';

    var W = 760, n = steps.length, GAP = 38, PAD = 14;
    var bw = (W - GAP * (n - 1)) / n;
    var inner = bw - 20;

    var laid = steps.map(function(s){
      return { l: wrap(s.label, 14, inner), n: wrap(s.note, 11, inner) };
    });
    var maxL = Math.max.apply(null, laid.map(function(o){ return o.l.length; }));
    var maxN = Math.max.apply(null, laid.map(function(o){ return o.n.length; }));
    var bh = PAD + 24 + 10 + maxL * 19 + (maxN ? 6 + maxN * 16 : 0) + PAD;

    var s = arrowDefs('ar-flow', C.line);
    laid.forEach(function(o, i){
      var x = i * (bw + GAP), cx = x + bw / 2;
      s += box(x, 0, bw, bh, C.blueLt, C.blueBd);
      s += '<circle cx="' + cx + '" cy="' + (PAD + 12) + '" r="12" fill="' + C.blue + '"/>';
      s += '<text x="' + cx + '" y="' + (PAD + 16) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="inherit">' + (i + 1) + '</text>';
      s += tspans(o.l, cx, PAD + 24 + 20, 14, C.ink, 600);
      if(o.n.length) s += tspans(o.n, cx, PAD + 24 + 20 + maxL * 19 + 8, 11, C.mute);
      if(i < n - 1){
        var ax = x + bw + 8, ay = bh / 2;
        s += '<line x1="' + ax + '" y1="' + ay + '" x2="' + (ax + GAP - 20) + '" y2="' + ay +
             '" stroke="' + C.line + '" stroke-width="2" marker-end="url(#ar-flow)"/>';
      }
    });
    return svgWrap(W, bh, s);
  }

  // ② Bottom-up 산식 — [고객 수] × [객단가] = [시장]
  function drawMarket(d){
    if(!d || (!d.unitValue && !d.priceValue && !d.totalValue)) return '';

    var W = 760, SYM = 46, bw = (W - SYM * 2) / 3, PAD = 16;
    var cells = [
      { lab: d.unitLabel || '타겟 고객 수', val: d.unitValue || '[__]', accent: false },
      { lab: d.priceLabel || '객단가',      val: d.priceValue || '[__]', accent: false },
      { lab: d.totalLabel || '초기 시장(SOM)', val: d.totalValue || '[__]', accent: true }
    ];
    var laid = cells.map(function(c){
      return { lab: wrap(c.lab, 11, bw - 24), val: wrap(c.val, 17, bw - 24), accent: c.accent };
    });
    var maxLab = Math.max.apply(null, laid.map(function(o){ return o.lab.length; }));
    var maxVal = Math.max.apply(null, laid.map(function(o){ return o.val.length; }));
    var bh = PAD + maxLab * 15 + 10 + maxVal * 23 + PAD;

    var s = '';
    laid.forEach(function(o, i){
      var x = i * (bw + SYM), cx = x + bw / 2;
      s += box(x, 0, bw, bh, o.accent ? C.em : C.emLt, o.accent ? C.em : C.emBd);
      s += tspans(o.lab, cx, PAD + 11, 11, o.accent ? '#CFE0F8' : C.mute, 600);
      s += tspans(o.val, cx, PAD + maxLab * 15 + 20, 17, o.accent ? '#fff' : C.ink, 700);
      if(i < 2){
        s += '<text x="' + (x + bw + SYM / 2) + '" y="' + (bh / 2 + 8) + '" text-anchor="middle" font-size="22" font-weight="700" fill="' +
             C.mute + '" font-family="inherit">' + (i === 0 ? '×' : '=') + '</text>';
      }
    });
    return svgWrap(W, bh, s);
  }

  // ③ GTM 퍼널 — 위가 넓고 아래로 좁아지는 계단
  function drawFunnel(d){
    var stages = arr(d && d.stages).filter(function(s){ return s && s.label; }).slice(0, 4);
    if(stages.length < 2) return '';

    var W = 760, n = stages.length, SH = 66, GAP = 8;
    var topW = 660, botW = 300, cx = W / 2;
    var H = n * SH + (n - 1) * GAP;

    var s = '';
    stages.forEach(function(st, i){
      var y = i * (SH + GAP);
      var wT = topW - (topW - botW) * (i / n);
      var wB = topW - (topW - botW) * ((i + 1) / n);
      var pts = [
        (cx - wT / 2) + ',' + y, (cx + wT / 2) + ',' + y,
        (cx + wB / 2) + ',' + (y + SH), (cx - wB / 2) + ',' + (y + SH)
      ].join(' ');
      // 라이브러리 틴트 램프(옅음→짙음). 흰 글자는 짙은 두 단계에만 — 옅은 파랑 위 흰 글자는 읽히지 않는다(2026-08-19 실측).
      var RAMP = ['#EDF1FE', '#A9BCFA', '#1B4BF0', '#10309E'].slice(-n);
      var fillC = RAMP[i];
      s += '<polygon points="' + pts + '" fill="' + fillC + '" stroke="' + C.blueBd + '" stroke-width="1.5"/>';

      var lab = wrap(st.label, 14, wB - 30);
      var note = wrap(st.note, 11, wB - 30);
      var dark = (fillC === '#1B4BF0' || fillC === '#10309E');
      var ty = y + SH / 2 - (note.length ? 8 : 0) + 5 - (lab.length - 1) * 9;
      s += tspans(lab, cx, ty, 14, dark ? '#fff' : C.ink, 600);
      if(note.length) s += tspans(note, cx, ty + lab.length * 19 + 2, 11, dark ? '#EAF2FC' : C.mute);
    });
    return svgWrap(W, H, s);
  }

  // ④ 마일스톤 타임라인 — 조달 목표·마일스톤(fundingAsk)에서 뽑는다
  //    돈 이야기를 하는 장(Ask)에 그림이 없으면 슬라이드가 맨 글자만 남는다.
  function drawTimeline(d){
    var items = arr(d && d.items).filter(function(x){ return x && x.label; }).slice(0, 5);
    if(items.length < 2) return '';

    var W = 760, n = items.length;
    var PADX = 40, AXIS = 92;
    var span = (W - PADX * 2) / (n - 1);
    var s = arrowDefs('mkTl', C.line);

    // 축
    s += '<line x1="' + PADX + '" y1="' + AXIS + '" x2="' + (W - PADX + 14) + '" y2="' + AXIS +
         '" stroke="' + C.line + '" stroke-width="2" marker-end="url(#mkTl)"/>';

    items.forEach(function(it, i){
      var cx = PADX + span * i;
      var up = i % 2 === 0;                     // 위·아래 번갈아 — 글자가 겹치지 않는다
      var isLast = i === n - 1;
      var col = isLast ? C.pu : C.blue;

      s += '<circle cx="' + cx + '" cy="' + AXIS + '" r="7" fill="#fff" stroke="' + col + '" stroke-width="3"/>';

      var when = String(it.when || '').trim();
      var lab = wrap(it.label, 13, span * 0.92);
      var note = wrap(it.note, 10.5, span * 0.92);

      var y = up ? AXIS - 26 : AXIS + 30;
      s += '<line x1="' + cx + '" y1="' + (up ? AXIS - 8 : AXIS + 8) + '" x2="' + cx + '" y2="' +
           (up ? y + 4 : y - 12) + '" stroke="' + C.line + '" stroke-width="1.5"/>';

      var ty = up ? y - (lab.length - 1) * 17 - (note.length ? note.length * 13 : 0) - (when ? 15 : 0) : y;
      if(when){ s += tspans([when], cx, ty, 11, col, 700); ty += 16; }
      s += tspans(lab, cx, ty, 13, C.ink, 600);
      if(note.length) s += tspans(note, cx, ty + lab.length * 17 + 1, 10.5, C.mute);
    });
    return svgWrap(W, 190, s);
  }

  // ⑤ 경쟁 포지셔닝 2×2 — 해자(moat)에서 뽑는다
  //   ★좌표는 LLM이 0~1로만 낸다. 축·격자·점은 코드가 그린다.
  function drawPositioning(d){
    if(!d || !d.us || !d.xLabel || !d.yLabel) return '';
    var others = arr(d.others).filter(function(o){ return o && o.label; }).slice(0, 4);

    var W = 760, H = 420, PAD = 74;
    var x0 = PAD, x1 = W - PAD, y0 = 30, y1 = H - PAD;
    var px = function(v){ return x0 + (x1 - x0) * Math.max(0, Math.min(1, +v || 0)); };
    var py = function(v){ return y1 - (y1 - y0) * Math.max(0, Math.min(1, +v || 0)); };

    var s = '';
    // 사분면 — 우상단(우리가 서야 할 자리)만 은은하게 칠한다
    s += '<rect x="' + ((x0 + x1) / 2) + '" y="' + y0 + '" width="' + ((x1 - x0) / 2) +
         '" height="' + ((y1 - y0) / 2) + '" fill="' + C.blueLt + '"/>';
    s += '<line x1="' + x0 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y1 + '" stroke="' + C.line + '" stroke-width="1.5"/>';
    s += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x0 + '" y2="' + y1 + '" stroke="' + C.line + '" stroke-width="1.5"/>';
    s += '<line x1="' + ((x0 + x1) / 2) + '" y1="' + y0 + '" x2="' + ((x0 + x1) / 2) + '" y2="' + y1 +
         '" stroke="' + C.line + '" stroke-width="1" stroke-dasharray="4 4"/>';
    s += '<line x1="' + x0 + '" y1="' + ((y0 + y1) / 2) + '" x2="' + x1 + '" y2="' + ((y0 + y1) / 2) +
         '" stroke="' + C.line + '" stroke-width="1" stroke-dasharray="4 4"/>';

    // 축 이름
    s += '<text x="' + ((x0 + x1) / 2) + '" y="' + (y1 + 40) + '" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + C.mute + '" font-family="inherit">' + esc(d.xLabel) + ' →</text>';
    s += '<text transform="translate(' + (x0 - 28) + ',' + ((y0 + y1) / 2) + ') rotate(-90)" text-anchor="middle" font-size="12.5" font-weight="700" fill="' + C.mute + '" font-family="inherit">' + esc(d.yLabel) + ' →</text>';

    // 경쟁사 — 회색 점
    others.forEach(function(o){
      var cx = px(o.x), cy = py(o.y);
      s += '<circle cx="' + cx + '" cy="' + cy + '" r="6" fill="#fff" stroke="' + C.mute + '" stroke-width="2"/>';
      s += tspans(wrap(o.label, 11, 150), cx, cy + 22, 11, C.mute, 500);
    });

    // 우리 — 강조
    var ux = px(d.us.x), uy = py(d.us.y);
    s += '<circle cx="' + ux + '" cy="' + uy + '" r="13" fill="' + C.blue + '" fill-opacity="0.15"/>';
    s += '<circle cx="' + ux + '" cy="' + uy + '" r="7.5" fill="' + C.blue + '"/>';
    s += tspans(wrap(d.us.label || '우리', 12.5, 180), ux, uy - 18, 12.5, C.blue, 800);

    return svgWrap(W, H, s);
  }

  // ⑥ Problem — 누가 무엇을 잃고 있는가 (targetCustomer + problemDescription에서 뽑는다)
  //    덱 5장 중 cover·problem 두 장이 늘 맨 글자만 남던 자리다.
  //    상장사 IR은 6%만 쓰지만 초기기업은 반드시 써야 하는 칸이다(코퍼스 1,344건 실측).
  //
  //  ★막대그래프로 그리지 않는다. "하루 3시간"과 "월 100만원"은 단위가 달라
  //    한 축에 올릴 수 없다. 단위가 다른 값을 같은 축에 세우면 그림이 거짓말을 한다.
  //    그래서 축 없이 카드로 나열한다 — 비교가 아니라 열거이기 때문이다.
  function drawPain(d){
    if(!d) return '';
    var who   = String(d.who || '').trim();
    var items = arr(d.items).filter(function(x){ return x && String(x.value || '').trim(); }).slice(0, 4);
    if(!items.length) return '';        // 손실 수치가 하나도 없으면 그리지 않는다

    var W = 760, GAP = 16, y = 0, s = '';

    // 누가 겪는가 — 페르소나. 없으면 이 칸 자체를 생략한다.
    if(who){
      var wl = wrap(who, 14, W - 56);
      var wh = 26 + wl.length * 20 + 14;
      s += box(0, 0, W, wh, '#fff', C.line);
      s += '<text x="20" y="24" font-size="10" font-weight="700" fill="' + C.mute +
           '" font-family="inherit" letter-spacing="0.06em">WHO · 누가 겪는가</text>';
      wl.forEach(function(l, i){
        s += '<text x="20" y="' + (48 + i * 20) + '" font-size="14" font-weight="600" fill="' + C.ink +
             '" font-family="inherit">' + esc(l) + '</text>';
      });
      y = wh + GAP;
    }

    // 무엇을 잃는가 — 손실 카드
    var n = items.length, bw = (W - GAP * (n - 1)) / n;
    var labs = items.map(function(it){ return wrap(it.label, 11.5, bw - 24); });
    var maxL = Math.max.apply(null, labs.map(function(l){ return l.length; }));
    var bh = 22 + 30 + 8 + maxL * 17 + 18;

    items.forEach(function(it, i){
      var x = i * (bw + GAP), cx = x + bw / 2;
      var val = String(it.value);
      // 값이 길면 글자를 줄인다 — 박스를 넘기느니 작게 쓴다
      var vfs = 27;
      while(vfs > 14 && textW(val, vfs) > bw - 24) vfs -= 1.5;

      s += box(x, y, bw, bh, C.rdLt, C.rdBd);
      s += '<text x="' + cx + '" y="' + (y + 24) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="' +
           C.rd + '" font-family="inherit" letter-spacing="0.06em">LOSS</text>';
      s += tspans([val], cx, y + 58, vfs, C.rd, 800);
      s += tspans(labs[i], cx, y + 82, 11.5, C.ink, 500);
    });

    return svgWrap(W, y + bh, s);
  }

  // ⑦ 양자 비교 — 기존 방식 vs 우리 방식 (moat에서 뽑는다)
  //    "무엇이 다른가"는 IR에서 가장 자주 나오는 관계인데 그릴 도식이 없었다.
  function drawBeforeAfter(d){
    if(!d || !d.left || !d.right) return '';
    var L = d.left, R = d.right;
    var li = arr(L.items).filter(Boolean).slice(0, 4).map(String);
    var ri = arr(R.items).filter(Boolean).slice(0, 4).map(String);
    if(!li.length && !ri.length) return '';

    var W = 760, ARW = 64, bw = (W - ARW) / 2, PAD = 18;
    var lw = li.map(function(t){ return wrap(t, 12.5, bw - PAD * 2); });
    var rw = ri.map(function(t){ return wrap(t, 12.5, bw - PAD * 2); });
    var lines = function(ws){ return ws.reduce(function(a, w){ return a + w.length; }, 0); };
    var rows = Math.max(lines(lw), lines(rw));
    var bh = 44 + rows * 20 + Math.max(li.length, ri.length) * 8 + PAD;

    function side(x, title, ws, col, bg, bd){
      var s = box(x, 0, bw, bh, bg, bd);
      s += tspans(wrap(title, 13, bw - PAD * 2), x + bw / 2, 28, 13, col, 700);
      var y = 56;
      ws.forEach(function(w){
        s += '<circle cx="' + (x + PAD + 4) + '" cy="' + (y - 4) + '" r="2.5" fill="' + col + '"/>';
        w.forEach(function(l, i){
          s += '<text x="' + (x + PAD + 14) + '" y="' + (y + i * 18) + '" font-size="12.5" fill="' +
               C.ink + '" font-family="inherit">' + esc(l) + '</text>';
        });
        y += w.length * 18 + 10;
      });
      return s;
    }

    var s = arrowDefs('mkBA', C.mute);
    s += side(0, L.title || '기존 방식', lw, C.mute, '#fff', C.line);
    s += side(bw + ARW, R.title || '우리 방식', rw, C.blue, C.blueLt, C.blueBd);
    s += '<line x1="' + (bw + 14) + '" y1="' + (bh / 2) + '" x2="' + (bw + ARW - 14) + '" y2="' + (bh / 2) +
         '" stroke="' + C.mute + '" stroke-width="2" marker-end="url(#mkBA)"/>';
    return svgWrap(W, bh, s);
  }

  // ⑧ 병렬 구성요소 — 순서가 없는 것에 화살표를 붙이지 않기 위해서다.
  //    전에는 이런 내용도 flow로 그려져, 없는 순서를 있는 것처럼 주장했다.
  function drawParallel(d){
    var items = arr(d && d.items).filter(function(x){ return x && x.label; }).slice(0, 4);
    if(items.length < 2) return '';

    var W = 760, GAP = 16, PAD = 16;
    var n = items.length, bw = (W - GAP * (n - 1)) / n;
    var labs = items.map(function(it){ return wrap(it.label, 13.5, bw - PAD * 2); });
    var nts  = items.map(function(it){ return wrap(it.note, 11, bw - PAD * 2); });
    var maxL = Math.max.apply(null, labs.map(function(l){ return l.length; }));
    var maxN = Math.max.apply(null, nts.map(function(l){ return l.length; }));
    var bh = PAD + maxL * 19 + (maxN ? 8 + maxN * 16 : 0) + PAD;

    var s = '';
    items.forEach(function(it, i){
      var x = i * (bw + GAP), cx = x + bw / 2;
      s += box(x, 0, bw, bh, C.blueLt, C.blueBd);
      s += tspans(labs[i], cx, PAD + 16, 13.5, C.ink, 700);
      if(nts[i].length) s += tspans(nts[i], cx, PAD + maxL * 19 + 16, 11, C.mute);
    });
    return svgWrap(W, bh, s);
  }

  // ⑨ 순환 — 반복되는 과정. 직선으로 그리면 끝나는 것처럼 보인다.
  function drawCycle(d){
    var st = arr(d && d.stages).filter(function(x){ return x && x.label; }).slice(0, 5);
    if(st.length < 3) return '';

    var W = 760, H = 340, cx = W / 2, cy = H / 2, R = 108, nr = 46;
    var n = st.length;
    var ang = function(i){ return (-90 + (360 / n) * i) * Math.PI / 180; };
    var px = function(i){ return cx + R * Math.cos(ang(i)); };
    var py = function(i){ return cy + R * Math.sin(ang(i)); };

    var s = arrowDefs('mkCy', C.pu);
    // 노드 사이를 호로 잇는다 — 원 위를 도는 것이 눈에 보여야 순환으로 읽힌다
    for(var i = 0; i < n; i++){
      var a0 = ang(i), a1 = ang((i + 1) % n);
      var pad = 0.30;                                  // 노드에 닿지 않도록 양끝을 물린다
      var s0 = a0 + pad, s1 = a1 - pad;
      s += '<path d="M ' + (cx + R * Math.cos(s0)) + ' ' + (cy + R * Math.sin(s0)) +
           ' A ' + R + ' ' + R + ' 0 0 1 ' + (cx + R * Math.cos(s1)) + ' ' + (cy + R * Math.sin(s1)) +
           '" fill="none" stroke="' + C.pu + '" stroke-width="2" marker-end="url(#mkCy)"/>';
    }
    st.forEach(function(it, i){
      var x = px(i), y = py(i);
      s += '<circle cx="' + x + '" cy="' + y + '" r="' + nr + '" fill="' + C.puLt + '" stroke="' + C.puBd + '" stroke-width="1.5"/>';
      var lab = wrap(it.label, 12, nr * 1.75);
      s += tspans(lab, x, y - (lab.length - 1) * 7 + 4, 12, C.ink, 600);
    });
    return svgWrap(W, H, s);
  }

  // ⑩ 허브 — 중심과 참여자. 플랫폼·생태계 서술에 쓰인다.
  function drawHub(d){
    if(!d || !d.center) return '';
    var sp = arr(d.spokes).filter(function(x){ return x && x.label; }).slice(0, 6);
    if(sp.length < 2) return '';

    var W = 760, H = 340, cx = W / 2, cy = H / 2, R = 118, cr = 62;
    var n = sp.length;
    var s = '';
    sp.forEach(function(it, i){
      var a = (-90 + (360 / n) * i) * Math.PI / 180;
      var x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
      // 선은 중심 원 밖에서 시작한다 — 원을 관통하면 안 된다
      s += '<line x1="' + (cx + cr * Math.cos(a)) + '" y1="' + (cy + cr * Math.sin(a)) +
           '" x2="' + (x - 38 * Math.cos(a)) + '" y2="' + (y - 22 * Math.sin(a)) +
           '" stroke="' + C.line + '" stroke-width="1.5"/>';
      var lab = wrap(it.label, 12, 148);
      var bh2 = 12 + lab.length * 17 + 12, bw2 = 156;
      s += box(x - bw2 / 2, y - bh2 / 2, bw2, bh2, '#fff', C.emBd);
      s += tspans(lab, x, y - (lab.length - 1) * 8.5 + 4, 12, C.ink, 600);
    });
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + cr + '" fill="' + C.emLt + '" stroke="' + C.em + '" stroke-width="2"/>';
    var cl = wrap(d.center.label || '', 13, cr * 1.7);
    s += tspans(cl, cx, cy - (cl.length - 1) * 8 + 4, 13, C.em, 800);
    return svgWrap(W, H, s);
  }

  // ⑪ 격차 — 현재와 목표의 차이. "얼마나 모자란가"가 한눈에 보여야 한다.
  function drawGap(d){
    if(!d || !d.from || !d.to) return '';
    var fv = String(d.from.value || '').trim(), tv = String(d.to.value || '').trim();
    if(!fv || !tv) return '';

    var W = 760, H = 210, bw = 232, gapW = W - bw * 2;
    var s = arrowDefs('mkGap', C.em);

    function pill(x, val, lab, col, bg, bd){
      var t = box(x, 40, bw, 108, bg, bd);
      t += tspans([val], x + bw / 2, 96, 30, col, 800);
      t += tspans(wrap(lab, 12, bw - 24), x + bw / 2, 124, 12, C.mute);
      return t;
    }
    s += pill(0, fv, d.from.label || '현재', C.mute, '#fff', C.line);
    s += pill(bw + gapW, tv, d.to.label || '목표', C.em, C.emLt, C.emBd);

    // 사이의 격차
    var gx = bw, gc = bw + gapW / 2;
    s += '<line x1="' + (gx + 14) + '" y1="94" x2="' + (gx + gapW - 14) + '" y2="94" stroke="' + C.em +
         '" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#mkGap)"/>';
    if(d.gap && String(d.gap.value || '').trim()){
      s += tspans([String(d.gap.value)], gc, 74, 15, C.em, 800);
      if(d.gap.label) s += tspans(wrap(d.gap.label, 11, gapW - 16), gc, 124, 11, C.mute);
    }
    return svgWrap(W, H, s);
  }

  // ⑫ 계층 — 위에서 아래로 쌓인 구조(기술 스택·서비스 층위).
  function drawLayers(d){
    var ls = arr(d && d.layers).filter(function(x){ return x && x.label; }).slice(0, 4);
    if(ls.length < 2) return '';

    var W = 760, GAP = 10, PAD = 14, y = 0, s = '';
    var tones = [[C.blueLt, C.blueBd], [C.emLt, C.emBd], [C.puLt, C.puBd], ['#fff', C.line]];
    ls.forEach(function(it, i){
      var lab = wrap(it.label, 13.5, W - 240);
      var nt  = wrap(it.note, 11, W - 240);
      var h = PAD + lab.length * 19 + (nt.length ? 6 + nt.length * 16 : 0) + PAD;
      var tone = tones[i % tones.length];
      s += box(0, y, W, h, tone[0], tone[1]);
      lab.forEach(function(l, j){
        s += '<text x="24" y="' + (y + PAD + 15 + j * 19) + '" font-size="13.5" font-weight="700" fill="' +
             C.ink + '" font-family="inherit">' + esc(l) + '</text>';
      });
      nt.forEach(function(l, j){
        s += '<text x="24" y="' + (y + PAD + lab.length * 19 + 15 + j * 16) + '" font-size="11" fill="' +
             C.mute + '" font-family="inherit">' + esc(l) + '</text>';
      });
      y += h + GAP;
    });
    return svgWrap(W, y - GAP, s);
  }

  // ══════════════════════════════════════════════════════════════
  //  도식 선택 — 자리(슬롯)마다 후보를 두고, 내용의 관계에 맞는 것을 고른다.
  //
  //  ★전에는 필드 하나에 도식 하나가 고정이었다. 그래서 순서가 없는 구성요소에도
  //    화살표가 붙고(없는 순서를 주장), 순환 구조도 직선으로 그려졌다(끝나는 것처럼 보임).
  //  ★그렇다고 LLM에게 그림을 맡기지는 않는다. LLM이 고르는 것은 **관계의 종류**뿐이고,
  //    좌표와 레이아웃은 여전히 코드가 정한다. 후보 밖의 type은 코드가 거부한다.
  // ══════════════════════════════════════════════════════════════
  var DG_DRAW = {
    pain: drawPain, gap: drawGap,
    flow: drawFlow, parallel: drawParallel, layers: drawLayers,
    position: drawPositioning, beforeafter: drawBeforeAfter,
    market: drawMarket,
    funnel: drawFunnel, cycle: drawCycle, hub: drawHub,
    timeline: drawTimeline
  };

  //  when = LLM이 이 도식을 고를 조건. spec = 그때 내야 할 JSON 모양.
  var DG_TYPE = {
    pain:        { name:'손실 열거', when:'고객이 잃는 것을 수치로 나열할 때',
                   spec:'"type":"pain", "who":"고통을 겪는 사람(25자 내외)", "items":[{"value":"3시간","label":"무엇을 잃는지(20자 이내)"}]' },
    gap:         { name:'격차', when:'현재 값과 목표 값의 차이가 핵심일 때',
                   spec:'"type":"gap", "from":{"value":"87%","label":"현재"}, "to":{"value":"95%","label":"목표"}, "gap":{"value":"8%p","label":"메워야 할 차이"}' },
    flow:        { name:'순차 흐름', when:'단계가 정해진 순서로 이어질 때',
                   spec:'"type":"flow", "steps":[{"label":"단계명(8자 내외)","note":"부연(15자 이내)"}]' },
    parallel:    { name:'병렬 구성', when:'순서 없이 나란한 구성요소일 때',
                   spec:'"type":"parallel", "items":[{"label":"구성요소","note":"부연(15자 이내)"}]' },
    layers:      { name:'계층 구조', when:'위아래로 쌓인 층위일 때(기술 스택 등)',
                   spec:'"type":"layers", "layers":[{"label":"층 이름","note":"부연"}]' },
    position:    { name:'경쟁 2×2', when:'경쟁 기준 두 축으로 자리가 갈릴 때',
                   spec:'"type":"position", "xLabel":"가로축","yLabel":"세로축","us":{"x":0.8,"y":0.8,"label":"우리"},"others":[{"x":0.3,"y":0.4,"label":"경쟁 유형"}]' },
    beforeafter: { name:'양자 비교', when:'기존 방식과 우리 방식을 맞세울 때',
                   spec:'"type":"beforeafter", "left":{"title":"기존 방식","items":["항목","항목"]}, "right":{"title":"우리 방식","items":["항목","항목"]}' },
    market:      { name:'Bottom-up 산식', when:'고객 수 × 객단가 = 시장으로 산출할 때',
                   spec:'"type":"market", "unitLabel":"고객 단위","unitValue":"고객 수","priceLabel":"객단가 항목","priceValue":"객단가","totalLabel":"시장 이름","totalValue":"금액"' },
    funnel:      { name:'퍼널', when:'넓은 채널에서 좁은 고객으로 줄어들 때',
                   spec:'"type":"funnel", "stages":[{"label":"단계","note":"부연"}]' },
    cycle:       { name:'순환', when:'과정이 되돌아와 반복될 때(리텐션·데이터 선순환)',
                   spec:'"type":"cycle", "stages":[{"label":"단계(12자 이내)"}]' },
    hub:         { name:'허브', when:'우리를 중심으로 여러 참여자가 붙을 때(플랫폼)',
                   spec:'"type":"hub", "center":{"label":"우리"}, "spokes":[{"label":"참여자"}]' },
    timeline:    { name:'마일스톤', when:'시점별 목표가 있을 때',
                   spec:'"type":"timeline", "items":[{"when":"시점","label":"마일스톤","note":"부연"}]' }
  };

  //  슬롯 = 슬라이드의 한 자리. 그 자리에 올 수 있는 후보를 **코드가** 정한다.
  var DG_SLOTS = {
    pain:     { label:'Problem — 고객이 잃는 것', src:'타겟 고객·고객의 문제', opts:['pain','gap'] },
    solution: { label:'Solution — 어떻게 푸는가', src:'해결책 작동 원리',      opts:['flow','parallel','layers'] },
    moat:     { label:'경쟁 — 우리의 자리',       src:'기술적 방어 해자',      opts:['position','beforeafter'] },
    market:   { label:'Market — 시장 산출',       src:'SOM 타겟·시장 규모',    opts:['market'] },
    gtm:      { label:'GTM — 고객 확보',          src:'수익 모델·GTM 전략',    opts:['funnel','cycle','hub'] },
    ask:      { label:'Ask — 조달·마일스톤',      src:'조달 목표·마일스톤',    opts:['timeline'] }
  };

  var DG_ORDER = ['pain', 'solution', 'moat', 'market', 'gtm', 'ask'];

  // 슬롯 하나 → SVG. renderDeck·renderDiagrams·regenDiagram이 모두 이 함수를 본다.
  function drawOne(slot, spec){
    var d = (spec || {})[slot];
    if(!d) return '';
    var S = DG_SLOTS[slot];
    var t = String(d.type || '');
    // ★후보 밖의 type은 거부한다. 엉뚱한 자리에 엉뚱한 그림이 들어가느니 비는 편이 낫다.
    if(!S || S.opts.indexOf(t) < 0) return '';
    return DG_DRAW[t] ? DG_DRAW[t](d) : '';
  }

  // 슬롯의 후보 메뉴 — 프롬프트에 넣는다. 전 도식을 다 나열하면 LLM이 고르지 못한다.
  // only = 자리 이름 하나 또는 여러 개(배열). 덱은 ①이 못 채운 자리만 물어본다.
  function slotMenu(only){
    return (only ? (Object.prototype.toString.call(only) === '[object Array]' ? only : [only]) : DG_ORDER).map(function(k){
      var S = DG_SLOTS[k];
      var out = ['## ' + k + ' — ' + S.label + '   (재료: ' + S.src + ')'];
      S.opts.forEach(function(t){
        out.push('   · ' + t + ' = ' + DG_TYPE[t].name + ' — ' + DG_TYPE[t].when);
        out.push('     { ' + DG_TYPE[t].spec + ' }');
      });
      return out.join('\n');
    }).join('\n\n');
  }

  var DG_RULE = [
    '# 도식을 고르는 법 — 이것이 가장 중요하다',
    '자리마다 후보가 여럿이다. **내용이 어떤 관계인지 먼저 판정하고** 그에 맞는 것을 골라라.',
    '- 정해진 순서로 이어지면 flow / 순서 없이 나란하면 parallel / 위아래로 쌓이면 layers',
    '- 되돌아와 반복되면 cycle / 갈수록 줄어들면 funnel / 중심에 우리가 있고 참여자가 붙으면 hub',
    '- 두 방식을 맞세우면 beforeafter / 두 기준으로 자리가 갈리면 position',
    '★보기 좋아서가 아니라 **정보 사이에 그 관계가 실제로 있어서** 고른다.',
    '  관계가 없으면 그 자리는 null이다. 억지로 만들지 마라 — 빈 자리가 틀린 그림보다 낫다.',
    '★각 도식에 "why"를 25자 이내로 적어라. 왜 그 형태를 골랐는지다(예: "순서가 있어 흐름도").'
  //  🔴 여기서 join한다. 배열째로 프롬프트 배열에 넣으면 바깥 join('\n')이 중첩 배열을
  //    toString으로 바꿔 **쉼표 한 줄**로 만든다 — 규칙이 줄글로 뭉개져 모델이 잘 안 읽는다.
  ].join('\n');

  // ══════════════════════════════════════════════════════════════
  //  피칭 덱 (5장 + R&D 부록)
  //
  //  ★도식과 같은 원칙: LLM은 '무엇을 말할지'만 내고, '어떻게 보일지'는 코드가 정한다.
  //  ★그리고 하나 더 — LLM이 낸 문구의 **숫자를 코드가 IR 원문과 대조**한다.
  //    슬라이드에 박힌 허구 수치는 팀이 투자자 앞에서 그대로 읽게 된다.
  //    "지어내지 마라"는 프롬프트만으로는 못 막는다(옛 TIPS 채점에서 이미 겪었다·기록).
  //  ★슬라이드와 도식을 LLM 호출 '한 번'에 받는다 — 계정당 일일 상한을 아껴야 한다.
  // ══════════════════════════════════════════════════════════════
  //  figs = 그 장에 놓을 **슬롯** 이름이다(도식 이름이 아니다).
  //  어떤 도식이 그려질지는 슬롯 안에서 내용의 관계에 따라 정해진다.
  var DECK_SLIDES = [
    { id:'cover',    label:'Cover',            figs:[] },
    { id:'problem',  label:'Problem',          figs:['pain'] },
    //  ★2026-08-22 신설 — 「왜 지금인가」. 20개사 실측에서 전원이 이 항목에 걸렸는데
    //    원인은 기업이 아니라 **덱에 그 자리가 없었던 것**이었다.
    //    🔴 opt = 선택 슬라이드. IR에 타이밍 근거가 없으면 LLM이 null을 내고 이 장은
    //      아예 빠진다 — 빈 장을 끼워 넣지 않는다. 그때 덱 점검이 「없다」고 짚으며,
    //      그 지적은 이제 기업이 손댈 수 있는 것이 된다(IR에 근거를 쓰면 채워진다).
    { id:'why_now',  label:'Why now',          figs:[], opt:true },
    { id:'solution', label:'Solution',         figs:['solution', 'moat'] },
    { id:'market',   label:'Market & BM',      figs:['market', 'gtm'] },
    { id:'team_ask', label:'Team & Ask',       figs:['ask'] }
  ];

  //  ── ① 도식 판정 결과를 프롬프트에 넣는다 (2026-08-22) ──
  //   ★관계 판정은 ①에서 이미 끝났다. 덱에서 다시 고르게 하면 문구 쓰기에 밀려
  //     무난한 형태로 수렴한다(20개사 실측 — 기업이 달라도 덱 도식이 비슷했다).
  //     여기서는 "이렇게 그려져 있으니 문구를 거기 맞춰라"만 말한다.
  function figBlock(){
    var fig = state.lastDiagrams || {};
    var lines = [];
    DG_ORDER.forEach(function(k){
      if(!drawOne(k, fig)) return;                 // ①이 실제로 그린 자리만
      var d = fig[k] || {};
      lines.push('- ' + DG_SLOTS[k].label + ' : ' + ((DG_TYPE[d.type] || {}).name || d.type) +
                 (d.why ? ' (고른 이유: ' + d.why + ')' : ''));
    });
    if(!lines.length) return '';
    return ['', '# ① 이 기업의 도식은 이미 이렇게 판정돼 있다',
            '아래 도식이 슬라이드에 그대로 실린다. **다시 고르지 마라.**',
            '슬라이드 문구는 이 도식과 같은 것을 가리켜야 한다 — 도식은 흐름인데 문구는 병렬을 말하면 읽는 사람이 갈린다.'
           ].concat(lines).join('\n');
  }

  //  ── ② 투자논리 진단 결과를 프롬프트에 넣는다 (2026-08-22) ──
  //   🔴 진단은 **덱을 검열하려고** 넣는 것이 아니다. 무엇이 비어 있는지 이미 가려 놓았으니
  //     그 빈 자리를 슬라이드에서 채운 척하지 못하게 하려고 넣는다.
  //     (덱은 요약이라 단정하기 쉽다 — 원문에서 「계획」이던 것이 슬라이드에서 「사실」이 된다.)
  function auditBlock(){
    var a = state.lastAudit;
    if(!a || a.kind !== 'axis') return '';
    var L = ['', '# ② 투자논리 진단 결과 — 이 덱이 넘지 말아야 할 선'];
    if(a.verdict) L.push('총평: ' + a.verdict);
    var fails = arr(a.thesis && a.thesis.fails).slice(0, 5);
    if(fails.length){
      L.push('', '## 지금 자료로 **성립하지 않는 범위** (슬라이드에서 단정하면 안 된다)');
      fails.forEach(function(x){ L.push('- ' + x); });
    }
    var holds = arr(a.thesis && a.thesis.holds).slice(0, 5);
    if(holds.length){
      L.push('', '## 성립하는 범위 (여기까지만 자신 있게 말하라)');
      holds.forEach(function(x){ L.push('- ' + x); });
    }
    var miss = [];
    arr(a.axes).forEach(function(ax){
      arr(ax.missing).slice(0, 2).forEach(function(m){ miss.push('- ' + (ax.name || ax.id) + ': ' + m); });
    });
    if(miss.length){ L.push('', '## 원문에 **없는 것** (있는 척 쓰지 마라)'); L.push.apply(L, miss.slice(0, 10)); }
    var q = arr(a.questions).filter(function(x){ return x && x.priority === 'P0'; }).slice(0, 3);
    if(q.length){
      L.push('', '## 투자자가 먼저 물을 것 (덱이 이 질문을 피해 가면 안 된다)');
      q.forEach(function(x){ L.push('- ' + x.q); });
    }
    L.push('', '★위 「성립하지 않는 범위」와 「없는 것」은 슬라이드에서 **말하지 않거나, 계획으로 적어라**.',
                '  근거가 없는데 단정하면 투자자 앞에서 그 문장 하나로 덱 전체가 의심받는다.');
    return L.join('\n');
  }

  function deckPrompt(){
    var fig  = state.lastDiagrams || {};
    // ①이 채우지 못한 자리만 덱 호출에서 물어본다. 나머지는 ①의 판정을 그대로 쓴다.

    return [
      '아래 IR을 투자자 앞에서 띄우는 **피칭 덱 5장**으로 압축하라.',

      '',
      '# IR 내용',

      '',

      //   ①과 어긋나면 화면에는 ①이 남으므로 호출만 낭비된다.
      (gaps.length
        ? '  "diagrams": { ' + gaps.map(function(k){ return '"' + k + '":{…}'; }).join(', ') + ' }'
        : ''),
      '}',

      '',

      '',
      gaps.length ? '# 도식 자리와 후보 — ①이 채우지 못한 자리만 (' + gaps.join(', ') + ')' : '',
      gaps.length ? slotMenu(gaps) : '',
      '',
      '# 규칙 (어기면 쓸 수 없는 덱이 된다)',
      '- headline은 **한 문장, 40자 이내**. 슬로건이 아니라 주장이어야 한다.',
      '  나쁜 예: "혁신적인 AI 플랫폼" / 좋은 예: "송장 입력에 하루 3시간을 쓴다"',

      '  근거가 없으면 숫자를 아예 빼고 문장으로 써라. 코드가 원문과 대조해 걸러낸다.',
      '- ★회사명·기관명·경쟁사명도 IR에 있는 것만. 없으면 유형으로 표현하라.',
      '- ★why_now = **IR에 최근 바뀐 외부 변수(규제 시행·기술 상용화·가격·수요 전환)와 그 시점이',
      '  적혀 있을 때만** 만든다. 없으면 **null**로 두고 지어내지 마라 — 빈 장은 만들지 않는다.',
      '  쓸 때는 완료형으로(「~되었다」), 앞으로의 전망(연평균 성장률 등)은 근거로 쓰지 마라.',
      '- rnd = R&D 항목(개발 목표·성능지표)이 IR에 있을 때만. 없으면 null.',
      '- diagrams = 위 "도식 자리와 후보"를 따른다. 각 자리에 "type"과 "why"를 넣고,',
      '  해당 관계가 IR에 없으면 그 자리는 null. 후보에 없는 type은 쓰지 마라.',
      '  market은 Bottom-up만, timeline의 when은 IR에 적힌 시점만, position 좌표는 0~1.',
      deckGuide()
    ].join('\n');
  }

  //  ★덱 영역 문항을 **생성 지침**으로 넣는다(출처 있는 문구만 프롬프트에 들어간다).
  //   🔴 채점기준·레드플래그는 넣지 않는다 — 내부 메타이고, 무엇보다 지침과 점검이
  //     같은 재료면 자기참조가 된다. 점검은 코드(DECK_CHECKS)가 따로 한다.
  function deckGuide(){
    var it = deckItems();
    if(!it.length) return '';
    var lines = it.slice(0, 12).map(function(x){
      return '- ' + String(x.question || '').replace(/\s+/g, ' ').trim();
    });
    return ['', '# 덱 작성 지침 (IR 코칭 지식엔진 · 문항 ' + it.length + '건)',
            '아래는 투자자가 덱에서 확인하려는 것이다. 지어내서 채우지 말고,',
            'IR에 있는 재료로 채울 수 있는 것만 반영하라.'].concat(lines).join('\n');
  }

  // ══ 덱 점검 — 문항ID → 코드 체크 번역표 (2026-08-22) ═══════════════
  //  🔴 왜 번역표가 프론트에 있는가: **엔진은 소비자를 모른다**(엔진 절대규칙).
  //    번들의 요구증거는 "피치덱 파일을 제출하라"처럼 사람이 내는 형태로 쓰여 있다.
  //    그런데 이 덱은 시스템이 만들었으므로 state.lastDeck에서 코드가 바로 꺼낼 수 있다.
  //    그 번역을 엔진에 시키면 엔진이 PitchBuilder를 전제하게 된다 — 그래서 여기에 둔다.
  //
  //  🔴 왜 LLM에게 다시 채점시키지 않는가: 생성 지침을 준 모델이 그 지침 준수를
  //    스스로 채점하면 "내 지침을 따랐나"만 확인하는 자기참조가 된다. 통과율만 오른다.
  //    그래서 점검은 **코드가 원문·형식을 대조**한다(badNumbers·verifyEvidence와 같은 축).
  //
  //  번역표가 없는 문항은 자동 점검하지 않고 「사람 확인」으로 남긴다 —
  //  없는 판정을 지어내는 것보다 확인하지 못했다고 적는 편이 정확하다.
  var DECK_DOMAINS = ['15 DCK', '16 VIZ'];

  //  결론 문장인가 — 명사구로 끝나면 아직 주장이 아니다.
  function isSentence(s){
    s = String(s || '').trim().replace(/[.!?]$/, '');
    if(!s) return false;
    return /(다|요|까|죠|함|됨|든다|한다|된다|이다|있다|없다|낸다|든다|간다|온다)$/.test(s)
        || /(을|를|이|가|은|는)\s+\S+(다|한다|된다|이다)/.test(s);
  }

  var DECK_CHECKS = {
    'IR-DCK-01': function(d){
      //  🔴 cover는 제외한다. 덱 프롬프트가 표지 제목을 「회사명 — 한 줄 정체성」으로
      //    지시하므로 명사구가 정상이다. 빼지 않으면 20개사 전부가 표지 하나 때문에
      //    걸린다 — 기업의 결함이 아니라 이 체크의 결함이다(2026-08-22 20개사 실측).
      var bad = (d.slides || []).filter(function(s){
        return s && s.id !== 'cover' && !isSentence(s.headline);
      });
      return { ok: !bad.length,
               note: bad.length ? bad.length + '장의 제목이 명사구입니다 — 결론 문장으로 바꾸십시오.'
                                : '본문 슬라이드 제목이 모두 완결 문장입니다(표지 제외).' };
    },
    'IR-DCK-03': function(d){
      //  🔴 2026-08-22 이전에는 덱 전체 문구에서 낱말을 찾았고, 덱에 「왜 지금」 자리가
      //    없어 20개사 전원이 걸렸다. 자리를 만든 뒤로는 **그 장이 있는지**를 본다.
      var wn = (d.slides || []).filter(function(s){ return s && s.id === 'why_now'; })[0];
      var body = wn ? [wn.headline, wn.sub].concat(arr(wn.bullets)).join(' ') : '';
      if(!body.trim())
        return { ok:false, note:'「왜 지금인가」 장이 없습니다 — IR에 최근 바뀐 외부 변수와 그 시점을 먼저 쓰십시오.' };
      var when = /\d{4}|\d+년|\d+월|올해|작년|최근/.test(body);
      return { ok: when,
               note: when ? '「왜 지금인가」 장에 바뀐 것과 시점이 함께 있습니다.'
