        a.thesis.fails.forEach(function(t){ h += '<li>' + esc(t) + '</li>'; }); h += '</ul>';
      }
      h += '<p class="pb-note" style="margin-top:8px">앞의 축에서 확인한 범위 안에서만 가른 것입니다. 여기서 우위를 새로 인정하지 않습니다.</p></div>';
    }

    // ── 보강 질문 ──
    if(a.questions.length){
      h += '<div class="pb-axsec"><h4>다음에 답해야 할 질문 <span class="pb-note">P0 = 자금→이정표→위험제거 또는 증거를 끊는 공백</span></h4>';
      a.questions.forEach(function(q){
        h += '<div class="pb-axq is-' + q.priority.toLowerCase() + '"><span class="p">' + q.priority + '</span>' +
             '<div><p class="qq">' + esc(q.q) + '</p>' +
             (q.evidence ? '<p class="ev">필요한 증거 · ' + esc(q.evidence) + '</p>' : '') +
             (q.edges.length ? '<p class="ev">살아나는 연결 · ' + esc(q.edges.join(' · ')) + '</p>' : '') + '</div></div>';
      });
      if(a.dropped) h += '<p class="pb-note">상한(7개·P0 3·P1 3·P2 1)을 넘긴 질문 ' + a.dropped + '개는 버렸습니다.</p>';
      h += '</div>';
    }
    h += '</div>';
    box.innerHTML = h;

  // ── ④ 최종 산출물 보관 ──
  //  ①(단계별 원고)은 덮어쓰지만 ④는 만들 때마다 쌓인다 — 지난 덱을 되찾을 수 있어야 한다.
  function saveOutput(kind, btn){
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 보관할 수 없습니다.'); return; }
    // ★낡은 진단이 한 벌로 묶여 ④에 쌓이면, 나중에 되찾을 때 그것이 '그때의 점수'로 읽힌다.
    //   보관을 막지는 않는다 — 원고만 보관하려는 경우도 있다. 다만 모르고 넘어가게 두지 않는다.
    var st = [];
    if(irStale(state.auditHash)) st.push('투자논리 진단');
    if(st.length && !confirm(
        st.join('·') + '은 지금 원고보다 낡았습니다(고치신 뒤 다시 하지 않았습니다).\n\n' +
        '이대로 보관하면 낡은 결과가 이 원고의 것으로 함께 쌓입니다.\n\n계속 보관할까요?')) return;

    var fd = state.formData, tot = 0, n = 0;
    steps().forEach(function(s){ s.inputs.forEach(function(i){
      tot++; if((fd[i.key] || '').trim()) n++; }); });

    var body = { action:'saveoutput', id:llm.id, code:llm.code,
                 kind:kind, snapshot:snapshot(),
                 filledRatio: tot ? Math.round(n / tot * 100) / 100 : 0 };

    if(kind === '피칭 덱' && state.lastDeck){
      body.deck = state.lastDeck.slides;
      body.diagrams = state.lastDeck.diagrams;
      body.slideCount = arr(state.lastDeck.slides).length;
      // 어떤 형태를 왜 골랐는지 — 나중에 이 덱을 다시 볼 때 판단 근거가 된다
      var notes = [];
      DG_ORDER.forEach(function(k){
        var dd = (state.lastDeck.diagrams || {})[k];
        if(dd && dd.type) notes.push(k + '=' + ((DG_TYPE[dd.type] || {}).name || dd.type) +
                                     (dd.why ? ' · ' + dd.why : ''));
      });
      body.figureNote = notes.join(' / ');
      var bad = 0;
      arr(state.lastDeck.slides).forEach(function(s){
        [s.headline, s.sub].concat(arr(s.bullets)).forEach(function(t){ bad += badNumbers(t).length; });
      });
      body.unverified = bad;
    }
    if(kind === '도식 묶음' && state.lastDiagrams){
      body.diagrams = state.lastDiagrams;
      var n2 = [];
      DG_ORDER.forEach(function(k){
        var dd = state.lastDiagrams[k];
        if(dd && dd.type) n2.push(k + '=' + ((DG_TYPE[dd.type] || {}).name || dd.type));
      });
      body.figureNote = n2.join(' / ');
    }

    var label = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = '보관 중…'; }
    callProxy(body)
      .then(function(){ alert('노션 ④ 최종 산출물에 보관했습니다.'); })
      .catch(function(err){ alert('보관하지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){ if(btn){ btn.disabled = false; btn.textContent = label; } });
  }

  function doSubmit(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 제출할 수 없습니다.'); return; }
    var already = state.status === '제출';
    if(!confirm(already ? '다시 제출하시겠습니까? 마감은 없으며 최신 내용으로 갱신됩니다.'
                        : '제출하시겠습니까? 제출 후에도 계속 고치고 다시 제출하실 수 있습니다.')) return;
    state.lastLagmp = null;
    var btn = $('btnSubmit'), lab = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = '제출 자료 만드는 중…'; }
    //  ★도식이 든 PDF 를 만들어 함께 보낸다(2026-08-22 민부장 지시).
    //   서버(GAS)가 만드는 PDF 에는 도식이 없다 — 도식은 브라우저가 그리기 때문이다.
    submitPdf()
      .then(function(pdf){ return syncToServer({ submit:true, pdf:pdf }); })
      .then(function(){
        if(btn){ btn.disabled = false; btn.textContent = lab; }
        renderResultView();

  //  ── 제출과 함께 보낼 PDF ── IR 본문 + 도식(결과 화면의 [IR 본문 PDF 다운로드]와 같은 것).
  //   🔴 실패해도 null 을 돌려준다. PDF 를 못 만들었다고 제출이 막히면 안 된다 —
  //     그때는 서버가 만든 텍스트 PDF 가 대신 올라간다.
  //   🔴 큰 파일은 보내지 않는다. 요청이 통째로 실패하면 제출 자체가 실패한다.
  var SUBMIT_PDF_MAX = 8000000;                       // base64 글자 수(≈ 6MB 원본)
  var SUBMIT_PDF_WAIT = 25000;                        // 25초
  function submitPdf(){
    var els = [$('secIR'), $('secFig')].filter(Boolean);
    if(!els.length) return Promise.resolve(null);
    //  🔴 반드시 시간 제한을 건다. CDN 이 막힌 망에서는 스크립트 로드가 성공도 실패도 하지
    //    않고 매달릴 수 있고, 그러면 **제출 버튼이 영영 안 끝난다**. 못 만들면 없는 채로 보낸다.
    var raced = Promise.race([
      exportFlowPdf(els, 'IR자료', null, { returnData:true }),
      new Promise(function(res){ setTimeout(function(){ res(null); }, SUBMIT_PDF_WAIT); })
    ]);
    return raced
      .then(function(uri){
        var b64 = String(uri || '').split(',')[1] || '';
        if(!b64) return null;
        if(b64.length > SUBMIT_PDF_MAX){ console.warn('제출 PDF 가 너무 큽니다', b64.length); return null; }
        return { b64: b64 };
      })
      .catch(function(err){ console.warn('제출 PDF', err); return null; });
  }

  //  ── ⑤ 성장관리 플랫폼 반영 결과를 사람 말로 옮긴다(2026-08-22) ──
  //   🔴 "성공했다"만 말하지 않는다. 사본이 안 갔으면 그렇다고 말해야 기업이
  //     관리자에게 알릴 수 있다 — 모르면 멘토가 안 본 채로 시간이 간다.
  function lagmpMsg(){
    var g = state.lastLagmp;
    if(!g) return '성장관리 플랫폼 연동은 켜져 있지 않습니다 — 담당자가 별도로 확인합니다.';
    //  ★알림창과 화면 양쪽에 그대로 쓰인다 — 태그를 넣지 않는다(알림창엔 글자로 보이고 화면은 이스케이프된다).
    if(g.ok && g.file)
      return '성장관리 플랫폼의 [② IR 고도화 · 검토 대상 IR 파일]에 이번 원고가' +
             (g.kind === 'screen' ? ' 도식과 함께' : '') + ' 올라갔습니다.';
    if(g.ok && !g.file)  return '성장관리 플랫폼에 제출 기록은 올라갔으나 IR 파일은 붙이지 못했습니다. 담당자에게 알려 주십시오.';
    if(g.error === 'off')   return '성장관리 플랫폼 연동은 켜져 있지 않습니다 — 담당자가 별도로 확인합니다.';
    if(g.error === 'role')  return '성장관리 플랫폼 반영은 기업 계정으로 제출할 때만 이뤄집니다.';
    if(g.error === 'login') return '성장관리 플랫폼에 연결하지 못했습니다(계정). 담당자에게 알려 주십시오.';
    if(g.error === 'scope') return '성장관리 플랫폼에서 이 기업을 찾지 못했습니다. 담당자에게 알려 주십시오.';
    return '성장관리 플랫폼에 반영하지 못했습니다. 제출 자체는 정상 저장되었습니다 — 담당자에게 알려 주십시오.';
  }

  // ── 도식 하나만 다시 뽑기 ──
  //  ★[덱 전체 다시]는 슬라이드 문구까지 새로 만든다. 도식 하나 때문에 문구를 잃을 이유가 없다.
  function regenDiagram(slot, btn){
    if(busy || !state.lastDeck) return;
    var S = DG_SLOTS[slot];
    if(!S) return;
    var prompt = [
      '아래 IR에서 "' + S.label + '" 자리에 들어갈 도식 하나만 다시 뽑아라. 다른 자리는 만들지 마라.',
      '이미 쓰인 내용에서만 뽑아라. 없는 숫자·연도·기관명·회사명을 지어내면 안 된다. 모르면 "[__]"로 비워라.',
      '', DG_RULE, '',
      '# IR 내용', contextBlock(null), '',
      '# 이 자리의 후보', slotMenu(slot), '',
      '# 출력 JSON — 이 키 하나만',
      '{ "' + slot + '": { "type":"위 후보 중 하나", … , "why":"고른 이유(25자 이내)" } }', '',
      'IR에 해당 내용이 아예 없으면 그 키를 null로 두어라. 억지로 만들지 마라.'
    ].join('\n');

    var label = btn.textContent;
    busy = true; btn.disabled = true; btn.textContent = '뽑는 중…';
    callLLM(SYSTEM, prompt)
      .then(function(d){
        state.lastDeck.diagrams = state.lastDeck.diagrams || {};
        // ★슬라이드 문구(slides)는 건드리지 않는다. 이 도식 하나만 갈아끼운다.
        state.lastDeck.diagrams[slot] = (d && d[slot]) || null;
        render();
      })
      .catch(function(err){ alert('도식을 다시 뽑지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if(btn && btn.isConnected){ btn.disabled = false; btn.textContent = label; }
      });
  }

  //  ── ③ IR 피칭 자료 카드 ── 관문 ①②를 지났는지에 따라 안내가 달라진다.

  //  ── 덱 점검 카드 ── 만들어진 덱을 덱 영역 문항으로 점검한다(2026-08-22).
  //   ★판정은 코드가 한다. LLM 호출을 추가하지 않는다.
  //   ★번역표가 없는 문항은 「사람 확인」으로 남긴다 — 없는 판정을 지어내지 않는다.
  function deckCheckCard(){
    var items = deckItems();
    var h = '<div class="pb-card pb-noprint" style="margin-top:18px">' +
              '<h3>덱 점검 <span class="pb-note" style="font:inherit;font-size:13px">전달 형식 · 점수 없음</span></h3>';
    if(!state.lastDeck || !arr(state.lastDeck.slides).length){
      return h + '<p class="pb-note">위에서 <b>[IR 피칭 자료 만들기]</b>로 덱을 만드시면 ' +
                 '이 자리에서 덱을 점검해 드립니다. 투자논리 진단(증거)과는 다른 축입니다 — ' +
                 '여기서는 <b>전달 형식</b>만 봅니다.</p></div>';
    }
    if(!items.length){
      return h + '<p class="pb-note">지식 번들이 아직 도착하지 않아 점검 항목이 비어 있습니다. ' +
                 '다시 로그인하시면 받아옵니다.</p></div>';
    }
    var d = state.lastDeck, auto = 0, pass = 0, manual = [];
    h += '<p class="pb-note">덱을 만든 뒤 <b>코드가</b> 원문·형식과 대조한 결과입니다. ' +
         'AI에게 다시 채점시키지 않습니다 — 자기가 준 지침을 자기가 채점하면 검사가 되지 않습니다.</p>' +
         '<div style="margin-top:12px">';
    items.forEach(function(it){
      var fn = DECK_CHECKS[it.id];
      if(!fn){ manual.push(it); return; }
      var r;
      try{ r = fn(d); }catch(e){ r = { ok:false, note:'점검 중 오류가 나 확인하지 못했습니다.' }; }
      auto++; if(r.ok) pass++;
      h += '<div class="pb-ck ' + (r.ok ? 'ok' : 'yet') + '"><span>' + (r.ok ? '✓' : '—') + '</span>' +
           esc(String(it.question || '').replace(/\?$/, '')) + '</div>' +
           '<p class="pb-note" style="margin:2px 0 10px 26px">' + esc(r.note) + '</p>';
    });
    h += '</div>';
    if(manual.length){
      h += '<div class="pb-hr" style="margin:12px 0"></div>' +
           '<p class="pb-note" style="margin-bottom:6px">코드가 확인할 수 없어 <b>사람이 볼 항목</b> — ' +
           manual.length + '건</p>';
      manual.forEach(function(it){
        h += '<div class="pb-ck yet"><span>·</span>' + esc(String(it.question || '')) + '</div>';
        var need = arr(it.evidence);
        if(need.length) h += '<p class="pb-note" style="margin:2px 0 10px 26px">필요한 것 — ' +
                             esc(need.join(' / ')) + '</p>';
      });
    }
    h += '<p class="pb-note" style="margin-top:12px">자동 점검 ' + pass + '/' + auto + '건 통과' +
         (manual.length ? ' · 사람 확인 ' + manual.length + '건' : '') + '. ' +
         '통과가 좋은 덱을 뜻하지는 않습니다 — 형식은 지켜도 감점만 면할 뿐입니다.</p>' +
         '</div>';
    return h;
  }

  function runDiagrams(){

    var btn = $('btnFig');

  }

  // ══ 통신 ══════════════════════════════════════════════════════
  //  계약(엔드포인트·파라미터·에러 의미)은 구 실행본과 동일하다. 서버(Code.gs)는 무변경이다.
  //  근거 패턴: [[패턴_GAS_토큰인증_역할별인가_백엔드]] · [[패턴_디자인핸드오프_기존시스템_이식]]

  // ★검수 스위치 — ?local=1 이면 서버를 부르지 않는다.
  //   빌드본을 서버에 붙이지 않고도 두 동선(관리자/기업)을 같은 파일로 검수할 수 있다.
  var LOCAL = /[?&]local=1/.test(location.search);

  // GAS 웹앱 URL. 주소를 아는 것만으로는 아무것도 못 한다 — 계정이 있어야 하고,
  // 계정은 자기 기업에만 닿는다(서버가 강제).
  var PROXY = 'https://script.google.com/macros/s/AKfycbxJfH8gIyeDDU4HPt1tsqRrmIdIgeQaXyQ_rf1BhkNiOysVkQRiHxKw-pD2I46C4LYZ/exec';

  function serverOn(){ return !LOCAL && !!llm.proxy; }
  function isAdmin(){ return llm.reviewer === true; }

  // ★재시도 정책 — 서버가 '확정'한 응답은 재시도하지 않는다.
  //   notfound·forbidden을 재시도 대상으로 두면 캐시가 영영 안 차고 영구 스피너가 된다.
  //   재시도는 '아직 모르는 것'(혼잡·통신·시간초과)에만 건다.
  var RETRYABLE = { busy:1, network:1, timeout:1, RATE:1, HTTP503:1 };
  function retryable(code){ return !!RETRYABLE[String(code || '')]; }

  // ── GAS 호출 ──
  //  ★POST는 반드시 text/plain 으로 보낸다. application/json 이면 브라우저가
  //    OPTIONS 프리플라이트를 보내는데 GAS는 그것을 처리하지 못한다.
  function callProxy(payload){
    return fetch(llm.proxy, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.json().catch(function(){
        throw new Error('서버 응답을 해석하지 못했습니다. 프록시 주소를 확인하세요.');
      });
    }).then(function(d){
      if(!d || !d.ok){
        var err = new Error((d && d.error) || '서버 오류');
        err.code = (d && d.code) || 'ERR';
        throw err;
      }
      return d;
    });
  }
  function apiGet(action, params){
    var qs = ['action=' + encodeURIComponent(action),
              'id=' + encodeURIComponent(llm.id),
              'code=' + encodeURIComponent(llm.code)];
    Object.keys(params || {}).forEach(function(k){
      if(params[k] != null && params[k] !== '') qs.push(k + '=' + encodeURIComponent(params[k]));
    });
    var url = llm.proxy + (llm.proxy.indexOf('?') < 0 ? '?' : '&') + qs.join('&');
    return fetch(url).then(function(r){ return r.json(); });
  }

  // ── Gemini ──
  //  교체 지점은 이 함수 하나뿐이다.
  var GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
  function callLLM(system, user){
    if(LOCAL) return Promise.reject(new Error('로컬 검수 모드입니다 — AI를 부르지 않습니다.'));
    if(llm.conn === 'proxy'){
      return callProxy({ action:'llm', id:llm.id, code:llm.code,
                         system:system, user:user, reviewer: !!llm.reviewer })
             .then(function(d){ llmBump(); quotaTake(d); return parseJSON(d.text); });
    }
    var url = GEMINI_BASE + encodeURIComponent(llm.model) +
              ':generateContent?key=' + encodeURIComponent(llm.key);
    return fetch(url, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        systemInstruction:{ parts:[{ text:system }] },
        contents:[{ role:'user', parts:[{ text:user }] }],
        // ★투자논리 진단·덱은 응답이 길다.
        //   2048로는 잘려 MAX_TOKENS가 난다 — JSON 파싱 실패의 진짜 원인이 이것이었다.
        generationConfig:{ temperature:0.4, responseMimeType:'application/json', maxOutputTokens:8192 }
      })
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
        var cand = data && data.candidates && data.candidates[0];
        if(!cand) throw new Error((data && data.promptFeedback && data.promptFeedback.blockReason)
                                  ? '안전 필터에 걸렸습니다.' : '응답이 비었습니다.');
        var text = '', parts = cand.content && cand.content.parts;
        if(parts) parts.forEach(function(p){ if(p.text) text += p.text; });
        if(cand.finishReason === 'MAX_TOKENS') throw new Error('응답이 너무 길어 잘렸습니다.');
        llmBump();
        return parseJSON(text);
      });
    });
  }

  // ── 서버 설정·상태 받아오기 ──
  //  ★설정의 정본은 서버(APP_CONFIG)다. localStorage를 신뢰하지 않는다 —
  //    팀이 개발자도구로 고쳐놨더라도 서버 값이 이긴다.
  function pullConfig(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('ping', {}).then(function(d){
      if(!d || !d.ok) return;
      llm.reviewer = !!d.reviewer;            // 심사자 권한도 서버 판정을 따른다
      quotaTake(d);                      // 남은 AI 사용 횟수(기업에게만 내려온다)
      var c = d.config;
      if(c){
        if(c.model) llm.model = c.model;
        if(typeof c.tipsMode === 'boolean') llm.tipsMode = c.tipsMode;
      }
      $('hdTips').classList.toggle('on', llm.tipsMode);
    }).catch(function(){});                   // 실패해도 화면을 멈추지 않는다
  }
  // ── 서버 초안(2026-08-19 신설) ──
  //  이노테크 제출 자료(신청서·사업계획서·아이템 분석)로 만든 초안이 서버 ①에 들어 있다(sync_drafts.py).
  //  ★로컬에 아무것도 없으면 조용히 그 초안으로 시작한다(기업이 [저장분 불러오기]를 몰라도 초안을 본다).
  //  ★로컬에 글이 있고 서버와 다르면 덮지 않는다 — 배너로 알리고 선택은 기업이 한다(원고 소유권은 기업).
  function pullServerDraft(){
    if(!serverOn() || (typeof admin !== 'undefined' && admin && admin.editing)) return Promise.resolve();
    return apiGet('load', {}).then(function(d){
      if(!d || !d.ok || !d.snapshot || !d.snapshot.formData) { state.serverDraft = null; return; }
      var fd = d.snapshot.formData, has = Object.keys(fd).some(function(k){ return String(fd[k] || '').trim(); });
      if(!has){ state.serverDraft = null; return; }
      var localHas = Object.keys(state.formData || {}).some(function(k){ return String(state.formData[k] || '').trim(); });
      if(!localHas){ applySnapshot(d.snapshot); state.serverDraft = null; writeLocal(); if(state.view === 'write') render(); return; }
      state.serverDraft = (hashOf(normTxt(JSON.stringify(fd))) === hashOf(normTxt(JSON.stringify(state.formData)))) ? null : d.snapshot;
      if(state.view === 'write') render();
    }).catch(function(){});
  }

  function pullStatus(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('list', {}).then(function(d){
      if(!d || !d.ok) return;
      var me = (d.companies || [])[0];        // 팀은 자기 기업 한 줄만 온다
      if(!me) return;
      state.status = me.status || '';
      state.submittedAt = me.submittedAt || '';
    }).catch(function(){});
  }

  // ── 스냅샷 ──
  function snapshot(){
    return {
      schema: 'pitchbuilder.snapshot.v1',
      exportedAt: new Date().toISOString(),
      company: state.formData.companyName || '',
      cid: state.cid || '',
      mode: llm.tipsMode ? 'IR 8단계' : 'IR 6단계',
      model: llm.model,
      formData: state.formData,
      audit: state.lastAudit || null,
      // ★"이 진단은 어느 원고의 것인가"를 서버에도 넘긴다.
      //   지금까지 낡음 판정은 이 브라우저만 알았다 — 노션을 보는 사람은 점수만 보고
      //   그것이 이미 고친 원고 이전의 것인지 알 수 없었다(설계정본 미결 6).
      irHash: irHash(),
      irHash: irHash()
    };
  }
  // ★빈 값은 보내지 않는다.
  //   한 기업을 두 사람이 각자 PC에서 쓰면, 먼저 저장한 쪽의 빈 칸이 나중 사람 작업을 지운다.
  //   대가: 팀이 칸을 일부러 비워도 서버에선 안 지워진다(지우는 것보다 남기는 쪽이 안전하다).
  function filledOnly(fd){
    var out = {};
    Object.keys(fd || {}).forEach(function(k){
      if(String(fd[k] || '').trim()) out[k] = fd[k];
    });
    return out;
  }

  // ── 서버 저장 (단계 이동마다 자동) ──
  //  ★늦게 온 응답이 최신 상태를 되돌리지 못하게 시퀀스를 센다.
  var syncSeq = 0, syncing = false;
  function syncToServer(opts){
    if(!serverOn() || syncing) return Promise.resolve();
    var body = snapshot();
    body.formData = filledOnly(body.formData);
    if(!Object.keys(body.formData).length) return Promise.resolve();

    var my = ++syncSeq;
    syncing = true;
    chip('saving');
    return callProxy({ action:(opts && opts.submit) ? 'submit' : 'save',
                       id:llm.id, code:llm.code, snapshot:body, submit:!!(opts && opts.submit),
                       // ⑤ 성장관리 플랫폼에 붙일 도식 포함 PDF(제출일 때만·없으면 서버가 대신 만든다)
                       pdfB64: (opts && opts.pdf && opts.pdf.b64) || '' })
      .then(function(d){
        if(my !== syncSeq) return;            // 더 최신 저장이 이미 끝났다 — 무시한다
        if(d.status) state.status = d.status;
        if(d.submittedAt) state.submittedAt = d.submittedAt;
        // ⑤ 성장관리 플랫폼 반영 결과(제출일 때만 온다). 조용히 버리지 않는다 —
        //   기업은 "제출했으니 멘토가 본다"고 믿는데 사본이 안 갔을 수 있다.
        if(opts && opts.submit) state.lastLagmp = d.lagmp || null;
        chip('ok');
      })
      .catch(function(err){
        // ★실패를 조용히 넘기지 않는다. 저장 안 됐는데 됐다고 믿고 창을 닫는 게 최악이다.
        chip('fail');
        if(retryable(err.code)) setTimeout(function(){ syncToServer(opts); }, 4000);
      })
      .then(function(){ syncing = false; });
  }

  // ── 노션에서 불러오기 ──
  function applySnapshot(s){
    state.serverDraft = null;
    var fd = (s && s.formData) ? s.formData : s;      // 옛 형식(formData만)도 받아준다
    if(!fd || typeof fd !== 'object') throw new Error('형식을 알 수 없습니다.');

    state.formData = {};
    Object.keys(PLACEHOLDER_RESULT).forEach(function(k){
      if(typeof fd[k] === 'string') state.formData[k] = fd[k];
    });
    state.cid        = s.cid || '';
    state.lastAudit  = s.audit || null;
    state.status     = s.status || '';
    state.submittedAt= s.submittedAt || '';
    // ★단계별 진단은 이 원고에 대한 것이 아니다 — 다른 PC에서 쓴 원고를 받아왔을 수도 있다.
    state.diags = {};
    // ★진단은 받아 쓰지만 '무엇을 보고 낸 것인지'는 모른다.
    //   모르는 것을 낡았다고 하지도, 최신이라고 하지도 않는다 → 빈 해시 = 판정 불가.
    state.auditHash = '';

    // ★R&D 항목이 있으면 R&D 대응을 켠다 — 안 켜면 그 입력이 화면에서 사라진다
    var hasRnd = ['devGoal','devPrior','devKpi','devVerify'].some(function(k){
      return (state.formData[k] || '').trim();
    });
    if(hasRnd && !llm.tipsMode){
      llm.tipsMode = true;
      $('hdTips').classList.add('on');
    }
    state.stepIndex = 0;
    saveLocal();
    render();
  }
  function notionLoad(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않습니다. 로컬 저장분만 사용합니다.'); return; }
    apiGet('load', { company: state.formData.companyName || '' }).then(function(d){
      if(!d || !d.ok){
        alert(d && d.error ? d.error : '불러오지 못했습니다.');
        return;
      }
      if(!d.snapshot){ alert('서버에 저장된 자료가 없습니다.'); return; }
      applySnapshot(d.snapshot);
      alert('불러왔습니다.');
    }).catch(function(err){ alert('불러오지 못했습니다 — ' + (err.message || '오류')); });
  }

  // ══ B1 이노테크 접수 불러오기 ═════════════════════════════════
  //  ★출발점을 옮기는 것이지 완성이 아니다. 기업이 이 위에서 고치고, 고칠 때마다 피드백을 받는다.
  //  ★덮어쓰기는 전체다. 부분 병합하면 무엇이 남고 무엇이 바뀌었는지 알 수 없게 된다.
  //  ★되돌리기는 두지 않는다 — 사전 경고가 그 역할이다.
  //    되돌리기가 있으면 "일단 눌러보자"가 되어 경고가 무의미해진다.
  function loadB1(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 신청서를 불러올 수 없습니다.'); return; }
    if(busy) return;

    var written = Object.keys(state.formData).filter(function(k){
      return String(state.formData[k] || '').trim();
    }).length;
    if(written && !confirm(
        '신청서 내용으로 ' + written + '개 칸이 통째로 대체됩니다.\n\n' +
        '지금까지 고치신 내용은 사라집니다' +
        (llm.tipsMode ? ' (R&D 2단계 포함).' : '.') + '\n' +
        'AI 진단·투자논리 진단 결과도 함께 지워집니다.\n\n계속할까요?')) return;

    var btn = $('hdB1');
    busy = true; btn.disabled = true; btn.textContent = '불러오는 중…';
    apiGet('b1', (admin && admin.editing) ? { cid: admin.editing.cid } : {})
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.error) || '불러오지 못했습니다.');
        if(!d.found){
          alert('접수 시스템에서 귀사의 신청서를 찾지 못했습니다.\n' +
                '접수번호가 다르거나 신청 자료가 없는 경우입니다.');
          return;
        }
        // 전체 대체 — 아는 필드만 받는다(신청 DB가 바뀌어도 엉뚱한 키가 들어오지 않게)
        state.formData = {};
        Object.keys(d.formData || {}).forEach(function(k){
          if(PLACEHOLDER_RESULT[k] !== undefined && String(d.formData[k] || '').trim()){
            state.formData[k] = d.formData[k];
          }
        });
        // 내용이 통째로 바뀌었으므로 그 위에서 나온 판단은 전부 버린다
        state.diags = {}; state.lastAudit = null;
        state.lastDiagrams = null; state.lastDeck = null;
        state.auditHash = '';
        state.b1ref = d.ref || null;
        state.b1At = new Date().toISOString();
        state.stepIndex = 0;
        // ★가져왔으면 그 내용을 보여줘야 한다 — 다른 화면에 머물면 "눌렀는데 아무 일도 없다"가 된다
        state.view = 'write';

        saveLocal();
        syncToServer();
        render();
        alert('신청서에서 ' + (d.filled || 0) + '개 칸을 가져왔습니다.\n\n' +
              '이제 고치실 차례입니다 — 고칠 때마다 코치가 다시 봅니다.');
      })
      .catch(function(err){ alert('불러오지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if($('hdB1')){ $('hdB1').disabled = false; $('hdB1').textContent = '신청서 내용 가져오기'; }
      });
  }

  // ══ 로그인 ════════════════════════════════════════════════════
  //  ★인증의 정본은 서버다. 로컬 검수 모드(?local=1)에서만 아이디로 역할을 흉내낸다.
  function enter(){
    var id = $('inId').value.trim(), code = $('inCode').value.trim();
    var e = $('loginErr');
    if(!id || !code){
      e.textContent = '접수번호와 접속코드를 모두 입력하십시오.';
      e.classList.remove('hidden');
      return;
    }
    llm.id = id; llm.code = code;
    llm.proxy = PROXY;
    llm.conn = PROXY ? 'proxy' : 'byok';

    if(!serverOn()){
      // 로컬 검수 — 서버가 없으므로 아이디로 역할만 가른다(패턴 §8 검수 스위치)
      llm.reviewer = (id === 'admin');
      openApp('로컬 검수 모드');
      return;
    }
    e.classList.add('hidden');
    $('btnLogin').disabled = true; $('btnLogin').textContent = '확인 중…';
    apiGet('ping', {}).then(function(d){
      if(!d || !d.ok){
        // ★"새 코드는 발급되지 않았다"는 서버 메시지와 무관하게 **항상** 붙인다.
        //   접속코드가 LAGMP와 같은 것이라, 팀이 새 코드를 기다리며 멈추는 일이 실제로 생긴다.
        e.innerHTML = esc((d && d.error) || '아이디 또는 접속코드가 올바르지 않습니다.') +
          '<br><span style="display:inline-block;margin-top:6px;font-size:13px;color:var(--pb-text-mute)">' +
          '성장관리플랫폼에서 쓰시던 코드와 같습니다 — 새 코드는 발급되지 않았습니다.</span>';
        e.classList.remove('hidden');
        return;
      }
      llm.reviewer = !!d.reviewer;
      quotaTake(d);                      // 남은 AI 사용 횟수(기업에게만 내려온다)
      state.cid = d.cid || id;
      if(d.company) state.formData.companyName = state.formData.companyName || d.company;
      if(d.config){
        if(d.config.model) llm.model = d.config.model;
        if(typeof d.config.tipsMode === 'boolean') llm.tipsMode = d.config.tipsMode;
      }
      openApp(d.company || '');
      pullStatus(); pullBrain(); pullServerDraft();
    }).catch(function(){
      e.textContent = '서버에 연결하지 못했습니다. 주소와 네트워크를 확인하십시오.';
      e.classList.remove('hidden');
    }).then(function(){
      $('btnLogin').disabled = false; $('btnLogin').textContent = '들어가기';
    });
  }
  function openApp(label){
    loadLocal();
    $('viewLogin').classList.add('hidden');
    ['pbHead','pbMeta','pbShell'].forEach(function(k){ $(k).classList.remove('hidden'); });
    $('hdTips').classList.toggle('on', llm.tipsMode);
    $('hdWho').textContent = llm.id + (label ? '  ·  ' + label : '') +
                             (isAdmin() ? '  ·  관리자' : '');
    // 관리자 전환 버튼은 서버가 관리자로 판정한 경우에만 만든다
    // ★[직접 입력] = 접수 명부에 없는 기업을 만드는 버튼.
    //   (대시보드 ↔ 작성 화면 전환은 로고가 맡는다 — 버튼 둘이 같은 일을 하면 안 된다.)
    if(isAdmin() && !$('hdNew')){
      var b = document.createElement('button');
      b.className = 'pb-hbtn'; b.id = 'hdNew'; b.textContent = '직접 입력';
      b.title = '이노테크 접수 명부에 없는 기업을 새로 만듭니다';
      b.onclick = adminNewCompany;
      $('hdTips').parentNode.insertBefore(b, $('hdTips'));
    }

    // ★기업은 처음 한 번 R&D 대응 여부를 정한다. 관리자는 묻지 않는다(전체 설정을 다루는 쪽이다).
    if(!isAdmin()){
      var ch = tipsChoice();
      if(ch === 'yes' || ch === 'no') llm.tipsMode = (ch === 'yes');
      else askTipsOnce();
      $('hdTips').classList.toggle('on', llm.tipsMode);
      state.stepIndex = Math.min(state.stepIndex, steps().length - 1);
    }

    // ★팀에게는 관리자 화면이 열릴 여지를 두지 않는다(앞 세션의 view가 남을 수 있다)
    if(isAdmin()){ goAdmin(); }
    else { state.view = 'write'; admin.editing = null; render(); }
  }

  //  묻는 것은 한 번뿐이다. 그 뒤엔 상단 토글로 언제든 바꾼다.
  function askTipsOnce(){
    var yes = confirm(
      'R&D 과제(정부 R&D 등)를 준비하십니까?\n\n' +
      '[확인] 예 — R&D 2단계(개발 목표 · 성능지표)가 더해져 8단계로 작성합니다\n\n' +
      '[취소] 아니오 — 투자용 IR 6단계만 작성합니다\n\n' +
      '※ 상단 [R&D 대응] 버튼으로 언제든 바꾸실 수 있습니다.');
    llm.tipsMode = !!yes;
    setTipsChoice(llm.tipsMode);
  }
  $('btnLogin').onclick = enter;
  $('inCode').onkeydown = function(e){ if(e.key === 'Enter') enter(); };
  $('inId').onkeydown  = function(e){ if(e.key === 'Enter') $('inCode').focus(); };

  // ══ 헤더 ══════════════════════════════════════════════════════
  //  로고 = 처음 화면. 관리자는 대시보드로, 팀은 작성 1단계로 돌아간다.
  //  ★대리 편집 중이라면 그것부터 닫는다 — 대시보드로 가면서 편집 상태만 남으면
  //    그 뒤 저장이 어느 기업으로 가는지 화면만 봐서는 알 수 없게 된다.
  function goHome(){
    if(admin && admin.editing){ adminCloseIR(); return; }
    if(isAdmin()){ goAdmin(); return; }
    state.view = 'write';
    state.stepIndex = 0;
    render();
    window.scrollTo(0, 0);
  }
  $('hdHome').onclick = goHome;
  $('hdHome').onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goHome(); } };

  $('hdTips').onclick = function(){
    llm.tipsMode = !llm.tipsMode;
    // 기업이 손으로 바꾼 것도 그 기업의 선택이다 — 다음 접속에 서버 기본값이 되돌리면 안 된다
    if(!isAdmin()) setTipsChoice(llm.tipsMode);
    this.classList.toggle('on', llm.tipsMode);
    state.stepIndex = Math.min(state.stepIndex, steps().length - 1);
    render();
  };
  $('hdExit').onclick = function(){
    ['pbHead','pbMeta','pbShell'].forEach(function(k){ $(k).classList.add('hidden'); });
    $('viewLogin').classList.remove('hidden');
    $('loginErr').classList.add('hidden');
    $('inCode').value = '';
    state.formData = {};                      // 메모리도 비운다
    // ★판단도 함께 비운다 — 칸만 갈라두면 메모리 경로로 샌다(로그인 시 loadLocal이 또 비운다: 두 겹)
    state.diags = {};
    state.auditHash = '';
    state.lastAudit = null;
    state.b1ref = null; state.b1At = '';
    // ★대리 편집 상태도 반드시 푼다. 남겨두면 다음 로그인이 그 기업 칸을 열어
    //   다른 사람이 남의 원고를 보게 된다.
    admin.editing = null; admin.rows = [];
    admin.applicants = []; admin.q = '';

    // 🔴 화면 상태와 권한도 반드시 되돌린다.
    //    안 그러면 관리자로 들어갔다 나간 뒤 팀으로 로그인했을 때
    //    state.view가 'admin'인 채로 남아 **팀에게 관리자 대시보드가 그려진다**
    //    — 작성칸이 아예 없으니 [신청서 내용 가져오기]도 옮겨갈 곳이 없다.
    state.view = 'write';
    state.stepIndex = 0;
    state.cid = '';
    llm.reviewer = false;
    // 관리자 전용 버튼은 DOM에 남으므로 직접 걷어낸다(다음 사람이 누를 수 있다)
    ['hdNew', 'hdAdmin'].forEach(function(id){
      var el = $(id); if(el && el.parentNode) el.parentNode.removeChild(el);
    });
  };
  $('hdB1').onclick   = loadB1;
  $('hdSave').onclick = function(){ saveLocal(); syncToServer(); };
  $('hdLoad').onclick = notionLoad;

  // ══ 초기화 ════════════════════════════════════════════════════
  //  ★"초기화 = 작성 현황에서 삭제"다(민부장님 정의, 2026-07-30).
  //    화면만 비우면 목록에 그대로 남아 지운 것처럼 보이지 않는다.
  //  ★단 완전 삭제는 하지 않는다 — 서버가 노션 **휴지통**으로 내린다(30일 복구 가능).
  //    되돌릴 수 없는 조작은 만들지 않는다.
  //  ★②이력·③멘토 코멘트는 남긴다. 지우는 것은 '원고'다 —
  //    이력과 사람 의견까지 지우면 왜 지웠는지조차 사라진다.
  function resetAll(){
    var n = Object.keys(state.formData).filter(function(k){
      return String(state.formData[k] || '').trim();
    }).length;
    var editing = !!(admin && admin.editing);
    var target = editing ? admin.editing.company : (state.formData.companyName || '').trim();

    if(!confirm(
        (target ? '「' + target + '」의 ' : '') + '작성 원고를 초기화합니다.\n\n' +
        '· 화면과 이 브라우저의 ' + n + '개 칸이 비워집니다\n' +
        '· AI 진단·투자논리 진단·피칭 덱·신청서 참고자료도 지워집니다\n' +
        '· 참여기업 리스트에서 「미작성」으로 돌아갑니다\n\n' +
        '이전 기록(노션 이력·멘토 코멘트)은 그대로 남고,\n' +
        '원고는 노션 휴지통에 30일간 보관돼 복구할 수 있습니다.\n\n계속할까요?')) return;

    var clearLocal = function(){
      state.formData = {};
      state.completed = false;
      state.stepIndex = 0;
      state.diags = {};
      state.auditHash = '';
      state.lastAudit = null;
      state.lastDeck = null; state.lastDiagrams = null;
      state.b1ref = null; state.b1At = '';
      state.view = 'write';
      state.tab = 0;
      // ★대리 편집 중이면 회사명은 남긴다 — 이어서 새로 쓸 수 있어야 한다
      if(editing) state.formData.companyName = admin.editing.company;
      writeLocal();
      chip('ok');
      render();
      window.scrollTo(0, 0);
    };

    if(!serverOn() || !target){ clearLocal(); return; }

    // 서버에서 내린 뒤 화면을 비운다 — 순서가 바뀌면 '지운 줄 알았는데 목록에 남는' 상태가 생긴다
    callProxy({ action:'reset', id:llm.id, code:llm.code, company: target })
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.error) || '초기화하지 못했습니다.');
        state.status = ''; state.submittedAt = '';
        clearLocal();
        if(admin) admin.rows = admin.rows.filter(function(r){
          return normName(r.company) !== normName(target);          // 목록에서도 즉시 뺀다
        });
      })
      .catch(function(err){
        // ★화면만 비우고 서버가 남으면 최악이다 — 지웠다고 믿고 목록에 그대로 있다
        alert('초기화하지 못했습니다 — ' + (err.message || '오류') + '\n\n화면은 그대로 두었습니다.');
      });
  }
  $('hdReset').onclick = resetAll;

  // 창을 닫기 전 저장 — 자동저장이 아직 안 끝났을 수 있다
  window.addEventListener('beforeunload', function(){
    try{ localStorage.setItem(skey(), JSON.stringify({
      stepIndex: state.stepIndex, formData: state.formData, completed: state.completed })); }catch(e){}
  });
})();
</script>
</body>
</html>
