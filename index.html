    var txt = b2.synth.map(function(s){ return s.stage + ':' + s.summary + '|' + s.action; }).join('\n');
    var ch = hashOf(normTxt(txt)), b = state.b2Base;
    if(!b || b.ch !== ch){
      b = { ch:ch, ih:irHash() };
      state.b2Base = b;
      writeLocal();
    }
    return b;
  }

  //  stage = 1(멘토링)·2(IR 고도화)·3(IR 평가). 탭이 갈렸으므로 단계별로 그린다.
  function b2Block(stage, title){
    if(!b2.enabled) return '';                       // 연동 자체가 꺼져 있으면 자리를 만들지 않는다
    if(b2.note === 'unreachable'){
      return '<div class="pb-corpus"><h5>' + esc(title) + '</h5>' +
             '<p>지금은 성장관리 플랫폼에서 의견을 가져오지 못했습니다. ' +
             '작성은 그대로 계속하십시오 — 잠시 뒤 다시 뜹니다.</p></div>';
    }
    var list = b2.synth.filter(function(x){ return Number(x.stage) === stage; });
    if(!list.length){
      // 멘토 탭(stage1)은 아래에 단계 코멘트가 이어지므로 조용히 접는다.
      // IR 고도화 탭은 그 자체가 목적이라 없다는 사실을 알린다.
      return (stage === 1) ? '' :
        '<div class="pb-corpus"><h5>' + esc(title) + '</h5>' +
        '<p>아직 전달된 의견이 없습니다. 단계가 확정되면 여기에 뜹니다.</p></div>';
    }

    var base = b2Baseline();
    var stale = !!base.ih && base.ih !== irHash();

    var h = '<div class="pb-corpus"><h5>' + esc(title) + '</h5>' +
            '<p class="pb-note" style="color:var(--pb-on-ink-3)">' +
            '성장관리 플랫폼에서 <b>확정</b>된 의견입니다. IR 전체에 대한 것이며, ' +
            '이 단계에만 해당하지 않습니다.</p>';
    list.forEach(function(s){
      h += '<div style="margin-top:12px">' +
           '<div style="font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-on-ink-3)">' +
             esc(B2_STAGE[s.stage] || (s.stage + '단계 종합')) +
             (s.at ? ' · ' + esc(s.at) + ' 확정' : '') + '</div>';
      if(s.summary) h += '<p style="margin-top:5px">' + esc(s.summary) + '</p>';
      if(s.action)  h += '<p style="margin-top:5px;color:var(--pb-on-ink-3)"><b>기업 대응</b> · ' +
                         esc(s.action) + '</p>';
      h += '</div>';
    });
    if(stale){
      // ★흐리지 않는다. 사람 의견은 원고가 바뀌어도 유효할 수 있다 — 바뀌었다는 사실만 알린다.
      // ★클래스로 구분한다 — 멘토 배너와 성장관리 배너가 한 탭에 함께 뜰 수 있다.
      //   구분이 없으면 "어느 판단이 낡았는가"를 화면도 검증도 가려내지 못한다.
      h += '<div class="pb-stalebar pb-b2stale" style="margin-top:12px">' +
           '<b>이 의견을 받은 뒤 IR을 고치셨습니다.</b>' +
           '<p>지적이 반영됐는지 확인하십시오. 성장관리 쪽은 아직 고친 원고를 보지 못했습니다.</p></div>';
    }
    return h + '</div>';
  }

  // ── 멘토 코멘트 기준선 ──
  //  코멘트 본문이 바뀌면 새 코멘트다 — 기준선을 다시 잡는다(옛 수정이력을 물고 늘어지지 않는다).
  function mentorBaseline(s, text){
    var ch = hashOf(normTxt(text)), b = state.mentorBase[s.id];
    if(!b || b.ch !== ch){
      b = { ch:ch, ih:stepHash(s) };
      state.mentorBase[s.id] = b;
      writeLocal();                            // 조용히 남긴다 — 없으면 새로고침에 판정이 사라진다
    }
    return b;
  }

  // ── 내 배분 ──
  //  🔴 상장사 실측 6·20·7·13%는 **출현율**(그 섹션이 등장한 덱의 비율)이다. 분량 비중이 아니다.
  //     내 글자수 비중과 한 줄에 놓으면 단위가 다른 숫자를 견주는 것이 된다 —
  //     시스템이 거짓말을 하게 되므로, 분량은 **TIPS 배점 비중**과만 견준다.
  //     근거: D:\00_기타\22_IR_인텔리전스_허브\docs\IR_뼈대_단계별_비교.md §1
  var STEP_RUBRIC = { problem:'need', market:'impact', business:'biz', team_ask:'team',
                      rnd_goal:'fit', rnd_kpi:'exec', rnd_global:'global' };
  function mineBlock(s){
    var mine = stepChars(s), total = 0;          // stepChars = 이미 있는 글자수 함수를 그대로 쓴다
    steps().forEach(function(x){ total += stepChars(x); });
    if(!total) return '<div class="pb-mine"><h5>내 배분</h5>' +
      '<p class="vd">아직 쓰신 글이 없습니다. 채우시면 이 단계에 들인 분량을 배점과 견줘 보여드립니다.</p></div>';

    var minePct = Math.round(mine / total * 100);
    var h = '<div class="pb-mine"><h5>내 배분</h5>' +
            '<div class="row"><span>이 단계 분량</span><span>' + mine.toLocaleString() + '자 · 전체의 ' + minePct + '%</span></div>' +
            '<div class="bar"><i style="width:' + Math.min(100, minePct) + '%"></i></div>';

    var rid = STEP_RUBRIC[s.id];
    var item = null;
    scorable().forEach(function(it){ if(it.id === rid) item = it; });
    if(item){
      var poss = 0;
      scorable().forEach(function(it){ poss += it.max; });
      var wantPct = poss ? Math.round(item.max / poss * 100) : 0;
      var d = minePct - wantPct;
      h += '<div class="row"><span>TIPS 배점 비중</span><span>' + item.max + '점 · 채점가능 ' + poss + '점의 ' + wantPct + '%</span></div>' +
           '<div class="bar want"><i style="width:' + Math.min(100, wantPct) + '%"></i></div>' +
           '<p class="vd">' +
           (Math.abs(d) <= 5
              ? '분량과 배점이 대체로 맞습니다.'
              : (d < 0
                  ? '<b>배점이 큰데 분량은 얇습니다</b>(' + Math.abs(d) + '%p 차이). 여기서 점수가 새어 나갑니다.'
                  : '배점보다 두껍게 쓰셨습니다(' + d + '%p 차이). 다른 단계가 얇지 않은지 보십시오.')) +
           '</p>';
    } else {
      h += '<p class="vd">이 단계에 직접 대응하는 TIPS 채점항목은 없습니다' +
           (s.id === 'solution' ? ' — 기술의 <b>적정성·실현성</b>은 IR이 아니라 R&amp;D 사업계획서가 묻습니다.' : '.') +
           '</p>';
    }
    // ★출현율은 '썼는가/안 썼는가'와만 견준다. 같은 단위끼리 견주는 것이다.
    if(s.corpusShare != null){
      h += '<p class="unit">상장사 1,344건 중 <b>' + s.corpusShare + '%</b>만 이 항목을 <b>씁니다</b> — ' +
           '출현율이지 분량 비중이 아닙니다. 당신은 ' +
           (mine ? '이 항목을 쓰셨습니다.' : '<b>아직 비워 두셨습니다.</b>') + '</p>';
    }
    return h + '</div>';
  }

  // ══ 가이드 ① — D5 지식체계 문항 ═══════════════════════════════
  //  🔴 **채점하지 않는다.** LLM을 부르지 않으므로 일일 상한과 무관하고,
  //     누르지 않아도 항상 떠 있다 — 이것이 '자동 코칭'의 실질이다.
  //     내 원고를 판단하는 일은 AI 진단 탭이 맡는다. 두 탭이 같은 말을 하면 안 된다.
  //  🔴 `red_flags`는 프롬프트 전용이라 여기 뿌리지 않는다(엔진 규칙).
  //  🔴 문항이 배정되지 않은 단계(1 cover · 6 team_ask · R&D)는 기존 coachTips를 쓴다.
  function guideBlock(s){
    var items = brainItemsFor(s.id);

    if(!items.length){
      var h0 = '<h5>작성 가이드</h5><ul>';
      (s.coachTips || []).forEach(function(t){ h0 += '<li>' + esc(t) + '</li>'; });
      h0 += '</ul>';
      if(brain.version){
        h0 += '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-3)">' +
              '이 단계는 아직 문헌 기반 문항이 배정되지 않았습니다.</p>';
      }
      return h0;
    }

    var h = '<h5>이 단계가 묻는 것</h5>' +
            '<p class="pb-note" style="color:var(--pb-on-ink-3)">' +
            'IR 학습자료 <b>40건</b>에서 뽑은 문항입니다. 채점하지 않습니다 — ' +
            '무엇을 갖춰야 하는지만 보여드립니다.</p>';

    items.forEach(function(it, i){
      var soft = String(it.confidence || '') === '낮음';
      var good = (it.anchors && (it.anchors['3'] || it.anchors[3])) || '';
      h += '<div class="pb-qitem">' +
             '<div class="q"><span class="n">' + (i + 1) + '</span>' + esc(it.question || '') +
               (soft ? '<span class="soft">의견</span>' : '') + '</div>';
      if(it.why) h += '<div class="why">' + esc(it.why) + '</div>';
      if(it.evidence && it.evidence.length){
        h += '<div class="ev"><b>요구 증거</b> ' +
             it.evidence.map(function(e){ return esc(e); }).join(' · ') + '</div>';
      }
      if(good) h += '<div class="good"><b>이 정도면 충분합니다</b><br>' + esc(good) + '</div>';
      if(it.industry) h += '<div class="ind">' + esc(it.industry) + '</div>';

      var rx = it.rx && brain.rx ? brain.rx[it.rx] : null;
      if(rx){
        h += '<button class="pb-qmore" data-rx="' + esc(it.id) + '">처방 보기</button>' +
             '<div class="pb-rx hidden" id="rx-' + esc(it.id) + '">' + rxHtml(rx) + '</div>';
      }
      if(it.sources && it.sources.length){
        h += '<div class="src">출처 ' + it.sources.map(function(x){ return esc(x); }).join(' · ') + '</div>';
      }
      h += '</div>';
    });
    return h;
  }

  //  처방 본문. 번들 계약이 문자열/객체 둘 다 올 수 있어 방어적으로 그린다.
  function rxHtml(rx){
    if(typeof rx === 'string') return '<p>' + esc(rx) + '</p>';
    var h = '';
    ['처방', 'action', 'body', '개선처방', 'text'].forEach(function(k){
      if(!h && rx[k]) h = '<p>' + esc(String(rx[k])) + '</p>';
    });
    if(!h){
      // 알 수 없는 형태여도 사람이 읽을 수 있게는 보여준다
      Object.keys(rx).forEach(function(k){
        var v = rx[k];
        if(typeof v === 'string' && v.trim())
          h += '<p><b>' + esc(k) + '</b> · ' + esc(v) + '</p>';
      });
    }
    return h || '<p>처방 본문이 비어 있습니다.</p>';
  }

  function bindGuideToggles(){
    Array.prototype.forEach.call($('pbRight').querySelectorAll('.pb-qmore'), function(b){
      b.onclick = function(){
        var box = $('rx-' + b.dataset.rx);
        if(!box) return;
        var open = !box.classList.contains('hidden');
        box.classList.toggle('hidden', open);
        b.textContent = open ? '처방 보기' : '처방 닫기';
      };
    });
  }

  // ══ 신청서 참고자료 (P2) ═══════════════════════════════════════
  //  이노테크 접수(B1)에 이미 쓰신 것 중 **IR 본문으로 옮기지 않는 것**을 여기서만 보여준다.
  //  🔴 숫자로 문장을 조립하지 않는다. "연 480만원 × 3,200곳 = 153억"을 시스템이 만들면
  //     그것은 기업이 쓴 문장이 아니라 시스템의 해석이고, 투자자가 근거를 물으면 팀이 답하지 못한다.
  //     그래서 값만 나란히 놓고, 문장은 사람이 쓴다.
  //  🔴 ③ 18단계 아이템분석은 여기에 싣지 않는다(미결 1 판단). 심사 배점·비판적 진단이 섞여 있어
  //     피심사자 본인에게 보이면 변별력이 깨진다 — LAGMP가 applicantdetail에서 막는 것과 같은 이유다.
  var B1_REF_STEPS = {
    cover:    { extra:['사업아이템명'] },
    solution: { extra:['LC3.고유가치제안(필수)'] },
    market:   { numbers:['1년차 목표 판매량', '단가', '3년차 목표매출'] },
    business: { numbers:['단가', '단위원가', '재구매율', 'CAC', 'LTV/CAC', '단위경제성'],
                extra:['LC7.비용구조', 'LC8.핵심지표'] }
  };
  function hasB1Ref(){
    var r = state.b1ref;
    if(!r) return false;
    var n = r.numbers && Object.keys(r.numbers).some(function(k){
      return r.numbers[k] !== null && r.numbers[k] !== '' && r.numbers[k] !== undefined;
    });
    return !!((r.files && r.files.length) || n || (r.extra && Object.keys(r.extra).length));
  }
  function numTxt(v){
    if(v === null || v === undefined || v === '') return '';
    return (typeof v === 'number') ? v.toLocaleString() : String(v);
  }
  function b1RefBlock(s){
    var r = state.b1ref;
    if(!r){
      // ★여기가 '원고를 지키면서 자료만 받는' 유일한 입구다. 버튼이 반드시 있어야 한다.
      return '<h5>신청서에 이렇게 쓰셨습니다</h5>' +
             '<p>이노테크 접수 자료 중 <b>IR 본문으로 옮기지 않는 것</b>(재무 트윈 숫자 · 고유가치제안 · ' +
             '비용구조 · 핵심지표 · 제출 파일)을 여기서 보실 수 있습니다.</p>' +
             '<p class="pb-note" style="margin-top:10px;color:var(--pb-on-ink-3)">' +
             '아래 버튼은 <b>작성하신 원고를 건드리지 않습니다.</b> ' +
             '원고까지 신청서 내용으로 되돌리시려면 상단 [신청서 내용 가져오기]를 쓰십시오.</p>' +
             '<button class="pb-inkbtn" id="btnB1Ref" style="margin-top:14px">참고자료 받기</button>';
    }

    var h = '<h5>신청서에 이렇게 쓰셨습니다</h5>' +
            '<p class="pb-note" style="color:var(--pb-on-ink-3)">' +
            '이노테크 접수 자료입니다' +
            (state.b1At ? ' · ' + esc(String(state.b1At).slice(0,16).replace('T',' ')) + ' 기준' : '') +
            '. <b>IR 본문에 자동으로 들어가지 않습니다</b> — 보고 판단하신 뒤 직접 쓰십시오.</p>';

    var map = B1_REF_STEPS[s.id] || {};
    var body = '';

    // 숫자 — 나란히 놓기만 한다. 곱하지도 더하지도 않는다.
    (map.numbers || []).forEach(function(k){
      var v = numTxt(r.numbers && r.numbers[k]);
      if(v) body += '<div class="row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>';
    });
    if(body){
      body = '<div class="pb-mine" style="margin-top:12px"><h5>재무 트윈에 적으신 숫자</h5>' + body +
             '<p class="vd">🔴 <b>이 값들로 문장을 만들어 드리지 않습니다.</b> 단위와 근거를 아는 사람은 여러분입니다. ' +
             '지금도 같은 값인지 확인하고, 시장·수익 문장은 직접 쓰십시오.</p></div>';
    }

    // 린캔버스 서술 — 본문 8칸에 안 들어가는 것들
    var ex = '';
    (map.extra || []).forEach(function(k){
      var v = (r.extra && r.extra[k]) || '';
      if(v) ex += '<div class="pb-mentor" style="margin-top:10px"><h5>' + esc(k) + '</h5><p>' + esc(v) + '</p></div>';
    });

    var out = body + ex;
    if(!out) out = '<p style="margin-top:12px">이 단계에 해당하는 신청서 참고자료는 없습니다.</p>';
    h += out;

    // 제출 파일 — 노션 첨부 URL은 시간이 지나면 만료된다.
    // ★[신청서 불러오기]로 다시 받게 하면 원고가 통째로 대체된다(그게 그 버튼의 정의다).
    //   자료만 다시 받는 경로를 따로 둔다 — 파일 하나 보려다 원고를 잃는 일이 없어야 한다.
    if(r.files && r.files.length){
      h += '<div class="pb-corpus" style="margin-top:14px"><h5>제출하신 파일</h5>';
      r.files.forEach(function(f){
        h += '<p style="margin:4px 0"><a href="' + esc(f.url) + '" target="_blank" rel="noopener">' +
             esc(f.name || f.label) + '</a> <span style="color:var(--pb-on-ink-3)">· ' + esc(f.label) + '</span></p>';
      });
      h += '<p class="pb-note" style="color:var(--pb-on-ink-3)">링크는 시간이 지나면 만료됩니다. ' +
           '열리지 않으면 아래 [참고자료만 새로 받기]를 누르십시오 — <b>원고는 건드리지 않습니다.</b></p></div>';
    }
    h += '<button class="pb-inkbtn" id="btnB1Ref" style="margin-top:14px">참고자료만 새로 받기</button>';
    return h;
  }

  // 원고를 그대로 두고 참고자료(ref)만 갱신한다 — [신청서 불러오기]와 다른 버튼인 이유.
  function reloadB1Ref(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않습니다.'); return; }
    if(busy) return;
    var btn = $('btnB1Ref');
    busy = true; if(btn){ btn.disabled = true; btn.textContent = '받는 중…'; }
    // 관리자가 대리 편집 중이면 그 기업 cid를 서버에 알려야 한다(팀은 서버가 알아서 정한다)
    apiGet('b1ref', (admin && admin.editing) ? { cid: admin.editing.cid } : {})
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.error) || '받지 못했습니다.');
        if(!d.found){ alert('접수 시스템에서 귀사의 신청 자료를 찾지 못했습니다.'); return; }
        state.b1ref = d.ref || null;
        state.b1At = new Date().toISOString();
        writeLocal();
        renderRight();
      })
      .catch(function(err){ alert('받지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if($('btnB1Ref')){ $('btnB1Ref').disabled = false; $('btnB1Ref').textContent = '참고자료만 새로 받기'; }
      });
  }

  // ── AI 진단 ──
  function runDiag(){
    if(busy) return;
    var s = steps()[state.stepIndex];
    var empty = s.inputs.every(function(i){ return !(state.formData[i.key] || '').trim(); });
    if(empty){
      renderDiagInto({ verdict:'이 단계가 비어 있습니다. 먼저 채우신 뒤 진단을 요청하십시오.' });
      return;
    }
    var btn = $('btnAI');
    busy = true; btn.disabled = true; btn.textContent = '진단 중…';
    callLLM(SYSTEM, stepPrompt())
      .then(function(d){
        // ★무엇을 보고 받은 진단인지를 함께 남긴다 — 이 해시가 낡음 판정의 근거다.
        state.diags[s.id] = { data:d, hash:stepHash(s), at:new Date().toISOString() };
        writeLocal();
        renderRight();                             // 버튼 라벨·낡음 배너까지 다시 그린다
      })
      .catch(function(err){
        renderDiagInto({ verdict:'진단하지 못했습니다 — ' + (err.message || '오류') });
      })
      .then(function(){
        busy = false;
        // ★라벨을 고정 문구로 되돌리면 안 된다 — 이미 진단을 받은 뒤에는 [다시 진단]이어야 한다.
        if($('btnAI')){
          $('btnAI').disabled = false;
          $('btnAI').textContent = state.diags[s.id] ? '다시 진단' : '이 단계 진단받기';
        }
      });
  }
  function renderDiagInto(d){
    var box = $('pbDiag');
    if(!box) return;
    var h = '';
    if(d.verdict) h += '<p style="font-size:13px;color:var(--pb-paper)">' + esc(d.verdict) + '</p>';

    arr(d.issues).forEach(function(it){
      var sev = (it.severity === 'high') ? ' sev-high' : '';
      h += '<div class="pb-issue' + sev + '">' +
             '<div class="f">' + esc(FIELD_LABEL[it.field] || it.field || '') + '</div>' +
             '<div class="q">' + esc(it.problem || '') + '</div>' +
             (it.why ? '<div class="w">' + esc(it.why) + '</div>' : '') +
           '</div>';
    });

    var rw = arr(d.rewrites).filter(function(r){ return r && r.text && FIELD_LABEL[r.field]; });
    rw.forEach(function(r, i){
      h += '<div class="pb-rw">' +
             '<div class="f" style="font:500 10px var(--pb-font-mono);letter-spacing:.12em;color:var(--pb-on-ink-3)">' +
               esc(FIELD_LABEL[r.field]) + '</div>' +
             '<p style="margin-top:6px">' + esc(r.text) + '</p>' +
             '<button data-rw="' + i + '">입력란에 적용</button>' +
           '</div>';
    });

    var qs = arr(d.questions);
    if(qs.length){
      h += '<div class="pb-issue"><div class="f">실사에서 나올 질문</div>';
      qs.forEach(function(q){
        h += '<div class="q" style="margin-top:6px">· ' + esc(typeof q === 'string' ? q : (q && q.q) || '') + '</div>';
      });
      h += '</div>';
    }
    box.innerHTML = h;

    Array.prototype.forEach.call(box.querySelectorAll('[data-rw]'), function(b){
      b.onclick = function(){
        var r = rw[+b.dataset.rw];
        if(!r) return;
        state.formData[r.field] = r.text;
        saveLocal();
        render();                                  // 입력란·목차·메타가 함께 갱신된다
        b.textContent = '적용됨';
        b.disabled = true;
      };
    });
  }

  // ── 저장 (계정별 격리) ──
  //  ★키를 계정별로 가르지 않으면, 같은 PC에서 A기업이 쓰고 나간 뒤
  //    B기업이 들어왔을 때 A의 IR이 그대로 떠 있는다.
  var saveTimer = null;
  // ★칩을 띄우지 않고 조용히 쓰는 경로. 화면을 그리다가 기준선을 잡을 때 쓴다 —
  //   코멘트를 열어보기만 했는데 '저장중…'이 뜨면 사용자는 자기가 뭘 고쳤나 의심한다.
  function writeLocal(){
    try{
      localStorage.setItem(skey(), JSON.stringify({
        stepIndex: state.stepIndex, formData: state.formData, completed: state.completed,
        // ★판단과 그 근거 해시도 같이 남긴다. 이것이 없으면 새로고침 한 번에
        //   "고치기 전 진단"이라는 사실이 사라지고, 낡은 진단이 최신인 양 다시 뜬다.
        diags: state.diags, mentorBase: state.mentorBase,
        tipsHash: state.tipsHash, auditHash: state.auditHash,
        // ★신청서 참고자료도 남긴다. 없으면 새로고침 한 번에 참고 열이 통째로 비고,
        //   기업은 "아까는 있었는데"라며 불러오기를 다시 눌러 원고를 통째로 잃는다.
        b1ref: state.b1ref || null, b1At: state.b1At || '',
        b2Base: state.b2Base || null
      }));
      return true;
    }catch(e){ return false; }
  }
  function saveLocal(){
    chip('saving');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ chip(writeLocal() ? 'ok' : 'fail'); }, 400);
  }
  function loadLocal(){
    // ★먼저 비운다 — 로그아웃해도 스크립트가 메모리에 남아 앞 기업 내용이 새어 나온다
    state.formData = {}; state.stepIndex = 0; state.completed = false;
    state.lastTips = null; state.lastAudit = null; state.lastGate = null; state.lastDeck = null;
    // ★진단·기준선도 반드시 비운다. 칸만 갈라두면 A기업이 받은 진단이 B기업 화면에 남는다.
    state.diags = {}; state.mentorBase = {}; state.tipsHash = ''; state.auditHash = '';
    // ★신청서 참고자료는 그 기업의 신청 내용이다 — 계정을 갈면 반드시 비운다.
    //   칸(localStorage 키)만 갈라두면 A기업의 신청서가 B기업 코치 열에 그대로 남는다.
    state.b1ref = null; state.b1At = ''; state.b2Base = null;
    // ★지식 번들은 기업 자료가 아니라 공용 지식이다 — 비우지 않고 그대로 쓴다.
    readBrain();
    mentor = { comments:{}, overall:'', who:'', loaded:false };
    b2 = { synth:[], loaded:false, enabled:false, note:'' };
    try{
      var raw = localStorage.getItem(skey());
      if(!raw) return;
      var s = JSON.parse(raw);
      if(s && typeof s === 'object'){
        state.formData  = s.formData || {};
        state.stepIndex = Math.min(+s.stepIndex || 0, steps().length - 1);
        state.completed = !!s.completed;
        state.diags      = (s.diags && typeof s.diags === 'object') ? s.diags : {};
        state.mentorBase = (s.mentorBase && typeof s.mentorBase === 'object') ? s.mentorBase : {};
        state.tipsHash   = s.tipsHash || '';
        state.auditHash  = s.auditHash || '';
        state.b1ref      = (s.b1ref && typeof s.b1ref === 'object') ? s.b1ref : null;
        state.b1At       = s.b1At || '';
        state.b2Base     = (s.b2Base && typeof s.b2Base === 'object') ? s.b2Base : null;
      }
    }catch(e){}
  }

  // ── 저장 상태칩 ── 실패는 자동으로 사라지지 않는다
  function chip(mode){
    var c = $('hdChip'), t = $('hdChipTxt');
    c.classList.toggle('is-fail', mode === 'fail');
    if(mode === 'saving'){ t.textContent = '저장중…'; }
    else if(mode === 'fail'){
      t.innerHTML = '저장 실패 — 브라우저를 닫지 마세요<button class="retry" id="hdRetry">다시 저장</button>';
      var r = $('hdRetry'); if(r) r.onclick = saveLocal;
    } else {
      var d = new Date();
      t.textContent = '저장됨 ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    }
  }

  function notYet(what){
    alert(what + '은(는) 다음 이식 단계에서 붙습니다.');
  }

  // ══ 화면 전환 ═════════════════════════════════════════════════
  //  화면이 늘면 전환 함수가 전부를 알아야 한다 — 하나를 빠뜨리면 그 화면이 열린 채 남는다.
  // 헤더 버튼의 '지금 쓸 수 있는가'를 화면 상태에 맞춘다.
  //  ★관리자는 기업을 연 상태에서만 신청서 내용을 가져올 수 있다 — 누구 신청서인지 정해져야 하고,
  //    직접 입력으로 만든 기업(접수번호 없음)은 애초에 가져올 신청서가 없다.
  function syncHeader(){
    if(!$('hdB1')) return;
    var canB1 = !isAdmin() || !!(admin && admin.editing && admin.editing.cid);
    $('hdB1').style.display = canB1 ? '' : 'none';
  }

  function render(){
    syncHeader();
    if(state.view === 'result'){ renderResultView(); return; }
    if(state.view === 'deck'){   renderDeckView();   return; }
    if(state.view === 'admin'){  renderAdminView();  return; }
    $('pbCenter').style.padding = '';
    renderLeft(); renderCenter(); renderRight(); renderMeta();
  }
  function goResult(){ state.view = 'result'; state.stepIndex = 0; render(); window.scrollTo(0,0); }
  function goWrite(){  state.view = 'write';  render(); window.scrollTo(0,0); }
  function goDeck(){
    if(!state.lastDeck){ makeDeck(); return; }
    state.view = 'deck'; render(); window.scrollTo(0,0);
  }

  // ══ 피칭 덱 ═══════════════════════════════════════════════════
  //  ★슬라이드 문구와 도식 구조를 LLM 호출 '한 번'에 받는다 — 일일 상한을 아껴야 한다.
  //  ★LLM이 요약하며 지어낸 수치가 슬라이드에 박히면 팀이 투자자 앞에서 그대로 읽는다.
  //    그래서 문구의 숫자를 코드가 IR 원문과 대조한다(badNumbers). 지우진 않는다 — 판단은 사람이 한다.
  var deckEdited = false;

  function makeDeck(){
    if(busy) return;
    var filledN = Object.keys(state.formData).filter(function(k){
      return String(state.formData[k] || '').trim();
    }).length;
    if(filledN < 4){
      alert('덱을 만들려면 내용이 더 필요합니다. 최소 4개 항목 이상 채워 주십시오. (현재 ' + filledN + '개)');
      return;
    }
    busy = true;
    var btn = $('btnDeckGo') || $('rlDeck');
    if(btn){ btn.disabled = true; btn.textContent = '만드는 중…'; }

    callLLM(SYSTEM, deckPrompt())
      .then(function(d){
        state.lastDeck = { slides: arr(d && d.slides), rnd:(d && d.rnd) || null,
                           diagrams:(d && d.diagrams) || {} };
        deckEdited = false;
        state.view = 'deck';
        render();
        window.scrollTo(0, 0);
      })
      .catch(function(err){ alert('덱을 만들지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if(btn){ btn.disabled = false; btn.textContent = '피칭 덱 만들기'; }
      });
  }

  function renderDeckView(){
    renderMeta();
    renderDeckLeft();
    renderDeckCenter();
    renderDeckRight();
  }

  function renderDeckLeft(){
    var deck = state.lastDeck || {};
    var wantRnd = !!deck.rnd && state.deckRnd !== false;
    var total = DECK_SLIDES.length + (wantRnd ? 1 : 0);
    var h = '<h4>피칭 덱<em>' + total + '장</em></h4>';
    DECK_SLIDES.forEach(function(sl, i){
      h += '<button class="pb-nav" data-s="' + i + '">' + esc(sl.label) + '</button>';
    });
    if(deck.rnd) h += '<button class="pb-nav" data-s="' + DECK_SLIDES.length + '">R&amp;D 부록</button>';

    if(deck.rnd){
      h += '<div class="pb-hr"></div>' +
           '<label style="display:flex;gap:9px;align-items:center;font-size:13px;color:var(--pb-text-body)">' +
           '<input type="checkbox" id="ckRnd"' + (wantRnd ? ' checked' : '') + '> R&amp;D 부록 붙이기</label>';
    }
    h += '<div class="pb-hr"></div>' +
         '<p class="fine">칸을 눌러 바로 고치실 수 있습니다. 고친 내용이 그대로 PDF로 나갑니다.</p>' +
         '<div class="sp"></div>' +
         '<button class="pb-cta" id="dkPdf">PDF로 내보내기</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkKeep">이 덱 보관</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkRegen">덱 전체 다시 만들기</button>' +
         '<button class="pb-cta sub" style="margin-top:8px" id="dkBack">← 결과로 돌아가기</button>';
    $('pbLeft').innerHTML = h;

    Array.prototype.forEach.call($('pbLeft').querySelectorAll('[data-s]'), function(b){
      b.onclick = function(){
        var el = document.querySelectorAll('#pbCenter .pb-slide')[+b.dataset.s];
        if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      };
    });
    if($('ckRnd')) $('ckRnd').onchange = function(){ state.deckRnd = this.checked; render(); };
    $('dkPdf').onclick = function(){
      document.body.classList.add('deck-print');
      window.print();
      setTimeout(function(){ document.body.classList.remove('deck-print'); }, 300);
    };
    $('dkRegen').onclick = function(){
      // ★덱 전체를 다시 만들면 고쳐 둔 문구가 사라진다. 도식 하나만 어색하면 그 도식만 다시 뽑는 편이 낫다.
      if(deckEdited && !confirm('고치신 슬라이드 문구가 모두 새 내용으로 바뀝니다.\n\n' +
        '도식 하나만 다시 뽑으려면 그 도식 위의 [도식만 다시]를 쓰십시오.\n\n덱 전체를 다시 만들까요?')) return;
      makeDeck();
    };
    $('dkKeep').onclick = function(){ saveOutput('피칭 덱', this); };
    $('dkBack').onclick = goResult;
  }

  function renderDeckCenter(){
    var deck = state.lastDeck || {};
    var wantRnd = !!deck.rnd && state.deckRnd !== false;
    var list = DECK_SLIDES.slice();
    var total = list.length + (wantRnd ? 1 : 0);

    var box = document.createElement('div');
    box.className = 'pb-deck';
    state.flagged = [];

    list.forEach(function(def, i){
      var data = (deck.slides || []).filter(function(s){ return s && s.id === def.id; })[0]
              || { headline:'', bullets:[] };
      box.appendChild(slideEl(def, data, i + 1, total, false));
    });
    if(wantRnd){
      box.appendChild(slideEl({ id:'rnd', label:'R&D 부록', figs:[] }, deck.rnd, total, total, true));
    }

    $('pbCenter').innerHTML = '';
    $('pbCenter').style.padding = '0';
    $('pbCenter').appendChild(box);
    renderDeckRight();                     // 숫자 대조는 슬라이드를 다 그린 뒤에 센다
  }

  function slideEl(def, data, no, total, isAppx){
    var card = document.createElement('div');
    card.className = 'pb-slide' + (def.id === 'cover' ? ' is-cover' : '') + (isAppx ? ' is-appx' : '');
    card.innerHTML = '<div class="sno">' + esc(def.label) + ' · ' + no + ' / ' + total + '</div>';

    flagNums(def.label, data.headline);
    card.appendChild(field('s-head', data.headline, function(v){ data.headline = v; }));

    if(def.id === 'cover'){
      card.appendChild(field('s-sub', data.sub, function(v){ data.sub = v; }));
    } else {
      var ul = document.createElement('ul');
      ul.className = 's-bullets';
      arr(data.bullets).forEach(function(b, i){
        flagNums(def.label, b);
        var li = document.createElement('li');
        var dot = document.createElement('span'); dot.className = 's-dot';
        li.appendChild(dot);
        li.appendChild(field('s-bullet', b, function(v){ data.bullets[i] = v; }));
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    (def.figs || []).forEach(function(k){
      var spec = (state.lastDeck || {}).diagrams;
      var svgStr = drawOne(k, spec);
      var dd = (spec || {})[k] || {};
      var kind = DG_TYPE[String(dd.type || '')];

      var fig = document.createElement('div');
      fig.className = 's-fig';
      fig.innerHTML = svgStr ||
        '<p class="s-fig-none">이 자리(' + esc((DG_SLOTS[k] || {}).label || k) +
        ')에 넣을 구조가 IR에서 나오지 않았습니다.</p>';

      if(svgStr && kind){
        var kb = document.createElement('span');
        kb.className = 's-fig-kind';
        kb.textContent = kind.name + (dd.why ? ' · ' + dd.why : '');
        fig.appendChild(kb);
      }
      var rb = document.createElement('button');
      rb.className = 's-fig-regen';
      rb.type = 'button';
      rb.textContent = svgStr ? '도식만 다시' : '도식 뽑기';
      rb.onclick = function(){ regenDiagram(k, rb); };
      fig.appendChild(rb);

      card.appendChild(fig);
    });
    return card;
  }

  function field(cls, val, onEdit){
    var ta = document.createElement('textarea');
    ta.className = cls;
    ta.rows = 1;
    ta.value = String(val || '');
    ta.oninput = function(){
      ta.style.height = 'auto';
      ta.style.height = (ta.scrollHeight + 2) + 'px';
      deckEdited = true;
      onEdit(ta.value);
      renderDeckRight();
    };
    setTimeout(function(){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; }, 0);
    return ta;
  }

  // ★IR 원문에 없는 숫자를 모은다. 지우지 않고 우측에 남긴다.
  function flagNums(where, text){
    var bad = badNumbers(text);
    if(bad.length) state.flagged.push({ where:where, nums:bad });
  }

  function renderDeckRight(){
    // 지금 화면의 모든 슬라이드 문구를 다시 훑는다(편집분 반영)
    var flags = [];
    var deck = state.lastDeck || {};
    (deck.slides || []).forEach(function(s){
      var def = DECK_SLIDES.filter(function(x){ return x.id === s.id; })[0];
      var label = def ? def.label : (s.id || '');
      [s.headline, s.sub].concat(arr(s.bullets)).forEach(function(t){
        var bad = badNumbers(t);
        if(bad.length) flags.push({ where:label, nums:bad });
      });
    });

    var h = '<div class="pb-panel"><h5>숫자 대조</h5>';
    if(!flags.length){
      h += '<p>슬라이드의 수치가 모두 IR 원문에서 확인됩니다.</p>' +
           '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-4)">' +
           '단위가 붙었거나 두 자리 이상인 숫자만 검사합니다.</p>';
    } else {
      h += '<p style="color:var(--pb-warn-txt-on-ink)">IR 원문에서 찾지 못한 수치가 ' +
           flags.reduce(function(a,f){ return a + f.nums.length; }, 0) + '건 있습니다. ' +
           '<b>지우지 않았습니다</b> — 맞는 값이면 IR에 근거를 채우시고, 아니면 문구를 고치십시오.</p>';
      flags.forEach(function(f){
        h += '<div class="pb-num"><span class="w">' + f.nums.map(esc).join(', ') + '</span>' +
             '<span class="s">' + esc(f.where) + '</span></div>';
      });
    }
    h += '<p class="pb-note" style="margin-top:16px;color:var(--pb-on-ink-4)">' +
         '이 대조표와 도식 형태 표시는 화면에만 있습니다. PDF에는 슬라이드만 나갑니다.</p></div>';
    $('pbRight').innerHTML = h;
  }

  // ══ 관리자 ════════════════════════════════════════════════════
  //  ★쓰기 권한은 서버가 판정한다. 화면에서 감추는 것은 편의일 뿐 방어가 아니다.
  //    (서버가 관리자가 아닌 요청의 코멘트 저장을 거부하고, 심사자 응답을 도려낸다.)
  //  ★단계 id는 여기와 Code.gs의 MENTOR_COLS가 같아야 한다.
  //    하나만 어긋나면 코멘트가 엉뚱한 단계에 붙는다 — 에러 없이 조용히 틀린다.
  var MENTOR_STEPS = [
    { id:'cover',      t:'1 한 줄 소개' }, { id:'problem',    t:'2 문제 정의' },
    { id:'solution',   t:'3 해결책·기술' }, { id:'market',     t:'4 시장 규모' },
    { id:'business',   t:'5 BM & GTM' },   { id:'team_ask',   t:'6 팀 & Ask' },
    { id:'rnd_goal',   t:'7 개발 목표' },  { id:'rnd_kpi',    t:'8 성능지표·검증' },
    { id:'rnd_global', t:'9 글로벌 진출' }
  ];
  //  editing = 관리자가 '대신 편집 중인 기업' {company, cid}. null이면 자기 것을 쓴다.
  var admin = { rows:[], sel:null, comments:{}, overall:'', loading:false, editing:null,
                applicants:[], apLoading:false, q:'',
                // 검토 화면 — 그 기업 원고를 읽으며 단계별 코멘트를 쓴다
                reviewing:false, doc:null, docMode:'', docLoading:false };

  // ★기업명 검색은 법인격 표기를 떼고 맞춘다.
  //   "(주)엑스업"·"주식회사 엑스업"·"엑스업"은 사람에게 같은 회사인데
  //   문자열로는 전부 다르다 — 그대로 비교하면 검색이 헛돈다.
  function normName(s){
    return String(s == null ? '' : s)
      .replace(/\(\s*주\s*\)|\(\s*유\s*\)|㈜|㈜|주식회사|유한회사|유한책임회사|합자회사|합명회사|\(재\)|재단법인|사단법인/g, '')
      .replace(/\s+/g, '')
      .toLowerCase();
  }

  //  ★대시보드로 간다는 것은 '기업 목록 화면'으로 간다는 뜻이다.
  //    검토 상태를 끄지 않으면, 로고를 눌러 대시보드로 갔는데 보던 검토 화면이 그대로 다시 그려진다
  //    — 화면이 안 바뀌니 버튼이 고장난 것처럼 보인다.
  function goAdmin(){
    admin.reviewing = false;
    admin.sel = null;
    admin.doc = null; admin.docMode = ''; admin.docLoading = false;
    state.view = 'admin';
    render();
    loadAdmin();
    window.scrollTo(0, 0);
  }

  function loadAdmin(){
    if(!serverOn()){ admin.rows = []; admin.applicants = []; renderAdminCenter(); return; }
    admin.loading = true; admin.apLoading = true; renderAdminCenter();
    apiGet('list', {}).then(function(d){
      admin.rows = (d && d.ok) ? (d.companies || []) : [];
    }).catch(function(){ admin.rows = []; })
      .then(function(){ admin.loading = false; renderAdminCenter(); });

    // ★신청기업 명부는 B1(이노테크 접수)에서 직접 온다.
    //   ①만 보면 '아직 IR을 쓰지 않은 기업'이 목록에 아예 없다 — 불러올 방법이 없어진다.
    apiGet('b1list', {}).then(function(d){
      admin.applicants = (d && d.ok) ? (d.applicants || []) : [];
    }).catch(function(){ admin.applicants = []; })
      .then(function(){ admin.apLoading = false; renderAdminCenter(); });
  }

  function renderAdminView(){
    renderMeta();
    renderAdminLeft();
    renderAdminCenter();
    renderAdminRight();
  }

  function renderAdminLeft(){
    var h = '<h4>관리자</h4>' +
            '<button class="pb-nav is-on">신청기업</button>' +
            '<div class="pb-hr"></div>' +
            '<h4>전체 설정</h4>' +
            '<p class="fine">여기서 정한 값이 <b>전 계정의 다음 접속</b>에 그대로 적용됩니다. ' +
            '팀에게는 설정 화면이 없습니다.</p>' +
            '<label style="display:flex;gap:9px;align-items:center;margin-top:12px;font-size:13px">' +
              '<input type="checkbox" id="cfgTips"' + (llm.tipsMode ? ' checked' : '') + '> TIPS 준비 모드(9단계)</label>' +
            '<button class="pb-cta sub" style="margin-top:12px" id="cfgApply">전체 적용</button>' +
            '<div class="sp"></div>' +
            '<button class="pb-cta sub" id="adWrite">내 IR 작성 화면</button>';
    $('pbLeft').innerHTML = h;
    $('cfgApply').onclick = function(){
      if(!serverOn()){ alert('서버에 연결돼 있지 않습니다.'); return; }
      callProxy({ action:'setconfig', id:llm.id, code:llm.code,
                  config:{ tipsMode: $('cfgTips').checked } })
        .then(function(){ llm.tipsMode = $('cfgTips').checked; alert('전 계정에 적용했습니다.'); })
        .catch(function(err){ alert('적용하지 못했습니다 — ' + (err.message || '오류')); });
    };
    $('adWrite').onclick = goWrite;
  }

  // 검색어에 걸리는 신청기업. 법인격 표기를 뗀 이름과 접수번호 둘 다로 찾는다.
  function apFiltered(){
    var raw = String(admin.q || '').trim();
    var q = normName(raw), qc = raw.toLowerCase();
    return admin.applicants.filter(function(x){
      if(!raw) return true;
      return (q && normName(x.company).indexOf(q) >= 0) ||
             (qc && String(x.cid || '').toLowerCase().indexOf(qc) >= 0);
    });
  }
  function apRowsHtml(){
    if(admin.apLoading) return '<p class="pb-note">명부를 불러오는 중…</p>';
    if(!admin.applicants.length)
      return '<p class="pb-note">' + (serverOn()
        ? '신청 명부를 불러오지 못했습니다. 서버에 <b>NOTION_DB_APPLICANT</b>가 설정돼 있는지 확인하십시오.'
        : '서버에 연결돼 있지 않습니다.') + '</p>';

    var list = apFiltered();
    if(!list.length) return '<p class="pb-note">"' + esc(admin.q) + '"에 맞는 기업이 없습니다.</p>';

    // ①에 원고가 있는 기업인지 함께 보인다 — 열기 전에 새로 쓰는지 이어 쓰는지 알 수 있다
    var written = {};
    admin.rows.forEach(function(r){ if(r.company) written[normName(r.company)] = r; });

    var h = '';
    list.slice(0, 200).forEach(function(x){
      var w = written[normName(x.company)];
      h += '<button class="pb-aprow" data-nm="' + esc(x.company) + '" data-cid="' + esc(x.cid || '') + '">' +
             '<b>' + esc(x.company || '(이름 없음)') + '</b>' +
             '<span>' + esc(x.cid || '') + '</span>' +
             '<em>' + (w ? '작성 ' + (w.filled != null ? w.filled + '/17' : '있음') : '미작성') + '</em>' +
           '</button>';
    });
    if(list.length > 200) h += '<p class="pb-note">' + (list.length - 200) + '곳 더 있습니다 — 검색어를 좁히십시오.</p>';
    return h;
  }
  function bindApRows(){
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-aprow'), function(b){
      b.onclick = function(){ adminOpenByName(b.dataset.nm, b.dataset.cid); };
    });
  }

  function bindReview(){
    if($('mBack')) $('mBack').onclick = adminBackToList;
    if($('mOpen')) $('mOpen').onclick = function(){ adminOpenIR(admin.sel); };
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('.pb-adqbtn'), function(b){
      b.onclick = function(){
        var box = $('adq-' + b.dataset.adq);
        if(!box) return;
        var open = !box.classList.contains('hidden');
        box.classList.toggle('hidden', open);
        b.textContent = b.textContent.replace(open ? '접기' : '펼치기', open ? '펼치기' : '접기');
      };
    });
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('[data-m]'), function(ta){
      ta.oninput = function(){ admin.comments[ta.dataset.m] = ta.value; };
    });
  }

  function renderAdminCenter(){
    $('pbCenter').style.padding = '';
    // 기업을 고르면 중앙이 '그 기업 검토 화면'으로 바뀐다 — 원고를 보면서 코멘트를 쓴다
    if(admin.reviewing && admin.sel != null){
      $('pbCenter').innerHTML = renderAdminReview();
      bindReview();
      return;
    }
    var rows = admin.rows;
    var sub = rows.filter(function(r){ return r.status === '제출'; }).length;
    var wrote = rows.filter(function(r){ return (r.filled || 0) > 0; }).length;

    var h = '<div class="pb-kpi">' +
              '<div class="k"><b>' + admin.applicants.length + '</b><span>신청기업</span></div>' +
              '<div class="k"><b>' + wrote + '</b><span>작성 착수</span></div>' +
              '<div class="k"><b>' + sub + '</b><span>제출 완료</span></div>' +
            '</div>';

    // ── 신청기업 불러오기 ── B1(이노테크 접수) 명부에서 고른다
    h += '<div class="pb-card" style="margin-top:16px">' +
           '<h3>작업할 기업 고르기</h3>' +
           '<p class="pb-note" style="margin-bottom:12px">이노테크 접수 명부입니다. ' +
           '이름을 치거나 목록에서 고르시면 <b>그 기업의 IR 원고가 열립니다.</b> ' +
           '(주)·주식회사는 빼고 검색해도 찾습니다.<br>' +
           '<span style="color:var(--pb-ink-3)">※ 여기는 <b>누구를</b> 작업할지 고르는 곳입니다. ' +
           '기업을 연 뒤 상단 [신청서 내용 가져오기]를 누르면 <b>그 기업이 낸 린캔버스로 작성칸이 채워집니다.</b></span></p>' +
           '<input id="apQ" class="pb-apq" placeholder="기업명 또는 접수번호 — 예: 엑스업 · ITC2026-002" ' +
             'value="' + esc(admin.q) + '" autocomplete="off">' +
           '<div id="apList" class="pb-aplist">' + apRowsHtml() + '</div>' +
         '</div>';

    if(admin.loading){
      h += '<div class="pb-card"><p class="pb-note">불러오는 중…</p></div>';
    } else if(!rows.length){
      h += '<div class="pb-card"><p class="pb-note">' +
           (serverOn() ? '표시할 기업이 없습니다.'
                       : '서버에 연결돼 있지 않습니다. 배포 후 <b>PROXY</b> 주소를 넣으면 실제 기업 목록이 뜹니다.') +
           '</p></div>';
    } else {
      h += '<h3 style="margin-top:22px">작성 현황</h3>' +
           '<p class="pb-note" style="margin-bottom:10px">이미 IR을 쓰기 시작한 기업입니다. ' +
           '행을 누르면 <b>멘토 코멘트</b>를 남기고, [열어 수정]을 누르면 <b>원고를 직접 고칩니다.</b></p>' +
           '<table class="pb-atbl"><thead><tr>' +
             '<th>기업</th><th>작성</th><th>최근 점수</th><th>제출</th><th>코멘트</th><th>원고</th>' +
           '</tr></thead><tbody>';
      rows.forEach(function(r, i){
        var on = admin.sel === i;
        h += '<tr data-i="' + i + '"' + (on ? ' class="is-on"' : '') + '>' +
               '<td><b>' + esc(r.company || '—') + '</b><span class="sub">' + esc(r.cid || '') + '</span></td>' +
               '<td>' + (r.filled != null ? r.filled + ' / 17' : '—') + '</td>' +
               '<td>' + (r.score != null ? esc(String(r.score)) : '—') + '</td>' +
               '<td>' + (r.status === '제출'
                          ? '<span class="pb-pill on">제출</span>'
                          : '<span class="pb-pill off">미제출</span>') + '</td>' +
               '<td>' + (r.comments ? r.comments + '칸' : '—') + '</td>' +
               '<td><button class="pb-hbtn" data-open="' + i + '">열어 수정</button></td>' +
             '</tr>';
      });
      h += '</tbody></table>' +
           '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-3)">' +
           '<b>[열어 수정]</b>은 그 기업의 원고를 <b>관리자 권한으로 직접 고치는</b> 기능입니다. ' +
           '저장하면 그 기업 자리에 저장되며, 팀이 다음에 열 때 고쳐진 원고를 봅니다.</p>';
    }
    $('pbCenter').innerHTML = h;
    bindApRows();
    if($('apQ')){
      // ★리스트만 다시 그린다. 전체를 다시 그리면 타자 도중 포커스를 빼앗긴다.
      $('apQ').oninput = function(){
        admin.q = this.value;
        var box = $('apList');
        if(box){ box.innerHTML = apRowsHtml(); bindApRows(); }
      };
    }
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('tr[data-i]'), function(tr){
      tr.onclick = function(e){
        if(e.target && e.target.dataset && e.target.dataset.open != null) return;  // 버튼은 따로 처리
        selectCompany(+tr.dataset.i);
      };
    });
    Array.prototype.forEach.call($('pbCenter').querySelectorAll('button[data-open]'), function(b){
      b.onclick = function(e){ e.stopPropagation(); adminOpenIR(+b.dataset.open); };
    });
  }

  // ══ 관리자 대리 편집 ═══════════════════════════════════════════
  //  서버는 처음부터 관리자에게 마스터 권한을 주고 있었다 —
  //  `loadCompany_`는 관리자면 아무 기업이나 열어주고, `saveSnapshot_`은 관리자가 보낸
  //  기업명 그대로 저장한다(강제는 팀 계정에만 건다). 화면에 진입로가 없었을 뿐이다.
  //
  //  🔴 위험한 기능이다. 관리자가 '지금 누구 원고를 보고 있는지' 놓치면 남의 IR을 덮어쓴다.
  //     그래서 ①저장 칸을 기업별로 가르고 ②화면 위에 계속 띄우고 ③닫는 버튼을 항상 둔다.
  function adminOpenIR(i){
    var r = admin.rows[i];
    if(r) adminOpenByName(r.company, r.cid || '');
  }

  //  name = ① IR 마스터에 붙일 기업명(정본). cid = 접수번호(B1 조회에 쓴다).
  function adminOpenByName(name, cid){
    name = String(name || '').trim();
    if(!name) return;
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 원고를 불러올 수 없습니다.'); return; }
    if(busy) return;
    busy = true;
    apiGet('load', { company: name })
      .then(function(d){
        // ★editing을 먼저 세운다 — who()가 바뀌어야 그 기업 전용 칸을 읽고 쓴다.
        admin.editing = { company: name, cid: cid || '' };
        loadLocal();                                   // 그 기업 칸에 남은 작업이 있으면 이어서
        // ★저장된 원고가 없는 것(NOTFOUND)은 오류가 아니다 — 아직 안 쓴 기업이다. 빈 화면에서 시작한다.
        if(d && d.ok && d.snapshot) applySnapshot(d.snapshot);
        state.formData.companyName = name;             // 저장 시 이 이름으로 그 행에 붙는다
        state.view = 'write';
        state.stepIndex = 0;
        mentor = { comments:{}, overall:'', who:'', loaded:false };
        render();
        pullComments();
        window.scrollTo(0, 0);
      })
      .catch(function(err){
        admin.editing = null;
        alert('열지 못했습니다 — ' + (err.message || '오류'));
      })
      .then(function(){ busy = false; });
  }

  //  ★B1 명부에 없는 기업을 관리자가 직접 만든다.
  //    명부에서 고르는 것과 다른 일이다 — 저쪽은 '있는 기업 중 고르기', 이쪽은 '없는 기업 만들기'.
  //    cid가 없으므로 [신청서 내용 가져오기]는 쓸 수 없다(가져올 신청서가 없다).
  function adminNewCompany(){
    var nm = prompt(
      '이노테크 접수 명부에 없는 기업을 직접 등록합니다.\n' +
      '(명부에 있는 기업은 대시보드에서 골라 여십시오.)\n\n' +
      '기업명을 입력하십시오 — 이 이름으로 IR 마스터에 저장됩니다.');
    if(nm === null) return;
    nm = String(nm).trim();
    if(!nm) return;

    var dup = admin.applicants.filter(function(x){ return normName(x.company) === normName(nm); })[0];
    if(dup && !confirm(
        '접수 명부에 "' + dup.company + '"(' + (dup.cid || '접수번호 없음') + ')가 이미 있습니다.\n\n' +
        '그래도 이 이름으로 새로 만드시겠습니까?\n' +
        '[취소]를 누르시고 대시보드에서 고르시면 신청서 내용까지 함께 쓸 수 있습니다.')) return;

    adminOpenByName(nm, dup ? (dup.cid || '') : '');
  }

  function adminCloseIR(){
    admin.editing = null;
    loadLocal();                                       // 관리자 자기 칸으로 되돌린다
    mentor = { comments:{}, overall:'', who:'', loaded:false };
    goAdmin();
  }

  //  ★코멘트는 '원고를 보면서' 쓰는 것이다.
  //    전에는 우측에 빈 입력칸 9개만 떴다 — 무엇에 대한 의견인지 화면에 없는 채로 쓰게 했다.
  //    이제 기업을 고르면 중앙이 검토 화면으로 바뀌어 단계마다 [원고 → 코멘트칸]이 붙는다.
  function selectCompany(i){
    admin.sel = i;
    admin.comments = {}; admin.overall = ''; admin.doc = null;
    admin.reviewing = true;
    admin.docLoading = true;
    renderAdminCenter();
    renderAdminRight();

    var r = admin.rows[i];
    if(!r || !serverOn()){ admin.docLoading = false; return; }

    apiGet('comments', { company: r.company || '' }).then(function(d){
      if(!d || !d.ok) return;
      admin.comments = d.comments || {};
      admin.overall = d.overall || '';
    }).catch(function(){})
      .then(function(){ renderAdminCenter(); renderAdminRight(); });

    // 원고도 함께 가져온다 — 이것이 없으면 코멘트를 '보지 않고' 쓰게 된다
    apiGet('load', { company: r.company || '' }).then(function(d){
      admin.doc = (d && d.ok && d.snapshot) ? (d.snapshot.formData || {}) : {};
      admin.docMode = (d && d.ok && d.snapshot) ? (d.snapshot.mode || '') : '';
    }).catch(function(){ admin.doc = {}; })
      .then(function(){ admin.docLoading = false; renderAdminCenter(); });
  }

  function adminBackToList(){
    admin.reviewing = false;
    admin.sel = null; admin.doc = null;
    renderAdminCenter();
    renderAdminRight();
    window.scrollTo(0, 0);
  }

  function stepById(id){
    var all = IR_STEPS.concat(TIPS_STEPS);
    for(var i = 0; i < all.length; i++) if(all[i].id === id) return all[i];
    return null;
  }

  // 기업 검토 화면 — 단계마다 '그 기업이 쓴 원고' 바로 아래에 코멘트칸을 둔다
  function renderAdminReview(){
    var r = admin.rows[admin.sel];
    if(!r) return '';
    var fd = admin.doc || {};

    var h = '<div class="pb-card" style="display:flex;align-items:center;gap:12px">' +
              '<div style="flex:1"><b style="font:600 17px var(--pb-font-serif)">' + esc(r.company || '') + '</b>' +
              '<p class="pb-note">' + esc(r.cid || '') +
              (admin.docMode ? ' · ' + esc(admin.docMode) : '') +
              (r.status === '제출' ? ' · 제출' : '') + '</p></div>' +
              '<button class="pb-hbtn" id="mBack">목록으로</button>' +
              '<button class="pb-hbtn" id="mOpen">원고 열어 수정</button>' +
            '</div>';

    if(admin.docLoading){
      return h + '<div class="pb-card" style="margin-top:14px"><p class="pb-note">원고를 불러오는 중…</p></div>';
    }

    var shown = 0;
    MENTOR_STEPS.forEach(function(s){
      var st = stepById(s.id);
      if(!st) return;
      var vals = st.inputs.map(function(f){ return { label:f.label, v:String(fd[f.key] || '').trim() }; });
      var any = vals.some(function(x){ return !!x.v; });
      var cm = admin.comments[s.id] || '';
      // ★쓰지도 않았고 코멘트도 없는 단계는 접는다 — R&D 3단계가 늘 빈 채로 자리를 먹는다
      if(!any && !cm) return;
      shown++;

      var body = '';
      vals.forEach(function(x){
        body += '<div class="pb-rvf"><span>' + esc(x.label) + '</span>' +
                (x.v ? '<p>' + esc(x.v) + '</p>' : '<p class="empty">비어 있습니다</p>') + '</div>';
      });
      // ★관리자도 같은 기준을 보면서 쓴다 — 팀에게 보이는 문항과 어긋난 코멘트를 막는다.
      //   접어 둔 채로 두고 필요할 때만 편다(원고를 읽는 흐름을 끊지 않게).
      var qs = brainItemsFor(s.id);
      var qh = '';
      if(qs.length){
        qh = '<button class="pb-adqbtn" data-adq="' + esc(s.id) + '">' +
               '이 단계가 묻는 것 ' + qs.length + '개 · 펼치기</button>' +
             '<div class="pb-adq hidden" id="adq-' + esc(s.id) + '">';
        qs.forEach(function(q, n){
          qh += '<p><b>' + (n + 1) + '. ' + esc(q.question || '') + '</b>';
          if(q.evidence && q.evidence.length)
            qh += '<br><span class="ev">요구 증거 · ' +
                  q.evidence.map(function(e){ return esc(e); }).join(' · ') + '</span>';
          qh += '</p>';
        });
        qh += '</div>';
      }

      h += '<div class="pb-card" style="margin-top:14px">' +
             '<h3>' + esc(st.title) + '</h3>' + body + qh +
             '<div class="pb-mfield" style="margin-top:12px">' +
               '<label>이 단계 코멘트' + (cm ? '<span class="cur">작성됨</span>' : '') + '</label>' +
               '<textarea data-m="' + s.id + '" placeholder="이 원고를 읽고 남길 의견">' + esc(cm) + '</textarea>' +
             '</div>' +
           '</div>';
    });

    if(!shown){
      h += '<div class="pb-card" style="margin-top:14px"><p class="pb-note">' +
           '이 기업은 아직 아무 단계도 쓰지 않았습니다. ' +
           '[원고 열어 수정]으로 관리자가 직접 채워 넣을 수 있습니다.</p></div>';
    }
    return h;
  }

  function renderAdminRight(){
    var r = admin.sel != null ? admin.rows[admin.sel] : null;
    var h = '<div class="pb-panel">';
    if(!r){
      h += '<h5>멘토 코멘트</h5><p>왼쪽 표에서 기업을 고르시면 단계별로 코멘트를 남길 수 있습니다.</p>' +
           '<p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-4)">' +
           '여기 쓴 글은 그 팀이 <b>해당 단계를 쓸 때</b> 코치 열 첫 탭에 뜹니다. ' +
           'AI 의견보다 위에 놓입니다.</p>';
    } else {
      // ★단계별 코멘트칸은 중앙 검토 화면(원고 옆)으로 옮겼다.
      //   여기에 또 두면 같은 값을 두 곳에서 고치게 되어 무엇이 최신인지 알 수 없다.
      var n = 0;
      MENTOR_STEPS.forEach(function(s){ if((admin.comments[s.id] || '').trim()) n++; });
      h += '<h5>' + esc(r.company || '') + '</h5>' +
           '<p class="pb-note">가운데 화면에서 <b>원고를 읽으며</b> 단계별 코멘트를 쓰십시오. ' +
           '지금 ' + n + '개 단계에 의견이 있습니다.</p>';
      h += '<div class="pb-mfield" style="margin-top:14px"><label>총평</label>' +
             '<textarea data-m="__overall" placeholder="전체 총평">' + esc(admin.overall) + '</textarea></div>' +
           '<button class="pb-inkbtn" id="mSave">코멘트 저장</button>' +
           '<p class="pb-note" style="margin-top:10px;color:var(--pb-on-ink-4)">' +
           '저장하면 팀 화면에 바로 반영됩니다. 코멘트는 팀이 지울 수 없습니다.</p>';
    }
    h += '</div>';
    $('pbRight').innerHTML = h;

    Array.prototype.forEach.call($('pbRight').querySelectorAll('[data-m]'), function(ta){
      ta.oninput = function(){
        if(ta.dataset.m === '__overall') admin.overall = ta.value;
        else admin.comments[ta.dataset.m] = ta.value;
      };
    });
    if($('mSave')) $('mSave').onclick = function(){
      if(!serverOn()){ alert('서버에 연결돼 있지 않습니다.'); return; }
      var btn = $('mSave');
      btn.disabled = true; btn.textContent = '저장 중…';
      callProxy({ action:'savecomments', id:llm.id, code:llm.code,
                  company: r.company, comments: admin.comments, overall: admin.overall })
        // ★목록을 다시 부르지 않는다 — rows가 갈리면 admin.sel 인덱스가 어긋나 다른 기업을 보게 된다
        .then(function(){ alert('저장했습니다.'); renderAdminCenter(); renderAdminRight(); })
        .catch(function(err){ alert('저장하지 못했습니다 — ' + (err.message || '오류')); })
        .then(function(){ btn.disabled = false; btn.textContent = '코멘트 저장'; });
    };
  }

  // ══ IR 전체 감수 · 제출 ═══════════════════════════════════════
  function runAudit(){
    if(busy) return;
    var btn = $('btnAudit');
    busy = true; btn.disabled = true; btn.textContent = '감수 중…';
    callLLM(SYSTEM, auditPrompt())
      .then(function(d){
        state.lastAudit = d;
        state.auditHash = irHash();               // 무엇을 보고 한 감수인지 기억한다
        writeLocal();
        renderAuditBox(); renderMeta(); syncToServer();
      })
      .catch(function(err){
        $('auditBox').innerHTML = '<div class="pb-warnbox" style="margin-top:14px">감수하지 못했습니다 — ' +
                                  esc(err.message || '오류') + '</div>';
      })
      .then(function(){
        busy = false;
        if($('btnAudit')){
          $('btnAudit').disabled = false;
          $('btnAudit').textContent = state.lastAudit ? 'IR 전체 다시 감수' : 'IR 전체 감수';
        }
      });
  }
  function renderAuditBox(){
    var a = state.lastAudit, box = $('auditBox');
    if(!box || !a) return;
    var stale = irStale(state.auditHash);
    var h = '';
    if(stale){
      h += '<div class="pb-warnbox" style="margin-top:14px">' +
           '<b>이 감수는 고치기 전 IR에 대한 것입니다.</b> 감수를 받은 뒤 원고를 고치셨습니다 — ' +
           '모순이 이미 해소됐을 수도, 새로 생겼을 수도 있습니다. 지금 원고로 다시 감수하십시오.</div>';
    }
    h += '<div class="pb-card' + (stale ? ' pb-faded' : '') + '" style="margin-top:14px">';
    if(a.verdict) h += '<p style="font-size:14px;color:var(--pb-text-body)">' + esc(a.verdict) + '</p>';

    var inc = arr(a.inconsistencies);
    if(inc.length){
      h += '<h3 style="margin-top:18px;font-size:15px">단계 사이의 모순</h3>';
      inc.forEach(function(it){
        h += '<div class="pb-warnbox" style="margin-top:9px">' +
             esc(typeof it === 'string' ? it : (it.problem || it.text || '')) + '</div>';
      });
    }
    var qs = arr(a.questions);
    if(qs.length){
      h += '<h3 style="margin-top:18px;font-size:15px">실사에서 나올 질문</h3><ul style="margin-top:8px;padding-left:18px">';
      qs.forEach(function(q){
        h += '<li style="font-size:14px;line-height:1.7">' + esc(typeof q === 'string' ? q : (q && q.q) || '') + '</li>';
      });
      h += '</ul>';
    }
    h += '</div>';
    box.innerHTML = h;
  }

  // ── ④ 최종 산출물 보관 ──
  //  ①(단계별 원고)은 덮어쓰지만 ④는 만들 때마다 쌓인다 — 지난 덱을 되찾을 수 있어야 한다.
  function saveOutput(kind, btn){
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 보관할 수 없습니다.'); return; }
    // ★낡은 채점·감수가 한 벌로 묶여 ④에 쌓이면, 나중에 되찾을 때 그것이 '그때의 점수'로 읽힌다.
    //   보관을 막지는 않는다 — 원고만 보관하려는 경우도 있다. 다만 모르고 넘어가게 두지 않는다.
    var st = [];
    if(irStale(state.tipsHash))  st.push('TIPS 채점');
    if(irStale(state.auditHash)) st.push('전체 감수');
    if(st.length && !confirm(
        st.join('·') + '은 지금 원고보다 낡았습니다(고치신 뒤 다시 하지 않았습니다).\n\n' +
        '이대로 보관하면 낡은 결과가 이 원고의 것으로 함께 쌓입니다.\n\n계속 보관할까요?')) return;

    var fd = state.formData, tot = 0, n = 0;
    steps().forEach(function(s){ s.inputs.forEach(function(i){
      tot++; if((fd[i.key] || '').trim()) n++; }); });

    var body = { action:'saveoutput', id:llm.id, code:llm.code,
                 kind:kind, snapshot:snapshot(),
                 filledRatio: tot ? Math.round(n / tot * 100) / 100 : 0 };

    if(kind === '피칭 덱' && state.lastDeck){
      body.deck = state.lastDeck.slides;
      body.diagrams = state.lastDeck.diagrams;
      body.slideCount = arr(state.lastDeck.slides).length;
      // 어떤 형태를 왜 골랐는지 — 나중에 이 덱을 다시 볼 때 판단 근거가 된다
      var notes = [];
      DG_ORDER.forEach(function(k){
        var dd = (state.lastDeck.diagrams || {})[k];
        if(dd && dd.type) notes.push(k + '=' + ((DG_TYPE[dd.type] || {}).name || dd.type) +
                                     (dd.why ? ' · ' + dd.why : ''));
      });
      body.figureNote = notes.join(' / ');
      var bad = 0;
      arr(state.lastDeck.slides).forEach(function(s){
        [s.headline, s.sub].concat(arr(s.bullets)).forEach(function(t){ bad += badNumbers(t).length; });
      });
      body.unverified = bad;
    }
    if(kind === '도식 묶음' && state.lastDiagrams){
      body.diagrams = state.lastDiagrams;
      var n2 = [];
      DG_ORDER.forEach(function(k){
        var dd = state.lastDiagrams[k];
        if(dd && dd.type) n2.push(k + '=' + ((DG_TYPE[dd.type] || {}).name || dd.type));
      });
      body.figureNote = n2.join(' / ');
    }

    var label = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = '보관 중…'; }
    callProxy(body)
      .then(function(){ alert('노션 ④ 최종 산출물에 보관했습니다.'); })
      .catch(function(err){ alert('보관하지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){ if(btn){ btn.disabled = false; btn.textContent = label; } });
  }

  function doSubmit(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 제출할 수 없습니다.'); return; }
    var already = state.status === '제출';
    if(!confirm(already ? '다시 제출하시겠습니까? 마감은 없으며 최신 내용으로 갱신됩니다.'
                        : '제출하시겠습니까? 제출 후에도 계속 고치고 다시 제출하실 수 있습니다.')) return;
    syncToServer({ submit:true }).then(function(){
      renderResultView();
      alert('제출했습니다.');
    });
  }

  // ── 도식 하나만 다시 뽑기 ──
  //  ★[덱 전체 다시]는 슬라이드 문구까지 새로 만든다. 도식 하나 때문에 문구를 잃을 이유가 없다.
  function regenDiagram(slot, btn){
    if(busy || !state.lastDeck) return;
    var S = DG_SLOTS[slot];
    if(!S) return;
    var prompt = [
      '아래 IR에서 "' + S.label + '" 자리에 들어갈 도식 하나만 다시 뽑아라. 다른 자리는 만들지 마라.',
      '이미 쓰인 내용에서만 뽑아라. 없는 숫자·연도·기관명·회사명을 지어내면 안 된다. 모르면 "[__]"로 비워라.',
      '', DG_RULE, '',
      '# IR 내용', contextBlock(null), '',
      '# 이 자리의 후보', slotMenu(slot), '',
      '# 출력 JSON — 이 키 하나만',
      '{ "' + slot + '": { "type":"위 후보 중 하나", … , "why":"고른 이유(25자 이내)" } }', '',
      'IR에 해당 내용이 아예 없으면 그 키를 null로 두어라. 억지로 만들지 마라.'
    ].join('\n');

    var label = btn.textContent;
    busy = true; btn.disabled = true; btn.textContent = '뽑는 중…';
    callLLM(SYSTEM, prompt)
      .then(function(d){
        state.lastDeck.diagrams = state.lastDeck.diagrams || {};
        // ★슬라이드 문구(slides)는 건드리지 않는다. 이 도식 하나만 갈아끼운다.
        state.lastDeck.diagrams[slot] = (d && d[slot]) || null;
        render();
      })
      .catch(function(err){ alert('도식을 다시 뽑지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if(btn && btn.isConnected){ btn.disabled = false; btn.textContent = label; }
      });
  }

  // ══ 결과 화면 ═════════════════════════════════════════════════
  function canScore(it){ return it.coverage !== 'none' || (llm.tipsMode && it.tipsFields); }
  function scorable(){ return TIPS_RUBRIC.items.filter(canScore); }

  function renderResultView(){
    renderMeta();
    renderResultLeft();
    renderResultCenter();
    renderResultRight();
  }

  function renderResultLeft(){
    var h = '<h4>결과<em>' + (llm.tipsMode ? '9단계' : '6단계') + '</em></h4>' +
            '<button class="pb-nav" id="rlIR">IR 본문</button>' +
            '<button class="pb-nav" id="rlFig">도식</button>' +
            '<button class="pb-nav" id="rlGate">TIPS 자격 요건</button>' +

            '투자자에게 보내는 자료에 채점표가 실리면 안 되기 때문입니다.</p>' +

    $('rlGate').onclick = function(){ go('secGate'); };
    $('rlPrint').onclick= function(){ window.print(); };
    $('rlDeck').onclick = goDeck;
    $('rlBack').onclick = goWrite;

  function renderResultCenter(){
    $('pbCenter').style.padding = '';
    var fd = state.formData;
    var name = (fd.companyName || '').trim() || '[회사명]';
    var one  = (fd.oneLiner || '').trim();

    var h = '<div class="pb-ir" id="secIR">' +
              '<h1>' + esc(name) + '</h1>' +
              (one ? '<p class="lead">' + esc(one) + '</p>' : '');

      if(s.id === 'cover') return;                       // 표지는 위에서 이미 썼다

        h += '<div class="fl"><b>' + esc(f.label) + '</b>' +
             (v ? '<p>' + esc(v) + '</p>'
                : '<p class="void">비어 있습니다 — 초안 자동생성은 제공하지 않습니다.</p>') +
             '</div>';
      });
      h += '</div>';
    });
    h += '</div>';

    // ── 도식 ──
    h += '<div id="secFig" style="margin-top:18px">' +
           '<div class="pb-card pb-noprint" style="display:flex;align-items:center;gap:12px">' +
             '<div style="flex:1"><b style="font:600 15px var(--pb-font-serif)">도식</b>' +

  // ── 자격 게이트 ──
  function renderGate(){
    var saved = {};
    try{ saved = JSON.parse(localStorage.getItem(tkey()) || '{}') || {}; }catch(e){}
    var h = '';
    TIPS_GATE.forEach(function(g){
      var cur = saved[g.id] || '';
      var isFail = cur === g.fail;
      h += '<div class="g' + (isFail ? ' is-fail' : '') + '"><b>' + esc(g.q) + '</b>' +
           '<select id="g-' + g.id + '" data-g="' + g.id + '">' +
             '<option value="">선택하십시오</option>' +
             g.opts.map(function(o){
               return '<option value="' + esc(o.v) + '"' + (cur === o.v ? ' selected' : '') + '>' + esc(o.t) + '</option>';
             }).join('') +
           '</select>' +
           (isFail ? '<div class="why">' + esc(g.why) + '</div>' : '') +
         '</div>';
    });
    $('gateBox').innerHTML = h;
    Array.prototype.forEach.call($('gateBox').querySelectorAll('select'), function(sel){
      sel.onchange = function(){ readGate(); renderGate(); };
    });
  }
  function readGate(){
    var ans = {};
    TIPS_GATE.forEach(function(g){
      var s = document.getElementById('g-' + g.id);
      ans[g.id] = s ? s.value : '';
    });
    try{ localStorage.setItem(tkey(), JSON.stringify(ans)); }catch(e){}
    return ans;
  }
  function checkGate(ans){
    var failed = [];
    TIPS_GATE.forEach(function(g){ if(ans[g.id] === g.fail) failed.push({ q:g.q, why:g.why }); });
    return failed;
  }

  // ── TIPS 채점 ──
  function tipsPrompt(){
    var items = scorable();
    var lines = items.map(function(it){
      return '### ' + it.id + ' — ' + it.name + ' (' + it.cat + ', 배점 ' + it.max + '점)\n' +
             '평가지표: ' + it.criteria;
    }).join('\n\n');
    return [
      '아래 창업팀의 IR을 **TIPS 선정평가표**로 채점하라. 너는 TIPS 평가위원이다.',
      '',
      '# 채점할 항목 (이것만 채점한다. 목록에 없는 항목은 건드리지 마라)',
      lines,
      '',
      '# 창업팀의 IR',
      contextBlock(null),
      '',
      '# 채점 규칙 (반드시 지켜라)',
      '- 등급은 S / A / B / C / D 다섯 중 하나다. S=탁월, A=우수, B=보통, C=미흡, D=매우미흡.',
      '- **점수(숫자)를 계산하지 마라.** 등급만 내라. 합산은 시스템이 한다.',
      '- **evidence에는 IR 원문 문장을 그대로 인용하라.** 요약하거나 바꿔 쓰지 마라.',
      '- ★**인용할 원문이 없으면 그 항목의 등급은 D이고 evidence는 빈 문자열이다.** 없는 근거를 지어내면 실패다.',
      '- fix는 그 항목의 점수를 올리려면 **무엇을 추가로 써야 하는지** 구체적으로 적어라. "더 구체적으로"는 금지다.',
      llm.reviewer ? '- (심사자 모드) risk에는 평가위원이 감점할 지점을, ask에는 발표 질의응답에서 던질 질문을 적어라.' : '',
      '',
      '# 출력 JSON',
      '{ "scores": [{ "id":"' + items.map(function(i){ return i.id; }).join('" | "') + '",',
      '               "grade":"S"|"A"|"B"|"C"|"D",',
      '               "evidence":"IR 원문 인용 (없으면 \\"\\")",',
      '               "reason":"그 등급을 준 이유 한 문장",',
      '               "fix":"점수를 올리려면 무엇을 써야 하는가"' +
                     (llm.reviewer ? ',\n               "risk":"평가위원이 감점할 지점",\n               "ask":"발표 질의응답에서 나올 질문"' : '') + ' }] }',
      '',
      'scores는 위 ' + items.length + '개 항목 전부에 대해 정확히 ' + items.length + '개를 내라.'
    ].filter(Boolean).join('\n');
  }

  function runTips(){
    if(busy) return;
    var ans = readGate();
    var failed = checkGate(ans);
    if(failed.length){
      // ★자격 미달이면 LLM을 부르지 않는다. 자격이 없으면 점수가 무의미하다.
      $('gateMsg').innerHTML = '<div class="pb-warnbox" style="margin-top:14px"><b>신청 자격에 미달합니다 — 채점을 시작하지 않았습니다.</b><br>' +
        failed.map(function(f){ return '· ' + esc(f.q) + ' — ' + esc(f.why); }).join('<br>') + '</div>';
      state.lastGate = { ok:false, failed:failed, answers:ans };
      syncToServer();                                  // 자격 미달도 이력에 남긴다(왜 떨어졌는지가 정보다)
      return;
    }
    $('gateMsg').innerHTML = '';
    state.lastGate = { ok:true, answers:ans };

    var btn = $('btnTips');
    busy = true; btn.disabled = true; btn.textContent = '채점 중…';
    callLLM(SYSTEM, tipsPrompt())
      .then(function(d){
        state.lastTips = buildTips(d);
        state.tipsHash = irHash();                // 무엇을 보고 낸 점수인지 기억한다
        writeLocal();
        renderResultRight();
        renderMeta();
        syncToServer();
      })
      .catch(function(err){
        $('gateMsg').innerHTML = '<div class="pb-warnbox" style="margin-top:14px">채점하지 못했습니다 — ' + esc(err.message || '오류') + '</div>';
      })
      .then(function(){
        busy = false;
        if($('btnTips')){
          $('btnTips').disabled = false;
          $('btnTips').textContent = state.lastTips ? 'TIPS 기준으로 다시 채점하기' : 'TIPS 기준으로 채점하기';
        }
      });
  }

  // ★점수 합산은 코드가 한다. LLM에 산수를 시키지 않는다.
  function buildTips(d){
    var byId = {};
    arr(d && d.scores).forEach(function(s){ if(s && s.id) byId[s.id] = s; });

    var got = 0, poss = 0, na = 0, unverified = 0, rows = [];
    TIPS_RUBRIC.items.forEach(function(it){
      var ok = canScore(it), s = byId[it.id];
      if(!ok || !s){
        na += it.max;
        rows.push({ item:it, grade:'NA', pts:0, missed: ok && !s });
        return;
      }
      var gi = TIPS_RUBRIC.gradePoints.indexOf(s.grade);
      var pts = gi >= 0 ? it.pts[gi] : 0;
      poss += it.max; got += pts;
      var ev = s.evidence || '';
      var verified = ev ? !!verifyEvidence(ev) : null;
      if(ev && !verified) unverified++;
      rows.push({ item:it, grade:(gi >= 0 ? s.grade : 'D'), pts:pts, evidence:ev,
                  verified:verified, reason:s.reason || '', fix:s.fix || '',
                  risk:s.risk || '', ask:s.ask || '' });
    });
    return { got:got, poss:poss, na:na, unverified:unverified, rows:rows,
             rubric:TIPS_RUBRIC.name, source:TIPS_RUBRIC.source, passMark:TIPS_RUBRIC.passMark,
             scoredAt:new Date().toISOString() };
  }

  function renderResultRight(){
    var t = state.lastTips;
    var h = '<div class="pb-panel">';
    if(!t){
      h += '<h5>TIPS 진단</h5><p>왼쪽에서 자격 요건을 고르신 뒤 <b>채점하기</b>를 누르십시오.</p>' +
           '<p class="pb-note" style="margin-top:14px;color:var(--pb-on-ink-4)">' +
           '배점과 등급점수는 공식 원문입니다. 다만 S~D 판정 기준선은 공식 문서에 없어 ' +
           '이 도구의 자체 정의입니다 — 점수를 공식인 것처럼 쓰지 마십시오.</p>';
    } else {
      var pct = t.poss ? Math.round(t.got / t.poss * 100) : 0;
      var tStale = irStale(state.tipsHash);
      if(tStale){
        // ★점수는 지우지 않는다. 다만 지금 원고의 점수가 아니라는 것을 분명히 한다 —
        //   낡은 점수를 최신인 양 보관·제출하면 그것이 곧 잘못된 판단의 근거가 된다.
        h += '<div class="pb-stalebar"><b>이 점수는 고치기 전 IR의 점수입니다.</b>' +
             '<p>채점 이후 원고를 고치셨습니다. 지금 점수를 알려면 다시 채점하십시오.</p></div>';
      }
      h += '<div class="pb-score' + (tStale ? ' pb-stale' : '') + '"><b>' + t.got + '</b><span>/ ' + t.poss + '점 (' + pct + '%)</span></div>';
      if(t.unverified){
        h += '<div class="pb-sdet"><span class="bad">근거 미확인 ' + t.unverified + '건 — ' +
             'AI가 IR에 없는 문장을 인용했습니다. 이 채점을 신뢰하지 마십시오.</span></div>';
      }
      t.rows.forEach(function(r){
        var na = r.grade === 'NA';
        h += '<div class="pb-srow' + (na ? ' na' : '') + '">' +
               '<span class="nm">' + esc(r.item.name) + '</span>' +
               '<span class="pt">' + r.item.max + '</span>' +
               '<span class="gd">' + (na ? '—' : esc(r.grade)) + '</span>' +
             '</div>';
        if(na){
          h += '<div class="pb-sdet">' + (r.item.gapHint || 'IR에 없는 정보입니다.') + '</div>';
        } else {
          h += '<div class="pb-sdet">';
          if(r.evidence){
            h += '<q>' + esc(r.evidence) + '</q>';
            if(!r.verified) h += ' <span class="bad">⚠ 원문에서 확인되지 않았습니다</span>';
          } else {
            h += '<span class="bad">IR에서 근거를 찾지 못했습니다.</span>';
          }
          if(r.reason) h += '<br>' + esc(r.reason);
          if(r.fix) h += '<span class="fix">→ ' + esc(r.fix) + '</span>';
          if(llm.reviewer && (r.risk || r.ask)){
            h += '<span class="fix" style="color:var(--pb-warn-txt-on-ink)">🔒 ' +
                 esc(r.risk || '') + (r.ask ? ' / Q. ' + esc(r.ask) : '') + '</span>';
          }
          h += '</div>';
        }
      });
      // ★가장 중요한 메시지 — 지금 그릇으로 60점에 닿을 수 있는가
      h += '<div class="pb-sdet" style="margin-top:14px;border-top:1px solid var(--pb-on-ink-line);padding-top:14px">' +
           '<b style="color:var(--pb-paper)">TIPS는 종합 ' + t.passMark + '점 미만이면 지원제외입니다.</b><br>';
      if(!llm.tipsMode){
        h += '채점하지 못한 <b>' + t.na + '점</b>은 IR이 아니라 <b>R&amp;D 사업계획서</b>에서 나옵니다. ' +
             'IR 6단계를 아무리 잘 써도 ' + t.passMark + '점에 닿을 수 없습니다 — ' +
             '<b>TIPS 준비 모드</b>를 켜면 90점까지 채점됩니다.';
      } else {
        var reach = t.got + 10;
        h += '남은 <b>' + t.na + '점(운영사 지원계획)</b>은 추천 운영사가 작성합니다. ' +
             (t.got >= t.passMark
               ? '창업팀 몫만으로 이미 ' + t.passMark + '점을 넘겼습니다.'
               : '창업팀 몫 + 운영사 최대 10점 = <b>최대 ' + reach + '점</b>입니다. ' +
                 (reach >= t.passMark ? '운영사 점수에 기대야 하는 위태로운 상태입니다.'
                                      : '<b>운영사가 만점을 받아도 미달합니다.</b>'));
      }
      h += '</div><p class="pb-note" style="margin-top:12px;color:var(--pb-on-ink-4)">' +
           esc(t.source) + '</p>';
    }
    h += '</div>';
    $('pbRight').innerHTML = h;
  }
