  // ══ 통신 ══════════════════════════════════════════════════════
  //  계약(엔드포인트·파라미터·에러 의미)은 구 실행본과 동일하다. 서버(Code.gs)는 무변경이다.
  //  근거 패턴: [[패턴_GAS_토큰인증_역할별인가_백엔드]] · [[패턴_디자인핸드오프_기존시스템_이식]]

  // ★검수 스위치 — ?local=1 이면 서버를 부르지 않는다.
  //   빌드본을 서버에 붙이지 않고도 두 동선(관리자/기업)을 같은 파일로 검수할 수 있다.
  var LOCAL = /[?&]local=1/.test(location.search);

  // GAS 웹앱 URL. 주소를 아는 것만으로는 아무것도 못 한다 — 계정이 있어야 하고,
  // 계정은 자기 기업에만 닿는다(서버가 강제).
  var PROXY = 'https://script.google.com/macros/s/AKfycbxJfH8gIyeDDU4HPt1tsqRrmIdIgeQaXyQ_rf1BhkNiOysVkQRiHxKw-pD2I46C4LYZ/exec';

  function serverOn(){ return !LOCAL && !!llm.proxy; }
  function isAdmin(){ return llm.reviewer === true; }

  // ★재시도 정책 — 서버가 '확정'한 응답은 재시도하지 않는다.
  //   notfound·forbidden을 재시도 대상으로 두면 캐시가 영영 안 차고 영구 스피너가 된다.
  //   재시도는 '아직 모르는 것'(혼잡·통신·시간초과)에만 건다.
  var RETRYABLE = { busy:1, network:1, timeout:1, RATE:1, HTTP503:1 };
  function retryable(code){ return !!RETRYABLE[String(code || '')]; }

  // ── GAS 호출 ──
  //  ★POST는 반드시 text/plain 으로 보낸다. application/json 이면 브라우저가
  //    OPTIONS 프리플라이트를 보내는데 GAS는 그것을 처리하지 못한다.
  function callProxy(payload){
    return fetch(llm.proxy, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.json().catch(function(){
        throw new Error('서버 응답을 해석하지 못했습니다. 프록시 주소를 확인하세요.');
      });
    }).then(function(d){
      if(!d || !d.ok){
        var err = new Error((d && d.error) || '서버 오류');
        err.code = (d && d.code) || 'ERR';
        throw err;
      }
      return d;
    });
  }
  function apiGet(action, params){
    var qs = ['action=' + encodeURIComponent(action),
              'id=' + encodeURIComponent(llm.id),
              'code=' + encodeURIComponent(llm.code)];
    Object.keys(params || {}).forEach(function(k){
      if(params[k] != null && params[k] !== '') qs.push(k + '=' + encodeURIComponent(params[k]));
    });
    var url = llm.proxy + (llm.proxy.indexOf('?') < 0 ? '?' : '&') + qs.join('&');
    return fetch(url).then(function(r){ return r.json(); });
  }

  // ── Gemini ──
  //  교체 지점은 이 함수 하나뿐이다.
  var GEMINI_BASE = 'https://generativelanguage.googleapis.com/v1beta/models/';
  function callLLM(system, user){
    if(LOCAL) return Promise.reject(new Error('로컬 검수 모드입니다 — AI를 부르지 않습니다.'));
    if(llm.conn === 'proxy'){
      return callProxy({ action:'llm', id:llm.id, code:llm.code,
                         system:system, user:user, reviewer: !!llm.reviewer })
             .then(function(d){ return parseJSON(d.text); });
    }
    var url = GEMINI_BASE + encodeURIComponent(llm.model) +
              ':generateContent?key=' + encodeURIComponent(llm.key);
    return fetch(url, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        systemInstruction:{ parts:[{ text:system }] },
        contents:[{ role:'user', parts:[{ text:user }] }],
        // ★TIPS 채점은 8항목 × (근거·이유·보완·감점·질문)이라 응답이 길다.
        //   2048로는 잘려 MAX_TOKENS가 난다 — JSON 파싱 실패의 진짜 원인이 이것이었다.
        generationConfig:{ temperature:0.4, responseMimeType:'application/json', maxOutputTokens:8192 }
      })
    }).then(function(res){
      return res.json().then(function(data){
        if(!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
        var cand = data && data.candidates && data.candidates[0];
        if(!cand) throw new Error((data && data.promptFeedback && data.promptFeedback.blockReason)
                                  ? '안전 필터에 걸렸습니다.' : '응답이 비었습니다.');
        var text = '', parts = cand.content && cand.content.parts;
        if(parts) parts.forEach(function(p){ if(p.text) text += p.text; });
        if(cand.finishReason === 'MAX_TOKENS') throw new Error('응답이 너무 길어 잘렸습니다.');
        return parseJSON(text);
      });
    });
  }

  // ── 서버 설정·상태 받아오기 ──
  //  ★설정의 정본은 서버(APP_CONFIG)다. localStorage를 신뢰하지 않는다 —
  //    팀이 개발자도구로 고쳐놨더라도 서버 값이 이긴다.
  function pullConfig(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('ping', {}).then(function(d){
      if(!d || !d.ok) return;
      llm.reviewer = !!d.reviewer;            // 심사자 권한도 서버 판정을 따른다
      var c = d.config;
      if(c){
        if(c.model) llm.model = c.model;
        if(typeof c.tipsMode === 'boolean') llm.tipsMode = c.tipsMode;
      }
      $('hdTips').classList.toggle('on', llm.tipsMode);
    }).catch(function(){});                   // 실패해도 화면을 멈추지 않는다
  }
  function pullComments(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('comments', { company: state.formData.companyName || '' }).then(function(d){
      if(!d || !d.ok) return;
      mentor.comments = d.comments || {};
      mentor.overall  = d.overall || '';
      mentor.who      = d.who || '';
      mentor.loaded   = true;
      renderRight();
    }).catch(function(){});
  }
  // 성장관리 플랫폼(LAGMP) 확정 종합의견 — 멘토 탭 2단 위쪽에 얹는다.
  //  ★확정 전이면 아무것도 오지 않는다(LAGMP가 전달 게이트를 건다). 그때 "검토 중"이라 적지 않는다 —
  //    아직 시작도 안 한 것인지 검토가 진행 중인지 이쪽은 알 수 없다. 모르는 것을 아는 척하지 않는다.
  function pullB2(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('b2', (admin && admin.editing) ? { cid: admin.editing.cid } : {}).then(function(d){
      if(!d || !d.ok) return;
      b2.enabled = !!d.enabled;
      b2.synth   = arr(d.synth);
      b2.loaded  = true;
      // LAGMP가 응답하지 않은 경우 — 의견만 접고 작성은 계속된다
      b2.note = (d.enabled && d.available === false) ? 'unreachable' : '';
      if(state.view === 'write') renderRight();
    }).catch(function(){});                   // 조용히 접는다
  }

  function pullStatus(){
    if(!serverOn()) return Promise.resolve();
    return apiGet('list', {}).then(function(d){
      if(!d || !d.ok) return;
      var me = (d.companies || [])[0];        // 팀은 자기 기업 한 줄만 온다
      if(!me) return;
      state.status = me.status || '';
      state.submittedAt = me.submittedAt || '';
    }).catch(function(){});
  }

  // ── 스냅샷 ──
  function snapshot(){
    return {
      schema: 'pitchbuilder.snapshot.v1',
      exportedAt: new Date().toISOString(),
      company: state.formData.companyName || '',
      cid: state.cid || '',
      mode: llm.tipsMode ? 'TIPS 9단계' : 'IR 6단계',
      model: llm.model,
      formData: state.formData,
      gate: state.lastGate || null,
      tips: state.lastTips || null,
      audit: state.lastAudit || null,
      // ★"이 점수는 어느 원고의 것인가"를 서버에도 넘긴다.
      //   지금까지 낡음 판정은 이 브라우저만 알았다 — 노션을 보는 사람은 점수만 보고
      //   그것이 이미 고친 원고 이전의 것인지 알 수 없었다(설계정본 미결 6).
      irHash: irHash(),
      tipsHash: state.tipsHash || ''
    };
  }
  // ★빈 값은 보내지 않는다.
  //   한 기업을 두 사람이 각자 PC에서 쓰면, 먼저 저장한 쪽의 빈 칸이 나중 사람 작업을 지운다.
  //   대가: 팀이 칸을 일부러 비워도 서버에선 안 지워진다(지우는 것보다 남기는 쪽이 안전하다).
  function filledOnly(fd){
    var out = {};
    Object.keys(fd || {}).forEach(function(k){
      if(String(fd[k] || '').trim()) out[k] = fd[k];
    });
    return out;
  }

  // ── 서버 저장 (단계 이동마다 자동) ──
  //  ★늦게 온 응답이 최신 상태를 되돌리지 못하게 시퀀스를 센다.
  var syncSeq = 0, syncing = false;
  function syncToServer(opts){
    if(!serverOn() || syncing) return Promise.resolve();
    var body = snapshot();
    body.formData = filledOnly(body.formData);
    if(!Object.keys(body.formData).length) return Promise.resolve();

    var my = ++syncSeq;
    syncing = true;
    chip('saving');
    return callProxy({ action:(opts && opts.submit) ? 'submit' : 'save',
                       id:llm.id, code:llm.code, snapshot:body, submit:!!(opts && opts.submit) })
      .then(function(d){
        if(my !== syncSeq) return;            // 더 최신 저장이 이미 끝났다 — 무시한다
        if(d.status) state.status = d.status;
        if(d.submittedAt) state.submittedAt = d.submittedAt;
        chip('ok');
      })
      .catch(function(err){
        // ★실패를 조용히 넘기지 않는다. 저장 안 됐는데 됐다고 믿고 창을 닫는 게 최악이다.
        chip('fail');
        if(retryable(err.code)) setTimeout(function(){ syncToServer(opts); }, 4000);
      })
      .then(function(){ syncing = false; });
  }

  // ── 노션에서 불러오기 ──
  function applySnapshot(s){
    var fd = (s && s.formData) ? s.formData : s;      // 옛 형식(formData만)도 받아준다
    if(!fd || typeof fd !== 'object') throw new Error('형식을 알 수 없습니다.');

    state.formData = {};
    Object.keys(PLACEHOLDER_RESULT).forEach(function(k){
      if(typeof fd[k] === 'string') state.formData[k] = fd[k];
    });
    state.cid        = s.cid || '';
    state.lastTips   = s.tips || null;
    state.lastAudit  = s.audit || null;
    state.lastGate   = s.gate || null;
    state.status     = s.status || '';
    state.submittedAt= s.submittedAt || '';
    // ★단계별 진단은 이 원고에 대한 것이 아니다 — 다른 PC에서 쓴 원고를 받아왔을 수도 있다.
    state.diags = {}; state.mentorBase = {};
    // ★채점·감수는 받아 쓰지만 '무엇을 보고 낸 것인지'는 모른다.
    //   모르는 것을 낡았다고 하지도, 최신이라고 하지도 않는다 → 빈 해시 = 판정 불가.
    state.tipsHash = ''; state.auditHash = '';

    // ★R&D 항목이 있으면 TIPS 모드를 켠다 — 안 켜면 그 입력이 화면에서 사라진다
    var hasRnd = ['devGoal','devPrior','devKpi','devVerify','globalPlan'].some(function(k){
      return (state.formData[k] || '').trim();
    });
    if(hasRnd && !llm.tipsMode){
      llm.tipsMode = true;
      $('hdTips').classList.add('on');
    }
    state.stepIndex = 0;
    saveLocal();
    render();
  }
  function notionLoad(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않습니다. 로컬 저장분만 사용합니다.'); return; }
    apiGet('load', { company: state.formData.companyName || '' }).then(function(d){
      if(!d || !d.ok){
        alert(d && d.error ? d.error : '불러오지 못했습니다.');
        return;
      }
      if(!d.snapshot){ alert('서버에 저장된 자료가 없습니다.'); return; }
      applySnapshot(d.snapshot);
      alert('불러왔습니다.');
    }).catch(function(err){ alert('불러오지 못했습니다 — ' + (err.message || '오류')); });
  }

  // ══ B1 이노테크 접수 불러오기 ═════════════════════════════════
  //  ★출발점을 옮기는 것이지 완성이 아니다. 기업이 이 위에서 고치고, 고칠 때마다 피드백을 받는다.
  //  ★덮어쓰기는 전체다. 부분 병합하면 무엇이 남고 무엇이 바뀌었는지 알 수 없게 된다.
  //  ★되돌리기는 두지 않는다 — 사전 경고가 그 역할이다.
  //    되돌리기가 있으면 "일단 눌러보자"가 되어 경고가 무의미해진다.
  function loadB1(){
    if(!serverOn()){ alert('서버에 연결돼 있지 않아 신청서를 불러올 수 없습니다.'); return; }
    if(busy) return;

    var written = Object.keys(state.formData).filter(function(k){
      return String(state.formData[k] || '').trim();
    }).length;
    if(written && !confirm(
        '신청서 내용으로 ' + written + '개 칸이 통째로 대체됩니다.\n\n' +
        '지금까지 고치신 내용은 사라집니다' +
        (llm.tipsMode ? ' (R&D 3단계 포함).' : '.') + '\n' +
        'AI 진단·TIPS 채점 결과도 함께 지워집니다.\n\n계속할까요?')) return;

    var btn = $('hdB1');
    busy = true; btn.disabled = true; btn.textContent = '불러오는 중…';
    apiGet('b1', (admin && admin.editing) ? { cid: admin.editing.cid } : {})
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.error) || '불러오지 못했습니다.');
        if(!d.found){
          alert('접수 시스템에서 귀사의 신청서를 찾지 못했습니다.\n' +
                '접수번호가 다르거나 신청 자료가 없는 경우입니다.');
          return;
        }
        // 전체 대체 — 아는 필드만 받는다(신청 DB가 바뀌어도 엉뚱한 키가 들어오지 않게)
        state.formData = {};
        Object.keys(d.formData || {}).forEach(function(k){
          if(PLACEHOLDER_RESULT[k] !== undefined && String(d.formData[k] || '').trim()){
            state.formData[k] = d.formData[k];
          }
        });
        // 내용이 통째로 바뀌었으므로 그 위에서 나온 판단은 전부 버린다
        state.diags = {}; state.lastTips = null; state.lastAudit = null;
        state.lastDiagrams = null; state.lastDeck = null;
        state.tipsHash = ''; state.auditHash = '';
        // ★멘토 기준선도 버린다 — 원고가 통째로 갈렸으므로 옛 기준선은 아무것도 뜻하지 않는다.
        //   다음 렌더에서 새 기준선을 잡는다.
        state.mentorBase = {};
        state.b2Base = null;                   // 성장관리 의견 기준선도 같은 이유로 버린다
        state.b1ref = d.ref || null;
        state.b1At = new Date().toISOString();
        state.stepIndex = 0;
        // ★가져왔으면 그 내용을 보여줘야 한다 — 다른 화면에 머물면 "눌렀는데 아무 일도 없다"가 된다
        state.view = 'write';

        saveLocal();
        syncToServer();
        render();
        alert('신청서에서 ' + (d.filled || 0) + '개 칸을 가져왔습니다.\n\n' +
              '이제 고치실 차례입니다 — 고칠 때마다 코치가 다시 봅니다.');
      })
      .catch(function(err){ alert('불러오지 못했습니다 — ' + (err.message || '오류')); })
      .then(function(){
        busy = false;
        if($('hdB1')){ $('hdB1').disabled = false; $('hdB1').textContent = '신청서 내용 가져오기'; }
      });
  }

  // ══ 로그인 ════════════════════════════════════════════════════
  //  ★인증의 정본은 서버다. 로컬 검수 모드(?local=1)에서만 아이디로 역할을 흉내낸다.
  function enter(){
    var id = $('inId').value.trim(), code = $('inCode').value.trim();
    var e = $('loginErr');
    if(!id || !code){
      e.textContent = '접수번호와 접속코드를 모두 입력하십시오.';
      e.classList.remove('hidden');
      return;
    }
    llm.id = id; llm.code = code;
    llm.proxy = PROXY;
    llm.conn = PROXY ? 'proxy' : 'byok';

    if(!serverOn()){
      // 로컬 검수 — 서버가 없으므로 아이디로 역할만 가른다(패턴 §8 검수 스위치)
      llm.reviewer = (id === 'admin');
      openApp('로컬 검수 모드');
      return;
    }
    e.classList.add('hidden');
    $('btnLogin').disabled = true; $('btnLogin').textContent = '확인 중…';
    apiGet('ping', {}).then(function(d){
      if(!d || !d.ok){
        // ★"새 코드는 발급되지 않았다"는 서버 메시지와 무관하게 **항상** 붙인다.
        //   접속코드가 LAGMP와 같은 것이라, 팀이 새 코드를 기다리며 멈추는 일이 실제로 생긴다.
        e.innerHTML = esc((d && d.error) || '아이디 또는 접속코드가 올바르지 않습니다.') +
          '<br><span style="display:inline-block;margin-top:6px;font-size:12px;color:var(--pb-text-mute)">' +
          '성장관리플랫폼에서 쓰시던 코드와 같습니다 — 새 코드는 발급되지 않았습니다.</span>';
        e.classList.remove('hidden');
        return;
      }
      llm.reviewer = !!d.reviewer;
      state.cid = d.cid || id;
      if(d.company) state.formData.companyName = state.formData.companyName || d.company;
      if(d.config){
        if(d.config.model) llm.model = d.config.model;
        if(typeof d.config.tipsMode === 'boolean') llm.tipsMode = d.config.tipsMode;
      }
      openApp(d.company || '');
      pullComments(); pullStatus(); pullB2(); pullBrain();
    }).catch(function(){
      e.textContent = '서버에 연결하지 못했습니다. 주소와 네트워크를 확인하십시오.';
      e.classList.remove('hidden');
    }).then(function(){
      $('btnLogin').disabled = false; $('btnLogin').textContent = '들어가기';
    });
  }
  function openApp(label){
    loadLocal();
    $('viewLogin').classList.add('hidden');
    ['pbHead','pbMeta','pbShell'].forEach(function(k){ $(k).classList.remove('hidden'); });
    $('hdTips').classList.toggle('on', llm.tipsMode);
    $('hdWho').textContent = llm.id + (label ? '  ·  ' + label : '') +
                             (isAdmin() ? '  ·  관리자' : '');
    // 관리자 전환 버튼은 서버가 관리자로 판정한 경우에만 만든다
    // ★[직접 입력] = 접수 명부에 없는 기업을 만드는 버튼.
    //   (대시보드 ↔ 작성 화면 전환은 로고가 맡는다 — 버튼 둘이 같은 일을 하면 안 된다.)
    if(isAdmin() && !$('hdNew')){
      var b = document.createElement('button');
      b.className = 'pb-hbtn'; b.id = 'hdNew'; b.textContent = '직접 입력';
      b.title = '이노테크 접수 명부에 없는 기업을 새로 만듭니다';
      b.onclick = adminNewCompany;
      $('hdTips').parentNode.insertBefore(b, $('hdTips'));
    }

    // ★기업은 처음 한 번 TIPS 준비 여부를 정한다. 관리자는 묻지 않는다(전체 설정을 다루는 쪽이다).
    if(!isAdmin()){
      var ch = tipsChoice();
      if(ch === 'yes' || ch === 'no') llm.tipsMode = (ch === 'yes');
      else askTipsOnce();
      $('hdTips').classList.toggle('on', llm.tipsMode);
      state.stepIndex = Math.min(state.stepIndex, steps().length - 1);
    }

    // ★팀에게는 관리자 화면이 열릴 여지를 두지 않는다(앞 세션의 view가 남을 수 있다)
    if(isAdmin()){ goAdmin(); }
    else { state.view = 'write'; admin.reviewing = false; admin.editing = null; render(); }
  }

  //  묻는 것은 한 번뿐이다. 그 뒤엔 상단 토글로 언제든 바꾼다.
  function askTipsOnce(){
    var yes = confirm(
      'TIPS(팁스) 프로그램을 준비하십니까?\n\n' +
      '[확인] 예 — TIPS 준비 모드로 작성합니다\n' +
      '   · R&D 3단계(개발 목표 · 성능지표 · 글로벌)가 더해져 9단계가 됩니다\n' +
      '   · 신청 자격 검토와 TIPS 기준 채점을 쓰실 수 있습니다\n\n' +
      '[취소] 아니오 — 투자용 IR 6단계만 작성합니다\n\n' +
      '※ 상단 [TIPS 준비 모드] 버튼으로 언제든 바꾸실 수 있습니다.');
    llm.tipsMode = !!yes;
    setTipsChoice(llm.tipsMode);
  }
  $('btnLogin').onclick = enter;
  $('inCode').onkeydown = function(e){ if(e.key === 'Enter') enter(); };
  $('inId').onkeydown  = function(e){ if(e.key === 'Enter') $('inCode').focus(); };

  // ══ 헤더 ══════════════════════════════════════════════════════
  //  로고 = 처음 화면. 관리자는 대시보드로, 팀은 작성 1단계로 돌아간다.
  //  ★대리 편집 중이라면 그것부터 닫는다 — 대시보드로 가면서 편집 상태만 남으면
  //    그 뒤 저장이 어느 기업으로 가는지 화면만 봐서는 알 수 없게 된다.
  function goHome(){
    if(admin && admin.editing){ adminCloseIR(); return; }
    if(isAdmin()){ goAdmin(); return; }
    state.view = 'write';
    state.stepIndex = 0;
    render();
    window.scrollTo(0, 0);
  }
  $('hdHome').onclick = goHome;
  $('hdHome').onkeydown = function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goHome(); } };

  $('hdTips').onclick = function(){
    llm.tipsMode = !llm.tipsMode;
    // 기업이 손으로 바꾼 것도 그 기업의 선택이다 — 다음 접속에 서버 기본값이 되돌리면 안 된다
    if(!isAdmin()) setTipsChoice(llm.tipsMode);
    this.classList.toggle('on', llm.tipsMode);
    state.stepIndex = Math.min(state.stepIndex, steps().length - 1);
    render();
  };
  $('hdExit').onclick = function(){
    ['pbHead','pbMeta','pbShell'].forEach(function(k){ $(k).classList.add('hidden'); });
    $('viewLogin').classList.remove('hidden');
    $('loginErr').classList.add('hidden');
    $('inCode').value = '';
    state.formData = {};                      // 메모리도 비운다
    // ★판단도 함께 비운다 — 칸만 갈라두면 메모리 경로로 샌다(로그인 시 loadLocal이 또 비운다: 두 겹)
    state.diags = {}; state.mentorBase = {};
    state.tipsHash = ''; state.auditHash = '';
    state.lastTips = null; state.lastAudit = null;
    state.b1ref = null; state.b1At = ''; state.b2Base = null;
    mentor = { comments:{}, overall:'', who:'', loaded:false };
    b2 = { synth:[], loaded:false, enabled:false, note:'' };
    // ★대리 편집 상태도 반드시 푼다. 남겨두면 다음 로그인이 그 기업 칸을 열어
    //   다른 사람이 남의 원고를 보게 된다.
    admin.editing = null; admin.sel = null; admin.rows = [];
    admin.applicants = []; admin.q = ''; admin.reviewing = false; admin.doc = null;

    // 🔴 화면 상태와 권한도 반드시 되돌린다.
    //    안 그러면 관리자로 들어갔다 나간 뒤 팀으로 로그인했을 때
    //    state.view가 'admin'인 채로 남아 **팀에게 관리자 대시보드가 그려진다**
    //    — 작성칸이 아예 없으니 [신청서 내용 가져오기]도 옮겨갈 곳이 없다.
    state.view = 'write';
    state.stepIndex = 0;
    state.cid = '';
    llm.reviewer = false;
    // 관리자 전용 버튼은 DOM에 남으므로 직접 걷어낸다(다음 사람이 누를 수 있다)
    ['hdNew', 'hdAdmin'].forEach(function(id){
      var el = $(id); if(el && el.parentNode) el.parentNode.removeChild(el);
    });
  };
  $('hdB1').onclick   = loadB1;
  $('hdSave').onclick = function(){ saveLocal(); syncToServer(); };
  $('hdLoad').onclick = notionLoad;

  // ══ 초기화 ════════════════════════════════════════════════════
  //  ★"초기화 = 작성 현황에서 삭제"다(민부장님 정의, 2026-07-30).
  //    화면만 비우면 목록에 그대로 남아 지운 것처럼 보이지 않는다.
  //  ★단 완전 삭제는 하지 않는다 — 서버가 노션 **휴지통**으로 내린다(30일 복구 가능).
  //    되돌릴 수 없는 조작은 만들지 않는다.
  //  ★②채점 이력·③멘토 코멘트는 남긴다. 지우는 것은 '원고'다 —
  //    이력과 사람 의견까지 지우면 왜 지웠는지조차 사라진다.
  function resetAll(){
    var n = Object.keys(state.formData).filter(function(k){
      return String(state.formData[k] || '').trim();
    }).length;
    var editing = !!(admin && admin.editing);
    var target = editing ? admin.editing.company : (state.formData.companyName || '').trim();

    if(!confirm(
        (target ? '「' + target + '」의 ' : '') + '작성 원고를 초기화합니다.\n\n' +
        '· 화면과 이 브라우저의 ' + n + '개 칸이 비워집니다\n' +
        '· AI 진단·TIPS 채점·피칭 덱·신청서 참고자료도 지워집니다\n' +
        '· <작성 현황> 목록에서도 사라집니다\n\n' +
        '채점 이력과 멘토 코멘트는 그대로 남고,\n' +
        '원고는 노션 휴지통에 30일간 보관돼 복구할 수 있습니다.\n\n계속할까요?')) return;

    var clearLocal = function(){
      state.formData = {};
      state.completed = false;
      state.stepIndex = 0;
      state.diags = {}; state.mentorBase = {}; state.b2Base = null;
      state.tipsHash = ''; state.auditHash = '';
      state.lastTips = null; state.lastAudit = null; state.lastGate = null;
      state.lastDeck = null; state.lastDiagrams = null;
      state.b1ref = null; state.b1At = '';
      state.view = 'write';
      state.tab = 0;
      // ★대리 편집 중이면 회사명은 남긴다 — 이어서 새로 쓸 수 있어야 한다
      if(editing) state.formData.companyName = admin.editing.company;
      writeLocal();
      chip('ok');
      render();
      window.scrollTo(0, 0);
    };

    if(!serverOn() || !target){ clearLocal(); return; }

    // 서버에서 내린 뒤 화면을 비운다 — 순서가 바뀌면 '지운 줄 알았는데 목록에 남는' 상태가 생긴다
    callProxy({ action:'reset', id:llm.id, code:llm.code, company: target })
      .then(function(d){
        if(!d || !d.ok) throw new Error((d && d.error) || '초기화하지 못했습니다.');
        state.status = ''; state.submittedAt = '';
        clearLocal();
        if(admin) admin.rows = admin.rows.filter(function(r){
          return normName(r.company) !== normName(target);          // 목록에서도 즉시 뺀다
        });
      })
      .catch(function(err){
        // ★화면만 비우고 서버가 남으면 최악이다 — 지웠다고 믿고 목록에 그대로 있다
        alert('초기화하지 못했습니다 — ' + (err.message || '오류') + '\n\n화면은 그대로 두었습니다.');
      });
  }
  $('hdReset').onclick = resetAll;

  // 창을 닫기 전 저장 — 자동저장이 아직 안 끝났을 수 있다
  window.addEventListener('beforeunload', function(){
    try{ localStorage.setItem(skey(), JSON.stringify({
      stepIndex: state.stepIndex, formData: state.formData, completed: state.completed })); }catch(e){}
  });
})();
</script>
</body>
</html>
